<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Sky -->
  <rect width="600" height="400" fill="#E0F7FA" />
  
  <!-- Background: Hills -->
  <path d="M0 350 Q 150 300 300 350 T 600 350 V 400 H 0 Z" fill="#A5D6A7" opacity="0.6" />
  <path d="M0 400 Q 200 320 400 400 T 600 400 Z" fill="#81C784" opacity="0.8" />

  <!-- Bicycle Wheels -->
  <!-- Rear Wheel -->
  <circle cx="200" cy="300" r="45" fill="none" stroke="#37474F" stroke-width="6" />
  <circle cx="200" cy="300" r="35" fill="none" stroke="#37474F" stroke-width="2" />
  <circle cx="200" cy="300" r="5" fill="#37474F" />
  
  <!-- Front Wheel -->
  <circle cx="360" cy="300" r="45" fill="none" stroke="#37474F" stroke-width="6" />
  <circle cx="360" cy="300" r="35" fill="none" stroke="#37474F" stroke-width="2" />
  <circle cx="360" cy="300" r="5" fill="#37474F" />

  <!-- Bicycle Frame -->
  <path d="M200 300 L 260 240 L 350 240 L 230 300 L 280 300 L 360 300" 
        fill="none" stroke="#37474F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Seat Post -->
  <line x1="240" y1="240" x2="250" y2="210" stroke="#37474F" stroke-width="5" />
  <!-- Handlebars -->
  <line x1="350" y1="240" x2="350" y2="215" stroke="#37474F" stroke-width="5" />
  <line x1="340" y1="215" x2="360" y2="215" stroke="#37474F" stroke-width="4" />
  
  <!-- Pedals -->
  <circle cx="280" cy="300" r="8" fill="#546E7A" />
  <line x1="280" y1="300" x2="280" y2="285" stroke="#546E7A" stroke-width="4" /> <!-- Crank -->

  <!-- Pelican Body -->
  <g transform="translate(240, 220) rotate(-10)">
    <!-- Tail/Back -->
    <path d="M-40 0 Q -60 -20 -40 -40" fill="none" stroke="#FBC02D" stroke-width="8" stroke-linecap="round" />
    
    <!-- Main Body -->
    <ellipse cx="0" cy="0" rx="45" ry="30" fill="#FDD835" stroke="#FBC02D" stroke-width="2" />
    
    <!-- Neck -->
    <path d="M35 -10 C 50 -30, 60 -20, 55 10" fill="none" stroke="#FDD835" stroke-width="14" stroke-linecap="round" />
    
    <!-- Head -->
    <circle cx="60" cy="5" r="12" fill="#FDD835" />
    
    <!-- Beak (Pouch) -->
    <path d="M68 5 L 90 15 L 68 25 Z" fill="#FFB74D" stroke="#EF6C00" stroke-width="1" />
    <path d="M90 15 L 95 16 L 94 14 Z" fill="#EF6C00" /> <!-- Beak tip -->
    
    <!-- Eye -->
    <circle cx="62" cy="2" r="2" fill="#263238" />
    
    <!-- Wing -->
    <path d="M10 10 C -10 30, -20 10, -5 -5 Z" fill="#FFF59D" stroke="#FBC02D" stroke-width="1" />
  </g>

  <!-- Pelican Legs (Cycling) -->
  <!-- Left Leg (Back) -->
  <path d="M260 240 L 250 260 L 270 270" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round" />
  <circle cx="270" cy="270" r="4" fill="#EF6C00" /> <!-- Shoe -->
  
  <!-- Right Leg (Forward) -->
  <path d="M260 240 L 275 260 L 280 300" fill="none" stroke="#FFB74D" stroke-width="6" stroke-linecap="round" />
  <circle cx="280" cy="300" r="4" fill="#EF6C00" /> <!-- Shoe on pedal -->

  <!-- Arms holding handlebars -->
  <line x1="300" y1="225" x2="340" y2="215" stroke="#FDD835" stroke-width="5" stroke-linecap="round" />
  
  <!-- Clouds -->
  <circle cx="500" cy="50" r="20" fill="white" opacity="0.8" />
  <circle cx="520" cy="60" r="25" fill="white" opacity="0.8" />
  <circle cx="480" cy="60" r="18" fill="white" opacity="0.8" />

  <circle cx="80" cy="80" r="15" fill="white" opacity="0.6" />
  <circle cx="100" cy="90" r="20" fill="white" opacity="0.6" />
</svg>