<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9e5d9"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12a5a8"/>
      <stop offset="100%" stop-color="#0a6f78"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb648"/>
      <stop offset="100%" stop-color="#ef8b2c"/>
    </linearGradient>

    <g id="wheel">
      <circle r="96" fill="none" stroke="#141414" stroke-width="13"/>
      <circle r="87" fill="none" stroke="#b9bec4" stroke-width="6"/>
      <g stroke="#8d949b" stroke-width="2.6" stroke-linecap="round">
        <line x1="-84" y1="0" x2="84" y2="0"/>
        <line x1="-84" y1="0" x2="84" y2="0" transform="rotate(30)"/>
        <line x1="-84" y1="0" x2="84" y2="0" transform="rotate(60)"/>
        <line x1="-84" y1="0" x2="84" y2="0" transform="rotate(90)"/>
        <line x1="-84" y1="0" x2="84" y2="0" transform="rotate(120)"/>
        <line x1="-84" y1="0" x2="84" y2="0" transform="rotate(150)"/>
      </g>
      <circle r="10" fill="#3d4348"/>
      <circle r="4" fill="#8d949b"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- speed lines -->
  <g stroke="#bcd7e6" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="40" y1="300" x2="140" y2="300"/>
    <line x1="20" y1="345" x2="115" y2="345"/>
    <line x1="55" y1="392" x2="130" y2="392"/>
  </g>

  <!-- far leg (behind frame) -->
  <g stroke="#e5902f" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M370,292 L400,385 L350,422"/>
  </g>
  <path d="M334,418 C344,409 368,410 374,418 C376,427 366,433 352,433 C340,433 332,426 334,418 Z" fill="#f2a03d"/>

  <!-- wheels -->
  <use href="#wheel" xlink:href="#wheel" x="230" y="440"/>
  <use href="#wheel" xlink:href="#wheel" x="570" y="440"/>

  <!-- chain -->
  <g stroke="#4a5056" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="400" y1="419" x2="230" y2="426"/>
    <line x1="400" y1="471" x2="230" y2="454"/>
  </g>
  <circle cx="230" cy="440" r="15" fill="none" stroke="#6a7076" stroke-width="5"/>

  <!-- frame -->
  <g stroke="url(#frameG)" stroke-width="13" fill="none" stroke-linecap="round">
    <line x1="400" y1="445" x2="230" y2="440"/>            <!-- chainstay -->
    <line x1="338" y1="318" x2="230" y2="440"/>            <!-- seatstay -->
    <line x1="400" y1="445" x2="338" y2="318"/>            <!-- seat tube -->
    <line x1="400" y1="445" x2="532" y2="318"/>            <!-- down tube -->
    <line x1="338" y1="318" x2="545" y2="268"/>            <!-- top tube -->
    <line x1="545" y1="268" x2="528" y2="322"/>            <!-- head tube -->
  </g>
  <!-- fork -->
  <path d="M531,320 C545,355 560,395 570,440" stroke="#0a6f78" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- seat post + saddle -->
  <line x1="338" y1="318" x2="330" y2="294" stroke="#3d4348" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="327" cy="292" rx="40" ry="12" fill="#2b2f33" transform="rotate(-6 327 292)"/>
  <!-- handlebar + stem -->
  <line x1="545" y1="270" x2="556" y2="244" stroke="#3d4348" stroke-width="9" stroke-linecap="round"/>
  <path d="M572,235 L518,249 C508,252 502,245 507,238" stroke="#1b1b1b" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- crank + pedals -->
  <g stroke="#33383c" stroke-width="12" stroke-linecap="round">
    <line x1="400" y1="445" x2="455" y2="470"/>
    <line x1="400" y1="445" x2="345" y2="420"/>
  </g>
  <rect x="437" y="465" width="38" height="11" rx="5" fill="#22262a"/>
  <rect x="327" y="415" width="38" height="11" rx="5" fill="#22262a"/>
  <circle cx="400" cy="445" r="29" fill="none" stroke="#6a7076" stroke-width="5"/>
  <circle cx="400" cy="445" r="9" fill="#3d4348"/>

  <!-- tail -->
  <path d="M292,230 C252,226 216,216 196,204 C212,240 242,266 288,278 Z" fill="#efece2" stroke="#d6d2c5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M270,232 L214,214 M275,250 L232,238" stroke="#d6d2c5" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- body -->
  <ellipse cx="360" cy="245" rx="96" ry="60" fill="url(#bodyG)" stroke="#d6d2c5" stroke-width="5" transform="rotate(-8 360 245)"/>
  <path d="M300,268 C330,292 380,300 425,285" fill="none" stroke="#dcd8cb" stroke-width="5" stroke-linecap="round"/>

  <!-- near leg -->
  <g stroke="#e5902f" stroke-width="19" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M386,290 L452,372 L455,462"/>
  </g>
  <path d="M432,466 C442,455 470,455 479,464 C482,473 470,481 455,481 C441,481 430,475 432,466 Z" fill="#f2a03d" stroke="#d9782a" stroke-width="3"/>

  <!-- neck -->
  <path d="M412,228 C446,218 456,192 472,166" fill="none" stroke="#f4f1e8" stroke-width="44" stroke-linecap="round"/>
  <path d="M412,228 C446,218 456,192 472,166" fill="none" stroke="#d6d2c5" stroke-width="44" stroke-linecap="round" opacity="0.35"/>

  <!-- head -->
  <circle cx="495" cy="142" r="35" fill="#fbfaf5" stroke="#d6d2c5" stroke-width="5"/>
  <!-- pouch -->
  <path d="M518,161 C570,168 625,182 660,174 C657,216 616,239 572,235 C534,231 516,198 518,161 Z"
        fill="#f7c873" stroke="#d9782a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M534,186 C568,204 606,214 642,212" fill="none" stroke="#e5a94e" stroke-width="4" stroke-linecap="round"/>
  <!-- upper beak -->
  <path d="M516,134 C570,140 626,156 660,172 L648,183 C610,179 564,171 518,163 Z"
        fill="url(#beakG)" stroke="#d9782a" stroke-width="4" stroke-linejoin="round"/>
  <path d="M540,145 C580,151 620,163 652,174" fill="none" stroke="#ffe0a8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- eye -->
  <circle cx="504" cy="124" r="9" fill="#ffffff" stroke="#c9c4b6" stroke-width="2"/>
  <circle cx="506" cy="125" r="4.6" fill="#1b1b1b"/>
  <circle cx="508" cy="123" r="1.7" fill="#ffffff"/>
  <!-- head tuft -->
  <path d="M470,116 C462,104 470,96 482,98" fill="none" stroke="#d6d2c5" stroke-width="5" stroke-linecap="round"/>

  <!-- wing reaching the handlebar -->
  <path d="M398,230 C450,212 506,220 545,247 C553,254 546,266 535,261 C500,255 458,266 416,280 C393,273 384,249 398,230 Z"
        fill="#f7f4ec" stroke="#d6d2c5" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#ddd9cc" stroke-width="4" stroke-linecap="round">
    <path d="M426,236 C466,230 502,240 531,253"/>
    <path d="M420,252 C458,250 488,255 514,261"/>
    <path d="M444,224 C478,222 508,230 530,241"/>
  </g>
  <!-- wingtip curling over the grip -->
  <path d="M536,252 C546,254 552,247 549,240" fill="none" stroke="#e9e5d9" stroke-width="14" stroke-linecap="round"/>

  <!-- ground -->
  <line x1="30" y1="545" x2="770" y2="545" stroke="#7f8f74" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#8ea37e" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M95,545 C95,534 89,530 86,527"/>
    <path d="M104,545 C106,534 112,530 116,527"/>
    <path d="M660,545 C660,534 654,530 651,527"/>
    <path d="M669,545 C671,534 677,530 681,527"/>
    <path d="M300,545 C301,536 296,531 293,528"/>
  </g>
</svg>