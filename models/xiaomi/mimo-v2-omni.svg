<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#f0f8ff"/>
  
  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#90EE90"/>
  
  <!-- Bicycle -->
  <g transform="translate(150, 180)">
    <!-- Back wheel -->
    <circle cx="0" cy="50" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="0" cy="50" r="5" fill="#333"/>
    
    <!-- Front wheel -->
    <circle cx="100" cy="50" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="100" cy="50" r="5" fill="#333"/>
    
    <!-- Bicycle frame -->
    <path d="M0,50 L40,20 L60,20 L100,50 M40,20 L40,50" 
          stroke="#333" stroke-width="6" fill="none"/>
    
    <!-- Seat -->
    <ellipse cx="40" cy="15" rx="12" ry="5" fill="#8B4513"/>
    
    <!-- Handlebars -->
    <path d="M60,20 L80,10 M60,20 L80,30" stroke="#333" stroke-width="4"/>
    
    <!-- Pedals -->
    <circle cx="40" cy="50" r="8" fill="#666"/>
    <rect x="30" y="48" width="20" height="4" fill="#666"/>
  </g>
  
  <!-- Pelican -->
  <g transform="translate(170, 120)">
    <!-- Body -->
    <ellipse cx="30" cy="50" rx="35" ry="25" fill="#F5F5DC"/>
    
    <!-- Wing -->
    <path d="M10,40 Q30,30 50,40 Q30,50 10,40" fill="#E6E6FA"/>
    
    <!-- Neck -->
    <path d="M30,30 Q20,10 30,0" stroke="#F5F5DC" stroke-width="8" fill="none"/>
    
    <!-- Head -->
    <circle cx="30" cy="-5" r="12" fill="#F5F5DC"/>
    
    <!-- Eye -->
    <circle cx="28" cy="-7" r="2" fill="#000"/>
    
    <!-- Beak (with pouch) -->
    <path d="M18,-5 L-5,5 L18,10 Z" fill="#FFA500"/>
    <path d="M18,-5 Q5,0 18,10" fill="#FF8C00"/>
    
    <!-- Feet on pedals -->
    <path d="M15,75 L15,85 M45,75 L45,85" stroke="#FFA500" stroke-width="4"/>
    
    <!-- Tail feathers -->
    <path d="M65,50 Q75,45 70,55 Q80,50 75,60" fill="#E6E6FA"/>
  </g>
  
  <!-- Text label -->
  <text x="200" y="290" font-family="Arial" font-size="16" 
        text-anchor="middle" fill="#333">Pelican on a Bicycle</text>
</svg>