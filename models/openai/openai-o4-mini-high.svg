<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <!-- Bicycle Wheels -->
  <circle cx="150" cy="300" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="350" cy="300" r="50" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="150" cy="300" r="5" fill="#333"/>
  <circle cx="350" cy="300" r="5" fill="#333"/>

  <!-- Bicycle Frame -->
  <line x1="150" y1="300" x2="250" y2="200" stroke="#333" stroke-width="6"/>
  <line x1="250" y1="200" x2="350" y2="300" stroke="#333" stroke-width="6"/>
  <line x1="250" y1="200" x2="200" y2="260" stroke="#333" stroke-width="6"/>

  <!-- Handlebar -->
  <line x1="350" y1="300" x2="380" y2="240" stroke="#333" stroke-width="6"/>
  <line x1="370" y1="240" x2="400" y2="240" stroke="#333" stroke-width="6"/>

  <!-- Seat -->
  <line x1="245" y1="190" x2="255" y2="190" stroke="#333" stroke-width="6"/>

  <!-- Pelican -->
  <g transform="translate(250,105)">
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="40" ry="25" fill="#f8f8f8" stroke="#333" stroke-width="3"/>
    <!-- Wing -->
    <path d="M-10,60 Q-30,50 0,45 Q20,55 0,60" fill="#e0e0e0" stroke="#333" stroke-width="2"/>
    <!-- Head -->
    <ellipse cx="35" cy="35" rx="20" ry="20" fill="#f8f8f8" stroke="#333" stroke-width="3"/>
    <circle cx="40" cy="35" r="4" fill="#333"/>
    <!-- Beak -->
    <path d="M55,45 Q100,55 55,75 Q60,55 55,45" fill="#f8b500" stroke="#333" stroke-width="2"/>
  </g>
</svg>