<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#87CEEB"/>

  <g id="bicycle" transform="translate(200,350)">
    <path d="M 100 150              L 150 100              L 250 100              L 300 150              L 250 200              L 150 200              Z" fill="#f8f8f8" stroke="black" stroke-width="4"/>
    <path d="M 150 100              L 250 100" stroke="black" stroke-width="4"/>
    <path d="M 150 200              L 150 150" stroke="black" stroke-width="4"/>
    <path d="M 250 200              L 250 150" stroke="black" stroke-width="4"/>
    <path d="M 250 150              L 300 150" stroke="black" stroke-width="4"/>
    <path d="M 100 150              L 100 100" stroke="black" stroke-width="4"/>
    <circle cx="100" cy="150" r="50" fill="#fff" stroke="black" stroke-width="4"/>
    <circle cx="250" cy="150" r="50" fill="#fff" stroke="black" stroke-width="4"/>
    <g id="spokes">
      <g transform="translate(100,150)">
        <circle r="50" fill="none"/>
        <g id="front_spokes">
          <g stroke="black" stroke-width="1">
            <line x1="0" y1="0" x2="0" y2="-50"/>
            <line x1="0" y1="0" x2="28.9" y2="-28.9"/>
            <line x1="0" y1="0" x2="28.9" y2="28.9"/>
            <line x1="0" y1="0" x2="-28.9" y2="-28.9"/>
            <line x1="0" y1="0" x2="-28.9" y2="28.9"/>
            <line x1="0" y1="0" x2="0" y2="50"/>
          </g>
        </g>
      </g>
      <g transform="translate(250,150)">
        <circle r="50" fill="none"/>
        <g id="rear_spokes">
          <g stroke="black" stroke-width="1">
            <line x1="0" y1="0" x2="0" y2="-50"/>
            <line x1="0" y1="0" x2="28.9" y2="-28.9"/>
            <line x1="0" y1="0" x2="28.9" y2="28.9"/>
            <line x1="0" y1="0" x2="-28.9" y2="-28.9"/>
            <line x1="0" y1="0" x2="-28.9" y2="28.9"/>
            <line x1="0" y1="0" x2="0" y2="50"/>
          </g>
        </g>
      </g>
    </g>
    <path d="M 100 100              L 70 70" stroke="black" stroke-width="4"/>
    <line x1="70" y1="70" x2="50" y2="70" stroke="black" stroke-width="4"/>
    <g id="pedals">
      <circle cx="200" cy="150" r="10" fill="#f8f8f8" stroke="black" stroke-width="2"/>
      <line x1="190" y1="150" x2="210" y2="150" stroke="black" stroke-width="2"/>
      <line x1="200" y1="140" x2="200" y2="160" stroke="black" stroke-width="2"/>
    </g>
  </g>

  <g id="pelican" transform="translate(250,250)">
    <ellipse cx="150" cy="170" rx="80" ry="120" fill="#8b5a2b" stroke="black" stroke-width="3"/>
    <circle cx="150" cy="50" r="45" fill="#8b5a2b" stroke="black" stroke-width="3"/>
    <circle cx="135" cy="30" r="5" fill="#000"/>
    <path d="M 150 55              Q 180 60 170 90              Q 200 80 210 110              Q 190 120 170 90              L 150 90              Z" fill="#ffebcd" stroke="black" stroke-width="2"/>
    <path d="M 150 90              Q 170 110 170 140              Q 200 120 200 150              Q 180 140 170 120              Q 140 120 150 90              Z" fill="#ffebcd" stroke="black" stroke-width="2"/>
    <path d="M 80 130              C 80 80 120 60 150 80              C 180 60 220 80 220 130              C 190 100 110 100 80 130              Z" fill="#8b5a2b" stroke="black" stroke-width="3" fill-opacity="0.8"/>
    <path d="M 150 290              L 140 310              L 160 310              Z" fill="#8b5a2b" stroke="black" stroke-width="2"/>
    <g id="legs" transform="translate(0,100)">
      <path d="M 140 200                L 140 250                C 140 260 145 260 145 250                L 145 220" stroke="#8b5a2b" stroke-width="6" fill="none"/>
      <path d="M 160 200                L 160 250                C 160 260 155 260 155 250                L 155 220" stroke="#8b5a2b" stroke-width="6" fill="none"/>
      <path d="M 140 260                L 130 275                L 150 275                Z" fill="#8b5a2b" stroke="black" stroke-width="2"/>
      <path d="M 160 260                L 150 275                L 170 275                Z" fill="#8b5a2b" stroke="black" stroke-width="2"/>
    </g>
  </g>
</svg>