<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican rides a blue bicycle beneath a sunny sky.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeeff"/>
      <stop offset="1" stop-color="#f4fcff"/>
    </linearGradient>

    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e3e8"/>
    </linearGradient>

    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb43b"/>
      <stop offset="1" stop-color="#e87928"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#47727f" flood-opacity=".25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="640" height="460" fill="url(#sky)"/>
  <circle cx="530" cy="80" r="35" fill="#ffd76a" opacity=".9"/>
  <path d="M70 105c18-18 40-18 58 0 18-18 40-18 58 0"
        fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".75"/>
  <path d="M430 125c14-14 31-14 45 0 14-14 31-14 45 0"
        fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".7"/>

  <!-- Ground shadow -->
  <ellipse cx="315" cy="421" rx="245" ry="16" fill="#568691" opacity=".18"/>

  <!-- Bicycle -->
  <g fill="none" stroke="#176d8c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- wheels -->
    <circle cx="155" cy="340" r="78" stroke="#233f4b" stroke-width="6"/>
    <circle cx="455" cy="340" r="78" stroke="#233f4b" stroke-width="6"/>
    <circle cx="155" cy="340" r="7" fill="#233f4b" stroke="none"/>
    <circle cx="455" cy="340" r="7" fill="#233f4b" stroke="none"/>

    <!-- frame -->
    <path d="M155 340 L245 255 L335 340 L155 340 L285 340 L245 255 L365 255 L455 340"/>
    <path d="M335 340 L365 255"/>
    <!-- handlebar -->
    <path d="M365 255 L390 218 L415 218"/>
    <path d="M410 218 q12 0 15 10"/>
    <!-- seat post and seat -->
    <path d="M245 255 L230 222"/>
    <path d="M214 220 Q230 214 246 220"/>
    <!-- hubs -->
    <path d="M147 340h16 M447 340h16"/>
  </g>

  <!-- Crank -->
  <g stroke="#233f4b" stroke-width="5" stroke-linecap="round">
    <circle cx="285" cy="340" r="14" fill="#f2b52d"/>
    <path d="M285 340 l22 -17"/>
    <path d="M307 323 h17"/>
    <path d="M285 340 l-20 18"/>
    <path d="M265 358 h-17"/>
  </g>

  <!-- Pelican body -->
  <g filter="url(#shadow)">
    <!-- torso -->
    <path d="M225 166
             C245 137 295 128 333 146
             C365 161 379 194 365 224
             C351 254 318 270 279 260
             C242 251 214 222 216 192
             C217 181 220 173 225 166Z"
          fill="url(#feathers)" stroke="#405963" stroke-width="5"/>

    <!-- back plumage -->
    <path d="M235 166 C254 144 289 137 320 146
             C295 153 275 168 261 190
             C249 185 240 176 235 166Z"
          fill="#b8c9d0"/>

    <!-- wing -->
    <path d="M255 175
             C285 165 329 177 342 202
             C350 218 337 237 316 240
             C294 242 266 225 248 207
             C239 197 242 183 255 175Z"
          fill="#c5d4da" stroke="#405963" stroke-width="4"/>
    <path d="M270 190 Q300 204 326 225
             M263 202 Q291 219 313 232"
          fill="none" stroke="#91aab3" stroke-width="3" stroke-linecap="round"/>

    <!-- long neck -->
    <path d="M238 178
             C216 160 207 132 216 103
             C224 78 245 61 272 65
             C292 68 303 82 298 98
             C294 110 281 114 270 108
             C264 105 259 110 261 122
             C266 145 279 158 286 170Z"
          fill="url(#feathers)" stroke="#405963" stroke-width="5"/>

    <!-- head -->
    <path d="M217 84
             C213 58 232 36 260 34
             C289 31 309 49 308 72
             C307 96 287 111 260 108
             C238 106 220 98 217 84Z"
          fill="#f8fbfc" stroke="#405963" stroke-width="5"/>

    <!-- crest -->
    <path d="M235 42 Q245 20 258 39 Q269 17 277 41 Q291 25 294 51"
          fill="#b7c8ce" stroke="#405963" stroke-width="4" stroke-linejoin="round"/>

    <!-- eye -->
    <circle cx="274" cy="65" r="7" fill="#23343a"/>
    <circle cx="277" cy="62" r="2.5" fill="#fff"/>

    <!-- beak and pouch -->
    <path d="M231 70
             C207 67 170 73 132 91
             C122 96 124 105 137 108
             L220 108
             C239 105 249 96 250 85
             C250 77 243 72 231 70Z"
          fill="url(#beak)" stroke="#874b2d" stroke-width="5"/>
    <path d="M134 107
             C158 119 198 131 225 119
             C239 113 247 103 249 91
             C236 101 220 104 200 104
             L137 101Z"
          fill="#f28b32" stroke="#874b2d" stroke-width="4"/>
    <path d="M148 96 Q188 91 225 94" fill="none" stroke="#c46128" stroke-width="3"/>
  </g>

  <!-- Pelican legs -->
  <g fill="none" stroke="#d87828" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- rear leg -->
    <path d="M286 245 L278 286 L301 321"/>
    <path d="M301 321 L320 329"/>
    <!-- front leg -->
    <path d="M323 242 L337 278 L315 311"/>
    <path d="M315 311 L297 322"/>
  </g>

  <!-- Webbed feet on pedals -->
  <g fill="#f08b2f" stroke="#874b2d" stroke-width="3" stroke-linejoin="round">
    <path d="M316 326 Q329 322 340 327 L327 334 L343 338 L324 341 L333 350 L316 343 L302 346 L309 335 L297 330Z"/>
    <path d="M298 320 Q285 318 274 324 L287 331 L271 336 L291 337 L282 347 L299 339 L313 340 L305 330 L317 324Z"/>
  </g>

  <!-- Handlebar grip and bicycle bell -->
  <circle cx="390" cy="217" r="6" fill="#f2b52d" stroke="#8a6320" stroke-width="3"/>
  <path d="M398 214 q8-10 16 0" fill="none" stroke="#e8a82b" stroke-width="4"/>

  <!-- Small motion lines -->
  <g fill="none" stroke="#6aa5b3" stroke-width="4" stroke-linecap="round" opacity=".65">
    <path d="M70 300h45"/>
    <path d="M82 320h26"/>
    <path d="M505 274h38"/>
  </g>
</svg>