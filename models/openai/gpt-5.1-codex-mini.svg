<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#a0d8ff" />
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#8bc34a" />
  <!-- Bicycle wheels -->
  <circle cx="130" cy="220" r="50" fill="none" stroke="#333" stroke-width="6" />
  <circle cx="270" cy="220" r="50" fill="none" stroke="#333" stroke-width="6" />
  <circle cx="130" cy="220" r="6" fill="#333" />
  <circle cx="270" cy="220" r="6" fill="#333" />
  <!-- Bicycle frame -->
  <line x1="130" y1="220" x2="190" y2="170" stroke="#555" stroke-width="6" />
  <line x1="270" y1="220" x2="190" y2="170" stroke="#555" stroke-width="6" />
  <line x1="190" y1="170" x2="190" y2="210" stroke="#555" stroke-width="6" />
  <line x1="190" y1="210" x2="230" y2="210" stroke="#555" stroke-width="6" />
  <line x1="230" y1="210" x2="260" y2="210" stroke="#555" stroke-width="6" />
  <line x1="260" y1="210" x2="260" y2="180" stroke="#555" stroke-width="6" />
  <line x1="260" y1="180" x2="230" y2="180" stroke="#555" stroke-width="6" />
  <line x1="230" y1="180" x2="190" y2="170" stroke="#555" stroke-width="6" />
  <circle cx="212" cy="210" r="8" fill="#333" />
  <!-- Handlebars -->
  <line x1="190" y1="170" x2="160" y2="150" stroke="#555" stroke-width="6" />
  <line x1="160" y1="150" x2="145" y2="150" stroke="#555" stroke-width="6" />
  <circle cx="145" cy="150" r="6" fill="#555" />
  <!-- Pelican body -->
  <ellipse cx="190" cy="150" rx="45" ry="60" fill="#fdf3e7" stroke="#d1bba2" stroke-width="3" />
  <!-- Wing -->
  <path d="M150 150 Q120 170 150 200 Q180 230 200 210 Q180 180 150 150" fill="#f7e5cf" stroke="#d1bba2" stroke-width="2" />
  <!-- Neck -->
  <path d="M190 90 Q180 110 170 120 Q165 130 180 140 Q200 150 210 140 Q220 130 215 115 Q210 105 200 95" fill="#fdf3e7" stroke="#d1bba2" stroke-width="3" />
  <!-- Head -->
  <circle cx="200" cy="95" r="18" fill="#fdf3e7" stroke="#d1bba2" stroke-width="3" />
  <circle cx="196" cy="92" r="4" fill="#333" />
  <circle cx="206" cy="92" r="4" fill="#333" />
  <!-- Beak -->
  <path d="M210 100 L260 95 Q280 92 275 105 L260 110 Q250 112 235 108 Z" fill="#ffcc5c" stroke="#d1bba2" stroke-width="2" />
  <ellipse cx="250" cy="103" rx="6" ry="3" fill="#e6a600" />
  <!-- Legs -->
  <line x1="170" y1="205" x2="170" y2="240" stroke="#f1c27d" stroke-width="5" />
  <line x1="210" y1="205" x2="210" y2="240" stroke="#f1c27d" stroke-width="5" />
  <line x1="170" y1="240" x2="200" y2="210" stroke="#333" stroke-width="4" />
  <line x1="210" y1="240" x2="190" y2="210" stroke="#333" stroke-width="4" />
  <!-- Beak detail -->
  <line x1="225" y1="103" x2="255" y2="103" stroke="#d18200" stroke-width="2" />
</svg>