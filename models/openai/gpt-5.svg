<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff2ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6a13a"/>
      <stop offset="100%" stop-color="#f4cc6a"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f39b2b"/>
      <stop offset="100%" stop-color="#ffd28a"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eef4"/>
    </linearGradient>
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="75%" stop-color="#2b2b2b"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feMerge>
        <feMergeNode in="off"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <rect y="240" width="100%" height="60" fill="#d8f0d0"/>
  <ellipse cx="210" cy="250" rx="120" ry="12" fill="#b5c9b1" opacity="0.45" filter="url(#shadow)"/>

  <!-- Bicycle -->
  <g id="bike" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <g id="rearWheel">
      <circle cx="140" cy="230" r="40" fill="url(#tireGrad)" stroke="#222" stroke-width="3"/>
      <circle cx="140" cy="230" r="30" fill="#d1d1d1" stroke="#777" stroke-width="2"/>
      <circle cx="140" cy="230" r="6" fill="#888" stroke="#444" stroke-width="2"/>
      <!-- spokes -->
      <g stroke="#9a9a9a" stroke-width="1.2" opacity="0.8">
        <line x1="140" y1="230" x2="140" y2="190"/>
        <line x1="140" y1="230" x2="170" y2="200"/>
        <line x1="140" y1="230" x2="180" y2="230"/>
        <line x1="140" y1="230" x2="170" y2="260"/>
        <line x1="140" y1="230" x2="140" y2="270"/>
        <line x1="140" y1="230" x2="110" y2="260"/>
        <line x1="140" y1="230" x2="100" y2="230"/>
        <line x1="140" y1="230" x2="110" y2="200"/>
      </g>
    </g>
    <g id="frontWheel">
      <circle cx="280" cy="230" r="40" fill="url(#tireGrad)" stroke="#222" stroke-width="3"/>
      <circle cx="280" cy="230" r="30" fill="#d1d1d1" stroke="#777" stroke-width="2"/>
      <circle cx="280" cy="230" r="6" fill="#888" stroke="#444" stroke-width="2"/>
      <!-- spokes -->
      <g stroke="#9a9a9a" stroke-width="1.2" opacity="0.8">
        <line x1="280" y1="230" x2="280" y2="190"/>
        <line x1="280" y1="230" x2="310" y2="200"/>
        <line x1="280" y1="230" x2="320" y2="230"/>
        <line x1="280" y1="230" x2="310" y2="260"/>
        <line x1="280" y1="230" x2="280" y2="270"/>
        <line x1="280" y1="230" x2="250" y2="260"/>
        <line x1="280" y1="230" x2="240" y2="230"/>
        <line x1="280" y1="230" x2="250" y2="200"/>
      </g>
    </g>

    <!-- Frame -->
    <g id="frame" stroke="#2f4f6f" stroke-width="5" fill="none">
      <!-- Key points: BB(210,230), SC(195,160), HT(300,170), RH(140,230), FH(280,230) -->
      <line x1="210" y1="230" x2="140" y2="230"/>
      <line x1="195" y1="160" x2="140" y2="230"/>
      <line x1="195" y1="160" x2="210" y2="230"/>
      <line x1="195" y1="160" x2="300" y2="170"/>
      <line x1="210" y1="230" x2="300" y2="170"/>
      <line x1="280" y1="230" x2="300" y2="170"/>
    </g>

    <!-- Seat -->
    <g id="seat" fill="#333">
      <path d="M183 156 q12 -5 28 0 q6 3 5 7 q-1 4 -7 5 l-26 1 q-6 0 -8 -5 q-2 -6 8 -8z" />
      <rect x="192" y="160" width="6" height="20" fill="#2f4f6f"/>
    </g>

    <!-- Handlebars -->
    <g id="handlebars" stroke="#2f4f6f" stroke-width="5" fill="none">
      <line x1="300" y1="170" x2="316" y2="158"/>
      <line x1="316" y1="158" x2="332" y2="158" stroke="#333" stroke-width="6"/>
      <circle cx="300" cy="170" r="3" fill="#2f4f6f"/>
    </g>

    <!-- Chainring and cranks -->
    <g id="crankset" stroke="#333" stroke-width="4" fill="none">
      <circle cx="210" cy="230" r="14" fill="#bbbbbb" stroke="#555" stroke-width="3"/>
      <!-- Crank arms -->
      <line x1="210" y1="230" x2="225.6" y2="214.4"/>
      <line x1="210" y1="230" x2="194.4" y2="245.6"/>
      <!-- Pedals -->
      <rect x="219.6" y="212.4" width="12" height="4" fill="#444" stroke="#222" stroke-width="1.5" transform="rotate(-45 225.6 214.4) translate(-6 -2)"/>
      <rect x="188.4" y="243.6" width="12" height="4" fill="#444" stroke="#222" stroke-width="1.5" transform="rotate(135 194.4 245.6) translate(-6 -2)"/>
      <!-- Chain (simplified) -->
      <path d="M224 230 q38 -15 56 0" stroke="#555" stroke-width="2" />
      <path d="M224 234 q38 -15 56 0" stroke="#777" stroke-width="1.2" opacity="0.8"/>
    </g>
  </g>

  <!-- Motion hints -->
  <g stroke="#7fb" stroke-width="3" opacity="0.5">
    <path d="M90 230 q-20 0 -35 -10" fill="none"/>
    <path d="M320 230 q35 0 50 -10" fill="none"/>
  </g>

  <!-- Pelican: back leg (behind cranks) -->
  <g id="pelican-back-leg" stroke="#d77424" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- Hip to knee to pedal (back/down) -->
    <path d="M195 202 Q188 214 190 222 T194.4 245.6"/>
    <!-- Foot (webbed) on pedal -->
    <g fill="#f09b3c" stroke="#c76518" stroke-width="2">
      <path d="M194.4 245.6 l-10 6 l9 0.5 l-8 6 l12 -2 l-3 7 l12 -8 q5 -3 2 -6 q-5 -5 -14 -3z"/>
      <!-- toe splits -->
      <path d="M188.3 252 l8 -2" />
      <path d="M186 258 l10 -3" />
    </g>
  </g>

  <!-- Pelican body and features -->
  <g id="pelican">
    <!-- Tail feathers -->
    <g opacity="0.95">
      <path d="M150 192 l-18 10 l20 4 z" fill="#cfd6e1" stroke="#9aa5b3" stroke-width="2"/>
      <path d="M160 188 l-18 14 l24 6 z" fill="#dbe2ec" stroke="#a6b1bf" stroke-width="2"/>
    </g>

    <!-- Body -->
    <ellipse cx="185" cy="185" rx="55" ry="38" fill="url(#bodyGrad)" stroke="#9aa5b3" stroke-width="2"/>
    <!-- Belly shading -->
    <path d="M140 190 q30 22 90 12 q-40 20 -82 4 z" fill="#dfe6ef" opacity="0.8"/>

    <!-- Wing -->
    <g id="wing">
      <path d="M178 175 q-40 10 -42 26 q1 10 16 18 q22 12 55 -4 q6 -3 8 -8 q3 -8 -7 -18 q-9 -10 -30 -14z"
            fill="#e8edf5" stroke="#9aa5b3" stroke-width="2"/>
      <!-- Feather lines -->
      <g stroke="#b3bdc9" stroke-width="1.5" fill="none" opacity="0.9">
        <path d="M150 204 q18 8 40 4"/>
        <path d="M154 196 q20 10 44 6"/>
        <path d="M160 190 q22 10 41 7"/>
      </g>
    </g>

    <!-- Neck -->
    <path d="M205 165 C220 152, 240 145, 254 150 C250 158, 236 165, 220 175 C212 179, 206 177, 204 170 Z"
          fill="#ffffff" stroke="#9aa5b3" stroke-width="2"/>

    <!-- Head -->
    <g id="head">
      <ellipse cx="260" cy="148" rx="16" ry="13" fill="#ffffff" stroke="#9aa5b3" stroke-width="2"/>
      <!-- Eye -->
      <circle cx="264" cy="146" r="3.5" fill="#202020"/>
      <circle cx="265.5" cy="145" r="1.3" fill="#ffffff" opacity="0.9"/>

      <!-- Beak upper -->
      <path d="M266 150 C286 147, 302 147, 320 150 C302 153, 285 152, 266 153 Z"
            fill="url(#beakGrad)" stroke="#c5791e" stroke-width="2"/>

      <!-- Lower beak pouch -->
      <path d="M262 151
               C278 165, 300 170, 322 152
               C301 154, 284 153, 266 152
               C264 152, 263 151.5, 262 151 Z"
            fill="url(#pouchGrad)" stroke="#c5791e" stroke-width="2" opacity="0.98"/>

      <!-- Beak hinge detail -->
      <circle cx="256" cy="150" r="2" fill="#c5791e"/>
      <!-- Small head crest -->
      <path d="M246 146 q-8 -6 -10 -2 q6 8 14 6" fill="none" stroke="#b5bfcc" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Pelican: front leg (in front of cranks) -->
  <g id="pelican-front-leg" stroke="#d77424" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- Hip to knee to pedal (front/up) -->
    <path d="M206 202 Q214 208 216 214 T225.6 214.4"/>
    <!-- Foot (webbed) on pedal -->
    <g fill="#f09b3c" stroke="#c76518" stroke-width="2">
      <path d="M225.6 214.4 l12 -4 l-5 7 l10 -1 l-11 7 l8 2 l-14 1 q-6 -1 -7 -4 q-1 -5 7 -8z"/>
      <!-- toe splits -->
      <path d="M233 214 l-9 4"/>
      <path d="M239 220 l-12 3"/>
    </g>
  </g>

  <!-- Little motion lines near feet to imply pedaling -->
  <g stroke="#f3a34a" stroke-width="2" opacity="0.7">
    <path d="M236 206 q6 3 10 0" fill="none"/>
    <path d="M184 248 q-6 3 -10 0" fill="none"/>
  </g>
</svg>