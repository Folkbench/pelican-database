<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" aria-labelledby="title desc">
  <title>Pelican riding a bicycle</title>
  <desc id="desc">A whimsical pelican with a large orange beak pedals a blue bicycle along a sunny path.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"></stop>
      <stop offset="100%" stop-color="#eefaff"></stop>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb23f"></stop>
      <stop offset="100%" stop-color="#ff7b22"></stop>
    </linearGradient>
    <style>
      .bike { fill: none; stroke: #1f4f7a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .spoke { stroke: #8aa9bd; stroke-width: 2; }
      .tire { fill: none; stroke: #1d2a33; stroke-width: 10; }
      .rim { fill: none; stroke: #d8edf7; stroke-width: 5; }
      .orange-stroke { stroke: #ee8b22; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  
