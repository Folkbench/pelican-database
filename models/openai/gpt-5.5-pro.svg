<svg xmlns="http://www.w3.org/2000/svg" width="800" height="520" viewBox="0 0 800 520">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful cartoon pelican with a long orange beak pedaling a blue bicycle.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bde8ff"/>
      <stop offset="100%" stop-color="#f4fbff"/>
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd98f"/>
      <stop offset="100%" stop-color="#f2a85a"/>
    </linearGradient>

    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#1f2937" flood-opacity="0.18"/>
    </filter>

    <style>
      .outline {
        stroke: #252a33;
        stroke-width: 4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .thin-dark {
        fill: none;
        stroke: #252a33;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .frame {
        fill: none;
        stroke: #2876d9;
        stroke-width: 10;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .bike-detail {
        fill: none;
        stroke: #1f2937;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tire {
        fill: #f8fcff;
        stroke: #1f2937;
        stroke-width: 9;
      }
      .rim {
        fill: none;
        stroke: #b9c6d4;
        stroke-width: 4;
      }
      .spoke {
        stroke: #8896a8;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .hub {
        fill: #1f2937;
        stroke: #ffffff;
        stroke-width: 3;
      }
      .feather {
        fill: none;
        stroke: #9fb0bf;
        stroke-width: 3;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="680" cy="82" r="36" fill="#ffe08a" opacity="0.9"/>

  <g fill="#ffffff" opacity="0.55">
    <ellipse cx="145" cy="86" rx="48" ry="18"/>
    <ellipse cx="180" cy="78" rx="34" ry="22"/>
    <ellipse cx="218" cy="90" rx="52" ry="17"/>
    <ellipse cx="580" cy="132" rx="50" ry="17"/>
    <ellipse cx="618" cy="123" rx="35" ry="22"/>
    <ellipse cx="655" cy="134" rx="48" ry="16"/>
  </g>

  <ellipse cx="400" cy="448" rx="355" ry="38" fill="#dbeed2"/>
  <path d="M80 444 C185 426 285 464 392 440 C512 413 605 461 730 438" fill="none" stroke="#b6d8a7" stroke-width="7" stroke-linecap="round"/>

  <g opacity="0.35" stroke="#558fc6" stroke-width="5" stroke-linecap="round">
    <path d="M70 318 H158"/>
    <path d="M42 350 H128"/>
    <path d="M96 389 H180"/>
    <path d="M610 325 H728"/>
    <path d="M640 360 H760"/>
  </g>

  <g id="bicycle" filter="url(#softShadow)">
    <g id="rear-wheel">
      <circle class="tire" cx="250" cy="380" r="91"/>
      <g class="spoke" transform="translate(250 380)">
        <line x1="0" y1="0" x2="0" y2="-78"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(30)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(150)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(210)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(300)"/>
