    <line x1="617" y1="269" x2="635" y2="276" stroke="#111827" stroke-width="7" stroke-linecap="round"/>

    <circle cx="385" cy="370" r="16" fill="#f8fcff" stroke="#1f2937" stroke-width="5"/>
    <line class="bike-detail" x1="385" y1="370" x2="365" y2="348"/>
    <line class="bike-detail" x1="365" y1="348" x2="343" y2="348"/>
    <line class="bike-detail" x1="385" y1="370" x2="405" y2="392"/>
    <line class="bike-detail" x1="405" y1="392" x2="430" y2="392"/>
  </g>

