    <path class="feather" d="M252 204 L171 204"/>
    <path class="feather" d="M255 218 L182 222"/>
    <path class="feather" d="M257 232 L202 240"/>

    <ellipse class="outline" cx="350" cy="208" rx="101" ry="69" transform="rotate(7 350 208)" fill="#fffaf0"/>
