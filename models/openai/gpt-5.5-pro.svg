        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(30)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(90)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(150)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(210)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(270)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(300)"/>
        <line x1="0" y1="0" x2="0" y2="-78" transform="rotate(330)"/>
      </g>
      <circle class="rim" cx="550" cy="380" r="78"/>
      <circle class="hub" cx="550" cy="380" r="9"/>
    </g>

    <path class="frame" d="M250 380 L360 260 L385 370 L250 380                            M360 260 L510 255 L385 370                            M385 370 L550 380                            M510 255 L550 380                            M360 260 L385 370"/>

    <line class="bike-detail" x1="360" y1="260" x2="354" y2="238"/>
    <path class="outline" fill="#263241" d="M322 246 C338 234 378 234 397 246 C386 257 340 260 322 246 Z"/>

    <path class="bike-detail" d="M510 255 C526 232 545 224 572 224"/>
    <path class="bike-detail" d="M572 224 C608 224 614 250 588 258"/>
