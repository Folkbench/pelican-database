    <path d="M419 202 C464 208 507 228 549 245" fill="none" stroke="#252a33" stroke-width="22" stroke-linecap="round"/>
    <path d="M419 202 C464 208 507 228 549 245" fill="none" stroke="#fffaf0" stroke-width="15" stroke-linecap="round"/>
    <path class="thin-dark" d="M548 245 C558 239 568 239 576 245"/>

    <path d="M410 171 C438 143 437 111 470 98" fill="none" stroke="#252a33" stroke-width="43" stroke-linecap="round"/>
    <path d="M410 171 C438 143 437 111 470 98" fill="none" stroke="#fffaf0" stroke-width="35" stroke-linecap="round"/>

    <path class="outline" fill="url(#pouchGrad)" d="M499 111 C557 109 651 115 704 128 C668 164 612 184 552 165 C522 155 504 134 499 111 Z"/>
    <ellipse class="outline" cx="483" cy="98" rx="36" ry="28" transform="rotate(7 483 98)" fill="#fffaf0"/>
    <path class="outline" fill="#f28b2d" d="M497 92 C561 82 640 91 705 121 C648 124 560 122 498 118 Z"/>
    <path d="M510 117 C573 119 646 122 704 128" fill="none" stroke="#c95d17" stroke-width="3" stroke-linecap="round"/>
    <path d="M519 138 C568 166 642 160 686 129" fill="none" stroke="#d9863d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <circle cx="623" cy="106" r="2.5" fill="#8a3b12"/>

    <circle cx="489" cy="91" r="5.5" fill="#1f2937"/>
    <circle cx="491" cy="89" r="1.6" fill="#ffffff"/>
    <path class="thin-dark" d="M468 78 C481 70 496 73 507 83"/>

    <g>
      <path class="outline" fill="#f08a2a" d="M347 345 C358 333 378 336 390 349 C374 350 363 354 350 361 C352 354 346 351 347 345 Z"/>
      <path class="thin-dark" d="M359 347 L351 358 M366 348 L366 358 M373 348 L387 351"/>

      <path class="outline" fill="#f08a2a" d="M390 388 C404 376 425 381 437 394 C421 396 411 401 397 405 C399 398 390 395 390 388 Z"/>
      <path class="thin-dark" d="M404 391 L397 402 M412 392 L412 403 M420 392 L434 395"/>
