<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground -->
  <line x1="0" y1="250" x2="400" y2="250" stroke="#888" stroke-width="1" stroke-dasharray="5,5"/>

  <!-- Bicycle wheels -->
  <circle cx="100" cy="200" r="50" fill="none" stroke="#000" stroke-width="4"/>
  <circle cx="300" cy="200" r="50" fill="none" stroke="#000" stroke-width="4"/>

  <!-- Bicycle frame -->
  <polyline points="100,200 200,150 300,200" fill="none" stroke="#000" stroke-width="4"/>
  <line x1="100" y1="200" x2="200" y2="200" stroke="#000" stroke-width="4"/>
  <line x1="200" y1="150" x2="200" y2="130" stroke="#000" stroke-width="4"/>

  <!-- Handlebars -->
  <line x1="300" y1="200" x2="330" y2="160" stroke="#000" stroke-width="4"/>
  <line x1="320" y1="170" x2="340" y2="170" stroke="#000" stroke-width="4"/>

  <!-- Pedals -->
  <circle cx="200" cy="200" r="8" fill="#000"/>
  <line x1="200" y1="200" x2="220" y2="220" stroke="#000" stroke-width="4"/>
  <line x1="200" y1="200" x2="180" y2="220" stroke="#000" stroke-width="4"/>

  <!-- Pelican body -->
  <ellipse cx="180" cy="115" rx="30" ry="20" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Wing -->
  <path d="M160,110 Q180,100 200,110 Q180,115 160,110" fill="#eee" stroke="#000" stroke-width="1"/>
  <!-- Neck -->
  <path d="M200,115 Q210,100 195,90" fill="none" stroke="#000" stroke-width="2"/>
  <!-- Head -->
  <circle cx="195" cy="90" r="12" fill="#fff" stroke="#000" stroke-width="2"/>
  <!-- Beak -->
  <path d="M195,90 L230,95 L195,100 Z" fill="#fc0" stroke="#000" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="190" cy="88" r="2" fill="#000"/>

  <!-- Pelican legs -->
  <line x1="170" y1="130" x2="180" y2="220" stroke="#000" stroke-width="2"/>
  <line x1="190" y1="130" x2="220" y2="220" stroke="#000" stroke-width="2"/>
</svg>