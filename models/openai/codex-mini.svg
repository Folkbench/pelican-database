<svg
    xmlns="http://www.w3.org/2000/svg"
    width="800"
    height="600"
    viewBox="0 0 800 600"
    aria-labelledby="title desc"
    role="img"
>
  <title id="title">Pelican Riding a Bicycle</title>
  <desc id="desc">A stylized cartoon pelican pedaling a bicycle.</desc>

  <!-- Ground line -->
  <line
    x1="0" y1="500"
    x2="800" y2="500"
    stroke="#4d4d4d"
    stroke-width="4"
  />

  <!-- Bicycle wheels -->
  <circle
    cx="240" cy="500" r="60"
    fill="none"
    stroke="#333"
    stroke-width="8"
  />
  <circle
    cx="560" cy="500" r="60"
    fill="none"
    stroke="#333"
    stroke-width="8"
  />

  <!-- Bicycle frame -->
  <line x1="240" y1="500" x2="360" y2="380" stroke="#555" stroke-width="8" />
  <line x1="360" y1="380" x2="560" y2="500" stroke="#555" stroke-width="8" />
  <line x1="360" y1="380" x2="360" y2="440" stroke="#555" stroke-width="8" />
  <line x1="360" y1="440" x2="440" y2="500" stroke="#555" stroke-width="8" />
  <line x1="360" y1="380" x2="300" y2="320" stroke="#555" stroke-width="8" />
  <circle cx="360" cy="440" r="16" fill="#555" />

  <!-- Handlebars -->
  <line x1="300" y1="320" x2="260" y2="300" stroke="#555" stroke-width="8" />
  <line x1="300" y1="320" x2="280" y2="260" stroke="#555" stroke-width="8" />
  <circle cx="260" cy="300" r="8" fill="#555" />
  <circle cx="280" cy="260" r="8" fill="#555" />

  <!-- Seat -->
  <rect x="360" y="330" width="40" height="12" fill="#444" rx="4" />

  <!-- Pelican body -->
  <ellipse
    cx="360" cy="300"
    rx="80" ry="60"
    fill="#fff"
    stroke="#333"
    stroke-width="4"
  />

  <!-- Pelican wing -->
  <path
    d="M340,280
       q-50,20 -30,60
       q40,-20 30,-60"
    fill="#e6e6e6"
    stroke="#333"
    stroke-width="3"
  />

  <!-- Pelican neck & head -->
  <path
    d="M380,260
       c50,-20 80,20 60,60
       q-30,10 -60,-40"
    fill="#fff"
    stroke="#333"
    stroke-width="4"
  />

  <!-- Pelican beak -->
  <path
    d="M440,300
       l60,0
       l-40,20
       l-20,-20"
    fill="#f4a261"
    stroke="#333"
    stroke-width="3"
  />

  <!-- Pelican eye -->
  <circle cx="418" cy="285" r="8" fill="#333" />

  <!-- Feet pedaling -->
  <line x1="380" y1="360" x2="240" y2="500" stroke="#a67c52" stroke-width="8" />
  <circle cx="240" cy="500" r="10" fill="#a67c52" />
  <line x1="340" y1="360" x2="560" y2="500" stroke="#a67c52" stroke-width="8" />
  <circle cx="560" cy="500" r="10" fill="#a67c52" />

</svg>