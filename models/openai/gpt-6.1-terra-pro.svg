  <path d="M413 182 Q453 184 505 178" fill="none" stroke="#d28c3d" stroke-width="2"/>
  <circle cx="393" cy="151" r="7" fill="#354c50"/>
  <circle cx="395" cy="149" r="2.4" fill="#fff"/>
  <path d="M378 140q8-8 17-6" fill="none" stroke="#d7e2db" stroke-width="3" stroke-linecap="round"/>

