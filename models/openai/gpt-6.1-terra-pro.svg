  <path d="M397 407 Q406 413 419 411" fill="none" stroke="#eaa15a" stroke-width="10" stroke-linecap="round"/>
  <path d="M403 408q8-1 14-5" fill="none" stroke="#c87e42" stroke-width="2" stroke-linecap="round"/>

  <g fill="none" stroke="#9bbca9" stroke-width="3" stroke-linecap="round">
    <path d="M79 516q3-10 8-14 M88 516q5-8 10-9"/>
    <path d="M685 519q3-11 9-16 M695 519q5-7 11-9"/>
