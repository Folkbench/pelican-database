<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#d9f2ed"/>
      <stop offset="1" stop-color="#f8f5df"/>
    </linearGradient>
    <linearGradient id="feathers" x2="0" y2="1">
      <stop stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#d9e2dc"/>
    </linearGradient>
    <linearGradient id="pouch" x2="0" y2="1">
      <stop stop-color="#f9c45d"/>
      <stop offset="1" stop-color="#e99c4f"/>
    </linearGradient>
    <g id="wheel">
      <circle r="105" fill="#f9f8e9" stroke="#354c50" stroke-width="10"/>
      <circle r="94" fill="none" stroke="#c4d4cb" stroke-width="3"/>
      <g stroke="#a9bdb6" stroke-width="2">
        <path d="M-94 0H94 M0-94V94 M-66-66 66 66 M66-66-66 66"/>
        <path d="M-87-36 87 36 M-87 36 87-36 M-36-87 36 87 M36-87-36 87"/>
      </g>
      <circle r="9" fill="#354c50"/>
      <circle r="4" fill="#e9eee1"/>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="657" cy="105" r="42" fill="#f9db94" opacity=".75"/>
  <g fill="none" stroke="#b7d9cf" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M87 131q16-13 32 0 16-13 32 0"/>
    <path d="M584 192q12-10 24 0 12-10 24 0"/>
  </g>
  <path d="M0 512 Q190 499 390 515 T800 507 V600 H0Z" fill="#dce8d4"/>
  <path d="M0 531 Q210 518 410 534 T800 528" fill="none" stroke="#c3d8c6" stroke-width="3"/>
  <ellipse cx="389" cy="548" rx="294" ry="14" fill="#abc9bb" opacity=".3"/>

  <!-- Bicycle -->
  <use href="#wheel" x="215" y="438"/>
  <use href="#wheel" x="565" y="438"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M215 438 340 330 372 438 215 438 M340 330H485L372 438" stroke="#327d78" stroke-width="13"/>
    <path d="M485 330 565 438" stroke="#285f60" stroke-width="11"/>
    <path d="M485 330 475 301 510 296" stroke="#354c50" stroke-width="8"/>
    <path d="M503 293h22" stroke="#354c50" stroke-width="10"/>
    <path d="M340 330 335 315" stroke="#354c50" stroke-width="7"/>
    <path d="M312 315h44" stroke="#354c50" stroke-width="10"/>
    <path d="M215 438 372 438" stroke="#d4a64e" stroke-width="3"/>
  </g>
  <circle cx="372" cy="438" r="24" fill="#f6f2dc" stroke="#354c50" stroke-width="5"/>
  <circle cx="372" cy="438" r="5" fill="#354c50"/>
  <path d="M372 438 398 411 M372 438 346 465" fill="none" stroke="#354c50" stroke-width="6" stroke-linecap="round"/>
  <path d="M388 411h25 M335 465h24" stroke="#354c50" stroke-width="7" stroke-linecap="round"/>

  <!-- Far leg -->
  <path d="M321 287 Q302 317 309 346 L330 392 343 461" fill="none" stroke="#d88c4d" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M343 461q8 6 21 5" fill="none" stroke="#d88c4d" stroke-width="9" stroke-linecap="round"/>

