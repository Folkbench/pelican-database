<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="220" height="180">
  <!-- wheels -->
  <circle cx="60"  cy="140" r="30" fill="none" stroke="#000" stroke-width="4"/>
  <circle cx="160" cy="140" r="30" fill="none" stroke="#000" stroke-width="4"/>
  
  <!-- bike frame -->
  <line x1="60" y1="140" x2="110" y2="90"  stroke="#000" stroke-width="4"/>
  <line x1="110" y1="90" x2="160" y2="140" stroke="#000" stroke-width="4"/>
  <line x1="110" y1="90" x2="110" y2="50" stroke="#000" stroke-width="4"/>
  <line x1="90"  y1="120" x2="140" y2="120" stroke="#000" stroke-width="4"/>
  <line x1="110" y1="50" x2="135" y2="55" stroke="#000" stroke-width="4"/>
  
  <!-- handlebar -->
  <line x1="135" y1="55" x2="150" y2="45" stroke="#000" stroke-width="4"/>
  
  <!-- pelican body -->
  <ellipse cx="95" cy="70" rx="35" ry="25" fill="#ffffff" stroke="#000" stroke-width="2"/>
  
  <!-- wing -->
  <path d="M75 75 Q95 55 115 75" fill="#e6e6e6" stroke="#000" stroke-width="2"/>
  
  <!-- neck -->
  <path d="M110 60 C130 40 150 50 150 70" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round"/>
  <path d="M110 60 C130 40 150 50 150 70" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"/>
  
  <!-- head -->
  <circle cx="155" cy="72" r="14" fill="#ffffff" stroke="#000" stroke-width="2"/>
  
  <!-- eye -->
  <circle cx="160" cy="70" r="3" fill="#000"/>
  
  <!-- beak -->
  <polygon points="169,75 200,68 200,77 169,84" fill="#f4a742" stroke="#000" stroke-width="2"/>
  
  <!-- legs / pedals -->
  <line x1="90"  y1="120" x2="82" y2="98" stroke="#d08c4f" stroke-width="6" stroke-linecap="round"/>
  <line x1="140" y1="120" x2="148" y2="98" stroke="#d08c4f" stroke-width="6" stroke-linecap="round"/>
</svg>