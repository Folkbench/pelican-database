<svg viewBox="0 0 320 250" width="320" height="250" xmlns="http://www.w3.org/2000/svg">
    <!-- Bicycle wheels -->
    <circle cx="80" cy="190" r="36" fill="#d0d0d0" stroke="#404040" stroke-width="6"/>
    <circle cx="210" cy="190" r="36" fill="#d0d0d0" stroke="#404040" stroke-width="6"/>
    <!-- Bike frame -->
    <line x1="80" y1="190" x2="145" y2="120" stroke="#4060a0" stroke-width="6"/>
    <line x1="210" y1="190" x2="145" y2="120" stroke="#4060a0" stroke-width="6"/>
    <line x1="80" y1="190" x2="135" y2="190" stroke="#4060a0" stroke-width="6"/>
    <line x1="135" y1="190" x2="145" y2="120" stroke="#4060a0" stroke-width="6"/>
    <line x1="145" y1="120" x2="210" y2="190" stroke="#4060a0" stroke-width="6"/>
    <!-- Handlebars -->
    <line x1="145" y1="120" x2="170" y2="75" stroke="#a09080" stroke-width="6"/>
    <line x1="170" y1="75" x2="190" y2="80" stroke="#a09080" stroke-width="5"/>
    <circle cx="190" cy="80" r="6" fill="#404040"/>
    <!-- Seat -->
    <rect x="122" y="110" width="18" height="7" rx="4" fill="#a09080"/>
    <!-- Pelican body -->
    <ellipse cx="110" cy="90" rx="35" ry="24" fill="#fff" stroke="#888" stroke-width="2"/>
    <!-- Pelican wing -->
    <ellipse cx="100" cy="90" rx="13" ry="13" fill="#e3e3e3" stroke="#888" stroke-width="1.5" transform="rotate(-30 100 90)"/>
    <!-- Pelican neck -->
    <rect x="129" y="55" width="12" height="33" rx="6" fill="#fff" stroke="#888" stroke-width="1.2" transform="rotate(15 135 75)"/>
    <!-- Pelican head -->
    <ellipse cx="140" cy="55" rx="14" ry="14" fill="#fff" stroke="#888" stroke-width="2"/>
    <!-- Pelican eye -->
    <ellipse cx="146" cy="53" rx="2.4" ry="2.4" fill="#202020"/>
    <!-- Pelican beak upper -->
    <polygon points="153,58 175,62 149,60" fill="#ffb955" stroke="#d57900" stroke-width="1.3"/>
    <!-- Pelican beak lower -->
    <ellipse cx="163" cy="65" rx="14" ry="4" fill="#ffd98a" stroke="#d57900" stroke-width="1"/>
    <!-- Pelican tail -->
    <polygon points="82,106 74,120 95,111" fill="#c0c0c0"/>
    <!-- Left leg -->
    <rect x="120" y="150" width="7" height="34" rx="4" fill="#ffb955" stroke="#c68f3d" stroke-width="1"/>
    <!-- Right leg -->
    <rect x="140" y="150" width="7" height="34" rx="4" fill="#ffb955" stroke="#c68f3d" stroke-width="1"/>
    <!-- Left foot on pedal -->
    <ellipse cx="123" cy="188" rx="7" ry="3.2" fill="#ffd98a" stroke="#d57900" stroke-width="1"/>
    <!-- Right foot on pedal -->
    <ellipse cx="143" cy="188" rx="7" ry="3.2" fill="#ffd98a" stroke="#d57900" stroke-width="1"/>
</svg>