<svg
  width="400"
  height="300"
  viewBox="0 0 400 300"
  xmlns="http://www.w3.org/2000/svg"
  aria-label="Pelican riding a bicycle"
  role="img"
>
  <!-- Bicycle wheels -->
  <circle cx="100" cy="220" r="50" stroke="#333" stroke-width="4" fill="#ccc" />
  <circle cx="300" cy="220" r="50" stroke="#333" stroke-width="4" fill="#ccc" />

  <!-- Wheel spokes -->
  <g stroke="#666" stroke-width="2">
    <!-- Left wheel spokes -->
    <line x1="100" y1="170" x2="100" y2="270" />
    <line x1="50" y1="220" x2="150" y2="220" />
    <line x1="68" y1="188" x2="132" y2="252" />
    <line x1="132" y1="188" x2="68" y2="252" />

    <!-- Right wheel spokes -->
    <line x1="300" y1="170" x2="300" y2="270" />
    <line x1="250" y1="220" x2="350" y2="220" />
    <line x1="268" y1="188" x2="332" y2="252" />
    <line x1="332" y1="188" x2="268" y2="252" />
  </g>

  <!-- Bicycle frame -->
  <line x1="100" y1="220" x2="200" y2="150" stroke="#444" stroke-width="6" />
  <line x1="300" y1="220" x2="200" y2="150" stroke="#444" stroke-width="6" />
  <line x1="100" y1="220" x2="300" y2="220" stroke="#444" stroke-width="6" />
  <line x1="200" y1="150" x2="200" y2="130" stroke="#444" stroke-width="6" />

  <!-- Handlebars -->
  <line x1="200" y1="130" x2="230" y2="110" stroke="#444" stroke-width="6" />
  <line x1="230" y1="110" x2="240" y2="120" stroke="#444" stroke-width="6" />
  <line x1="230" y1="110" x2="220" y2="120" stroke="#444" stroke-width="6" />

  <!-- Pelican body -->
  <ellipse cx="220" cy="120" rx="40" ry="60" fill="#f2f0e6" stroke="#a67c00" stroke-width="2" />
  
  <!-- Pelican wing -->
  <path
    d="M190 110 Q170 130 190 150"
    fill="#d9d7ca"
    stroke="#a67c00"
    stroke-width="2"
  />

  <!-- Pelican head -->
  <circle cx="240" cy="80" r="25" fill="#f2f0e6" stroke="#a67c00" stroke-width="2" />

  <!-- Pelican eye -->
  <circle cx="250" cy="75" r="6" fill="white" />
  <circle cx="250" cy="75" r="3" fill="#333" />

  <!-- Pelican beak -->
  <path
    d="M265 85 Q290 100 270 110 Q290 120 265 130 Q260 115 255 100 Q260 85 265 85 Z"
    fill="#e0b050"
    stroke="#a67c00"
    stroke-width="2"
  />

  <!-- Pelican neck -->
  <path
    d="M230 100 Q235 90 235 80"
    fill="none"
    stroke="#a67c00"
    stroke-width="2"
  />

  <!-- Pelican legs -->
  <line x1="205" y1="180" x2="185" y2="220" stroke="#a67c00" stroke-width="6" />
  <line x1="235" y1="180" x2="255" y2="220" stroke="#a67c00" stroke-width="6" />

  <!-- Pelican feet on pedals -->
  <circle cx="185" cy="220" r="8" fill="#a67c00" />
  <circle cx="255" cy="220" r="8" fill="#a67c00" />

  <!-- Pedals -->
  <line x1="185" y1="220" x2="215" y2="210" stroke="#444" stroke-width="6" />
  <line x1="255" y1="220" x2="225" y2="230" stroke="#444" stroke-width="6" />
</svg>