<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#87CEEB"/>

  <!-- Bicycle Frame -->
  <g id="bicycle" transform="translate(50, 50)">
    <!-- Wheels -->
    <circle cx="100" cy="100" r="40" stroke="#333" stroke-width="4" fill="none"/>
    <circle cx="200" cy="100" r="40" stroke="#333" stroke-width="4" fill="none"/>
    
    <!-- Frame -->
    <line x1="100" y1="100" x2="150" y2="70" stroke="#333" stroke-width="4"/>
    <line x1="200" y1="100" x2="150" y2="70" stroke="#333" stroke-width="4"/>
    <line x1="150" y1="70" x2="150" y2="40" stroke="#333" stroke-width="4"/>
    
    <!-- Seat -->
    <rect x="140" y="35" width="20" height="10" fill="#555"/>
    
    <!-- Handlebars -->
    <line x1="150" y1="40" x2="145" y2="25" stroke="#333" stroke-width="4"/>
    <line x1="150" y1="40" x2="155" y2="25" stroke="#333" stroke-width="4"/>
    
    <!-- Pedals -->
    <circle cx="130" cy="120" r="5" fill="#333"/>
    <circle cx="170" cy="120" r="5" fill="#333"/>
    <line x1="130" y1="120" x2="135" y2="110" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="120" x2="165" y2="110" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Pelican -->
  <g id="pelican" transform="translate(100, 50)">
    <!-- Body -->
    <ellipse cx="150" cy="100" rx="30" ry="20" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    
    <!-- Head -->
    <circle cx="150" cy="70" r="15" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    
    <!-- Beak -->
    <path d="M150 70 Q160 80 170 70 Q160 85 150 80 Q140 85 130 80 Q140 75 150 70" 
          fill="#FFA500" stroke="#000" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="155" cy="65" r="3" fill="#000"/>
    
    <!-- Neck -->
    <path d="M150 85 Q140 90 135 100" stroke="#000" stroke-width="2" fill="none"/>
    
    <!-- Wings -->
    <path d="M130 95 Q120 100 130 110" stroke="#000" stroke-width="2" fill="#CCCCCC"/>
    <path d="M170 95 Q180 100 170 110" stroke="#000" stroke-width="2" fill="#CCCCCC"/>
    
    <!-- Tail Feathers -->
    <path d="M150 120 L145 130 L155 130 Z" fill="#FFFFFF" stroke="#000" stroke-width="1"/>
    
    <!-- Legs -->
    <line x1="130" y1="120" x2="120" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="170" y1="120" x2="180" y2="140" stroke="#000" stroke-width="2"/>
    
    <!-- Feet -->
    <circle cx="115" cy="145" r="3" fill="#FFA500"/>
    <circle cx="185" cy="145" r="3" fill="#FFA500"/>
  </g>
</svg>