<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Pelican riding a bicycle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <rect y="430" width="800" height="75" fill="#4a4a4a"/>
  <rect y="465" width="800" height="135" fill="#9dc183"/>
  <line x1="0" y1="467" x2="800" y2="467" stroke="#f7fafc" stroke-width="4" stroke-dasharray="40 30"/>

  <!-- Rear wheel -->
  <g>
    <circle cx="280" cy="420" r="90" fill="none" stroke="#111" stroke-width="18"/>
    <circle cx="280" cy="420" r="72" fill="none" stroke="#d0d0d0" stroke-width="5"/>
    <circle cx="280" cy="420" r="14" fill="#333"/>
    <g stroke="#aaa" stroke-width="2">
      <line x1="280" y1="330" x2="280" y2="420"/>
      <line x1="280" y1="510" x2="280" y2="420"/>
      <line x1="190" y1="420" x2="280" y2="420"/>
      <line x1="370" y1="420" x2="280" y2="420"/>
      <line x1="216" y1="356" x2="280" y2="420"/>
      <line x1="344" y1="356" x2="280" y2="420"/>
      <line x1="216" y1="484" x2="280" y2="420"/>
      <line x1="344" y1="484" x2="280" y2="420"/>
    </g>
  </g>

  <!-- Front wheel -->
  <g>
    <circle cx="580" cy="420" r="90" fill="none" stroke="#111" stroke-width="18"/>
    <circle cx="580" cy="420" r="72" fill="none" stroke="#d0d0d0" stroke-width="5"/>
    <circle cx="580" cy="420" r="14" fill="#333"/>
    <g stroke="#aaa" stroke-width="2">
      <line x1="580" y1="330" x2="580" y2="420"/>
      <line x1="580" y1="510" x2="580" y2="420"/>
      <line x1="490" y1="420" x2="580" y2="420"/>
      <line x1="670" y1="420" x2="580" y2="420"/>
      <line x1="516" y1="356" x2="580" y2="420"/>
      <line x1="644" y1="356" x2="580" y2="420"/>
      <line x1="516" y1="484" x2="580" y2="420"/>
      <line x1="644" y1="484" x2="580" y2="420"/>
    </g>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#c53030" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="430" y1="420" x2="280" y2="420"/>
    <line x1="430" y1="420" x2="380" y2="290"/>
    <line x1="430" y1="420" x2="520" y2="310"/>
    <line x1="380" y1="290" x2="520" y2="310"/>
    <line x1="380" y1="290" x2="280" y2="420"/>
    <line x1="520" y1="310" x2="580" y2="420"/>
  </g>

  <!-- Seat -->
  <ellipse cx="380" cy="285" rx="42" ry="12" fill="#2d3748"/>
  <rect x="365" y="278" width="30" height="8" rx="4" fill="#1a202c"/>

  <!-- Handlebars -->
  <g stroke="#2d3748" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="520" y1="310" x2="520" y2="270"/>
    <line x1="500" y1="270" x2="560" y2="270"/>
  </g>
  <circle cx="500" cy="270" r="7" fill="#1a202c"/>
  <circle cx="560" cy="270" r="7" fill="#1a202c"/>

  <!-- Cranks and pedals -->
  <g stroke="#2d3748" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="430" y1="420" x2="460" y2="375"/>
    <line x1="430" y1="420" x2="400" y2="465"/>
  </g>
  <rect x="452" y="367" width="20" height="14" rx="4" fill="#2d3748"/>
  <rect x="382" y="457" width="20" height="14" rx="4" fill="#2d3748"/>

  <!-- Pelican legs -->
  <g stroke="#f6ad55" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M 395 285 L 400 465"/>
    <path d="M 405 285 C 420 320, 430 350, 460 375"/>
  </g>
  <path d="M 392 462 C 385 472, 395 478, 408 472 C 412 468, 406 460, 392 462 Z" fill="#f6ad55"/>
  <path d="M 452 372 C 445 382, 455 388, 468 382 C 472 378, 466 370, 452 372 Z" fill="#f6ad55"/>

  <!-- Pelican body -->
  <ellipse cx="390" cy="235" rx="88" ry="58" fill="#f7f7f7" stroke="#d6d6d6" stroke-width="2"/>

  <!-- Tail -->
  <path d="M 318 225 C 275 195, 270 265, 318 280 Z" fill="#f7f7f7" stroke="#d6d6d6" stroke-width="2"/>

  <!-- Back wing -->
  <path d="M 350 225 C 300 205, 295 255, 345 270 Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>

  <!-- Neck -->
  <path d="M 390 205 C 420 188, 448 172, 470 150" fill="none" stroke="#f7f7f7" stroke-width="30" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="470" cy="150" r="30" fill="#f7f7f7" stroke="#d6d6d6" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="476" cy="142" r="6" fill="#1a202c"/>
  <circle cx="478" cy="140" r="2" fill="#ffffff"/>

  <!-- Front wing reaching handlebar -->
  <path d="M 360 215 C 400 195, 470 225, 520 270 C 505 285, 435 260, 365 250 Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="2"/>

  <!-- Beak upper mandible -->
  <polygon points="492,138 612,118 608,128 492,148" fill="#f6ad55" stroke="#dd6b20" stroke-width="1.5"/>

  <!-- Beak lower mandible and pouch -->
  <path d="M 492 148 C 530 185, 585 175, 608 128 C 592 145, 540 165, 492 148 Z" fill="#fbd38d" stroke="#dd6b20" stroke-width="1.5"/>
</svg>