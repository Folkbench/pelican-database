<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <style type="text/css">
      .pelican-body { fill: #FFEBCD; stroke: #8B4513; stroke-width: 2; } /* Moccasin body, SaddleBrown outline */
      .pelican-beak { fill: #FFD700; stroke: #DAA520; stroke-width: 2; } /* Gold beak, Goldenrod outline */
      .pelican-eye { fill: #000000; }
      .bicycle-frame { fill: none; stroke: #333333; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .bicycle-wheel { fill: none; stroke: #666666; stroke-width: 3; }
      .bicycle-tire { fill: #222222; }
      .bicycle-spoke { stroke: #AAAAAA; stroke-width: 1; }
      .bicycle-seat { fill: #444444; stroke: #222222; stroke-width: 2; }
      .bicycle-pedal { fill: #555555; stroke: #333333; stroke-width: 1; }
    </style>
  </defs>

  
  <g id="pelican" transform="translate(250, 150)">
    
    <path class="pelican-body" d="M100,150 C120,50 250,70 280,150 C290,200 200,280 100,250 C50,230 80,180 100,150 Z"></path>
    <path class="pelican-body" d="M100,150 C120,50 250,70 280,150 C290,200 200,280 100,250 C50,230 80,180 100,150 Z"></path>

    
    <path class="pelican-body" d="M220,90 C200,30 250,20 280,50 C300,70 290,110 270,120 Z"></path>

    
    <path class="pelican-beak" d="M280,50 Q350,20 400,60 Q380,100 280,110 Z"></path> 
    <path class="pelican-beak" d="M280,110 Q350,140 400,100 Q380,80 280,50 Z"></path> 

    
    <circle class="pelican-eye" cx="260" cy="70" r="5"></circle>

    
    
    <path class="pelican-body" d="M180,130 Q150,80 120,100 L110,130 Q140,150 180,130 Z" transform="translate(-30, 20) rotate(-10 150 120)"></path>
    
    <path class="pelican-body" d="M190,130 Q160,80 130,100 L120,130 Q150,150 190,130 Z" transform="translate(10, 20) rotate(10 150 120)"></path>

  </g>

  
  <g id="bicycle">
    
    <circle class="bicycle-tire" cx="200" cy="400" r="50"></circle>
    <circle class="bicycle-wheel" cx="200" cy="400" r="45"></circle>
    
    <line class="bicycle-spoke" x1="200" y1="400" x2="200" y2="355"></line>
    <line class="bicycle-spoke" x1="200" y1="400" x2="200" y2="445"></line>
    <line class="bicycle-spoke" x1="200" y1="400" x2="160" y2="360"></line>
    <line class="bicycle-spoke" x1="200" y1="400" x2="240" y2="440"></line>

    
    <circle class="bicycle-tire" cx="500" cy="400" r="50"></circle>
    <circle class="bicycle-wheel" cx="500" cy="400" r="45"></circle>
    
    <line class="bicycle-spoke" x1="500" y1="400" x2="500" y2="355"></line>
    <line class="bicycle-spoke" x1="500" y1="400" x2="500" y2="445"></line>
    <line class="bicycle-spoke" x1="500" y1="400" x2="460" y2="360"></line>
    <line class="bicycle-spoke" x1="500" y1="400" x2="540" y2="440"></line>

    
    <path class="bicycle-frame" d="M200,400 L250,280 L450,280 L500,400 L250,280 L280,380 L500,400"></path>
    
    <line class="bicycle-frame" x1="250" y1="280" x2="280" y2="200"></line>
    
    <path class="bicycle-seat" d="M260,200 Q280,180 300,200 L290,210 Q270,190 260,200 Z"></path>

    
    <line class="bicycle-frame" x1="450" y1="280" x2="480" y2="180"></line> 
    <path class="bicycle-frame" d="M480,180 Q450,150 420,170 M480,180 Q510,150 540,170"></path> 
    <circle cx="420" cy="170" r="8" fill="#555555" stroke="#333333" stroke-width="1"></circle> 
    <circle cx="540" cy="170" r="8" fill="#555555" stroke="#333333" stroke-width="1"></circle> 

    
    <circle class="bicycle-pedal" cx="280" cy="380" r="10"></circle>
  </g>

</svg>