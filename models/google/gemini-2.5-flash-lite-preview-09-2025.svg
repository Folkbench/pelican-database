<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <title>Pelican Riding a Bicycle</title>
  <style>
    .bicycle-frame { stroke: #3a3a3a; stroke-width: 10; stroke-linecap: round; fill: none; }
    .wheel { fill: #222; stroke: #111; stroke-width: 2; }
    .pelican-body { fill: #f7f7f7; stroke: #3a3a3a; stroke-width: 3; }
    .beak { fill: #ffdd00; stroke: #3a3a3a; stroke-width: 3; }
    .leg { stroke: #ffcc99; stroke-width: 12; stroke-linecap: round; }
  </style>

  <!-- === BICYCLE ELEMENTS === -->

  <!-- Wheels -->
  <circle cx="150" cy="300" r="45" class="wheel"/>
  <circle cx="450" cy="300" r="45" class="wheel"/>
  <!-- Spokes/Hubs -->
  <circle cx="150" cy="300" r="5" fill="#fff"/>
  <circle cx="450" cy="300" r="5" fill="#fff"/>

  <!-- Frame (Using Polyline for simplicity) -->
  <polyline points="150,300 290,270 310,160 450,210 450,300" class="bicycle-frame"/>

  <!-- Handlebars -->
  <line x1="450" y1="210" x2="510" y2="180" class="bicycle-frame" stroke-width="8"/>
  
  <!-- === PELICAN ELEMENTS === -->
  
  <!-- Body (Slightly tilted forward) -->
  <ellipse cx="320" cy="180" rx="85" ry="65" class="pelican-body"/>
  
  <!-- Back Wing (Simple curve for texture) -->
  <path d="M 240 180 Q 260 230 280 250" stroke="#bbb" stroke-width="20" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="410" cy="160" r="35" class="pelican-body"/>
  
  <!-- Eye -->
  <circle cx="420" cy="155" r="5" fill="black"/>

  <!-- Beak and Pouch -->
  <path d="M 405 175 Q 480 195 510 200 Q 480 220 405 190 Z" class="beak"/>
  <!-- Pouch detail -->
  <path d="M 415 195 Q 480 220 500 205" stroke="#ffaa00" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- Seat area (where the bird rests) -->
  <rect x="300" y="150" width="20" height="20" fill="#4a2c1a"/>

  <!-- Legs and Feet (Pedaling action) -->
  
  <!-- Right Leg (Extended forward) -->
  <line x1="315" y1="230" x2="320" y2="285" class="leg"/>
  <circle cx="320" cy="285" r="10" fill="#ffcc99"/>
  
  <!-- Left Leg (Coming up from the bottom bracket) -->
  <line x1="325" y1="235" x2="300" y2="265" class="leg"/>
  <circle cx="300" cy="265" r="10" fill="#ffcc99"/>
  
  <!-- Rudder/Tail (Simple white triangle) -->
  <path d="M 220 190 L 240 210 L 220 230 Z" fill="#f7f7f7" stroke="#3a3a3a" stroke-width="2"/>

</svg>