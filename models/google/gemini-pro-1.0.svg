<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">

  <!-- Pelican body -->
  <path d="M80,100 C50,150 50,50 80,0 C110,50 110,150 80,100 Z" fill="#e6b8af" stroke="#825c3e" stroke-width="2"/>

  <!-- Pelican head -->
  <circle cx="80" cy="40" r="15" fill="#e6b8af" stroke="#825c3e" stroke-width="2"/>

  <!-- Pelican beak -->
  <path d="M80,55 L75,70 L85,70 Z" fill="#e6b8af" stroke="#825c3e" stroke-width="2"/>

  <!-- Pelican eyes -->
  <circle cx="77" cy="43" r="2" fill="#000000"/>
  <circle cx="83" cy="43" r="2" fill="#000000"/>

  <!-- Bicycle frame -->
  <line x1="50" y1="100" x2="110" y2="100" stroke="#000000" stroke-width="3"/>
  <line x1="80" y1="100" x2="80" y2="150" stroke="#000000" stroke-width="3"/>
  <line x1="60" y1="150" x2="100" y2="150" stroke="#000000" stroke-width="3"/>

  <!-- Bicycle wheels -->
  <circle cx="60" cy="180" r="10" fill="#000000"/>
  <circle cx="100" cy="180" r="10" fill="#000000"/>

  <!-- Bicycle seat -->
  <rect x="70" y="140" width="10" height="10" fill="#825c3e"/>

  <!-- Bicycle pedals -->
  <line x1="70" y1="160" x2="75" y2="170" stroke="#000000" stroke-width="2"/>
  <line x1="90" y1="160" x2="85" y2="170" stroke="#000000" stroke-width="2"/>

</svg>