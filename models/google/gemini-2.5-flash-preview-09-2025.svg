<svg width="700" height="450" viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bike-line {
        stroke: #444;
        stroke-width: 6;
        stroke-linecap: round;
        fill: none;
      }
      .wheel {
        stroke: #333;
        stroke-width: 4;
        fill: #FFF;
      }
      .pelican-fill {
        fill: #FFFFFF;
        stroke: black;
        stroke-width: 2;
        stroke-linejoin: round;
      }
      .pouch-fill {
        fill: #FFCC00; /* Bright yellow/orange for the pouch */
        stroke: #E67E22;
        stroke-width: 2;
      }
      .leg-fill {
        fill: #E67E22;
        stroke: black;
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Ground Line (Optional visual context) -->
  <line x1="50" y1="350" x2="650" y2="350" stroke="#888" stroke-width="2"/>

  <!-- 1. The Bicycle -->
  <g id="bicycle">
    
    <!-- Wheels -->
    <g class="wheel">
      <!-- Rear Wheel (Centered at 250, 350) -->
      <circle cx="250" cy="350" r="60"/>
      <line x1="250" y1="290" x2="250" y2="410" stroke-width="1"/>
      <line x1="190" y1="350" x2="310" y2="350" stroke-width="1"/>
      
      <!-- Front Wheel (Centered at 500, 350) -->
      <circle cx="500" cy="350" r="60"/>
      <line x1="500" y1="290" x2="500" y2="410" stroke-width="1"/>
      <line x1="440" y1="350" x2="560" y2="350" stroke-width="1"/>
    </g>

    <!-- Frame -->
    <g class="bike-line">
      <!-- Top Tube/Seat Post Connection -->
      <line x1="250" y1="350" x2="380" y2="250"/>
      <!-- Down Tube -->
      <line x1="380" y1="250" x2="400" y2="350"/> 
      <!-- Chain Stay (bottom line) -->
      <line x1="250" y1="350" x2="400" y2="350"/>
      <!-- Fork -->
      <line x1="500" y1="350" x2="400" y2="200"/> 
      
      <!-- Seat Post and Seat -->
      <line x1="380" y1="250" x2="370" y2="210" stroke-width="8"/>
      <rect x="340" y="200" width="60" height="10" fill="#333" stroke="none"/>
      
      <!-- Handlebars -->
      <line x1="400" y1="200" x2="450" y2="180"/>
      <circle cx="450" cy="180" r="8" fill="#555" stroke="none"/>
      
      <!-- Pedals/Crank -->
      <circle cx="400" cy="350" r="15" fill="#555" stroke="black" stroke-width="1"/>
    </g>
  </g>

  <!-- 2. The Pelican -->
  <g id="pelican">
    
    <!-- Body (Sitting on the seat) -->
    <ellipse class="pelican-fill" cx="370" cy="245" rx="55" ry="40"/>
    
    <!-- Neck -->
    <path class="pelican-fill" d="M370 205 Q320 150 300 170" stroke-width="4"/>
    
    <!-- Head -->
    <circle class="pelican-fill" cx="295" cy="168" r="20"/>
    <circle cx="285" cy="165" r="3" fill="black"/> <!-- Eye -->

    <!-- Beak and Pouch -->
    <g transform="rotate(-10 310 175)">
      <!-- Upper Beak -->
      <rect x="295" y="170" width="80" height="8" fill="#E67E22" stroke="black" stroke-width="1"/>
      <!-- Pouch (lower beak) -->
      <path class="pouch-fill" d="M295 178 L375 178 L360 210 L300 210 Z"/>
    </g>

    <!-- Feet and Legs (Positioned near the pedals) -->
    <g class="leg-fill">
      <!-- Left Leg (down) -->
      <line x1="390" y1="280" x2="415" y2="335" stroke-width="4" stroke-linecap="round"/>
      <!-- Foot (on pedal) -->
      <path d="M410 340 L400 340 L405 350 Z" /> 
      
      <!-- Right Leg (up/back) -->
      <line x1="360" y1="280" x2="380" y2="300" stroke-width="4" stroke-linecap="round"/>
    </g>
    
  </g>

</svg>