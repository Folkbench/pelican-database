<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <title>Pelican riding a bicycle</title>

  <!-- Bike Frame and Wheels -->
  <g id="bicycle" stroke="black" stroke-width="10" fill="none">
    <!-- Back Wheel -->
    <circle cx="250" cy="350" r="100"/>
    <!-- Front Wheel -->
    <circle cx="650" cy="350" r="100"/>

    <!-- Frame Tubes -->
    <line x1="250" y1="350" x2="450" y2="200"/> <!-- Bottom rear to seat post connection -->
    <line x1="650" y1="350" x2="450" y2="200"/> <!-- Bottom front to seat post connection -->
    <line x1="450" y1="200" x2="500" y2="150"/> <!-- Seat post connection to handlebar stem -->
    <line x1="450" y1="200" x2="550" y2="200"/> <!-- Top tube (simplified) -->
  </g>

  <!-- Bike Components -->
  <g id="bike-components" stroke="black" stroke-width="8" fill="grey">
    <!-- Seat -->
    <rect x="460" y="130" width="80" height="20" fill="red" stroke="black" stroke-width="5"/>
    <!-- Handlebars -->
    <g transform="translate(550, 150)">
      <path d="M 0 0 Q 50 -50 100 0" fill="none"/>
      <circle cx="100" cy="0" r="15" fill="black"/> <!-- Grip -->
    </g>
    <!-- Crank and Pedals -->
    <circle cx="450" cy="300" r="20" fill="black"/> <!-- Crank center -->
    <line x1="450" y1="300" x2="400" y2="350"/> <!-- Left crank -->
    <circle cx="400" cy="350" r="15" fill="red"/> <!-- Left pedal -->
    <line x1="450" y1="300" x2="500" y2="350"/> <!-- Right crank -->
    <circle cx="500" cy="350" r="15" fill="red"/> <!-- Right pedal -->
  </g>


  <!-- Pelican -->
  <g id="pelican" fill="burlywood" stroke="black" stroke-width="3">
    <!-- Body -->
    <ellipse cx="460" cy="250" rx="80" ry="100"/>

    <!-- Neck -->
    <path d="M 460 150 C 450 80, 500 80, 550 150" fill="none" stroke="burlywood" stroke-width="20" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="550" cy="150" r="40"/>

    <!-- Eye -->
    <circle cx="565" cy="140" r="5" fill="black"/>

    <!-- Beak -->
    <path d="M 590 150 L 680 160 L 680 190 L 590 180 Z" fill="paleturquoise" stroke="black"/> <!-- Top/shape of beak -->
    <path d="M 590 180 Q 630 250 680 190" fill="paleturquoise" stroke="black"/> <!-- Pouch -->

    <!-- Leg 1 (left) -->
    <line x1="430" y1="340" x2="410" y2="345" stroke="burlywood" stroke-width="10" stroke-linecap="round"/>
     <line x1="410" y1="345" x2="405" y2="360" stroke="burlywood" stroke-width="10" stroke-linecap="round"/> <!-- Foot near pedal -->


    <!-- Leg 2 (right) -->
     <line x1="490" y1="340" x2="495" y2="350" stroke="burlywood" stroke-width="10" stroke-linecap="round"/>
     <line x1="495" y1="350" x2="500" y2="365" stroke="burlywood" stroke-width="10" stroke-linecap="round"/> <!-- Foot near pedal -->

    <!-- Wing (simple) -->
    <path d="M 400 230 Q 350 260 400 300 Z" fill="burlywood" stroke="black"/>

  </g>

</svg>