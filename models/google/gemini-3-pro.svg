<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="300" fill="url(#skyGradient)" />
  <rect x="0" y="250" width="400" height="50" fill="#8D6E63" /> <!-- Ground -->
  <rect x="0" y="250" width="400" height="10" fill="#5D4037" /> <!-- Road edge -->
  
  <!-- Clouds -->
  <path d="M50,60 Q65,40 80,60 T110,60 T140,60" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M280,40 Q295,20 310,40 T340,40" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="200" cy="275" rx="120" ry="10" fill="rgba(0,0,0,0.2)" />

  <!-- Bicycle (Back Half) -->
  <g transform="translate(0, -10)">
    <!-- Back Wheel -->
    <circle cx="100" cy="240" r="35" fill="none" stroke="#333" stroke-width="6" />
    <circle cx="100" cy="240" r="30" fill="none" stroke="#DDD" stroke-width="2" />
    <!-- Spokes -->
    <g stroke="#BBB" stroke-width="1">
      <line x1="100" y1="205" x2="100" y2="275" />
      <line x1="65" y1="240" x2="135" y2="240" />
      <line x1="75" y1="215" x2="125" y2="265" />
      <line x1="75" y1="265" x2="125" y2="215" />
    </g>

    <!-- Front Wheel -->
    <circle cx="300" cy="240" r="35" fill="none" stroke="#333" stroke-width="6" />
    <circle cx="300" cy="240" r="30" fill="none" stroke="#DDD" stroke-width="2" />
    <!-- Spokes -->
    <g stroke="#BBB" stroke-width="1">
      <line x1="300" y1="205" x2="300" y2="275" />
      <line x1="265" y1="240" x2="335" y2="240" />
      <line x1="275" y1="215" x2="325" y2="265" />
      <line x1="275" y1="265" x2="325" y2="215" />
    </g>

    <!-- Bike Frame -->
    <path d="M100,240 L180,240 L150,160 L100,240" fill="none" stroke="#D32F2F" stroke-width="5" stroke-linejoin="round" />
    <path d="M180,240 L260,150 L250,150" fill="none" stroke="#D32F2F" stroke-width="5" stroke-linecap="round" />
    <path d="M150,160 L260,150" fill="none" stroke="#D32F2F" stroke-width="5" />
    <!-- Fork -->
    <line x1="260" y1="150" x2="300" y2="240" stroke="#D32F2F" stroke-width="4" />
    <!-- Handlebars -->
    <path d="M260,150 L255,130 L280,120" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" />
    
    <!-- Seat -->
    <path d="M140,160 L130,155 L170,155 Z" fill="#333" />
    <ellipse cx="150" cy="155" rx="20" ry="5" fill="#333" />

    <!-- Chainring -->
    <circle cx="180" cy="240" r="12" fill="#999" stroke="#555" stroke-width="2" />
  </g>

  <!-- Pelican (Far Leg - Left) -->
  <g transform="translate(0, -10)">
    <!-- Leg -->
    <path d="M160,190 Q165,220 180,240" stroke="#FF9800" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Foot on Pedal -->
    <path d="M175,240 L195,240 L190,250 Z" fill="#FF9800" />
    <rect x="175" y="245" width="20" height="5" fill="#333" /> <!-- Pedal -->
  </g>

  <!-- Pelican Body -->
  <g transform="translate(0, -10)">
    <!-- Tail -->
    <path d="M110,170 Q90,180 100,190 Q120,185 130,180" fill="#FFF" stroke="#DDD" stroke-width="1" />
    
    <!-- Main Body -->
    <ellipse cx="160" cy="170" rx="55" ry="40" fill="#FFF" stroke="#EEE" stroke-width="2" />
    
    <!-- Neck -->
    <path d="M190,150 Q210,140 215,100 L235,100 Q235,160 200,180 Z" fill="#FFF" stroke="#EEE" stroke-width="1" />

    <!-- Head Tuft -->
    <path d="M210,80 Q200,85 195,75 Q205,75 215,80" fill="#FFF" />

    <!-- Head Circle -->
    <circle cx="225" cy="90" r="18" fill="#FFF" />

    <!-- Beak & Pouch -->
    <!-- Upper Mandible -->
    <path d="M235,82 L320,95 Q325,97 320,100 L240,95" fill="#FFB74D" stroke="#E65100" stroke-width="1" />
    <!-- Lower Pouch (The distinctive part) -->
    <path d="M240,95 L320,100 Q300,140 230,120 Q235,110 240,95" fill="url(#beakGradient)" stroke="#E65100" stroke-width="1" />
    <!-- Beak Tip Hook -->
    <path d="M320,95 L322,102 L315,100" fill="#E65100" />

    <!-- Eye -->
    <circle cx="225" cy="88" r="3" fill="black" />
    <circle cx="226" cy="87" r="1" fill="white" />

    <!-- Wing -->
    <path d="M150,150 Q200,150 200,180 Q180,200 150,190 Q130,170 150,150" fill="#FDFBF7" stroke="#DDD" stroke-width="2" />
    <!-- Wing Feathers -->
    <path d="M150,190 Q160,195 170,190 M170,190 Q180,195 190,185" fill="none" stroke="#DDD" stroke-width="2" />
  </g>

  <!-- Pelican (Near Leg - Right) -->
  <g transform="translate(0, -10)">
    <!-- Leg Thigh feathering -->
    <path d="M160,190 Q170,200 180,190" fill="#FFF" />
    <!-- Lower Leg -->
    <path d="M170,195 Q190,200 180,220" stroke="#FF9800" stroke-width="6" fill="none" stroke-linecap="round" />
    <!-- Foot on Pedal (High position) -->
    <g transform="translate(180, 220) rotate(-20)">
        <!-- Webbed Foot -->
        <path d="M-5,0 L15,0 L12,10 L5,8 L-2,10 Z" fill="#FF9800" />
        <rect x="-5" y="5" width="20" height="5" fill="#333" /> <!-- Pedal -->
    </g>
    <!-- Crank Arm -->
    <line x1="180" y1="240" x2="180" y2="225" stroke="#999" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Motion Lines -->
  <g stroke="#87CEEB" stroke-width="2" opacity="0.7">
    <line x1="330" y1="240" x2="360" y2="240" />
    <line x1="340" y1="250" x2="370" y2="250" />
    <path d="M100,180 Q80,180 70,170" fill="none" />
  </g>

</svg>