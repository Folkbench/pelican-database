<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Gradient for the sky -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81D4FA" />
      <stop offset="100%" stop-color="#E1F5FE" />
    </linearGradient>
    
    <!-- Gradient for the ground -->
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#81C784" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />
  
  <!-- Sun -->
  <circle cx="100" cy="100" r="50" fill="#FFF59D" opacity="0.8" />
  <circle cx="100" cy="100" r="40" fill="#FFEB3B" />

  <!-- Clouds -->
  <path d="M 200 120 Q 230 90 260 120 Q 290 100 320 130 Q 340 150 300 160 L 220 160 Q 180 150 200 120 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 600 180 Q 620 150 650 170 Q 680 150 700 180 Q 720 200 680 210 L 620 210 Q 580 200 600 180 Z" fill="#FFFFFF" opacity="0.8" />
  <path d="M 400 80 Q 420 60 440 80 Q 460 70 470 90 Q 480 100 460 110 L 410 110 Q 380 100 400 80 Z" fill="#FFFFFF" opacity="0.7" />

  <!-- Ground -->
  <rect y="530" width="800" height="70" fill="url(#groundGrad)" />
  <path d="M 0 530 Q 200 510 400 530 T 800 530" fill="#66BB6A" opacity="0.5" />

  <!-- Bicycle Shadows -->
  <ellipse cx="250" cy="535" rx="85" ry="15" fill="rgba(0,0,0,0.15)" />
  <ellipse cx="550" cy="535" rx="85" ry="15" fill="rgba(0,0,0,0.15)" />

  <!-- ================= BICYCLE ================= -->
  <g id="bicycle">
    <!-- Back Wheel -->
    <circle cx="250" cy="450" r="80" fill="none" stroke="#333" stroke-width="12" />
    <circle cx="250" cy="450" r="70" fill="none" stroke="#B0BEC5" stroke-width="3" />
    <!-- Spokes -->
    <g stroke="#90A4AE" stroke-width="2">
      <line x1="250" y1="370" x2="250" y2="530" />
      <line x1="170" y1="450" x2="330" y2="450" />
      <line x1="193" y1="393" x2="307" y2="507" />
      <line x1="307" y1="393" x2="193" y2="507" />
      <line x1="210" y1="380" x2="290" y2="520" />
      <line x1="290" y1="380" x2="210" y2="520" />
    </g>
    <circle cx="250" cy="450" r="12" fill="#333" />

    <!-- Front Wheel -->
    <circle cx="550" cy="450" r="80" fill="none" stroke="#333" stroke-width="12" />
    <circle cx="550" cy="450" r="70" fill="none" stroke="#B0BEC5" stroke-width="3" />
    <!-- Spokes -->
    <g stroke="#90A4AE" stroke-width="2">
      <line x1="550" y1="370" x2="550" y2="530" />
      <line x1="470" y1="450" x2="630" y2="450" />
      <line x1="493" y1="393" x2="607" y2="507" />
      <line x1="607" y1="393" x2="493" y2="507" />
      <line x1="510" y1="380" x2="590" y2="520" />
      <line x1="590" y1="380" x2="510" y2="520" />
    </g>
    <circle cx="550" cy="450" r="12" fill="#333" />

    <!-- Bike Chain -->
    <path d="M 400 450 L 250 450" stroke="#666" stroke-width="4" stroke-dasharray="6,3" />
    <circle cx="250" cy="450" r="18" fill="none" stroke="#666" stroke-width="4" />
    <circle cx="400" cy="450" r="18" fill="none" stroke="#666" stroke-width="4" />

    <!-- Frame -->
    <g stroke="#D32F2F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <!-- Chainstay -->
      <line x1="250" y1="450" x2="400" y2="450" />
      <!-- Seat stay -->
      <line x1="250" y1="450" x2="360" y2="320" />
      <!-- Seat tube -->
      <line x1="400" y1="450" x2="360" y2="320" />
      <!-- Down tube -->
      <line x1="400" y1="450" x2="520" y2="320" />
      <!-- Top tube -->
      <line x1="360" y1="320" x2="520" y2="320" />
      <!-- Head tube -->
      <line x1="520" y1="320" x2="550" y2="450" />
    </g>

    <!-- Fork -->
    <line x1="550" y1="450" x2="550" y2="320" stroke="#D32F2F" stroke-width="8" stroke-linecap="round" />
    
    <!-- Handlebar Stem -->
    <line x1="550" y1="320" x2="560" y2="290" stroke="#333" stroke-width="8" stroke-linecap="round" />
    
    <!-- Handlebars -->
    <path d="M 560 290 Q 580 280 590 300 Q 600 320 580 330" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round" />
    
    <!-- Seat Post -->
    <line x1="360" y1="320" x2="350" y2="290" stroke="#333" stroke-width="8" stroke-linecap="round" />
    
    <!-- Seat -->
    <ellipse cx="350" cy="290" rx="35" ry="12" fill="#333" />
    <ellipse cx="350" cy="288" rx="30" ry="8" fill="#555" />

    <!-- Pedal Crank -->
    <circle cx="400" cy="450" r="15" fill="#333" />
    <circle cx="400" cy="450" r="8" fill="#666" />
    
    <!-- Crank Arms -->
    <line x1="400" y1="450" x2="430" y2="480" stroke="#333" stroke-width="8" stroke-linecap="round" />
    <line x1="400" y1="450" x2="370" y2="420" stroke="#333" stroke-width="8" stroke-linecap="round" />
    
    <!-- Pedals -->
    <rect x="420" y="475" width="25" height="12" rx="4" fill="#333" />
    <rect x="355" y="415" width="25" height="12" rx="4" fill="#333" />
  </g>

  <!-- ================= PELICAN ================= -->
  <g id="pelican">
    <!-- Back Wing -->
    <path d="M 300 200 Q 220 260 240 340 Q 260 370 320 330 Z" fill="#E0E0E0" stroke="#333" stroke-width="4" stroke-linejoin="round" />
    <path d="M 280 240 Q 250 280 260 320" fill="none" stroke="#B0BEC5" stroke-width="3" />

    <!-- Tail Feathers -->
    <path d="M 280 300 Q 220 350 240 380 Q 260 360 290 340 Z" fill="#FFFFFF" stroke="#333" stroke-width="4" stroke-linejoin="round" />

    <!-- Pelican Body -->
    <path d="M 340 140 C 440 140 460 260 390 330 C 330 380 260 330 260 240 C 260 150 280 140 340 140 Z" fill="#FFFFFF" stroke="#333" stroke-width="4" stroke-linejoin="round" />

    <!-- Back Leg (Pedaling Up) -->
    <g stroke="#FF9800" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <line x1="340" y1="320" x2="370" y2="380" />
      <line x1="370" y1="380" x2="370" y2="420" />
    </g>
    <!-- Back Foot -->
    <path d="M 370 420 L 395 420 L 395 432 L 355 432 Z" fill="#FF9800" stroke="#333" stroke-width="3" stroke-linejoin="round" />

    <!-- Front Leg (Pedaling Down) -->
    <g stroke="#FF9800" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
      <line x1="360" y1="320" x2="400" y2="400" />
      <line x1="400" y1="400" x2="420" y2="470" />
    </g>
    <!-- Front Foot -->
    <path d="M 420 470 L 445 470 L 445 482 L 405 482 Z" fill="#FF9800" stroke="#333" stroke-width="3" stroke-linejoin="round" />

    <!-- Neck -->
    <path d="M 360 180 C 380 80, 460 80, 480 130 L 480 160 C 430 160, 400 180, 380 230 Z" fill="#FFFFFF" stroke="#333" stroke-width="4" stroke-linejoin="round" />

    <!-- Head -->
    <circle cx="480" cy="130" r="42" fill="#FFFFFF" stroke="#333" stroke-width="4" />

    <!-- Eye -->
    <circle cx="500" cy="120" r="6" fill="#333" />
    <circle cx="502" cy="118" r="2" fill="#FFFFFF" />

    <!-- Upper Beak -->
    <path d="M 510 110 Q 630 105 650 140 Q 580 140 510 140 Z" fill="#FFB300" stroke="#333" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Beak Tip -->
    <path d="M 640 140 Q 660 145 650 155 Q 630 150 620 150 Z" fill="#FF8F00" stroke="#333" stroke-width="3" stroke-linejoin="round" />

    <!-- Pouch -->
    <path d="M 510 140 Q 580 220 640 140 Z" fill="#FFE082" stroke="#333" stroke-width="4" stroke-linejoin="round" />
    <!-- Pouch details -->
    <path d="M 520 150 Q 570 190 620 145" fill="none" stroke="#FFCA28" stroke-width="3" />

    <!-- Front Wing (Holding Handlebars) -->
    <path d="M 380 200 Q 460 230 550 290 Q 570 300 560 315 Q 480 290 400 260 Z" fill="#FFFFFF" stroke="#333" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Wing Feathers Details -->
    <path d="M 440 235 L 520 290" stroke="#333" stroke-width="3" stroke-linecap="round" />
    <path d="M 420 225 L 500 285" stroke="#333" stroke-width="3" stroke-linecap="round" />
    <path d="M 400 215 L 480 280" stroke="#333" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Motion Lines (for a sense of movement) -->
  <g stroke="#90A4AE" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="120" y1="450" x2="60" y2="450" />
    <line x1="140" y1="480" x2="80" y2="480" />
    <line x1="110" y1="420" x2="70" y2="420" />
    <line x1="680" y1="450" x2="740" y2="450" />
    <line x1="660" y1="480" x2="720" y2="480" />
    <line x1="690" y1="420" x2="730" y2="420" />
  </g>
</svg>