<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#e1f5fe"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <g id="sun">
    <circle cx="100" cy="100" r="50" fill="#ffeb3b"/>
    <line x1="100" y1="30" x2="100" y2="10" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="170" x2="100" y2="190" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="30" y1="100" x2="10" y2="100" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="170" y1="100" x2="190" y2="100" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="35" y2="35" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="165" y2="165" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="50" y1="150" x2="35" y2="165" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
    <line x1="150" y1="50" x2="165" y2="35" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Clouds -->
  <g id="clouds" fill="#ffffff" opacity="0.8">
    <path d="M 150,100 Q 170,80 190,100 Q 210,90 230,110 Q 250,130 230,140 L 150,140 Q 130,130 130,110 Q 130,90 150,100 Z"/>
    <path d="M 600,150 Q 620,130 640,150 Q 660,140 680,160 Q 700,180 680,190 L 600,190 Q 580,180 580,160 Q 580,140 600,150 Z"/>
    <path d="M 350,80 Q 370,60 390,80 Q 410,70 430,90 Q 450,110 430,120 L 350,120 Q 330,110 330,90 Q 330,70 350,80 Z"/>
  </g>

  <!-- Birds in the sky -->
  <g id="birds" fill="none" stroke="#333" stroke-width="3">
    <path d="M 600,100 Q 610,90 620,100 Q 630,90 640,100"/>
    <path d="M 650,120 Q 655,115 660,120 Q 665,115 670,120" stroke-width="2"/>
    <path d="M 720,80 Q 730,70 740,80 Q 750,70 760,80" stroke-width="2"/>
  </g>

  <!-- Ground -->
  <g id="ground">
    <path d="M 0,500 Q 200,480 400,500 T 800,500 L 800,600 L 0,600 Z" fill="#aed581"/>
    <path d="M 0,520 Q 200,500 400,520 T 800,520 L 800,600 L 0,600 Z" fill="#81c784"/>
  </g>

  <!-- Trees -->
  <g id="trees">
    <circle cx="700" cy="480" r="40" fill="#81c784"/>
    <circle cx="730" cy="490" r="30" fill="#66bb6a"/>
    <circle cx="680" cy="490" r="30" fill="#66bb6a"/>
    <circle cx="100" cy="480" r="40" fill="#81c784"/>
    <circle cx="70" cy="490" r="30" fill="#66bb6a"/>
    <circle cx="130" cy="490" r="30" fill="#66bb6a"/>
  </g>

  <!-- Speed Lines -->
  <g id="speed-lines" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="50" y1="300" x2="150" y2="300"/>
    <line x1="80" y1="340" x2="200" y2="340"/>
    <line x1="600" y1="300" x2="700" y2="300"/>
    <line x1="580" y1="340" x2="680" y2="340"/>
  </g>

  <!-- Shadow under bicycle -->
  <ellipse cx="400" cy="530" rx="200" ry="20" fill="#000000" opacity="0.15"/>

  <!-- Pelican Back Wing -->
  <g id="pelican-back-wing">
    <path d="M 320,210 Q 400,230 460,270 Q 420,270 350,240 Z" fill="#bdbdbd" stroke="#333" stroke-width="4"/>
  </g>

  <!-- Pelican Back Leg -->
  <g id="pelican-back-leg">
    <path d="M 340,290 L 420,440" fill="none" stroke="#ffeb3b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 420,440 L 440,450 L 450,440 L 430,430 Z" fill="#ffeb3b" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Bicycle -->
  <g id="bicycle">
    <!-- Rear Wheel -->
    <g id="rear-wheel">
      <circle cx="250" cy="450" r="80" fill="none" stroke="#333" stroke-width="12"/>
      <circle cx="250" cy="450" r="70" fill="none" stroke="#ccc" stroke-width="4"/>
      <circle cx="250" cy="450" r="60" fill="none" stroke="#ccc" stroke-width="2" opacity="0.5"/>
      <g stroke="#999" stroke-width="2">
        <line x1="250" y1="380" x2="250" y2="520"/>
        <line x1="180" y1="450" x2="320" y2="450"/>
        <line x1="200" y1="400" x2="300" y2="500"/>
        <line x1="300" y1="400" x2="200" y2="500"/>
      </g>
      <circle cx="250" cy="450" r="10" fill="none" stroke="#555" stroke-width="4"/>
    </g>

    <!-- Front Wheel -->
    <g id="front-wheel">
      <circle cx="550" cy="450" r="80" fill="none" stroke="#333" stroke-width="12"/>
      <circle cx="550" cy="450" r="70" fill="none" stroke="#ccc" stroke-width="4"/>
      <circle cx="550" cy="450" r="60" fill="none" stroke="#ccc" stroke-width="2" opacity="0.5"/>
      <g stroke="#999" stroke-width="2">
        <line x1="550" y1="380" x2="550" y2="520"/>
        <line x1="480" y1="450" x2="620" y2="450"/>
        <line x1="500" y1="400" x2="600" y2="500"/>
        <line x1="600" y1="400" x2="500" y2="500"/>
      </g>
      <circle cx="550" cy="450" r="10" fill="none" stroke="#555" stroke-width="4"/>
    </g>

    <!-- Frame -->
    <g id="frame" stroke="#e91e63" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="250" y1="450" x2="400" y2="450"/> <!-- Chainstay -->
      <line x1="400" y1="450" x2="350" y2="320"/> <!-- Seat tube -->
      <line x1="350" y1="320" x2="500" y2="320"/> <!-- Top tube -->
      <line x1="500" y1="320" x2="400" y2="450"/> <!-- Down tube -->
      <line x1="500" y1="320" x2="550" y2="450"/> <!-- Fork -->
      <line x1="350" y1="320" x2="340" y2="290"/> <!-- Seat post -->
      <line x1="500" y1="320" x2="490" y2="290"/> <!-- Handlebar stem -->
      <line x1="500" y1="320" x2="520" y2="380" stroke-width="12"/> <!-- Head tube -->
    </g>

    <!-- Chain -->
    <g id="chain" stroke="#555" stroke-width="3" stroke-dasharray="4,2">
      <line x1="250" y1="440" x2="400" y2="430"/>
      <line x1="250" y1="460" x2="400" y2="470"/>
    </g>

    <!-- Chainring -->
    <circle cx="400" cy="450" r="20" fill="none" stroke="#555" stroke-width="4"/>
    <circle cx="400" cy="450" r="22" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Seat -->
    <path d="M 320,290 L 360,290 C 365,290 365,295 360,295 L 320,295 C 315,295 315,290 320,290 Z" fill="#333"/>

    <!-- Handlebars -->
    <g id="handlebars">
      <path d="M 490,290 C 490,270 510,270 520,280" fill="none" stroke="#333" stroke-width="8" stroke-linecap="round"/>
      <path d="M 515,277 L 530,290" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round"/>
      <circle cx="500" cy="270" r="8" fill="#ffc107" stroke="#333" stroke-width="3"/>
      <path d="M 500,270 L 505,275" fill="none" stroke="#333" stroke-width="3"/>
    </g>

    <!-- Pedals and Cranks -->
    <g id="pedals">
      <!-- Crank 2 (Back) -->
      <line x1="400" y1="450" x2="420" y2="440" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="410" y="435" width="20" height="10" rx="3" fill="#333"/>
      
      <!-- Crank 1 (Front) -->
      <line x1="400" y1="450" x2="380" y2="460" stroke="#333" stroke-width="6" stroke-linecap="round"/>
      <rect x="370" y="455" width="20" height="10" rx="3" fill="#333"/>
    </g>
  </g>

  <!-- Basket -->
  <g id="basket">
    <path d="M 520,280 L 560,280 L 560,330 L 520,330 Z" fill="#ffb74d" stroke="#333" stroke-width="4"/>
    <line x1="520" y1="300" x2="560" y2="300" stroke="#333" stroke-width="2"/>
    <line x1="520" y1="320" x2="560" y2="320" stroke="#333" stroke-width="2"/>
    <line x1="540" y1="280" x2="540" y2="330" stroke="#333" stroke-width="2"/>
    <!-- Fish in Basket -->
    <path d="M 530,310 Q 540,300 550,310 Q 540,320 530,310 Z" fill="#03a9f4" stroke="#333" stroke-width="2"/>
    <path d="M 550,310 L 555,305 L 555,315 Z" fill="#03a9f4" stroke="#333" stroke-width="2"/>
    <circle cx="535" cy="309" r="1.5" fill="#333"/>
  </g>

  <!-- Pelican Body -->
  <g id="pelican-body">
    <ellipse cx="340" cy="230" rx="60" ry="70" fill="#ffffff" stroke="#333" stroke-width="4"/>
    <!-- Feathers -->
    <path d="M 320,250 Q 340,260 360,250" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 310,270 Q 330,280 350,270" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Tail -->
    <path d="M 280,230 Q 220,240 200,270 Q 240,270 280,260 Z" fill="#ffffff" stroke="#333" stroke-width="4"/>
  </g>

  <!-- Pelican Neck, Head, and Beak -->
  <g id="pelican-neck-head-beak">
    <!-- Neck -->
    <path d="M 370,220 Q 370,150 410,150 L 430,160 Q 400,180 400,220 Z" fill="#ffffff" stroke="#333" stroke-width="4"/>
    <!-- Head -->
    <circle cx="410" cy="150" r="35" fill="#ffffff" stroke="#333" stroke-width="4"/>
    <!-- Blush -->
    <circle cx="430" cy="155" r="8" fill="#ff8a80" opacity="0.6"/>
    <!-- Eye -->
    <circle cx="420" cy="140" r="6" fill="#333"/>
    <circle cx="422" cy="138" r="2" fill="#fff"/>
    <!-- Upper Beak -->
    <path d="M 440,140 C 510,130 550,150 570,165 C 530,175 480,175 440,165 Z" fill="#ff9800" stroke="#333" stroke-width="3"/>
    <!-- Beak Hook -->
    <path d="M 570,165 C 575,168 575,172 570,175" fill="none" stroke="#333" stroke-width="3"/>
    <!-- Pouch -->
    <path d="M 440,165 C 490,220 540,190 570,165 C 530,185 480,185 440,165 Z" fill="#ffb74d" stroke="#333" stroke-width="3"/>
    <!-- Beak Separation Line -->
    <path d="M 440,165 C 480,165 530,175 570,165" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Fish in Pouch -->
    <path d="M 480,190 Q 490,180 500,190 Q 490,200 480,190 Z" fill="#03a9f4" stroke="#333" stroke-width="2"/>
    <path d="M 500,190 L 505,185 L 505,195 Z" fill="#03a9f4" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Pelican Front Leg -->
  <g id="pelican-front-leg">
    <path d="M 350,290 L 380,460" fill="none" stroke="#ffeb3b" stroke-width="12" stroke-linecap="round"/>
    <path d="M 380,460 L 400,470 L 410,460 L 390,450 Z" fill="#ffeb3b" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Pelican Front Wing -->
  <g id="pelican-front-wing">
    <path d="M 360,210 Q 450,230 530,280 Q 480,280 390,250 Z" fill="#e0e0e0" stroke="#333" stroke-width="4"/>
    <path d="M 530,280 L 540,290 L 535,295 L 525,285 Z" fill="#e0e0e0" stroke="#333" stroke-width="3"/>
    <path d="M 380,230 L 400,250 L 390,260" fill="none" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Scarf -->
  <g id="scarf">
    <!-- Neck Wrap -->
    <path d="M 380,190 Q 400,200 420,190 L 410,210 Q 390,220 370,210 Z" fill="#f44336" stroke="#333" stroke-width="3"/>
    <!-- Tail 1 -->
    <path d="M 380,200 Q 280,240 200,180 Q 300,210 380,200" fill="#f44336" stroke="#333" stroke-width="3"/>
    <!-- Tail 2 -->
    <path d="M 380,200 Q 260,260 180,200 Q 280,230 380,200" fill="#ef5350" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Helmet -->
  <g id="helmet">
    <path d="M 375,120 Q 410,90 445,120 L 445,130 Q 410,120 375,130 Z" fill="#ffc107" stroke="#333" stroke-width="4"/>
    <path d="M 375,130 L 385,160" fill="none" stroke="#333" stroke-width="3"/>
  </g>

</svg>