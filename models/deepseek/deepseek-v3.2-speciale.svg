<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Bicycle Frame -->
  <line x1="50" y1="150" x2="150" y2="150" stroke="black" stroke-width="5" />
  <line x1="150" y1="150" x2="200" y2="100" stroke="black" stroke-width="5" />
  <line x1="50" y1="150" x2="100" y2="100" stroke="black" stroke-width="5" />
  
  <!-- Wheels -->
  <circle cx="50" cy="150" r="30" stroke="black" stroke-width="5" fill="none" />
  <circle cx="150" cy="150" r="30" stroke="black" stroke-width="5" fill="none" />
  
  <!-- Pedals -->
  <line x1="100" y1="100" x2="110" y2="90" stroke="black" stroke-width="3" />
  <line x1="100" y1="100" x2="90" y2="110" stroke="black" stroke-width="3" />
  
  <!-- Pelican Body -->
  <ellipse cx="200" cy="100" rx="40" ry="30" fill="lightgray" />
  
  <!-- Pelican Head -->
  <circle cx="230" cy="90" r="20" fill="lightgray" />
  
  <!-- Pelican Beak -->
  <polygon points="250,90 280,80 280,100" fill="orange" />
  
  <!-- Pelican Eye -->
  <circle cx="235" cy="85" r="3" fill="black" />
  
  <!-- Pelican Wings -->
  <path d="M180,110 Q160,100 180,90" fill="lightgray" />
  <path d="M220,110 Q240,100 220,90" fill="lightgray" />
  
  <!-- Pelican Legs -->
  <line x1="200" y1="130" x2="200" y2="150" stroke="black" stroke-width="3" />
  <line x1="200" y1="150" x2="190" y2="160" stroke="black" stroke-width="3" />
  <line x1="200" y1="150" x2="210" y2="160" stroke="black" stroke-width="3" />
  
  <!-- Handlebar -->
  <line x1="200" y1="100" x2="220" y2="80" stroke="black" stroke-width="3" />
  <line x1="220" y1="80" x2="230" y2="80" stroke="black" stroke-width="3" />
</svg>