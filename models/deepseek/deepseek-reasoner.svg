<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" width="500" height="300">
  <!-- Bicycle Frame -->
  <path d="M150 180 L200 120 L250 120 L350 180" stroke="#333" stroke-width="5" fill="none"/>
  <path d="M250 120 L250 150 L220 180" stroke="#333" stroke-width="5" fill="none"/>
  
  <!-- Wheels -->
  <circle cx="180" cy="180" r="40" stroke="#333" stroke-width="8" fill="none"/>
  <circle cx="320" cy="180" r="40" stroke="#333" stroke-width="8" fill="none"/>
  
  <!-- Spokes -->
  <g stroke="#AAA" stroke-width="2">
    <line x1="180" y1="180" x2="210" y2="155"/>
    <line x1="180" y1="180" x2="205" y2="195"/>
    <line x1="180" y1="180" x2="155" y2="195"/>
    <line x1="180" y1="180" x2="150" y2="165"/>
    <line x1="320" y1="180" x2="350" y2="155"/>
    <line x1="320" y1="180" x2="350" y2="200"/>
    <line x1="320" y1="180" x2="295" y2="200"/>
    <line x1="320" y1="180" x2="290" y2="160"/>
  </g>
  
  <!-- Handlebars -->
  <path d="M250 120 L240 100" stroke="#333" stroke-width="5"/>
  <path d="M240 90 L260 90" stroke="#333" stroke-width="6"/>
  
  <!-- Seat -->
  <path d="M350 180 L340 160" stroke="#333" stroke-width="5"/>
  <rect x="335" y="155" width="15" height="10" rx="3" fill="#555"/>
  
  <!-- Pedals -->
  <circle cx="220" cy="180" r="10" fill="#777"/>
  <line x1="220" y1="180" x2="200" y2="165" stroke="#333" stroke-width="4"/>
  <circle cx="200" cy="165" r="8" fill="#555"/>
  
  <!-- Pelican Body -->
  <ellipse cx="260" cy="140" rx="40" ry="30" fill="#F8F8F8"/>
  
  <!-- Pelican Head -->
  <circle cx="300" cy="120" r="25" fill="#F8F8F8"/>
  
  <!-- Beak -->
  <path d="M325 120 L375 110 L325 135 Z" fill="#FF9E1B"/>
  <path d="M325 127 L360 118" stroke="#D17C00" stroke-width="2"/>
  
  <!-- Eye -->
  <circle cx="305" cy="115" r="4" fill="#333"/>
  
  <!-- Leg on pedal -->
  <path d="M275 170 L260 180 L245 165" stroke="#333" stroke-width="4" fill="none"/>
  
  <!-- Wing on handlebars -->
  <path d="M250 140 Q230 130 240 110 Q260 100 255 140" fill="#F8F8F8" stroke="#333" stroke-width="2"/>
  
  <!-- Tail Feathers -->
  <path d="M220 140 Q200 130 195 150 Q210 160 220 145" fill="#F8F8F8"/>
  
  <!-- Road -->
  <line x1="0" y1="220" x2="500" y2="220" stroke="#777" stroke-width="3" stroke-dasharray="10,5"/>
  
  <!-- Background Elements -->
  <circle cx="400" cy="80" r="20" fill="#FFD700" opacity="0.8"/>
  <path d="M50 220 L70 190 L90 210 L110 180 L130 200" fill="none" stroke="#5C9E5C" stroke-width="8"/>
</svg>