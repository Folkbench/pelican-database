<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"></stop>
      <stop offset="100%" stop-color="#E0F7FF"></stop>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEE58"></stop>
      <stop offset="100%" stop-color="#FFC107"></stop>
    </radialGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8BC34A"></stop>
      <stop offset="100%" stop-color="#689F38"></stop>
    </linearGradient>
  </defs>
  
  
  <rect width="400" height="300" fill="url(#sky)"></rect>
  <circle cx="350" cy="50" r="25" fill="url(#sun)"></circle>
  <rect y="200" width="400" height="100" fill="url(#ground)"></rect>
  
  
  <g opacity="0.8">
    <ellipse cx="100" cy="70" rx="25" ry="15" fill="white"></ellipse>
    <ellipse cx="120" cy="60" rx="20" ry="18" fill="white"></ellipse>
    <ellipse cx="140" cy="70" rx="22" ry="16" fill="white"></ellipse>
  </g>
  
  
  <g id="bicycle">
    
    <path d="M150 200 L250 140" stroke="#333" stroke-width="8" fill="none"></path>
    <path d="M250 140 L280 180" stroke="#333" stroke-width="8" fill="none"></path>
    <path d="M150 200 L200 180" stroke="#333" stroke-width="8" fill="none"></path>
    
    
    <circle cx="180" cy="200" r="40" stroke="#333" stroke-width="6" fill="none">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="5s" repeatCount="indefinite"></animateTransform>
    </circle>
    <circle cx="280" cy="180" r="40" stroke="#333" stroke-width="6" fill="none">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="5s" repeatCount="indefinite"></animateTransform>
    </circle>
    
    <g stroke="#666" stroke-width="2">
      <line x1="180" y1="200" x2="180" y2="160"></line>
      <line x1="180" y1="200" x2="180" y2="240"></line>
      <line x1="180" y1="200" x2="145" y2="200"></line>
      <line x1="180" y1="200" x2="215" y2="200"></line>
      <line x1="280" y1="180" x2="280" y2="140"></line>
      <line x1="280" y1="180" x2="280" y2="220"></line>
      <line x1="280" y1="180" x2="245" y2="180"></line>
      <line x1="280" y1="180" x2="315" y2="180"></line>
    </g>
    
    
    <path d="M240 140 L240 120" stroke="#333" stroke-width="6"></path>
    <path d="M235 120 L245 120" stroke="#333" stroke-width="6"></path>
    
    
    <path d="M150 200 L140 185 L160 185 Z" fill="#8B4513"></path>
  </g>
  
  
  <g id="pelican">
    
    <ellipse cx="220" cy="160" rx="40" ry="25" fill="#F5F5F5" stroke="#666" stroke-width="2"></ellipse>
    
    
    <path d="M180 150 Q190 130 210 140" stroke="#F5F5F5" stroke-width="18" fill="none"></path>
    
    
    <ellipse cx="165" cy="135" rx="20" ry="15" fill="#F5F5F5" stroke="#666" stroke-width="2"></ellipse>
    
    
    <path d="M145 135 L125 130 L125 140 Z" fill="#FF9800"></path>
    <ellipse cx="138" cy="135" rx="3" ry="2" fill="white"></ellipse>
    <ellipse cx="132" cy="135" rx="1.5" ry="1" fill="black"></ellipse>
    
    
    <circle cx="175" cy="130" r="3" fill="black"></circle>
    
    
    <path d="M200 160 Q220 140 240 165 Q220 175 200 175 Z" fill="#E0E0E0" stroke="#666" stroke-width="2"></path>
    
    
    <path d="M230 175 L240 190" stroke="#FF9800" stroke-width="6" stroke-linecap="round"></path>
    <circle cx="240" cy="190" r="5" fill="#FF9800"></circle>
    
    
    <path d="M210 175 L200 190" stroke="#FF9800" stroke-width="6" stroke-linecap="round"></path>
    <circle cx="200" cy="190" r="5" fill="#FF9800"></circle>
    
    
    <path d="M200 190 L195 195 L200 195 Z" fill="#FF9800"></path>
    <path d="M240 190 L235 195 L240 195 Z" fill="#FF9800"></path>
    
    
    <path d="M165 120 Q175 100 185 120" stroke="#1976D2" stroke-width="12" stroke-linecap="round" fill="none"></path>
    <ellipse cx="175" cy="118" rx="15" ry="4" fill="#1976D2"></ellipse>
  </g>
  
  
  <g>
    <circle cx="230" cy="190" r="15" stroke="#333" stroke-width="4" fill="none">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2.5s" repeatCount="indefinite"></animateTransform>
    </circle>
    
    <line x1="230" y1="190" x2="240" y2="190" stroke="#333" stroke-width="4">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2.5s" repeatCount="indefinite"></animateTransform>
    </line>
    <line x1="230" y1="190" x2="220" y2="190" stroke="#333" stroke-width="4">
      <animateTransform attributeName="transform" attributeType="XML" type="rotate" dur="2.5s" repeatCount="indefinite"></animateTransform>
    </line>
  </g>
  
  
  <g opacity="0.6">
    <line x1="320" y1="180" x2="340" y2="175" stroke="white" stroke-width="2" stroke-dasharray="3,3"></line>
    <line x1="320" y1="185" x2="340" y2="180" stroke="white" stroke-width="2" stroke-dasharray="3,3"></line>
    <line x1="320" y1="190" x2="340" y2="185" stroke="white" stroke-width="2" stroke-dasharray="3,3"></line>
  </g>
</svg>