<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Bicycle Frame -->
  <line x1="50" y1="130" x2="100" y2="80" stroke="black" stroke-width="3" />
  <line x1="100" y1="80" x2="150" y2="130" stroke="black" stroke-width="3" />
  <line x1="100" y1="80" x2="100" y2="130" stroke="black" stroke-width="3" />
  <!-- Wheels -->
  <circle cx="50" cy="130" r="20" stroke="black" stroke-width="3" fill="none" />
  <circle cx="150" cy="130" r="20" stroke="black" stroke-width="3" fill="none" />
  <!-- Pelican Body -->
  <ellipse cx="100" cy="70" rx="30" ry="20" fill="lightgray" />
  <!-- Pelican Beak -->
  <polygon points="130,70 150,80 130,90" fill="orange" />
  <!-- Pelican Eye -->
  <circle cx="110" cy="65" r="3" fill="black" />
  <!-- Pelican Wings -->
  <path d="M90,80 Q70,90 90,100" stroke="lightgray" stroke-width="3" fill="none" />
  <path d="M110,80 Q130,90 110,100" stroke="lightgray" stroke-width="3" fill="none" />
</svg>