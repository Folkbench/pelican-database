<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Bicycle wheels -->
  <circle cx="120" cy="260" r="30" fill="black"/>
  <circle cx="280" cy="260" r="30" fill="black"/>
  <!-- Bicycle frame (diamond shape) -->
  <path d="M120,260 L200,150 L280,260 L200,260 Z" fill="none" stroke="black" stroke-width="3"/>
  <!-- Seat -->
  <rect x="190" y="145" width="20" height="10" fill="gray"/>
  <!-- Crank arms -->
  <line x1="200" y1="260" x2="150" y2="260" stroke="black" stroke-width="3"/>
  <line x1="200" y1="260" x2="250" y2="260" stroke="black" stroke-width="3"/>
  <!-- Pedals -->
  <circle cx="150" cy="260" r="8" fill="black"/>
  <circle cx="250" cy="260" r="8" fill="black"/>
  <!-- Handlebars -->
  <line x1="200" y1="150" x2="200" y2="140" stroke="black" stroke-width="3"/>
  <line x1="200" y1="140" x2="190" y2="140" stroke="black" stroke-width="3"/>
  <line x1="200" y1="140" x2="210" y2="140" stroke="black" stroke-width="3"/>
  <!-- Pelican body -->
  <ellipse cx="200" cy="130" rx="35" ry="25" fill="white" stroke="gray" stroke-width="2"/>
  <!-- Pelican head -->
  <circle cx="200" cy="100" r="18" fill="white" stroke="gray" stroke-width="2"/>
  <!-- Pelican beak -->
  <path d="M200,100 L240,100 L240,115 Z" fill="gray"/>
  <!-- Pelican eyes -->
  <circle cx="195" cy="95" r="3" fill="black"/>
  <circle cx="205" cy="95" r="3" fill="black"/>
  <!-- Pelican wings -->
  <path d="M165,130 C150,100 140,80 160,90 C170,100 175,120 165,130 Z" fill="white" stroke="gray" stroke-width="1"/>
  <path d="M235,130 C250,100 260,80 240,90 C230,100 225,120 235,130 Z" fill="white" stroke="gray" stroke-width="1"/>
  <!-- Pelican legs -->
  <line x1="190" y1="155" x2="150" y2="260" stroke="black" stroke-width="3"/>
  <line x1="210" y1="155" x2="250" y2="260" stroke="black" stroke-width="3"/>
</svg>