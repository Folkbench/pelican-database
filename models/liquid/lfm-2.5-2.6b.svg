<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
 <!-- Bicycle wheels -->
 <circle cx="150" cy="300" r="50" fill="none" stroke="#333" stroke-width="5"/>
 <circle cx="350" cy="300" r="50" fill="none" stroke="#333" stroke-width="5"/>
 <!-- Bicycle frame -->
 <line x1="150" y1="300" x2="250" y2="200" stroke="#333" stroke-width="4"/>
 <line x1="250" y1="200" x2="350" y2="300" stroke="#333" stroke-width="4"/>
 <!-- Seat and handlebars -->
 <ellipse cx="250" cy="170" rx="18" ry="6" fill="#8B4513"/>
 <line x1="250" y1="170" x2="270" y2="170" stroke="#333" stroke-width="3"/>
 <line x1="270" y1="170" x2="280" y2="170" stroke="#333" stroke-width="3" stroke-dasharray="4 4"/>
 <!-- Pelican body -->
 <ellipse cx="300" cy="250" rx="32" ry="28" fill="#A9A9A9"/>
 <!-- Pelican head -->
 <circle cx="320" cy="220" r="24" fill="#A9A9A9"/>
 <!-- Large orange beak -->
 <path d="M 340 220 L 370 200 L 350 220 Z" fill="#FFA500"/>
 <!-- Left wing -->
 <path d="M 280 240 Q 310 280, 300 330" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linecap="round"/>
 <!-- Right wing -->
 <path d="M 310 240 Q 290 260, 280 290" fill="none" stroke="#F5F5F5" stroke-width="4" stroke-linecap="round"/>
 <!-- Legs to pedals -->
 <line x1="300" y1="275" x2="290" y2="340" stroke="#333" stroke-width="4"/>
 <line x1="310" y1="275" x2="320" y2="340" stroke="#333" stroke-width="4"/>
 <!-- Feet on pedals -->
 <circle cx="290" cy="340" r="5" fill="#555"/>
 <circle cx="320" cy="340" r="5" fill="#555"/>
 <!-- Pelican hand on handlebar -->
 <circle cx="280" cy="170" r="3" fill="#333"/>
</svg>