        <line x1="280" y1="200" x2="200" y2="180"/>
        <line x1="200" y1="130" x2="180" y2="100"/>
    </g>

    <path d="M 180 100 L 140 80" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>
    <path d="M 180 100 L 220 80" stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="140" cy="80" r="5" fill="#333"/>
    <circle cx="220" cy="80" r="5" fill="#333"/>

    <path d="M 200 180 Q 210 170, 220 180" stroke="#444" stroke-width="8" stroke-linecap="round" fill="none"/>

    <circle cx="200" cy="180" r="10" fill="#555"/>
    <line x1="200" y1="180" x2="185" y2="160" stroke="#555" stroke-width="4"/>
    <circle cx="185" cy="160" r="6" fill="#777"/>
    <line x1="200" y1="180" x2="215" y2="200" stroke="#555" stroke-width="4"/>
    <circle cx="215" cy="200" r="6" fill="#777"/>

    <ellipse cx="200" cy="120" rx="40" ry="30" fill="white" stroke="#333" stroke-width="2"/>
    <circle cx="230" cy="100" r="20" fill="white" stroke="#333" stroke-width="2"/>
    <path d="M 250 100 L 290 90 L 280 110 L 250 105 Z" fill="#ff9900" stroke="#cc7700" stroke-width="2"/>
    <line x1="260" y1="98" x2="275" y2="102" stroke="#cc7700" stroke-width="1"/>
    <circle cx="235" cy="95" r="3" fill="black"/>
    <ellipse cx="170" cy="110" rx="20" ry="12" fill="white" stroke="#333" stroke-width="2" transform="rotate(-20 170 110)"/>
    <ellipse cx="185" cy="130" rx="15" ry="10" fill="white" stroke="#333" stroke-width="2" transform="rotate(10 185 130)"/>
    <circle cx="185" cy="160" r="8" fill="#ff9900"/>
    <circle cx="215" cy="200" r="8" fill="#ff9900"/>

    <path d="M 160 120 Q 140 110, 130 130" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>

    <line x1="0" y1="250" x2="400" y2="250" stroke="#666" stroke-width="4"/>
    <line x1="0" y1="252" x2="400" y2="252" stroke="#8a8" stroke-width="2"/>

    <circle cx="350" cy="50" r="30" fill="#ffdd00"/>
    <g stroke="#ffaa00" stroke-width="3">
        <line x1="350" y1="20" x2="350" y2="10"/>
        <line x1="380" y1="50" x2="390" y2="50"/>
        <line x1="350" y1="80" x2="350" y2="90"/>
        <line x1="320" y1="50" x2="310" y2="50"/>
        <line x1="365" y1="25" x2="370" y2="15"/>
        <line x1="375" y1="75" x2="385" y2="85"/>
        <line x1="335" y1="25" x2="325" y2="15"/>
