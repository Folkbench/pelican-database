<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
    <defs>
        <linearGradient id="wheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#888"/>
            <stop offset="100%" stop-color="#333"/>
        </linearGradient>
        <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#666"/>
            <stop offset="100%" stop-color="#444"/>
        </linearGradient>
    </defs>

    <rect width="100%" height="100%" fill="#aad5ff"/>

    <circle cx="120" cy="200" r="50" fill="url(#wheelGrad)" stroke="#222" stroke-width="3"/>
    <circle cx="280" cy="200" r="50" fill="url(#wheelGrad)" stroke="#222" stroke-width="3"/>

    <g stroke="#ccc" stroke-width="1.5">
        <line x1="120" y1="150" x2="120" y2="250"/>
        <line x1="70" y1="200" x2="170" y2="200"/>
        <line x1="95" y1="165" x2="145" y2="235"/>
        <line x1="145" y1="165" x2="95" y2="235"/>
        <line x1="280" y1="150" x2="280" y2="250"/>
        <line x1="230" y1="200" x2="330" y2="200"/>
        <line x1="255" y1="165" x2="305" y2="235"/>
        <line x1="305" y1="165" x2="255" y2="235"/>
    </g>

    <g stroke="url(#frameGrad)" stroke-width="6" stroke-linecap="round">
