    <path d="M393 430h168l-87 165"/>
    <path d="m383 406 91 189"/>
    <path d="m548 391 78 204"/>
  </g>
  <g fill="none" stroke="#df735f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="m279 595 114-165 81 165H279"/>
    <path d="M393 430h168l-87 165"/>
    <path d="m383 406 91 189"/>
    <path d="m548 391 78 204"/>
  </g>
  <path d="M405 433h126" stroke="#f5b098" stroke-width="3" stroke-linecap="round"/>
  <path d="m397 454 20 42" stroke="#f5b098" stroke-width="3" stroke-linecap="round"/>

  <!-- Chain, crank and saddle -->
  <path d="M280 582 470 568a28 28 0 1 1 0 56l-190-17a13 13 0 0 1 0-25Z" fill="none" stroke="#647c78" stroke-width="4"/>
  <circle cx="474" cy="595" r="28" fill="#e0e6d8" stroke="#293f48" stroke-width="5"/>
  <circle cx="474" cy="595" r="18" fill="none" stroke="#9bb0a7" stroke-width="4"/>
  <path d="m383 407-8-24" stroke="#293f48" stroke-width="9"/>
  <path d="M339 380q10-14 43-9l36 8q9 3 4 11h-74q-15 0-9-10Z" fill="#674f44" stroke="#293f48" stroke-width="5"/>
  <path d="M350 379h45" stroke="#b99572" stroke-width="3" stroke-linecap="round"/>

  <!-- Handlebar and bell -->
  <path d="m549 393-10-31q-5-16 13-19h39" fill="none" stroke="#293f48" stroke-width="10" stroke-linecap="round"/>
  <path d="m549 391-10-29q-4-13 13-15h20" fill="none" stroke="#afc7bd" stroke-width="5" stroke-linecap="round"/>
  <path d="M574 345h26" stroke="#674f44" stroke-width="13" stroke-linecap="round"/>
  <path d="M556 337a12 12 0 0 1 24 0Z" fill="#efc774" stroke="#293f48" stroke-width="3"/>
  <path d="M587 353q44 30 12 88" fill="none" stroke="#647c78" stroke-width="3"/>

  <!-- Pelican silhouette, tail and long neck -->
  <path d="m339 311-37-17 19 38-30 12 48 13
           c11 30 41 49 77 44
           c51-4 89-39 97-85
           c5-26-2-50 12-76
           c8-16 23-21 36-26
           c20-8 26-25 18-41
           c-8-20-24-29-44-28
           c-30 0-55 29-64 54
           c-11 28-8 57-15 79
           c-4 16-8 27-15 34
           c-13-28-47-52-74-46
           c-18 4-29 20-28 45Z"
        fill="url(#feathers)" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>

