  <path d="M509 152q-7-17 0-26 4 12 15 16M521 146q2-19 12-23-2 12 6 22"
        fill="#fffef5" stroke="#293f48" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Neck glow and chest -->
  <path d="M497 211c-15 29-10 69-22 96-8 18-18 29-27 37" fill="none" stroke="#fffef7" stroke-width="16" stroke-linecap="round"/>
  <path d="M482 342q-12 29-38 39" fill="none" stroke="#bdcec5" stroke-width="4" stroke-linecap="round"/>

  <!-- Bill pouch and long upper bill -->
  <path d="M551 205 743 222
           c-23 9-52 28-82 44
           c-22 12-38 14-53 7
           c-28-13-43-37-57-68Z"
        fill="url(#pouch)" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>
  <path d="M575 222q28 35 56 40" fill="none" stroke="#fbe0a0" stroke-width="5" stroke-linecap="round"/>
  <path d="M564 188c49 3 115 13 181 31q10 3 4 9l-197-18Z"
        fill="#efbd59" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>
  <path d="m580 198 133 20" stroke="#ffe2a1" stroke-width="4" stroke-linecap="round"/>
  <path d="m559 211 178 13" fill="none" stroke="#9e7042" stroke-width="2.5"/>
  <path d="m745 221 4 7-11 3" fill="#cf8248" stroke="#293f48" stroke-width="3" stroke-linejoin="round"/>

  <!-- Bright, curious eye -->
  <circle cx="548" cy="178" r="12" fill="#ecc97f"/>
  <circle cx="550" cy="178" r="6.5" fill="#293f48"/>
  <circle cx="552" cy="176" r="2.2" fill="#fff"/>
  <path d="M536 160q10-5 18 1" fill="none" stroke="#293f48" stroke-width="3" stroke-linecap="round"/>

  <!-- A tiny windblown neckerchief -->
  <path d="m473 258 39 12-6 16-38-13Z" fill="#df735f" stroke="#293f48" stroke-width="4" stroke-linejoin="round"/>
  <path d="M472 265q-34-19-65-9l23 12-15 15q34 5 57-18Z" fill="#df735f" stroke="#293f48" stroke-width="4" stroke-linejoin="round"/>
  <path d="m429 265 30 1" stroke="#f7ad90" stroke-width="3" stroke-linecap="round"/>

  <!-- Wing reaching to the handlebar -->
  <path d="M368 290
           c24-16 50 4 71 27
           c23 25 49 33 79 29
           l29-7
           q11-2 16 7
           q-10 17-35 21
           c-45 13-94 6-126-15
           c-23-14-39-36-34-62Z"
        fill="#f9faf0" stroke="#293f48" stroke-width="5" stroke-linejoin="round"/>
  <g fill="none" stroke="#b7c9c0" stroke-width="3.5" stroke-linecap="round">
    <path d="M383 310q39 49 106 48"/>
    <path d="M382 328q34 38 79 40"/>
    <path d="M398 312q22 24 43 32"/>
  </g>
  <path d="m547 348 10 1m-17 6 10 1" stroke="#293f48" stroke-width="3" stroke-linecap="round"/>

  <!-- Near leg and broad webbed foot -->
  <path d="M424 395q16 37 13 72l-20 66q-5 13 5 25l31 29"
        fill="none" stroke="#293f48" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M424 395q16 37 13 72l-20 66q-5 13 5 25l31 29"
        fill="none" stroke="#efb95d" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M444 574q13-3 23 5l37 27-22 1-12 6-11-9-20-6Z"
        fill="#efb95d" stroke="#293f48" stroke-width="4" stroke-linejoin="round"/>
  <path d="m463 585 19 15m-29-11 16 13" fill="none" stroke="#c58b47" stroke-width="2.5" stroke-linecap="round"/>

  <!-- The front pedal -->
  <path d="m474 595-26 28" stroke="#293f48" stroke-width="7" stroke-linecap="round"/>
  <circle cx="474" cy="595" r="6" fill="#293f48"/>
  <rect x="427" y="618" width="43" height="11" rx="4" fill="#674f44" stroke="#293f48" stroke-width="3"/>
  <path d="M436 622h25" stroke="#c7ae8c" stroke-width="2" stroke-linecap="round"/>

  <!-- Little flecks of a happy afternoon -->
  <g fill="#dfb76e">
    <circle cx="219" cy="354" r="4"/>
    <circle cx="728" cy="463" r="5"/>
    <circle cx="174" cy="653" r="3"/>
  </g>
  <g fill="none" stroke="#d3ab62" stroke-width="3" stroke-linecap="round">
    <path d="m623 302 4 9m8-20 8 6"/>
  </g>
</svg>