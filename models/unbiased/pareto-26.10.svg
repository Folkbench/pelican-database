<svg xmlns="http://www.w3.org/2000/svg" width="900" height="800" viewBox="0 0 900 800" role="img" aria-labelledby="title desc">
  <title id="title">A pelican out for a bicycle ride</title>
  <desc id="desc">A cheerful white pelican with a long golden bill pedals a coral bicycle beneath a soft seaside sun.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f3e7"/>
      <stop offset="1" stop-color="#edf3e9"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffd278"/>
      <stop offset="1" stop-color="#eea05b"/>
    </linearGradient>
    <linearGradient id="feathers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffef5"/>
      <stop offset="1" stop-color="#dce8df"/>
    </linearGradient>
    <g id="wheel">
      <circle r="111" fill="#faf8ed" stroke="#293f48" stroke-width="13"/>
      <circle r="98" fill="none" stroke="#c4d5cd" stroke-width="3"/>
      <g stroke="#a5bbb5" stroke-width="2">
        <path d="M0-96V96M-96 0H96"/>
        <path d="M-68-68 68 68M-68 68 68-68"/>
        <path d="M-37-89 37 89M-89-37 89 37"/>
        <path d="M-89 37 89-37M-37 89 37-89"/>
      </g>
      <circle r="11" fill="#f3cb78" stroke="#293f48" stroke-width="4"/>
      <path d="M-83-60A102 102 0 0 1-36-95" fill="none" stroke="#fffdf1" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- A little patch of seaside sunshine -->
  <rect width="900" height="800" fill="url(#sky)"/>
  <circle cx="472" cy="346" r="268" fill="#e2ede2"/>
  <circle cx="666" cy="171" r="76" fill="#f4ce88" opacity=".72"/>
  <g fill="none" stroke="#a5c2b8" stroke-width="4" stroke-linecap="round">
    <path d="M158 226q17-17 34 0q17-17 34 0"/>
    <path d="M698 340q12-12 24 0q12-12 24 0"/>
  </g>
  <g fill="#f8fbf2" opacity=".95">
    <path d="M141 319c0-13 11-24 25-24 3-19 31-25 42-8 19-8 37 5 37 22h18v10Z"/>
    <path d="M676 408c0-11 10-19 21-18 7-18 32-18 39 0 15-3 28 8 28 18Z"/>
  </g>

  <!-- Ground and breeze -->
  <ellipse cx="453" cy="714" rx="320" ry="19" fill="#bed2c3" opacity=".5"/>
  <path d="M113 716H788" fill="none" stroke="#94b3a3" stroke-width="3" stroke-linecap="round"/>
  <g fill="none" stroke="#9fbcb0" stroke-width="5" stroke-linecap="round">
    <path d="M146 400h99M174 426h55M130 451h81"/>
  </g>
  <g fill="none" stroke="#83a591" stroke-width="3" stroke-linecap="round">
    <path d="m126 705-8-15m8 15 4-23m0 23 11-11"/>
    <path d="m771 705-5-18m5 18 10-12"/>
  </g>

  <!-- Wheels -->
  <use href="#wheel" x="279" y="595"/>
  <use href="#wheel" x="626" y="595"/>

  <!-- Mudguards -->
  <g fill="none" stroke-linecap="round">
    <path d="M162 571a119 119 0 0 1 223-37M517 546a119 119 0 0 1 225 27" stroke="#293f48" stroke-width="10"/>
    <path d="M162 571a119 119 0 0 1 223-37M517 546a119 119 0 0 1 225 27" stroke="#e9bb71" stroke-width="5"/>
  </g>

  <!-- Far leg and pedal -->
  <path d="M393 379q-19 59 19 91l68 53" fill="none" stroke="#293f48" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M393 379q-19 59 19 91l68 53" fill="none" stroke="#dca04e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m465 518 32-5 18 16-46 6Z" fill="#e7ae58" stroke="#293f48" stroke-width="4" stroke-linejoin="round"/>
  <path d="M487 536h37" stroke="#293f48" stroke-width="9" stroke-linecap="round"/>
  <path d="m474 591 28-55" stroke="#829b96" stroke-width="7"/>

