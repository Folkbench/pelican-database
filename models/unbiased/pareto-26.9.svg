<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Wheel Symbol to avoid repetition -->
    <g id="wheel">
      <!-- Tire -->
      <circle cx="250" cy="450" r="80" fill="none" stroke="#073B4C" stroke-width="14" />
      <!-- Rim -->
      <circle cx="250" cy="450" r="70" fill="none" stroke="#FFFFFF" stroke-width="6" />
      <!-- Spokes -->
      <path d="M 250 380 L 250 520 M 180 450 L 320 450 M 200.5 400.5 L 299.5 499.5 M 299.5 400.5 L 200.5 499.5" stroke="#94A3B8" stroke-width="4" />
      <!-- Hub -->
      <circle cx="250" cy="450" r="12" fill="#073B4C" />
      <circle cx="250" cy="450" r="5" fill="#FFFFFF" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#F0F4F8" />
  
  <!-- Accent Circle -->
  <circle cx="400" cy="300" r="240" fill="#FFD166" />

  <!-- Motion Lines -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round">
    <path d="M 80 250 L 40 250" />
    <path d="M 100 300 L 40 300" />
    <path d="M 80 350 L 40 350" />
    <path d="M 720 250 L 680 250" />
    <path d="M 760 300 L 700 300" />
    <path d="M 720 350 L 680 350" />
  </g>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="530" rx="200" ry="15" fill="#D0D5DB" opacity="0.8" />

  <!-- LAYER 1: Background Elements (Left Leg & Left Pedal) -->
  <g id="background-pedals">
    <!-- Left Crank Arm -->
    <line x1="380" y1="450" x2="360" y2="420" stroke="#64748B" stroke-width="10" stroke-linecap="round" />
    <!-- Left Pedal -->
    <rect x="345" y="415" width="30" height="12" rx="4" fill="#475569" />
  </g>

  <!-- Pelican Left Leg (Background) -->
  <g id="pelican-left-leg">
    <!-- Thigh -->
    <line x1="290" y1="280" x2="340" y2="380" stroke="#C2410C" stroke-width="12" stroke-linecap="round" />
    <!-- Calf -->
    <line x1="340" y1="380" x2="360" y2="420" stroke="#C2410C" stroke-width="10" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 360 420 Q 380 415 395 425 Q 380 435 360 430 Z" fill="#C2410C" />
  </g>

  <!-- LAYER 2: Wheels -->
  <use href="#wheel" x="0" y="0" />
  <use href="#wheel" x="300" y="0" />

  <!-- LAYER 3: Bike Frame -->
  <g id="bike-frame">
    <!-- Fenders -->
    <path d="M 205 372 A 90 90 0 0 1 295 372" fill="none" stroke="#EF476F" stroke-width="8" stroke-linecap="round" />
    <path d="M 505 372 A 90 90 0 0 1 595 372" fill="none" stroke="#EF476F" stroke-width="8" stroke-linecap="round" />
    
    <!-- Chainstay -->
    <line x1="250" y1="450" x2="380" y2="450" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    <!-- Seat stay -->
    <line x1="250" y1="450" x2="320" y2="320" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    <!-- Down tube -->
    <line x1="380" y1="450" x2="530" y2="350" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    <!-- Seat tube -->
    <line x1="380" y1="450" x2="320" y2="320" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    <!-- Top tube -->
    <line x1="320" y1="320" x2="520" y2="290" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    <!-- Fork -->
    <line x1="550" y1="450" x2="520" y2="290" stroke="#EF476F" stroke-width="12" stroke-linecap="round" />
    
    <!-- Handlebar Stem -->
    <line x1="520" y1="290" x2="510" y2="260" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" />
    <!-- Handlebars -->
    <path d="M 510 260 Q 540 240 570 260" fill="none" stroke="#073B4C" stroke-width="10" stroke-linecap="round" />
    
    <!-- Seat Post -->
    <line x1="320" y1="320" x2="330" y2="290" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" />
    <!-- Seat -->
    <ellipse cx="330" cy="285" rx="35" ry="12" fill="#1E293B" />
    
    <!-- Chainring & Chain -->
    <circle cx="380" cy="450" r="24" fill="none" stroke="#073B4C" stroke-width="8" />
    <!-- Rear Cog -->
    <circle cx="250" cy="450" r="12" fill="none" stroke="#073B4C" stroke-width="6" />
    <!-- Chain -->
    <path d="M 250 438 L 380 426 A 24 24 0 0 1 380 474 L 250 462 A 12 12 0 0 1 250 438 Z" fill="none" stroke="#64748B" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- LAYER 4: Foreground Pedals & Pelican Right Leg -->
  <g id="foreground-pedals">
    <!-- Right Crank Arm -->
    <line x1="380" y1="450" x2="400" y2="480" stroke="#073B4C" stroke-width="10" stroke-linecap="round" />
    <!-- Right Pedal -->
    <rect x="385" y="475" width="30" height="12" rx="4" fill="#1E293B" />
  </g>

  <!-- Pelican Right Leg (Foreground) -->
  <g id="pelican-right-leg">
    <!-- Thigh -->
    <line x1="350" y1="310" x2="390" y2="430" stroke="#EA580C" stroke-width="14" stroke-linecap="round" />
    <!-- Calf -->
    <line x1="390" y1="430" x2="400" y2="470" stroke="#EA580C" stroke-width="12" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <path d="M 400 470 Q 420 465 435 475 Q 420 485 400 480 Z" fill="#EA580C" />
  </g>

  <!-- LAYER 5: Pelican Body & Details -->
  <g id="pelican-body">
    <!-- Tail Feathers -->
    <path d="M 235 250 L 190 240 L 210 260 L 185 270 L 220 280 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Main Body -->
    <path d="M 235 250 C 235 170, 370 170, 380 250 C 385 290, 360 310, 320 310 C 270 310, 240 290, 235 250 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" />
    
    <!-- Neck -->
    <path d="M 375 235 C 385 150, 420 130, 460 140 L 475 160 C 430 190, 410 250, 390 280 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" />
    
    <!-- Head -->
    <ellipse cx="470" cy="145" rx="22" ry="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" />
    
    <!-- Head Tuft -->
    <path d="M 465 130 Q 460 115 470 110 Q 470 120 475 130" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    
    <!-- Eye -->
    <circle cx="477" cy="140" r="5" fill="#1E293B" />
    <circle cx="478" cy="138" r="1.5" fill="#FFFFFF" />
    
    <!-- Beak - Upper Bill -->
    <path d="M 485 135 C 550 130, 600 140, 630 165 C 610 160, 580 145, 485 148 Z" fill="#FBBF24" stroke="#D97706" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Beak - Pouch -->
    <path d="M 485 148 C 520 200, 580 200, 625 175 C 580 180, 520 170, 485 155 Z" fill="#F97316" stroke="#EA580C" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Mouth Line -->
    <path d="M 485 148 C 550 145, 600 155, 630 165" fill="none" stroke="#D97706" stroke-width="3" />

    <!-- Nostril -->
    <circle cx="510" cy="140" r="2" fill="#D97706" />
    
    <!-- Scarf (Mint Green for contrast) -->
    <path d="M 460 160 Q 480 170 470 185 Q 450 190 440 175 Z" fill="#118AB2" />
    <path d="M 450 175 Q 400 180 360 160 Q 390 190 450 180 Z" fill="#118AB2" />
    <path d="M 445 180 Q 390 210 340 200 Q 380 220 445 185 Z" fill="#0D6E8A" />
  </g>

  <!-- LAYER 6: Pelican Wing (Foreground) -->
  <g id="pelican-wing">
    <!-- Wing Body -->
    <path d="M 330 220 C 400 180, 500 230, 560 260 C 500 280, 420 280, 350 290 Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Wing Feathers / Fingers wrapping around handlebar -->
    <path d="M 560 260 Q 575 265 585 270" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <path d="M 555 265 Q 570 270 580 275" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <path d="M 550 270 Q 565 275 575 280" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
  </g>

</svg>