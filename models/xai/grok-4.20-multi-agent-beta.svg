<svg xmlns="http://www.w3.org/2000/svg" width="400" height="280" viewBox="0 0 400 280">
  <!-- Ground -->
  <line x1="30" y1="260" x2="370" y2="260" stroke="#34495E" stroke-width="12" />

  <!-- Rear wheel -->
  <circle r="60" cy="205" cx="105" fill="#ECF0F1" stroke="#2C3E50" stroke-width="12"/>
  <circle r="47" cy="205" cx="105" fill="none" stroke="#2C3E50" stroke-width="6"/>

  <!-- Front wheel -->
  <circle r="60" cy="205" cx="275" fill="#ECF0F1" stroke="#2C3E50" stroke-width="12"/>
  <circle r="47" cy="205" cx="275" fill="none" stroke="#2C3E50" stroke-width="6"/>

  <!-- Wheel spokes - rear -->
  <g stroke="#2C3E50" stroke-width="3.5">
    <line x1="105" y1="145" x2="105" y2="265"/>
    <line x1="45" y1="205" x2="165" y2="205"/>
    <line x1="57" y1="160" x2="153" y2="250"/>
    <line x1="57" y1="250" x2="153" y2="160"/>
  </g>
  
  <!-- Wheel spokes - front -->
  <g stroke="#2C3E50" stroke-width="3.5">
    <line x1="275" y1="145" x2="275" y2="265"/>
    <line x1="215" y1="205" x2="335" y2="205"/>
    <line x1="227" y1="160" x2="323" y2="250"/>
    <line x1="227" y1="250" x2="323" y2="160"/>
  </g>

  <!-- Bicycle frame (thick dark lines) -->
  <!-- Chainstay: rear → crank -->
  <line x1="105" y1="205" x2="185" y2="205" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Seat tube: crank → seat cluster -->
  <line x1="185" y1="205" x2="160" y2="125" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Seatstay: rear wheel → seat cluster -->
  <line x1="105" y1="205" x2="155" y2="125" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Top tube: seat cluster → head tube -->
  <line x1="160" y1="125" x2="260" y2="120" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Down tube: crank → head tube -->
  <line x1="185" y1="205" x2="265" y2="125" stroke="#2C3E50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Head tube / fork upper section -->
  <line x1="265" y1="125" x2="272" y2="145" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Fork (to front wheel) - two lines for simple fork look -->
  <line x1="272" y1="145" x2="275" y2="205" stroke="#2C3E50" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="267" y1="145" x2="275" y2="205" stroke="#2C3E50" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Saddle (slightly curved, positioned above seat cluster) -->
  <path d="M 130,118 L 167,113 L 177,122 L 158,127 Z" fill="#E74C3C" stroke="#2C3E50" stroke-width="4" />

  <!-- Handlebar stem -->
  <line x1="267" y1="122" x2="285" y2="105" stroke="#2C3E50" stroke-width="7" stroke-linecap="round" />

  <!-- Handlebars (reaching back toward rider) -->
  <path d="M 285,105 C 295,95 305,93 320,105" fill="transparent" stroke="#2C3E50" stroke-width="7" stroke-linecap="round" />

  <!-- Crank center -->
  <circle r="8" cx="185" cy="205" fill="#ECF0F1" stroke="#2C3E50" stroke-width="4"/>

  <!-- Pedal arm + pedal (angled forward) -->
  <line x1="185" y1="205" x2="212" y2="227" stroke="#2C3E50" stroke-width="5" stroke-linecap="round"/>
  <rect x="205" y="225" width="29" height="6" rx="2" transform="rotate(-35 210 228)" fill="#34495E" stroke="#2C3E50" stroke-width="2.5"/>

  <!-- Pelican body (off-white, slightly tilted back on seat) -->
  <ellipse cx="165" cy="145" rx="43" ry="34" transform="rotate(-28 170 160)" fill="#FAF0D8" stroke="#26334A" stroke-width="6"/>

  <!-- Tail (simple feathered look) -->
  <path d="M 122,160 C 105,165 98,172 115,185" fill="#FAF0D8" stroke="#26334A" stroke-width="4"/>
  <path d="M 125,167 C 107,170 103,178 118,190" fill="#FAF0D8" stroke="#26334A" stroke-width="3.5"/>

  <!-- Wing (folded against body) -->
  <ellipse cx="135" cy="157" rx="37" ry="19" transform="rotate(-55 155 165)" fill="#EFD9B9" stroke="#26334A" stroke-width="4"/>

  <!-- Long curved neck (thick stroke for volume) -->
  <path d="M 195,125 C 225,105 235,78 250,55" fill="transparent" stroke="#FAF0D8" stroke-width="21" stroke-linecap="round" />

  <!-- Head (slightly tilted) -->
  <ellipse cx="270" cy="49" rx="18" ry="16" transform="rotate(-25 257 53)" fill="#FAF0D8" stroke="#26334A" stroke-width="3.5"/>

  <!-- Long orange beak - upper mandible (long triangle) -->
  <polygon points="285,41 355,39 286,54" fill="#F9B24F" stroke="#26334A" stroke-width="3"/>

  <!-- Beak lower pouch (slightly saggy, characteristic of pelican) -->
  <path d="M 286,54 C 305,68 322,73 348,53 L 355,39" fill="#FFCB6F" stroke="#26334A" stroke-width="2.5"/>

  <!-- Eye -->
  <ellipse cx="280" cy="46" rx="4" ry="5" transform="rotate(-25 265 50)" fill="#26334A"/>
  <circle r="1.2" cx="281.5" cy="44.5" fill="#FFFFFF"/>

  <!-- Leg (bright orange, from under body to pedal) -->
  <path d="M 185,165 C 190,185 195,195 210,222" fill="transparent" stroke="#F39C3E" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Webbed foot on pedal (simple) -->
  <path d="M 212,223 L 235,217 M 212,223 L 233,225" fill="transparent" stroke="#F39C3E" stroke-width="4.5" stroke-linecap="round"/>

</svg>