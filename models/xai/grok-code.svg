<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle Wheels -->
  <circle cx="100" cy="250" r="50" fill="none" stroke="black" stroke-width="4"/>
  <circle cx="250" cy="250" r="50" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- Bicycle Frame -->
  <line x1="100" y1="250" x2="175" y2="200" stroke="black" stroke-width="4"/>
  <line x1="175" y1="200" x2="250" y2="250" stroke="black" stroke-width="4"/>
  <line x1="175" y1="200" x2="200" y2="150" stroke="black" stroke-width="4"/>
  <line x1="200" y1="150" x2="250" y2="165" stroke="black" stroke-width="4"/>
  
  <!-- Handlebars -->
  <line x1="200" y1="150" x2="190" y2="140" stroke="black" stroke-width="4"/>
  <line x1="200" y1="150" x2="210" y2="140" stroke="black" stroke-width="4"/>
  
  <!-- Seat -->
  <ellipse cx="175" cy="185" rx="15" ry="5" fill="black"/>
  
  <!-- Pelican Body -->
  <ellipse cx="175" cy="180" rx="30" ry="20" fill="white" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Head and Beak -->
  <circle cx="210" cy="175" r="15" fill="white" stroke="black" stroke-width="2"/>
  <path d="M 225 175 Q 250 160 270 175 Q 250 190 225 175 Z" fill="orange" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Wings -->
  <path d="M 155 180 Q 140 160 130 180 Q 140 200 155 180 Z" fill="gray" stroke="black" stroke-width="2"/>
  <path d="M 195 180 Q 210 160 220 180 Q 210 200 195 180 Z" fill="gray" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Legs on Pedals -->
  <line x1="175" y1="200" x2="165" y2="220" stroke="black" stroke-width="4"/>
  <line x1="175" y1="200" x2="185" y2="220" stroke="black" stroke-width="4"/>
  <circle cx="165" cy="225" r="5" fill="black"/>
  <circle cx="185" cy="225" r="5" fill="black"/>
  
  <!-- Ground -->
  <line x1="0" y1="300" x2="400" y2="300" stroke="green" stroke-width="10"/>
</svg>