<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (sky blue) -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#90EE90"/>
  
  <!-- Bicycle Wheels -->
  <!-- Rear Wheel -->
  <circle cx="100" cy="220" r="40" fill="none" stroke="black" stroke-width="3"/>
  <circle cx="100" cy="220" r="20" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Front Wheel -->
  <circle cx="300" cy="220" r="40" fill="none" stroke="black" stroke-width="3"/>
  <circle cx="300" cy="220" r="20" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Bicycle Frame -->
  <!-- Main tube -->
  <line x1="100" y1="220" x2="200" y2="150" stroke="black" stroke-width="4"/>
  <!-- Seat tube -->
  <line x1="150" y1="180" x2="150" y2="140" stroke="black" stroke-width="4"/>
  <!-- Down tube -->
  <line x1="100" y1="220" x2="200" y2="180" stroke="black" stroke-width="4"/>
  <!-- Head tube -->
  <line x1="200" y1="150" x2="250" y2="150" stroke="black" stroke-width="4"/>
  <!-- Front fork -->
  <line x1="250" y1="150" x2="300" y2="180" stroke="black" stroke-width="4"/>
  <line x1="250" y1="150" x2="300" y2="220" stroke="black" stroke-width="3"/>
  
  <!-- Seat -->
  <rect x="140" y="130" width="20" height="8" fill="#8B4513" rx="2"/>
  
  <!-- Handlebars -->
  <line x1="250" y1="150" x2="280" y2="140" stroke="black" stroke-width="4"/>
  <line x1="280" y1="140" x2="290" y2="135" stroke="black" stroke-width="3"/>
  
  <!-- Pedals (simplified) -->
  <circle cx="150" cy="200" r="5" fill="#666"/>
  
  <!-- Pelican Body -->
  <ellipse cx="175" cy="120" rx="30" ry="40" fill="#FFF" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Head -->
  <circle cx="175" cy="70" r="20" fill="#FFF" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Beak -->
  <path d="M 195 70 L 250 65 L 240 80 Z" fill="#FFDBAC" stroke="black" stroke-width="2"/>
  <!-- Beak pouch -->
  <path d="M 220 80 Q 240 90 220 100 Q 200 90 220 80" fill="#FFD700" stroke="black" stroke-width="1"/>
  
  <!-- Pelican Eye -->
  <circle cx="185" cy="65" r="3" fill="black"/>
  
  <!-- Pelican Wings (as arms on handlebars) -->
  <path d="M 150 120 Q 120 100 140 140 Q 130 160 175 140" fill="#FFF" stroke="black" stroke-width="2"/>
  <path d="M 200 120 Q 230 100 210 140 Q 220 160 175 140" fill="#FFF" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Tail -->
  <path d="M 145 150 Q 120 160 145 170" fill="#FFF" stroke="black" stroke-width="2"/>
  
  <!-- Pelican Legs -->
  <line x1="160" y1="150" x2="160" y2="190" stroke="#8B4513" stroke-width="3"/>
  <line x1="190" y1="150" x2="190" y2="190" stroke="#8B4513" stroke-width="3"/>
  <!-- Feet on pedals -->
  <ellipse cx="150" cy="200" rx="8" ry="4" fill="#8B4513" transform="rotate(-15 150 200)"/>
  
  <!-- Simple clouds for fun -->
  <g fill="white" stroke="none">
    <circle cx="50" cy="50" r="15"/>
    <circle cx="70" cy="50" r="20"/>
    <circle cx="90" cy="50" r="15"/>
    <circle cx="320" cy="40" r="12"/>
    <circle cx="340" cy="40" r="18"/>
    <circle cx="360" cy="40" r="12"/>
  </g>
</svg>