<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#a8e0ff"/>

  <!-- Ground -->
  <rect y="220" width="400" height="80" fill="#5cb85c"/>

  <!-- Bicycle wheels -->
  <!-- Rear wheel -->
  <circle cx="130" cy="210" r="45" fill="#fff" stroke="#222" stroke-width="12"/>
  <circle cx="130" cy="210" r="32" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="130" cy="210" r="12" fill="#222"/>
  
  <!-- Front wheel -->
  <circle cx="280" cy="210" r="45" fill="#fff" stroke="#222" stroke-width="12"/>
  <circle cx="280" cy="210" r="32" fill="none" stroke="#222" stroke-width="8"/>
  <circle cx="280" cy="210" r="12" fill="#222"/>

  <!-- Bicycle frame -->
  <!-- Main triangle -->
  <line x1="130" y1="210" x2="205" y2="130" stroke="#222" stroke-width="14" stroke-linecap="round"/>
  <line x1="205" y1="130" x2="280" y2="210" stroke="#222" stroke-width="14" stroke-linecap="round"/>
  <line x1="170" y1="185" x2="280" y2="130" stroke="#222" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Handlebar stem -->
  <line x1="205" y1="130" x2="235" y2="95" stroke="#222" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <line x1="235" y1="95" x2="265" y2="75" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Seat -->
  <path d="M165 125 Q145 115 130 125" fill="none" stroke="#222" stroke-width="18" stroke-linecap="round"/>

  <!-- Pedals and crank -->
  <line x1="205" y1="175" x2="195" y2="195" stroke="#222" stroke-width="8"/>
  <rect x="185" y="192" width="18" height="8" rx="2" fill="#e74c3c" transform="rotate(-35 195 195)"/>

  <!-- Pelican body -->
  <!-- Body -->
  <ellipse cx="175" cy="95" rx="48" ry="38" fill="#f8f8f8" stroke="#222" stroke-width="8"/>
  
  <!-- Head and neck -->
  <path d="M195 68 Q225 45 245 55" fill="none" stroke="#f8f8f8" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Head -->
  <ellipse cx="255" cy="52" rx="22" ry="19" fill="#f8f8f8" stroke="#222" stroke-width="6" transform="rotate(15 255 52)"/>
  
  <!-- Beak -->
  <polygon points="272,50 310,48 272,65" fill="#f39c12" stroke="#222" stroke-width="4"/>
  <!-- Beak pouch -->
  <path d="M272 58 Q285 78 305 63" fill="#ffbb66" stroke="#222" stroke-width="3"/>
  
  <!-- Eye -->
  <circle cx="265" cy="47" r="5" fill="#222"/>
  <circle cx="266" cy="46" r="2" fill="#fff"/>
  
  <!-- Wing -->
  <path d="M140 85 Q105 65 95 95 Q110 115 145 105" fill="#ecf0f1" stroke="#222" stroke-width="7"/>
  
  <!-- Leg on pedal -->
  <line x1="195" y1="125" x2="200" y2="175" stroke="#f39c12" stroke-width="11" stroke-linecap="round"/>
  
  <!-- Foot on pedal -->
  <ellipse cx="195" cy="177" rx="13" ry="6" fill="#f39c12" transform="rotate(-40 200 175)"/>
  
  <!-- Tail feathers -->
  <path d="M125 95 Q95 105 90 125" fill="none" stroke="#f8f8f8" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Little helmet for fun -->
  <ellipse cx="255" cy="29" rx="19" ry="9" fill="#e74c3c" stroke="#222" stroke-width="4"/>
  <rect x="236" y="22" width="38" height="7" fill="#e74c3c" rx="2"/>
</svg>