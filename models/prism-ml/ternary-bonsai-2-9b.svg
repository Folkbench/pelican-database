<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sky { fill: #E0F7FA; }
      .bikeFrame { stroke: #555; stroke-width: 4; fill: none; }
      .bikeWheel { fill: #333; stroke: #666; }
      .pelicanBody { fill: #FFF; stroke: #333; stroke-width: 2; }
      .pelicanWing { fill: #FFD700; stroke: #333; stroke-width: 2; }
      .pelicanHead { fill: #FFF; stroke: #333; stroke-width: 2; }
      .pelicanBeak { stroke: #FFA500; stroke-width: 3; fill: none; }
      .pelicanPouch { fill: #FFDAB9; }
      .pelicanEyes { fill: #000; }
      .pedal { fill: #333; }
    </style>
  </defs>
  <rect width="400" height="400" class="sky" />
  
  <!-- Bicycle Frame -->
  <path class="bikeFrame" d="M 110 280 Q 180 280 250 150 Q 310 200 250 120 Q 250 120 200 100" />
  <line class="bikeFrame" x1="250" y1="120" x2="260" y2="120" />
  <line class="bikeFrame" x1="120" y1="280" x2="150" y2="280" />
  <line class="bikeFrame" x1="200" y1="240" x2="230" y2="240" />
  
  <!-- Bicycle Wheels -->
  <circle class="bikeWheel" cx="120" cy="290" r="40" />
  <circle class="bikeWheel" cx="250" cy="130" r="40" />
  
  <!-- Spokes -->
  <line x1="120" y1="260" x2="120" y2="320" />
  <line x1="120" y1="280" x2="120" y2="300" />
  <line x1="120" y1="290" x2="120" y2="270" />
  <circle class="bikeWheel" cx="120" cy="290" r="4" fill="#333" />
  
  <line x1="250" y1="120" x2="250" y2="160" />
  <line x1="250" y1="130" x2="250" y2="150" />
  <line x1="250" y1="140" x2="250" y2="160" />
  <circle class="bikeWheel" cx="250" cy="130" r="4" fill="#333" />

  <!-- Bicycle Seat and Handlebars -->
  <ellipse cx="180" cy="260" rx="40" ry="30" class="bikeFrame" stroke="#333" stroke-width="2" fill="none" />
  <path class="bikeFrame" d="M 260 120 L 250 100 L 230 90 L 200 110 Z" />
  
  <!-- Pelican -->
  <!-- Wings -->
  <path class="pelicanWing" d="M 150 260 L 100 260 L 140 240 Z" />
  <path class="pelicanWing" d="M 250 240 L 260 250 L 240 270 Z" />
  
  <!-- Body -->
  <path class="pelicanBody" d="M 160 260 C 150 270 150 290 170 290 C 190 290 190 270 180 260 Z" />
  <ellipse class="pelicanBody" cx="180" cy="260" rx="30" ry="45" fill="#FFF" />
  
  <!-- Neck -->
  <path class="pelicanBody" d="M 180 260 Q 150 210 160 120" stroke="#333" fill="none" stroke-width="8" />
  <path class="pelicanBody" d="M 160 120 L 170 110" />
  
  <!-- Head -->
  <ellipse class="pelicanHead" cx="170" cy="115" rx="25" ry="25" fill="#FFF" stroke="#333" />
  
  <!-- Eye -->
  <circle class="pelicanEyes" cx="168" cy="113" r="3" fill="#000" />
  
  <!-- Beak and Pouch -->
  <path class="pelicanBeak" d="M 175 105 L 195 150" />
  <path class="pelicanBeak" d="M 175 115 L 195 160" stroke-width="2" fill="none"/>
  <path class="pelicanPouch" d="M 175 105 L 195 105 L 185 150 L 175 105 Z" />
  
  <!-- Legs and Pedals -->
  <line class="pelicanBody" x1="185" y1="280" x2="165" y2="240" stroke="#333" stroke-width="2" />
  <line class="pelicanBody" x1="195" y1="280" x2="215" y2="240" stroke="#333" stroke-width="2" />
  <circle class="pedal" cx="165" cy="240" r="8" />
  <circle class="pedal" cx="215" cy="240" r="8" />
</svg>