<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Ground -->
  <rect x="0" y="150" width="200" height="50" fill="#c8e6c9"/>
  <!-- Bicycle frame -->
  <path d="M80 150 L100 130 L120 150 M80 150 L80 120 M100 130 L100 120 M100 130 L130 145" stroke="#555" stroke-width="4" fill="none"/>
  <!-- Wheels -->
  <circle cx="80" cy="150" r="20" stroke="#555" stroke-width="4" fill="none"/>
  <circle cx="120" cy="150" r="20" stroke="#555" stroke-width="4" fill="none"/>
  <!-- Pelican body -->
  <ellipse cx="100" cy="110" rx="30" ry="20" fill="#fffbe6" stroke="#ffa500" stroke-width="2"/>
  <!-- Head -->
  <circle cx="115" cy="95" r="10" fill="#fffbe6" stroke="#ffa500" stroke-width="2"/>
  <!-- Beak -->
  <polygon points="125,90 135,95 125,100" fill="#ffa500"/>
  <!-- Eye -->
  <circle cx="118" cy="93" r="2" fill="black"/>
  <!-- Wings -->
  <path d="M85 100 Q70 80 80 90" stroke="#ffa500" stroke-width="3" fill="none"/>
  <path d="M115 100 Q130 80 120 90" stroke="#ffa500" stroke-width="3" fill="none"/>
  <!-- Legs -->
  <line x1="100" y1="130" x2="90" y2="150" stroke="#ffa500" stroke-width="3"/>
  <line x1="100" y1="130" x2="110" y2="150" stroke="#ffa500" stroke-width="3"/>
  <!-- Feet -->
  <path d="M90 150 L85 155 L95 155" fill="none" stroke="#ffa500" stroke-width="2"/>
  <path d="M110 150 L105 155 L115 155" fill="none" stroke="#ffa500" stroke-width="2"/>
</svg>