<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#B0E0F6"/>
    </radialGradient>
    <radialGradient id="wheel" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#333"/>
      <stop offset="86%" stop-color="#666"/>
      <stop offset="100%" stop-color="#333"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="600" height="450" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="520" cy="60" r="35" fill="#FFD54F" opacity="0.9"/>

  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="100" cy="50" rx="40" ry="15" fill="white"/>
    <ellipse cx="130" cy="45" rx="30" ry="12" fill="white"/>
    <ellipse cx="75" cy="48" rx="25" ry="10" fill="white"/>
  </g>
  <g opacity="0.7">
    <ellipse cx="420" cy="80" rx="35" ry="12" fill="white"/>
    <ellipse cx="445" cy="76" rx="25" ry="10" fill="white"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="385" width="600" height="65" fill="#66BB6A"/>
  <rect x="0" y="385" width="600" height="5" fill="#4CAF50"/>
  <line x1="0" y1="385" x2="600" y2="385" stroke="#4CAF50" stroke-width="2"/>

  <!-- ===== BICYCLE ===== -->
  <g id="bicycle">
    <!-- Rear wheel -->
    <circle cx="160" cy="340" r="55" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="160" cy="340" r="55" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="160" cy="340" r="45" fill="none" stroke="#444" stroke-width="0.8"/>
    <!-- Spokes -->
    <line x1="160" y1="285" x2="160" y2="395" stroke="#666" stroke-width="1"/>
    <line x1="105" y1="340" x2="215" y2="340" stroke="#666" stroke-width="1"/>
    <line x1="121" y1="301" x2="199" y2="379" stroke="#666" stroke-width="1"/>
    <line x1="199" y1="301" x2="121" y2="379" stroke="#666" stroke-width="1"/>
    <circle cx="160" cy="340" r="4" fill="#555"/>
    <circle cx="160" cy="340" r="2" fill="#888"/>

    <!-- Front wheel -->
    <circle cx="400" cy="340" r="55" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="400" cy="340" r="55" fill="none" stroke="#555" stroke-width="1"/>
    <circle cx="400" cy="340" r="45" fill="none" stroke="#444" stroke-width="0.8"/>
    <line x1="400" y1="285" x2="400" y2="395" stroke="#666" stroke-width="1"/>
    <line x1="345" y1="340" x2="455" y2="340" stroke="#666" stroke-width="1"/>
    <line x1="361" y1="301" x2="439" y2="379" stroke="#666" stroke-width="1"/>
    <line x1="439" y1="301" x2="361" y2="379" stroke="#666" stroke-width="1"/>
    <circle cx="400" cy="340" r="4" fill="#555"/>
    <circle cx="400" cy="340" r="2" fill="#888"/>

    <!-- Frame -->
    <!-- Seat tube -->
    <line x1="200" y1="215" x2="210" y2="300" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="200" y1="215" x2="350" y2="210" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="210" y1="300" x2="280" y2="255" stroke="#C62828" stroke-width="6" stroke-linecap="round"/>
    <!-- Chain stay -->
    <line x1="210" y1="300" x2="160" y2="340" stroke="#C62828" stroke-width="5" stroke-linecap="round"/>
    <!-- Seat stay -->
    <line x1="200" y1="215" x2="160" y2="340" stroke="#C62828" stroke-width="4" stroke-linecap="round"/>
    <!-- Fork -->
    <line x1="350" y1="210" x2="400" y2="340" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <!-- Head tube -->
    <line x1="350" y1="210" x2="345" y2="200" stroke="#444" stroke-width="5" stroke-linecap="round"/>

    <!-- Handlebars -->
    <line x1="345" y1="200" x2="330" y2="175" stroke="#444" stroke-width="4" stroke-linecap="round"/>
    <line x1="330" y1="175" x2="310" y2="170" stroke="#444" stroke-width="3" stroke-linecap="round"/>
    <line x1="330" y1="175" x2="310" y2="180" stroke="#444" stroke-width="3" stroke-linecap="round"/>
    <!-- Handlebar grips -->
    <line x1="310" y1="170" x2="295" y2="165" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <line x1="310" y1="180" x2="295" y2="185" stroke="#333" stroke-width="5" stroke-linecap="round"/>

    <!-- Seat post -->
    <line x1="200" y1="215" x2="200" y2="205" stroke="#555" stroke-width="4"/>
    <!-- Seat -->
    <ellipse cx="200" cy="202" rx="18" ry="5" fill="#333"/>

    <!-- Pedal crank -->
    <circle cx="245" cy="300" r="6" fill="#555"/>
    <line x1="245" y1="300" x2="230" y2="315" stroke="#555" stroke-width="3"/>
    <line x1="245" y1="300" x2="260" y2="285" stroke="#555" stroke-width="3"/>
    <!-- Pedals -->
    <rect x="225" y="313" width="12" height="4" rx="1" fill="#777" transform="rotate(15,231,315)"/>
    <rect x="254" y="281" width="12" height="4" rx="1" fill="#777" transform="rotate(-15,260,283)"/>

    <!-- Chain -->
    <ellipse cx="220" cy="310" rx="30" ry="8" fill="none" stroke="#888" stroke-width="1.5"/>
  </g>

  <!-- ===== PELICAN ===== -->
  <g id="pelican">
    <!-- Tail feathers -->
    <path d="M175,180 L145,155 L155,175 L140,165 L155,185 L145,180 L160,190" fill="#E8E8E8" stroke="#ccc" stroke-width="0.5"/>

    <!-- Body -->
    <ellipse cx="210" cy="175" rx="48" ry="38" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Belly highlight -->
    <ellipse cx="215" cy="180" rx="30" ry="22" fill="#FAFAFA"/>

    <!-- Left wing (upper) -->
    <path d="M180,160 Q140,140 130,160 Q145,175 180,175" fill="#F5F5F5" stroke="#ccc" stroke-width="1"/>
    <path d="M185,165 Q155,145 148,162 Q158,172 185,172" fill="white" stroke="#ccc" stroke-width="0.5"/>
    <!-- Wing feather lines -->
    <line x1="170" y1="165" x2="145" y2="160" stroke="#ccc" stroke-width="0.5"/>
    <line x1="172" y1="170" x2="148" y2="168" stroke="#ccc" stroke-width="0.5"/>

    <!-- Right wing (lower, closer to bike) -->
    <path d="M230,170 Q260,155 265,170 Q255,180 230,180" fill="#EEEEEE" stroke="#ccc" stroke-width="1"/>

    <!-- Neck -->
    <path d="M240,170 Q260,155 270,145 Q275,140 280,142" fill="white" stroke="none"/>
    <path d="M235,175 Q255,160 265,150 Q272,145 278,147" fill="#F8F8F8" stroke="none"/>

    <!-- Head -->
    <circle cx="285" cy="138" r="22" fill="white" stroke="#ddd" stroke-width="1"/>
    <!-- Head tuft -->
    <path d="M270,120 Q275,110 280,118 Q285,108 290,118" fill="#F0F0F0" stroke="#ccc" stroke-width="0.5"/>

    <!-- Eye -->
    <circle cx="295" cy="130" r="4.5" fill="#333"/>
    <circle cx="296.5" cy="128.5" r="1.8" fill="white"/>

    <!-- Upper beak -->
    <path d="M300,132 L350,128 L352,138 L300,142 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1"/>
    <!-- Beak ridge -->
    <line x1="300" y1="137" x2="350" y2="133" stroke="#E65100" stroke-width="0.8"/>

    <!-- Lower beak -->
    <path d="M300,142 L348,138 L345,155 Q320,168 300,155 Z" fill="#FFB300" stroke="#E65100" stroke-width="1"/>
    <!-- Beak pouch -->
    <path d="M300,142 Q325,175 345,155 Q330,170 300,155" fill="#FF8F00" opacity="0.5" stroke="#E65100" stroke-width="0.5"/>

    <!-- Legs -->
    <path d="M225,205 Q220,240 210,275" stroke="#FF8F00" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M230,205 Q245,240 255,275" stroke="#FF8F00" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Feet on pedals -->
    <ellipse cx="208" cy="277" rx="10" ry="4" fill="#FF8F00" stroke="#E65100" stroke-width="0.5"/>
    <line x1="200" y1="277" x2="195" y2="274" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>
    <line x1="200" y1="277" x2="195" y2="280" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>

    <ellipse cx="253" cy="283" rx="10" ry="4" fill="#FF8F00" stroke="#E65100" stroke-width="0.5"/>
    <line x1="245" y1="283" x2="240" y2="280" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>
    <line x1="245" y1="283" x2="240" y2="286" stroke="#FF8F00" stroke-width="2" stroke-linecap="round"/>

    <!-- Wing holding handlebars -->
    <path d="M250,165 Q280,155 300,160 Q310,155 320,158" fill="none" stroke="#ddd" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Small birds in sky -->
  <g stroke="#555" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M80,100 Q85,95 90,100 Q95,95 100,100"/>
    <path d="M120,85 Q124,81 128,85 Q132,81 136,85"/>
    <path d="M550,95 Q554,91 558,95 Q562,91 566,95"/>
  </g>
</svg>