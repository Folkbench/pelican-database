<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Pelican Riding a Bicycle</title>
  <desc>A white pelican with a large orange beak sits on a red bicycle, wings on the handlebars and feet on the pedals.</desc>

  <!-- Ground shadow -->
  <ellipse cx="200" cy="268" rx="130" ry="8" fill="#000" opacity="0.12"/>

  <!-- ===== Bicycle ===== -->
  <!-- Frame -->
  <g stroke="#c0392b" stroke-width="6" stroke-linecap="round" fill="none">
    <!-- Chain stays and seat stays -->
    <line x1="130" y1="225" x2="200" y2="225"/>
    <line x1="130" y1="225" x2="175" y2="160"/>
    <!-- Down tube and top tube -->
    <line x1="200" y1="225" x2="260" y2="160"/>
    <line x1="175" y1="160" x2="260" y2="160"/>
    <!-- Seat post -->
    <line x1="175" y1="160" x2="172" y2="145"/>
    <!-- Head tube -->
    <line x1="260" y1="160" x2="275" y2="140"/>
    <!-- Fork -->
    <line x1="275" y1="140" x2="300" y2="225"/>
  </g>

  <!-- Wheels -->
  <g fill="none" stroke="#2c3e50" stroke-width="5">
    <circle cx="130" cy="225" r="45"/>
    <circle cx="300" cy="225" r="45"/>
  </g>
  <!-- Spokes -->
  <g stroke="#7f8c8d" stroke-width="1.5" opacity="0.7">
    <line x1="130" y1="180" x2="130" y2="270"/>
    <line x1="85" y1="225" x2="175" y2="225"/>
    <line x1="98.5" y1="198.5" x2="161.5" y2="251.5"/>
    <line x1="161.5" y1="198.5" x2="98.5" y2="251.5"/>
    <line x1="300" y1="180" x2="300" y2="270"/>
    <line x1="255" y1="225" x2="345" y2="225"/>
    <line x1="268.5" y1="198.5" x2="331.5" y2="251.5"/>
    <line x1="331.5" y1="198.5" x2="268.5" y2="251.5"/>
  </g>
  <!-- Hubs -->
  <circle cx="130" cy="225" r="6" fill="#2c3e50"/>
  <circle cx="300" cy="225" r="6" fill="#2c3e50"/>

  <!-- Handlebars -->
  <path d="M275 140 Q285 125 295 130" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round"/>

  <!-- Saddle -->
  <ellipse cx="172" cy="142" rx="18" ry="6" fill="#2c3e50"/>

  <!-- Pedals and crank -->
  <line x1="200" y1="225" x2="215" y2="200" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="225" x2="185" y2="250" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/>
  <rect x="208" y="196" width="14" height="5" rx="2" fill="#2c3e50"/>
  <rect x="178" y="246" width="14" height="5" rx="2" fill="#2c3e50"/>

  <!-- ===== Pelican ===== -->
  <!-- Tail -->
  <path d="M150 130 Q130 120 120 130 Q135 140 150 140 Z" fill="#f5f6fa" stroke="#dcdde1" stroke-width="2"/>

  <!-- Body -->
  <ellipse cx="185" cy="125" rx="45" ry="30" fill="#f5f6fa" stroke="#dcdde1" stroke-width="2"/>

  <!-- Legs -->
  <line x1="185" y1="150" x2="215" y2="200" stroke="#e67e22" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="150" x2="185" y2="250" stroke="#e67e22" stroke-width="4" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="215" cy="200" rx="8" ry="4" fill="#e67e22"/>
  <ellipse cx="185" cy="250" rx="8" ry="4" fill="#e67e22"/>

  <!-- Wing (reaching to handlebars) -->
  <path d="M170 110 Q220 100 285 128 Q230 135 175 135 Z" fill="#dcdde1" stroke="#b2bec3" stroke-width="2"/>
  <path d="M190 115 Q230 112 270 127" fill="none" stroke="#b2bec3" stroke-width="1.5"/>

  <!-- Neck -->
  <path d="M215 110 Q235 90 245 75" fill="none" stroke="#f5f6fa" stroke-width="18" stroke-linecap="round"/>
  <path d="M215 110 Q235 90 245 75" fill="none" stroke="#dcdde1" stroke-width="18" stroke-linecap="round" opacity="0.3"/>

  <!-- Head -->
  <circle cx="250" cy="70" r="18" fill="#f5f6fa" stroke="#dcdde1" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="255" cy="65" r="3" fill="#2c3e50"/>
  <circle cx="256" cy="64" r="1" fill="#fff"/>

  <!-- Beak (large pouched pelican beak) -->
  <path d="M265 68 Q310 60 340 75 Q310 90 265 82 Z" fill="#e67e22" stroke="#d35400" stroke-width="2"/>
  <!-- Pouch -->
  <path d="M268 80 Q300 105 330 82 Q300 90 268 80 Z" fill="#f39c12" opacity="0.8"/>
  <!-- Beak line -->
  <line x1="265" y1="75" x2="340" y2="75" stroke="#d35400" stroke-width="1.5"/>

  <!-- Crest feathers -->
  <path d="M240 55 Q235 40 245 35 Q248 45 248 55 Z" fill="#f5f6fa" stroke="#dcdde1" stroke-width="1.5"/>
  <path d="M250 53 Q250 38 260 33 Q260 45 258 53 Z" fill="#f5f6fa" stroke="#dcdde1" stroke-width="1.5"/>
</svg>