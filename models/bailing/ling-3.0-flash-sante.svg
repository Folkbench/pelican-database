<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky -->
  <rect width="500" height="400" fill="#87CEEB"/>
  
  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="80" cy="60" rx="30" ry="15" fill="white"/>
    <ellipse cx="100" cy="55" rx="25" ry="12" fill="white"/>
    <ellipse cx="420" cy="80" rx="35" ry="18" fill="white"/>
    <ellipse cx="445" cy="75" rx="28" ry="14" fill="white"/>
  </g>
  
  <!-- Ground -->
  <path d="M 0 320 Q 250 310 500 320 L 500 400 L 0 400 Z" fill="#4CAF50"/>
  
  <!-- Bicycle -->
  <g id="bike">
    <!-- Back wheel -->
    <g transform="translate(120, 280)">
      <circle r="50" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#ccc" stroke-width="2"/>
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#ccc" stroke-width="2"/>
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ccc" stroke-width="2"/>
        <line x1="35" y1="-35" x2="-35" y2="35" stroke="#ccc" stroke-width="2"/>
        <line x1="-25" y1="-43" x2="25" y2="43" stroke="#ccc" stroke-width="2"/>
        <line x1="25" y1="-43" x2="-25" y2="43" stroke="#ccc" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Front wheel -->
    <g transform="translate(350, 280)">
      <circle r="50" fill="none" stroke="#333" stroke-width="4"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" repeatCount="indefinite"/>
        <line x1="0" y1="-50" x2="0" y2="50" stroke="#ccc" stroke-width="2"/>
        <line x1="-50" y1="0" x2="50" y2="0" stroke="#ccc" stroke-width="2"/>
        <line x1="-35" y1="-35" x2="35" y2="35" stroke="#ccc" stroke-width="2"/>
        <line x1="35" y1="-35" x2="-35" y2="35" stroke="#ccc" stroke-width="2"/>
        <line x1="-25" y1="-43" x2="25" y2="43" stroke="#ccc" stroke-width="2"/>
        <line x1="25" y1="-43" x2="-25" y2="43" stroke="#ccc" stroke-width="2"/>
      </g>
    </g>
    
    <!-- Frame -->
    <path d="M 120 280 L 200 220 L 320 200 L 350 280" fill="none" stroke="#e74c3c" stroke-width="6" stroke-linecap="round"/>
    <path d="M 200 220 L 200 280" fill="none" stroke="#e74c3c" stroke-width="6" stroke-linecap="round"/>
    <path d="M 320 200 L 340 180" fill="none" stroke="#333" stroke-width="4"/>
    
    <!-- Seat -->
    <ellipse cx="195" cy="215" rx="20" ry="6" fill="#333"/>
    
    <!-- Handlebars -->
    <path d="M 320 200 L 330 180" stroke="#333" stroke-width="5" stroke-linecap="round"/>
    <path d="M 325 180 L 340 175 M 325 180 L 340 185" stroke="#333" stroke-width="3"/>
    
    <!-- Crank/Pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.5s" repeatCount="indefinite" transform-origin="200 280"/>
      <circle cx="200" cy="280" r="8" fill="#333"/>
      <line x1="190" y1="280" x2="210" y2="280" stroke="#333" stroke-width="4"/>
    </g>
  </g>
  
  <!-- Pelican -->
  <g id="pelican" transform="rotate(-10 180 180)">
    <!-- Body -->
    <ellipse cx="180" cy="180" rx="40" ry="30" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Tail feathers -->
    <path d="M 140 170 L 120 155 L 125 175 Z" fill="#ddd" stroke="#333" stroke-width="1"/>
    
    <!-- Neck -->
    <path d="M 210 170 Q 230 140 220 110 Q 215 95 210 90" fill="none" stroke="white" stroke-width="16" stroke-linecap="round"/>
    <path d="M 210 170 Q 230 140 220 110 Q 215 95 210 90" fill="none" stroke="#333" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Head -->
    <circle cx="210" cy="85" r="18" fill="white" stroke="#333" stroke-width="2"/>
    
    <!-- Eye -->
    <circle cx="220" cy="80" r="3" fill="#333"/>
    <circle cx="221" cy="79" r="1" fill="white"/>
    
    <!-- Beak pouch (characteristic pelican feature) -->
    <path d="M 228 85 L 265 90 Q 270 115 255 115 L 228 110 Z" fill="orange" stroke="#333" stroke-width="1"/>
    
    <!-- Upper beak -->
    <path d="M 228 85 L 265 88" stroke="#333" stroke-width="2" fill="none"/>
    <path d="M 228 95 L 260 96" stroke="#333" stroke-width="2" fill="none"/>
    
    <!-- Wings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-10 170 180;10 170 180;-10 170 180" dur="0.6s" repeatCount="indefinite"/>
      <path d="M 155 175 L 100 140 L 115 175 Z" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
      <path d="M 155 185 L 90 175 L 110 195 Z" fill="#eeeeee" stroke="#333" stroke-width="1"/>
    </g>
    
    <!-- Feet on pedals -->
    <circle cx="190" cy="285" r="8" fill="orange" stroke="#333" stroke-width="1"/>
    <circle cx="210" cy="285" r="8" fill="orange" stroke="#333" stroke-width="1"/>
  </g>
</svg>