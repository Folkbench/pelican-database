<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Pelican riding a bicycle</title>
  <desc id="dsc">A white pelican with a big orange throat pouch leans over the handlebars of a teal
  bicycle on a sunny country road, wings wrapped around the bars, webbed feet on the pedals.</desc>

  <defs>
    <!-- ======== gradients ======== -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#a8e2f5"/>
      <stop offset=".55" stop-color="#ddf1ef"/>
      <stop offset="1"   stop-color="#fdf1d9"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0"  stop-color="#fff5c4" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#ffe487" stop-opacity=".42"/>
      <stop offset="1"  stop-color="#ffe487" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3eae0"/><stop offset="1" stop-color="#b6dbca"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7ddaf"/><stop offset="1" stop-color="#8fc792"/>
    </linearGradient>
    <linearGradient id="roadG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e8d4"/><stop offset="1" stop-color="#d8cbB2"/>
    </linearGradient>
    <linearGradient id="bodyG" x1=".25" y1="0" x2=".7" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#f6f9fb"/>
      <stop offset="1"   stop-color="#d2dee9"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd775"/><stop offset="1" stop-color="#f4a236"/>
    </linearGradient>
    <linearGradient id="pouchG" x1=".2" y1="0" x2=".55" y2="1">
      <stop offset="0"  stop-color="#ffca62"/>
      <stop offset=".6" stop-color="#f79a3c"/>
      <stop offset="1"  stop-color="#e2751f"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33b4b6"/><stop offset="1" stop-color="#10757d"/>
    </linearGradient>

    <!-- ======== reusable shapes ======== -->
    <path id="cloud" d="M-72,0C-86,0-92,-14-82,-22C-86,-36-72,-46-58,-40C-50,-54-28,-56-18,-44
                        C-4,-52 12,-42 10,-26C22,-22 20,-2 6,0Z"/>

    <g id="wheel">
      <circle r="88" fill="none" stroke="#33434d" stroke-width="14"/>
      <circle r="88" fill="none" stroke="#546874" stroke-width="4" opacity=".45"/>
      <circle r="75" fill="none" stroke="#b7c6d0" stroke-width="6"/>
      <g stroke="#dde6eb" stroke-width="2.1" stroke-linecap="round">
        <line y1="-73" y2="73"/>
        <line x1="-73" y1="0" x2="73" y2="0"/>
        <line x1="-63" y1="-36.5" x2="63" y2="36.5"/>
        <line x1="-36.5" y1="-63" x2="36.5" y2="63"/>
        <line x1="-36.5" y1="63" x2="36.5" y2="-63"/>
        <line x1="-63" y1="36.5" x2="63" y2="-36.5"/>
      </g>
      <circle r="10" fill="#5d6f7a"/>
      <circle r="4.5" fill="#2b3a44"/>
    </g>

    <path id="frame" fill="none" d="M390,372L336,234M390,372L540,286M341,243L525,244
                                    M390,372L220,370M345,249L220,370M518,226L545,292
                                    M336,234L330,208M518,226L507,207
                                    M541,290C556,320 568,346 580,370"/>

    <path id="tailShape" d="M268,138C246,124 224,114 202,114C212,128 214,144 208,158
                            C230,154 252,156 268,162Z"/>
    <path id="bodyShape" d="M256,128C282,104 316,92 350,102C386,80 418,66 452,68
                            C468,58 496,62 504,80C509,91 505,100 496,106
                            C462,104 432,110 410,126C396,140 388,152 384,166
                            C376,192 344,212 306,210C272,208 248,188 244,162
                            C242,146 246,136 256,128Z"/>
    <path id="wingShape" d="M352,116C392,114 428,142 452,182C460,194 458,208 446,208
                            C434,206 418,194 402,180C382,162 362,154 344,154
                            C340,140 344,124 352,116Z"/>
    <path id="pouchShape" d="M498,96C534,99 584,108 613,112C610,136 594,161 566,165
                             C532,169 504,140 498,96Z"/>

    <clipPath id="clipTail"><use href="#tailShape"/></clipPath>
    <clipPath id="clipBody"><use href="#bodyShape"/></clipPath>
    <clipPath id="clipWing"><use href="#wingShape"/></clipPath>
    <clipPath id="clipPouch"><use href="#pouchShape"/></clipPath>
  </defs>

  <!-- ================= SKY ================= -->
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="702" cy="86" r="98" fill="url(#sunGlow)"/>
  <circle cx="702" cy="86" r="36" fill="#ffe894"/>
  <circle cx="702" cy="86" r="36" fill="none" stroke="#fff6cf" stroke-width="3" opacity=".8"/>

  <g fill="#ffffff">
    <use href="#cloud" transform="translate(150,124) scale(1.05)" opacity=".92"/>
    <use href="#cloud" transform="translate(690,252) scale(.82)"  opacity=".8"/>
    <use href="#cloud" transform="translate(380,54)  scale(.58)"  opacity=".7"/>
  </g>

  <!-- ================= HILLS + ROAD ================= -->
  <path fill="url(#hillFar)" d="M0,432C90,398 170,404 250,424C330,444 400,414 480,400
        C570,384 660,398 740,416C770,423 786,428 800,430L800,466L0,466Z"/>
  <path fill="url(#hillNear)" d="M0,452C80,430 150,438 230,450C320,463 400,442 470,434
        C560,424 650,440 720,452C760,459 782,462 800,462L800,470L0,470Z"/>
  <rect x="0" y="460" width="800" height="60" fill="url(#roadG)"/>
  <line x1="0" y1="460.5" x2="800" y2="460.5" stroke="#c2b295" stroke-width="2"/>
  <g stroke="#faf3e2" stroke-width="5" stroke-linecap="round" opacity=".75">
    <line x1="40"  y1="500" x2="112" y2="500"/>
    <line x1="180" y1="500" x2="252" y2="500"/>
    <line x1="320" y1="500" x2="392" y2="500"/>
    <line x1="460" y1="500" x2="532" y2="500"/>
    <line x1="600" y1="500" x2="672" y2="500"/>
    <line x1="740" y1="500" x2="792" y2="500"/>
  </g>
  <g fill="#7fbb84">
    <path d="M46,462c1-11 5-16 7-21c-1,9 1,15 5,21z"/>
    <path d="M104,462c2-9 6-13 8-17c-1,7 0,12 4,17z"/>
    <path d="M666,462c1-10 5-15 7-20c-1,9 1,14 5,20z"/>
    <path d="M742,462c2-8 6-12 8-16c-1,7 0,11 4,16z"/>
  </g>

  <!-- ================= WIND ================= -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".72">
    <path d="M96,150C128,142 160,146 184,158"  stroke-width="6"/>
    <path d="M70,196C104,190 138,194 162,206"  stroke-width="5"/>
    <path d="M124,104C150,98 176,100 196,108"  stroke-width="4.5"/>
    <path d="M268,58C298,50 328,52 350,60"      stroke-width="4.5"/>
    <path d="M556,198C586,192 614,196 634,206"  stroke-width="5"/>
  </g>

  <!-- ================= SHADOW + DUST ================= -->
  <ellipse cx="400" cy="468" rx="252" ry="13" fill="#3a4a3f" opacity=".15"/>
  <g fill="#ffffff" opacity=".55">
    <circle cx="126" cy="450" r="16"/><circle cx="102" cy="457" r="11"/><circle cx="148" cy="459" r="10"/>
    <circle cx="674" cy="452" r="14"/><circle cx="696" cy="458" r="9"/>
  </g>
  <ellipse cx="220" cy="466" rx="48" ry="8" fill="#2b3a33" opacity=".18"/>
  <ellipse cx="580" cy="466" rx="48" ry="8" fill="#2b3a33" opacity=".18"/>

  <!-- ================= WHEELS ================= -->
  <use href="#wheel" x="220" y="370"/>
  <use href="#wheel" x="580" y="370"/>

  <!-- ================= DRIVETRAIN (far side) ================= -->
  <g fill="none" stroke-linecap="round">
    <path d="M390,339L220,355" stroke="#3d4c57" stroke-width="4.5"/>
    <path d="M390,405L220,385" stroke="#3d4c57" stroke-width="4.5"/>
    <path d="M390,339L220,355" stroke="#8d9ca7" stroke-width="1.6" stroke-dasharray="5 5"/>
    <path d="M390,405L220,385" stroke="#8d9ca7" stroke-width="1.6" stroke-dasharray="5 5"/>
  </g>
  <circle cx="220" cy="370" r="15" fill="none" stroke="#4d5c66" stroke-width="3.5" stroke-dasharray="2.5 4"/>
  <circle cx="220" cy="370" r="11" fill="#cfd9e0" stroke="#4d5c66" stroke-width="2.5"/>

  <!-- far crank + pedal -->
  <path d="M390,372L362,342" stroke="#33434d" stroke-width="12" stroke-linecap="round"/>
  <path d="M390,372L362,342" stroke="#7d8d98" stroke-width="7"  stroke-linecap="round"/>
  <rect x="340" y="335" width="42" height="9" rx="4" fill="#26333b"/>

  <!-- far leg + webbed foot -->
  <g fill="none" stroke-linecap="round">
    <path d="M320,196L348,282" stroke="#7d5546" stroke-width="19"/>
    <path d="M320,196L348,282" stroke="#a97e69" stroke-width="14"/>
    <path d="M348,282L357,320" stroke="#7d5546" stroke-width="15"/>
    <path d="M348,282L357,320" stroke="#a97e69" stroke-width="10"/>
  </g>
  <path d="M356,306C346,313 342,324 347,329C355,335 378,335 389,330C396,327 395,318 387,315
           C376,310 365,303 356,306Z" fill="#a97e69" stroke="#7d5546" stroke-width="2.6"/>

  <!-- ================= FRAME ================= -->
  <use href="#frame" stroke="#0f4a52" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#frame" stroke="url(#frameG)" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#frame" stroke="#8fdfe0" stroke-width="3" stroke-linecap="round" opacity=".5"
       transform="translate(-2.5,-3.5)"/>

  <!-- chainring + near crank + pedal -->
  <circle cx="390" cy="372" r="33" fill="none" stroke="#4d5c66" stroke-width="4" stroke-dasharray="3 4.5"/>
  <circle cx="390" cy="372" r="28" fill="#e7edf1" stroke="#5b6b76" stroke-width="3"/>
  <g stroke="#9fadb7" stroke-width="4" stroke-linecap="round">
    <line x1="390" y1="372" x2="390" y2="350"/>
    <line x1="390" y1="372" x2="410" y2="383"/>
    <line x1="390" y1="372" x2="370" y2="383"/>
  </g>
  <circle cx="390" cy="372" r="8" fill="#4d5c66"/>
  <path d="M390,372L418,400" stroke="#33434d" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M390,372L418,400" stroke="#8d9ca7" stroke-width="7.5" stroke-linecap="round" fill="none"/>
  <rect x="396" y="398" width="46" height="10" rx="4.5" fill="#2f3d46"/>
  <rect x="400" y="400" width="38" height="2.6" rx="1.3" fill="#6d7d88" opacity=".8"/>

  <!-- near leg + webbed foot -->
  <g fill="none" stroke-linecap="round">
    <path d="M344,196L384,296" stroke="#a86e5b" stroke-width="22"/>
    <path d="M344,196L384,296" stroke="#d7a189" stroke-width="16"/>
    <path d="M384,296L404,372" stroke="#a86e5b" stroke-width="17"/>
    <path d="M384,296L404,372" stroke="#d7a189" stroke-width="11.5"/>
  </g>
  <circle cx="384" cy="296" r="9.5" fill="#d7a189" stroke="#a86e5b" stroke-width="2.6"/>
  <path d="M400,366C388,375 383,388 389,394C399,400 428,401 441,395C450,391 448,381 439,377
           C426,371 412,362 400,366Z" fill="#d7a189" stroke="#a86e5b" stroke-width="3"/>
  <g stroke="#a86e5b" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".85">
    <path d="M410,396C412,388 415,381 420,376"/>
    <path d="M425,396C427,389 429,383 433,379"/>
  </g>

  <!-- ================= SADDLE, BARS, BELL ================= -->
  <path d="M292,206C296,196 308,190 330,189C352,188 368,192 372,200C374,206 366,212 344,215
           C318,218 298,214 292,206Z" fill="#2f3d46" stroke="#22303a" stroke-width="2"/>
  <path d="M300,201C313,196 340,194 362,198" fill="none" stroke="#7b8b96" stroke-width="2.6"
        stroke-linecap="round" opacity=".75"/>
  <path d="M508,207C496,193 476,186 452,192" fill="none" stroke="#2f3d46" stroke-width="9"
        stroke-linecap="round"/>
  <path d="M474,187C466,186 458,188 452,192" fill="none" stroke="#e2604f" stroke-width="13"
        stroke-linecap="round"/>
  <path d="M480,189A10,10 0 0 1 500,189Z" fill="#e2604f" stroke="#a9402f" stroke-width="2"/>
  <circle cx="490" cy="177.5" r="3" fill="#a9402f"/>

  <!-- ================= PELICAN ================= -->
  <!-- crest tuft (behind head) -->
  <path d="M456,70C448,57 436,49 423,44C435,52 445,61 449,74Z"
        fill="url(#bodyG)" stroke="#33434d" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- tail -->
  <use href="#tailShape" fill="url(#bodyG)" stroke="#33434d" stroke-width="2.5" stroke-linejoin="round"/>
  <g clip-path="url(#clipTail)">
    <path d="M200,110C212,126 216,144 210,162L180,166L180,108Z" fill="#3d4e5a"/>
    <path d="M218,120C226,132 230,146 228,158" fill="none" stroke="#aebdc9" stroke-width="1.8"/>
    <path d="M236,126C243,137 246,148 245,158" fill="none" stroke="#aebdc9" stroke-width="1.8"/>
  </g>
  <use href="#tailShape" fill="none" stroke="#33434d" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- body + neck + head, one clean silhouette -->
  <use href="#bodyShape" fill="url(#bodyG)" stroke="#33434d" stroke-width="2.7" stroke-linejoin="round"/>
  <g clip-path="url(#clipBody)">
    <path d="M382,170C372,194 342,208 306,206C276,204 254,190 246,166C258,186 280,196 306,198
             C340,200 368,188 382,170Z" fill="#c2d1de" opacity=".65"/>
    <path d="M470,72C486,68 498,74 502,84C494,76 482,74 470,78Z" fill="#cfdce6"/>
    <ellipse cx="300" cy="132" rx="52" ry="26" transform="rotate(-12 300 132)" fill="#ffffff" opacity=".55"/>
  </g>
  <use href="#bodyShape" fill="none" stroke="#33434d" stroke-width="2.7" stroke-linejoin="round"/>

  <!-- pouch -->
  <use href="#pouchShape" fill="url(#pouchG)" stroke="#33434d" stroke-width="2.5" stroke-linejoin="round"/>
  <g clip-path="url(#clipPouch)">
    <path d="M512,112C528,148 556,158 584,140" fill="none" stroke="#d9752a" stroke-width="3.4"
          stroke-linecap="round" opacity=".55"/>
    <path d="M520,104C528,132 542,150 562,156" fill="none" stroke="#ffe0a0" stroke-width="4"
          stroke-linecap="round" opacity=".55"/>
  </g>
  <use href="#pouchShape" fill="none" stroke="#33434d" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- upper mandible -->
  <path d="M500,80C536,85 584,96 613,104C620,106 620,112 613,112C584,107 534,99 498,96Z"
        fill="url(#beakG)" stroke="#33434d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M604,102C612,104 619,107 618,110C616,113 609,113 604,111Z" fill="#d9752a"/>
  <path d="M498,96C534,99 584,108 613,112" fill="none" stroke="#d9752a" stroke-width="2.2" opacity=".9"/>
  <path d="M520,92C526,93 531,94.5 535,96" fill="none" stroke="#d3822b" stroke-width="2.6"
        stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="487" cy="82" r="10"  fill="none" stroke="#eb9b3f" stroke-width="3"/>
  <circle cx="487" cy="82" r="7"   fill="#fdfeff" stroke="#33434d" stroke-width="2"/>
  <circle cx="489.5" cy="82" r="3.9" fill="#2b3944"/>
  <circle cx="491.5" cy="79.4" r="1.5" fill="#ffffff"/>

  <!-- far wing -->
  <path d="M348,112C388,104 424,126 448,164C456,176 452,186 444,180C420,162 388,144 352,142
           C342,140 340,124 348,112Z" fill="#c9d7e2" stroke="#33434d" stroke-width="2.3"
        stroke-linejoin="round"/>

  <!-- near wing (the "arm" on the bar) -->
  <use href="#wingShape" fill="url(#bodyG)" stroke="#33434d" stroke-width="2.6" stroke-linejoin="round"/>
  <g clip-path="url(#clipWing)">
    <path d="M394,174C414,188 436,200 450,208C436,214 416,206 400,193C390,185 386,177 394,174Z"
          fill="#3d4e5a"/>
    <path d="M368,152C392,158 414,172 430,190" fill="none" stroke="#b7c6d1" stroke-width="2.2"/>
    <path d="M360,140C386,146 410,162 426,180" fill="none" stroke="#cbd8e2" stroke-width="2.2"/>
  </g>
  <use href="#wingShape" fill="none" stroke="#33434d" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- feather "thumb" hooked over the grip -->
  <path d="M450,186C456,181 466,181 471,185C468,192 459,195 450,193Z"
        fill="#eef3f7" stroke="#33434d" stroke-width="2.1" stroke-linejoin="round"/>
</svg>