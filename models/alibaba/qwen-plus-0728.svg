<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#87CEEB"/>

  <!-- Sun -->
  <circle cx="400" cy="60" r="40" fill="#FFD700"/>

  <!-- Ground -->
  <rect y="220" width="500" height="80" fill="#90EE90"/>

  <!-- Bicycle -->
  <!-- Wheels -->
  <circle cx="150" cy="200" r="40" fill="white" stroke="black" stroke-width="3"/>
  <circle cx="320" cy="200" r="40" fill="white" stroke="black" stroke-width="3"/>
  <!-- Wheel spokes -->
  <line x1="150" y1="200" x2="150" y2="160" stroke="black" stroke-width="2"/>
  <line x1="150" y1="200" x2="190" y2="200" stroke="black" stroke-width="2"/>
  <line x1="150" y1="200" x2="150" y2="240" stroke="black" stroke-width="2"/>
  <line x1="150" y1="200" x2="110" y2="200" stroke="black" stroke-width="2"/>

  <line x1="320" y1="200" x2="320" y2="160" stroke="black" stroke-width="2"/>
  <line x1="320" y1="200" x2="360" y2="200" stroke="black" stroke-width="2"/>
  <line x1="320" y1="200" x2="320" y2="240" stroke="black" stroke-width="2"/>
  <line x1="320" y1="200" x2="280" y2="200" stroke="black" stroke-width="2"/>

  <!-- Frame -->
  <line x1="150" y1="200" x2="200" y2="130" stroke="blue" stroke-width="6"/>
  <line x1="200" y1="130" x2="280" y2="130" stroke="blue" stroke-width="6"/>
  <line x1="280" y1="130" x2="320" y2="200" stroke="blue" stroke-width="6"/>
  <line x1="200" y1="130" x2="180" y2="200" stroke="blue" stroke-width="6"/>
  <line x1="180" y1="200" x2="150" y2="200" stroke="blue" stroke-width="6"/>

  <!-- Handlebars -->
  <line x1="280" y1="130" x2="295" y2="100" stroke="blue" stroke-width="5"/>
  <line x1="295" y1="100" x2="310" y2="100" stroke="blue" stroke-width="5"/>

  <!-- Seat -->
  <line x1="230" y1="130" x2="230" y2="150" stroke="blue" stroke-width="4"/>
  <ellipse cx="230" cy="150" rx="15" ry="5" fill="black"/>

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="210" cy="160" rx="30" ry="25" fill="white" stroke="black" stroke-width="2"/>

  <!-- Head -->
  <circle cx="245" cy="145" r="18" fill="white" stroke="black" stroke-width="2"/>

  <!-- Beak -->
  <path d="M263,145 L285,145 L275,150 Z" fill="orange" stroke="black" stroke-width="1"/>

  <!-- Pelican's large beak pouch -->
  <path d="M263,145 Q274,155 275,150" fill="pink" stroke="black" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="250" cy="140" r="3" fill="black"/>

  <!-- Legs (on pedals) -->
  <line x1="210" y1="175" x2="190" y2="200" stroke="black" stroke-width="4"/>
  <line x1="210" y1="175" x2="230" y2="200" stroke="black" stroke-width="4"/>

  <!-- Arms holding handlebars -->
  <line x1="215" y1="165" x2="265" y2="120" stroke="black" stroke-width="3"/>
  <line x1="225" y1="165" x2="275" y2="125" stroke="black" stroke-width="3"/>

  <!-- Pedals -->
  <circle cx="180" cy="200" r="5" fill="gray"/>
  <circle cx="240" cy="200" r="5" fill="gray"/>

  <!-- Clouds -->
  <ellipse cx="100" cy="80" rx="50" ry="20" fill="white" opacity="0.8"/>
  <ellipse cx="120" cy="80" rx="40" ry="18" fill="white" opacity="0.8"/>
  <ellipse cx="80" cy="80" rx="40" ry="18" fill="white" opacity="0.8"/>

  <!-- Road lines -->
  <rect x="100" y="250" width="300" height="5" fill="white" opacity="0.6"/>
  <rect x="50" y="250" width="30" height="5" fill="white" opacity="0.6"/>
  <rect x="420" y="250" width="30" height="5" fill="white" opacity="0.6"/>
</svg>