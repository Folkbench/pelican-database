<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" style="background-color: #f0f8ff;">
  <defs>
    <style>
      .wheel { transform-origin: center; animation: spin 1s linear infinite; }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      
      </style>
  </defs>

  <rect x="0" y="380" width="400" height="20" fill="#8B4513"/>

  <g stroke="#333" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="200" y1="180" x2="100" y2="250"/>
    <line x1="200" y1="180" x2="300" y2="250"/>
    <circle cx="200" cy="180" r="6" fill="#333"/>
    <line x1="200" y1="180" x2="200" y2="150"/>
    <circle cx="200" cy="250" r="6" fill="#333"/>
  </g>

  <g class="wheel">
    <circle cx="100" cy="250" r="40" fill="#ddd" stroke="#333" stroke-width="3"/>
    <circle cx="300" cy="250" r="40" fill="#ddd" stroke="#333" stroke-width="3"/>
    
    <g stroke="#888" stroke-width="2">
      <line x1="100" y1="210" x2="100" y2="290"/>
      <line x1="60" y1="250" x2="140" y2="250"/>
      <line x1="85" y1="225" x2="115" y2="275"/>
      <line x1="115" y1="225" x2="85" y2="275"/>
      
      <line x1="300" y1="210" x2="300" y2="290"/>
      <line x1="260" y1="250" x2="340" y2="250"/>
      <line x1="285" y1="225" x2="315" y2="275"/>
      <line x1="315" y1="225" x2="285" y2="275"/>
    </g>
  </g>

  <g>
    <path d="M160 220 Q 140 180 180 180 T 210 200 L 210 250 Q 170 200 160 220" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    
    <ellipse cx="200" cy="230" rx="25" ry="20" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
  </g>

  <g transform="translate(200, -60)">
    <ellipse cx="0" cy="-20" rx="25" ry="30" fill="#FFE4C4"/>
    
    <path d="M-20 -20 Q 0 -40 20 -20 L 20 -10 Q 0 10 -20 0 Z" fill="#FFD700" stroke="#DAA520" stroke-width="2"/>
    <ellipse cx="0" cy="-15" rx="30" ry="8" fill="#DAA520"/> <circle cx="-10" cy="-25" r="5" fill="black"/>
    <circle cx="-10" cy="-28" r="2" fill="white"/>
    
    <line x1="-60" y1="-20" x2="0" y2="-30" stroke="#FF0000" stroke-width="20"/> <rect x="-30" y="-20" width="60" height="10" fill="#FF0000"/> <circle cx="-10" cy="-35" r="8" fill="white" stroke="black" stroke-width="2"/> </g>

  <g class="left-leg">
    <rect x="180" y="250" width="10" height="30" fill="#8B4513" transform="rotate(-15 185 250)"/>
    <circle cx="185" cy="265" r="12" fill="#CD853F" stroke="white"/>
  </g>
  <g class="right-leg">
    <rect x="220" y="250" width="10" height="30" fill="#8B4513" transform="rotate(15 235 250)"/>
    <circle cx="235" cy="265" r="12" fill="#CD853F" stroke="white"/>
  </g>

  <text x="200" y="350" font-family="Arial" font-size="14" fill="#333" text-anchor="middle">Spin the wheels!</text>
</svg>