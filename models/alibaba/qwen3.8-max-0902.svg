  <path d="M394 248 C398 288 398 328 394 358 C392 376 388 392 386 400"
        fill="none" stroke="#d9762a" stroke-width="13" stroke-linecap="round"/>
  <path d="M378 392 C370 396 365 402 364 410 C370 412 377 411 382 407 C383 414 388 419 395 420 C398 414 397 407 393 401 C399 404 406 404 411 401 C408 395 402 390 395 388 C389 386 383 388 378 392 Z"
