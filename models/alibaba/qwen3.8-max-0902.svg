    <path d="M820 448 Q845 443 870 448 T920 448"/>
    <path d="M150 470 Q175 465 200 470 T250 470"/>
    <path d="M540 462 Q565 457 590 462 T640 462"/>
    <path d="M700 486 Q730 481 760 486 T820 486"/>
    <path d="M320 500 Q350 495 380 500 T440 500"/>
    <path d="M60 512 Q90 507 120 512 T180 512"/>
