    <circle cx="235" cy="445" r="10" fill="#59626d" stroke="#3f4750" stroke-width="2"/>
    <circle cx="235" cy="445" r="3.5" fill="#cfd6dd"/>

    <circle cx="645" cy="445" r="93" fill="none" stroke="#2b2f36" stroke-width="13"/>
    <circle cx="645" cy="445" r="78" fill="none" stroke="#c9d2da" stroke-width="5"/>
    <path stroke="#b6bfc8" stroke-width="2.5" fill="none"
