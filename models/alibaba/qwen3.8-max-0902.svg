  <path d="M836 616 L830 599 M836 616 L842 599" stroke="#d99f82" stroke-width="1.2" fill="none"/>

  <!-- shadows -->
  <ellipse cx="440" cy="546" rx="290" ry="13" fill="#2f4858" opacity="0.14"/>
  <ellipse cx="235" cy="544" rx="72" ry="9" fill="#2f4858" opacity="0.2"/>
  <ellipse cx="645" cy="544" rx="72" ry="9" fill="#2f4858" opacity="0.2"/>

