    <circle cx="256" cy="588" r="2.5"/><circle cx="338" cy="606" r="3.5"/>
    <circle cx="420" cy="592" r="2.5"/><circle cx="506" cy="612" r="4"/>
    <circle cx="586" cy="590" r="3"/><circle cx="662" cy="608" r="3.5"/>
    <circle cx="742" cy="586" r="2.5"/><circle cx="806" cy="606" r="4"/>
    <circle cx="876" cy="588" r="3"/><circle cx="912" cy="618" r="2.5"/>
  </g>
