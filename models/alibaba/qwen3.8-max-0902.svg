<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d">
  <title id="t">Pelican riding a bicycle</title>
  <desc id="d">A cheerful white pelican with a big orange beak pedals a red bicycle along the shoreline, waves and a sailboat behind it.</desc>

  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfeaf7"/>
      <stop offset="1" stop-color="#fdf2df"/>
    </linearGradient>
    <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0e8"/>
      <stop offset="1" stop-color="#4d9ec9"/>
    </linearGradient>
    <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ddab"/>
      <stop offset="1" stop-color="#e6c48c"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffeab0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffeab0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9bc5c"/>
      <stop offset="1" stop-color="#ef8a2b"/>
    </linearGradient>
    <radialGradient id="bodyG" cx="0.45" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1ecdd"/>
    </radialGradient>

    <path id="bikeFrame" fill="none" stroke-linecap="round" stroke-linejoin="round"
          d="M235 445 L430 435 L378 272 M383 291 L235 445 M430 435 L610 300 M385 299 L601 274 M596 256 L619 313 M619 313 Q640 382 645 445"/>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="960" height="470" fill="url(#skyG)"/>

  <!-- sun -->
  <circle cx="838" cy="92" r="70" fill="url(#sunG)"/>
  <circle cx="838" cy="92" r="34" fill="#ffe9a0"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="150" cy="105" rx="46" ry="20"/>
    <ellipse cx="186" cy="94" rx="30" ry="16"/>
    <ellipse cx="118" cy="97" rx="26" ry="14"/>
    <ellipse cx="560" cy="66" rx="40" ry="17"/>
    <ellipse cx="592" cy="57" rx="24" ry="13"/>
    <ellipse cx="360" cy="138" rx="28" ry="12"/>
