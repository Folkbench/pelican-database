  <ellipse cx="566" cy="140" rx="26" ry="11" fill="#fbc76b" opacity="0.6"/>

  <!-- upper bill -->
  <path d="M496 92 C546 96 604 106 654 120 C660 122 660 127 653 126 C602 118 546 110 496 108 Z"
        fill="#f2932e" stroke="#d3731f" stroke-width="2" stroke-linejoin="round"/>
  <path d="M512 99 L556 105" stroke="#d3731f" stroke-width="2" stroke-linecap="round"/>

  <!-- eye -->
  <circle cx="486" cy="97" r="4.5" fill="#22252a"/>
  <circle cx="487.5" cy="95.5" r="1.5" fill="#ffffff"/>

  <!-- wing reaching the handlebar -->
  <path d="M376 178 C420 168 468 178 508 198 C528 208 544 216 552 222 C556 226 552 232 546 230 C530 226 508 220 484 212 C448 200 412 198 384 204 C372 198 370 188 376 178 Z"
        fill="#aeb9c2" stroke="#8fa0ab" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M500 206 L536 222 M488 212 L520 226" stroke="#8fa0ab" stroke-width="2" stroke-linecap="round"/>

  <!-- near leg and webbed foot on the pedal -->
  <path d="M404 246 C418 282 430 316 436 344 C442 384 456 424 470 452"
        fill="none" stroke="#d3731f" stroke-width="19" stroke-linecap="round"/>
  <path d="M404 246 C418 282 430 316 436 344 C442 384 456 424 470 452"
        fill="none" stroke="#ef8a2b" stroke-width="15" stroke-linecap="round"/>
  <path d="M478 450 C470 452 464 456 460 462 C456 468 456 474 458 478 C464 478 470 476 474 472 C476 478 480 484 486 486 C490 482 490 476 488 470 C494 474 502 476 508 474 C506 466 500 458 492 454 C488 450 482 448 478 450 Z"
        fill="#ef8a2b" stroke="#d3731f" stroke-width="2" stroke-linejoin="round"/>
</svg>