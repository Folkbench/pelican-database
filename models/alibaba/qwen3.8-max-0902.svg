    <path d="M188 158 q9 -9 18 0 q9 -9 18 0"/>
    <path d="M262 128 q7 -7 14 0 q7 -7 14 0"/>
  </g>

  <!-- sea -->
  <rect x="0" y="430" width="960" height="110" fill="url(#seaG)"/>

  <!-- sailboat on the horizon -->
  <g>
    <path d="M740 396 L740 422 L723 422 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M744 402 L744 422 L757 422 Z" fill="#f4e9d8"/>
    <path d="M724 424 L756 424 L750 431 Q740 435 730 431 Z" fill="#4a5a66"/>
  </g>

