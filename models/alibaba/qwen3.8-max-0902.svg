  <path d="M430 435 L386 406" stroke="#2b2f36" stroke-width="9" stroke-linecap="round"/>
  <rect x="369" y="399" width="32" height="8" rx="3" fill="#23272c" stroke="#14171a" stroke-width="1.5"/>

  <!-- far leg and webbed foot -->
  <path d="M394 248 C398 288 398 328 394 358 C392 376 388 392 386 400"
