  <!-- frame -->
  <use href="#bikeFrame" xlink:href="#bikeFrame" stroke="#9c312b" stroke-width="15"/>
  <use href="#bikeFrame" xlink:href="#bikeFrame" stroke="#e2534d" stroke-width="9"/>

  <!-- seatpost and saddle -->
  <path d="M378 272 L371 250" stroke="#9c312b" stroke-width="10" stroke-linecap="round"/>
  <path d="M378 272 L371 250" stroke="#cfd6dd" stroke-width="5" stroke-linecap="round"/>
  <path d="M336 252 C348 240 366 236 384 238 C402 240 412 246 414 252 C402 260 386 262 370 262 C356 262 344 258 336 252 Z"
        fill="#7c4a2a" stroke="#5d3620" stroke-width="2"/>
  <path d="M348 246 C362 240 384 240 402 248" stroke="#a06a42" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- handlebar, grip, bell -->
  <path d="M596 256 C592 240 585 229 572 223 C561 218 550 218 542 223" fill="none" stroke="#3f4750" stroke-width="11" stroke-linecap="round"/>
  <path d="M596 256 C592 240 585 229 572 223 C561 218 550 218 542 223" fill="none" stroke="#cfd6dd" stroke-width="6" stroke-linecap="round"/>
  <path d="M556 219 L538 226" stroke="#23272c" stroke-width="12" stroke-linecap="round"/>
  <circle cx="572" cy="219" r="5.5" fill="#f2c14e" stroke="#b8862f" stroke-width="2"/>

  <!-- chainring and near crank -->
  <circle cx="430" cy="435" r="25" fill="none" stroke="#3f4750" stroke-width="6"/>
  <circle cx="430" cy="435" r="16" fill="none" stroke="#3f4750" stroke-width="2" opacity="0.6"/>
  <path d="M430 435 L474 464" stroke="#2b2f36" stroke-width="9" stroke-linecap="round"/>
  <circle cx="430" cy="435" r="7" fill="#2b2f36"/>
  <rect x="461" y="462" width="34" height="9" rx="3" fill="#23272c" stroke="#14171a" stroke-width="1.5"/>

  <!-- ============ PELICAN ============ -->
  <!-- tail feathers -->
  <path d="M296 196 C268 196 244 208 230 228 C248 224 262 226 272 232 C258 242 250 254 248 268 C264 258 280 252 292 250 C288 236 290 216 296 196 Z"
        fill="#e8e4d8" stroke="#cfc7b2" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="352" cy="198" rx="90" ry="62" transform="rotate(-8 352 198)"
           fill="url(#bodyG)" stroke="#d8d0bc" stroke-width="3"/>

  <!-- folded wing on the body -->
  <path d="M300 176 C330 164 366 166 392 184 C380 208 348 224 312 220 C296 208 292 190 300 176 Z"
        fill="#c9d2d8" stroke="#a9b6bf" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M318 214 C336 212 356 204 372 190 M306 200 C322 200 344 196 362 184"
        stroke="#a9b6bf" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- neck and head -->
  <path d="M400 176 C420 166 432 150 438 128 C442 112 448 100 460 92 C470 85 484 83 494 88 C504 93 508 102 505 111 C502 120 494 125 484 126 C478 138 468 156 452 170 C436 184 416 186 400 176 Z"
        fill="url(#bodyG)" stroke="#d8d0bc" stroke-width="3" stroke-linejoin="round"/>
  <!-- crest tuft -->
  <path d="M470 84 C462 72 450 64 438 62 C452 70 462 80 468 88 Z"
        fill="#fbfaf2" stroke="#d9d2c0" stroke-width="2" stroke-linejoin="round"/>

  <!-- throat pouch -->
  <path d="M498 108 C506 136 528 156 560 160 C596 164 632 148 652 126 C640 128 600 122 560 118 C536 116 514 112 498 108 Z"
