<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- ground -->
    <line x1="10" y1="285" x2="390" y2="285" stroke="#222" stroke-width="4"/>

    <!-- bicycle wheels -->
    <g fill="none" stroke="#222" stroke-width="5">
      <circle cx="70" cy="210" r="55"/>
      <circle cx="330" cy="210" r="55"/>
      <circle cx="70" cy="210" r="7" fill="#222"/>
      <circle cx="330" cy="210" r="7" fill="#222"/>

      <g stroke-width="2">
        <!-- left spokes -->
        <line x1="70" y1="210" x2="125" y2="210"/>
        <line x1="70" y1="210" x2="109" y2="171"/>
        <line x1="70" y1="210" x2="70" y2="155"/>
        <line x1="70" y1="210" x2="31" y2="171"/>
        <line x1="70" y1="210" x2="15" y2="210"/>
        <line x1="70" y1="210" x2="31" y2="249"/>
        <line x1="70" y1="210" x2="70" y2="265"/>
        <line x1="70" y1="210" x2="109" y2="249"/>

        <!-- right spokes -->
        <line x1="330" y1="210" x2="385" y2="210"/>
        <line x1="330" y1="210" x2="369" y2="171"/>
        <line x1="330" y1="210" x2="330" y2="155"/>
        <line x1="330" y1="210" x2="291" y2="171"/>
        <line x1="330" y1="210" x2="275" y2="210"/>
        <line x1="330" y1="210" x2="291" y2="249"/>
        <line x1="330" y1="210" x2="330" y2="265"/>
        <line x1="330" y1="210" x2="369" y2="249"/>
      </g>
    </g>

    <!-- bicycle frame -->
    <g fill="none" stroke="#222" stroke-width="6">
      <line x1="70" y1="210" x2="200" y2="210"/>
      <line x1="70" y1="210" x2="175" y2="150"/>
      <line x1="175" y1="150" x2="200" y2="210"/>
      <line x1="175" y1="150" x2="275" y2="150"/>
      <line x1="200" y1="210" x2="275" y2="150"/>
      <line x1="275" y1="150" x2="330" y2="210"/>

      <!-- handlebar -->
      <line x1="275" y1="150" x2="255" y2="130"/>
      <path d="M255 130 L235 130"/>

      <!-- crank and pedal -->
      <circle cx="200" cy="210" r="18" stroke-width="4"/>
      <line x1="200" y1="210" x2="235" y2="185" stroke-width="4"/>
      <line x1="225" y1="185" x2="245" y2="185" stroke-width="4"/>
    </g>

    <!-- pelican -->
    <g>
      <!-- tail -->
      <path d="M110 105 L85 90 L105 115 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>

      <!-- body -->
      <ellipse cx="165" cy="105" rx="55" ry="42" fill="#ffffff" stroke="#222" stroke-width="3"/>

      <!-- neck -->
      <path d="M205 105 C215 85,225,80,225,85" fill="none" stroke="#222" stroke-width="22"/>
      <path d="M205 105 C215 85,225,80,225,85" fill="none" stroke="#ffffff" stroke-width="16"/>

      <!-- head -->
      <circle cx="225" cy="85" r="20" fill="#ffffff" stroke="#222" stroke-width="3"/>

      <!-- beak -->
      <path d="M218 80 L300 95 L295 103 L225 97 Z" fill="#ffcc5c" stroke="#222" stroke-width="3"/>
      <path d="M225 97 C245 130,285,125,295,103 L225 97 Z" fill="#f5b041" stroke="#222" stroke-width="3"/>

      <!-- eye -->
      <circle cx="228" cy="80" r="3" fill="#222"/>

      <!-- wing reaching handlebar -->
      <path d="M175 95 C195 95,225,115,235,130 L230,138 C215,130,190,120,170,110 Z" fill="#ffffff" stroke="#222" stroke-width="3"/>

      <!-- leg -->
      <path d="M160 135 L185 165 L225 185" fill="none" stroke="#222" stroke-width="4"/>

      <!-- foot on pedal -->
      <path d="M220 180 L240 180 L235 190 L225 190 Z" fill="#f5b041" stroke="#222" stroke-width="3"/>
    </g>
  </g>
</svg>