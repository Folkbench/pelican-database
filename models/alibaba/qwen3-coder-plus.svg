<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle -->
  <circle cx="100" cy="200" r="40" stroke="black" stroke-width="3" fill="none"/>
  <circle cx="300" cy="200" r="40" stroke="black" stroke-width="3" fill="none"/>
  <line x1="100" y1="200" x2="200" y2="150" stroke="black" stroke-width="5"/>
  <line x1="300" y1="200" x2="200" y2="150" stroke="black" stroke-width="5"/>
  <line x1="200" y1="150" x2="200" y2="100" stroke="black" stroke-width="5"/>
  <line x1="200" y1="100" x2="170" y2="100" stroke="black" stroke-width="3"/>
  <line x1="200" y1="100" x2="230" y2="100" stroke="black" stroke-width="3"/>
  <circle cx="200" cy="100" r="5" fill="black"/>

  <!-- Pelican body -->
  <ellipse cx="200" cy="90" rx="30" ry="20" fill="#f0e68c"/>
  <!-- Pelican head -->
  <circle cx="235" cy="80" r="15" fill="#f0e68c"/>
  <!-- Pelican beak -->
  <path d="M245,80 Q280,70 290,80 Q280,90 245,85 Z" fill="#ffa500"/>
  <!-- Pelican pouch -->
  <path d="M260,85 Q270,100 250,110 Q240,100 260,85 Z" fill="#ff6347"/>
  <!-- Pelican eye -->
  <circle cx="240" cy="75" r="3" fill="black"/>
  <!-- Pelican wing -->
  <path d="M190,80 Q170,60 160,90 Q170,100 190,90 Z" fill="#d2b48c"/>
  <!-- Pelican legs on pedals -->
  <line x1="200" y1="110" x2="180" y2="170" stroke="#ffa500" stroke-width="3"/>
  <line x1="200" y1="110" x2="220" y2="170" stroke="#ffa500" stroke-width="3"/>
  <!-- Feet -->
  <line x1="180" y1="170" x2="170" y2="175" stroke="#ffa500" stroke-width="2"/>
  <line x1="180" y1="170" x2="180" y2="175" stroke="#ffa500" stroke-width="2"/>
  <line x1="180" y1="170" x2="190" y2="175" stroke="#ffa500" stroke-width="2"/>
  <line x1="220" y1="170" x2="210" y2="175" stroke="#ffa500" stroke-width="2"/>
  <line x1="220" y1="170" x2="220" y2="175" stroke="#ffa500" stroke-width="2"/>
  <line x1="220" y1="170" x2="230" y2="175" stroke="#ffa500" stroke-width="2"/>
</svg>