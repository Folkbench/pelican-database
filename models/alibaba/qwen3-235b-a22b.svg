<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" style="background:#f0f8ff">
  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="180" cy="120" rx="40" ry="25" fill="#fff" stroke="#000" stroke-width="1"/>
    
    <!-- Head -->
    <circle cx="220" cy="95" r="18" fill="#fff" stroke="#000" stroke-width="1"/>
    
    <!-- Beak -->
    <path d="M220 95 Q250 110 240 130" fill="none" stroke="#ffcc00" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Eye -->
    <circle cx="228" cy="90" r="3" fill="#000"/>
    
    <!-- Wing -->
    <path d="M150 125 Q130 110 120 140" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Tail -->
    <path d="M140 135 Q130 140 135 150" fill="none" stroke="#000" stroke-width="2"/>
    
    <!-- Legs -->
    <line x1="170" y1="140" x2="170" y2="190" stroke="#ffcc00" stroke-width="3"/>
    <line x1="190" y1="140" x2="190" y2="190" stroke="#ffcc00" stroke-width="3"/>
    
    <!-- Feet -->
    <circle cx="170" cy="195" r="5" fill="#ffcc00"/>
    <circle cx="190" cy="195" r="5" fill="#ffcc00"/>
  </g>

  <!-- Bicycle -->
  <g id="bike">
    <!-- Frame -->
    <polygon points="100,200 150,140 250,200 150,200" fill="none" stroke="#333" stroke-width="4"/>
    
    <!-- Wheels -->
    <circle cx="100" cy="200" r="30" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="250" cy="200" r="30" fill="none" stroke="#333" stroke-width="3"/>
    
    <!-- Spokes -->
    <line x1="100" y1="200" x2="130" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="100" y1="200" x2="100" y2="170" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="200" x2="280" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="250" y1="200" x2="250" y2="170" stroke="#333" stroke-width="2"/>
    
    <!-- Handlebars -->
    <path d="M100 200 Q80 160 100 140" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="100" cy="140" r="5" fill="#333"/>
    
    <!-- Seat -->
    <ellipse cx="180" cy="145" rx="10" ry="4" fill="#333"/>
    
    <!-- Pedals -->
    <line x1="150" y1="200" x2="130" y2="220" stroke="#ffcc00" stroke-width="3"/>
    <line x1="150" y1="200" x2="170" y2="220" stroke="#ffcc00" stroke-width="3"/>
  </g>
</svg>