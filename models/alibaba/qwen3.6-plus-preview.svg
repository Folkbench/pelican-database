<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for flat style depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="4" flood-color="#000000" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <!-- Soft Blue Sky -->
  <rect width="800" height="600" fill="#AEE2FF" />

  <!-- Sun -->
  <circle cx="680" cy="120" r="45" fill="#FFD166" opacity="0.9" />

  <!-- Simple White Clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <!-- Cloud 1 -->
    <g transform="translate(120, 100)">
      <rect x="0" y="20" width="120" height="40" rx="20" />
      <circle cx="35" cy="20" r="25" />
      <circle cx="75" cy="10" r="35" />
    </g>
    <!-- Cloud 2 -->
    <g transform="translate(550, 150) scale(0.8)">
      <rect x="0" y="20" width="120" height="40" rx="20" />
      <circle cx="35" cy="20" r="25" />
      <circle cx="75" cy="10" r="35" />
    </g>
    <!-- Cloud 3 -->
    <g transform="translate(300, 60) scale(0.6)">
      <rect x="0" y="20" width="120" height="40" rx="20" />
      <circle cx="35" cy="20" r="25" />
      <circle cx="75" cy="10" r="35" />
    </g>
    <!-- Cloud 4 -->
    <g transform="translate(50, 250) scale(0.7)">
      <rect x="0" y="20" width="120" height="40" rx="20" />
      <circle cx="35" cy="20" r="25" />
      <circle cx="75" cy="10" r="35" />
    </g>
  </g>

  <!-- ================= ENVIRONMENT & MOTION ================= -->
  <!-- Ground / Road -->
  <rect x="0" y="530" width="800" height="70" fill="#E9ECEF" />
  <rect x="0" y="530" width="800" height="8" fill="#DEE2E6" />
  
  <!-- Stylized Bushes -->
  <g fill="#06D6A0">
    <circle cx="80" cy="520" r="30" />
    <circle cx="130" cy="530" r="25" />
    <circle cx="40" cy="535" r="20" />
    <circle cx="720" cy="515" r="35" />
    <circle cx="660" cy="525" r="25" />
    <circle cx="770" cy="530" r="20" />
  </g>

  <!-- Motion Lines -->
  <g stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.6">
    <line x1="650" y1="200" x2="750" y2="200" />
    <line x1="680" y1="250" x2="780" y2="250" />
    <line x1="620" y1="350" x2="700" y2="350" />
    <line x1="100" y1="400" x2="180" y2="400" />
    <line x1="50" y1="450" x2="120" y2="450" />
  </g>

  <!-- ================= BICYCLE & PELICAN ================= -->
  
  <!-- Back Wing (Behind Body & Handlebars) -->
  <g transform="translate(330, 190) rotate(-15)">
    <path d="M 0 0 C 30 -30, 80 -20, 100 10 C 80 30, 30 40, 0 20 Z" fill="#DEE2E6" />
    <path d="M 10 5 C 30 -10, 60 -5, 75 10 C 60 20, 30 25, 10 15 Z" fill="#E9ECEF" />
  </g>

  <!-- Back Leg -->
  <g>
    <!-- Upper Leg -->
    <line x1="380" y1="270" x2="420" y2="360" stroke="#FB8500" stroke-width="14" stroke-linecap="round" />
    <!-- Lower Leg -->
    <line x1="420" y1="360" x2="420" y2="450" stroke="#FB8500" stroke-width="12" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <g transform="translate(420, 450) rotate(-10)">
      <path d="M -10 -5 L 25 -5 C 30 -5, 30 5, 25 5 L -10 5 C -15 5, -20 0, -20 0 C -15 0, -10 -5, -10 -5 Z" fill="#FB8500" />
    </g>
  </g>

  <!-- Back Wheel -->
  <g>
    <!-- Tire -->
    <circle cx="250" cy="450" r="80" fill="#2B2D42" />
    <!-- Rim -->
    <circle cx="250" cy="450" r="68" fill="#E9ECEF" />
    <!-- Spokes -->
    <g stroke="#ADB5BD" stroke-width="4">
      <line x1="250" y1="382" x2="250" y2="518" />
      <line x1="182" y1="450" x2="318" y2="450" />
      <line x1="202" y1="402" x2="298" y2="498" />
      <line x1="202" y1="498" x2="298" y2="402" />
    </g>
    <!-- Hub -->
    <circle cx="250" cy="450" r="12" fill="#6C757D" />
  </g>

  <!-- Bicycle Frame (Red) -->
  <g stroke="#E63946" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rear Triangle -->
    <line x1="250" y1="450" x2="400" y2="450" /> <!-- Chainstay -->
    <line x1="250" y1="450" x2="340" y2="280" /> <!-- Seatstay -->
    <line x1="400" y1="450" x2="340" y2="280" /> <!-- Seat Tube -->
    <!-- Front Triangle -->
    <line x1="400" y1="450" x2="520" y2="280" /> <!-- Down Tube -->
    <line x1="340" y1="280" x2="520" y2="280" /> <!-- Top Tube -->
    <!-- Head Tube -->
    <line x1="520" y1="280" x2="500" y2="220" />
  </g>

  <!-- Bottom Bracket & Cranks -->
  <circle cx="400" cy="450" r="24" fill="#6C757D" />
  <circle cx="400" cy="450" r="16" fill="#E9ECEF" />
  
  <!-- Back Crank & Pedal -->
  <line x1="400" y1="450" x2="420" y2="450" stroke="#6C757D" stroke-width="10" stroke-linecap="round" />
  <rect x="410" y="442" width="24" height="16" rx="4" fill="#343A40" />

  <!-- Front Crank & Pedal (Pelican's active leg) -->
  <line x1="400" y1="450" x2="380" y2="450" stroke="#6C757D" stroke-width="10" stroke-linecap="round" />
  <rect x="366" y="442" width="24" height="16" rx="4" fill="#343A40" />

  <!-- Seat Post & Saddle -->
  <line x1="340" y1="280" x2="320" y2="240" stroke="#6C757D" stroke-width="10" stroke-linecap="round" />
  <path d="M 280 240 C 280 220, 360 220, 360 240 C 360 250, 280 250, 280 240 Z" fill="#343A40" />

  <!-- Handlebars -->
  <g stroke="#6C757D" stroke-width="10" stroke-linecap="round" fill="none">
    <!-- Stem -->
    <line x1="500" y1="220" x2="510" y2="190" />
    <!-- Curved Bars -->
    <path d="M 480 190 Q 510 160 540 190" />
  </g>
  <!-- Handlebar Grips -->
  <line x1="470" y1="195" x2="490" y2="185" stroke="#343A40" stroke-width="14" stroke-linecap="round" />
  <line x1="530" y1="185" x2="550" y2="195" stroke="#343A40" stroke-width="14" stroke-linecap="round" />

  <!-- Pelican Body (White Feathers) -->
  <g filter="url(#soft-shadow)">
    <!-- Main Body Shape -->
    <path d="M 240 280 C 240 180, 320 180, 380 180 C 430 180, 450 220, 430 270 C 410 310, 340 320, 280 300 C 250 290, 240 280, 240 280 Z" fill="#F8F9FA" />
    <!-- Belly Highlight -->
    <path d="M 280 300 C 340 320, 410 310, 430 270 C 420 290, 380 300, 340 290 C 300 280, 280 290, 280 300 Z" fill="#FFFFFF" opacity="0.6" />
    <!-- Tail Feathers -->
    <path d="M 240 280 L 210 270 L 220 290 L 190 295 L 220 305 L 240 290 Z" fill="#F8F9FA" />
  </g>

  <!-- Loose Feathers (Stylized) -->
  <g fill="#FFFFFF" opacity="0.7">
    <circle cx="220" cy="250" r="3" />
    <circle cx="205" cy="265" r="2.5" />
    <circle cx="230" cy="230" r="2" />
  </g>

  <!-- Pelican Head & Neck -->
  <g filter="url(#soft-shadow)">
    <!-- Neck -->
    <path d="M 360 200 C 380 150, 400 140, 430 160 L 410 210 Z" fill="#F8F9FA" />
    <!-- Head -->
    <circle cx="410" cy="160" r="35" fill="#F8F9FA" />
  </g>

  <!-- Large Orange Beak -->
  <g filter="url(#soft-shadow)">
    <!-- Upper Beak -->
    <path d="M 440 150 Q 520 140 590 160 L 440 175 Z" fill="#FFB703" />
    <!-- Lower Beak / Pouch -->
    <path d="M 440 175 Q 530 180 585 162 Q 520 250 440 195 Z" fill="#FB8500" />
    <!-- Nostril -->
    <ellipse cx="470" cy="155" rx="4" ry="2" fill="#E85D04" opacity="0.6" />
    <!-- Beak Tip Hook -->
    <path d="M 585 160 Q 595 165 590 170 Q 580 165 585 160 Z" fill="#E85D04" />
  </g>

  <!-- Eye -->
  <g>
    <circle cx="420" cy="150" r="8" fill="#2B2D42" />
    <circle cx="422" cy="148" r="3" fill="#FFFFFF" />
  </g>

  <!-- Front Leg (Overlapping the frame) -->
  <g>
    <!-- Upper Leg -->
    <line x1="360" y1="280" x2="340" y2="370" stroke="#FB8500" stroke-width="14" stroke-linecap="round" />
    <!-- Lower Leg -->
    <line x1="340" y1="370" x2="380" y2="450" stroke="#FB8500" stroke-width="12" stroke-linecap="round" />
    <!-- Webbed Foot -->
    <g transform="translate(380, 450) rotate(15)">
      <path d="M -10 -5 L 25 -5 C 30 -5, 30 5, 25 5 L -10 5 C -15 5, -20 0, -20 0 C -15 0, -10 -5, -10 -5 Z" fill="#FB8500" />
    </g>
  </g>

  <!-- Front Wheel (Overlaps the front leg and frame) -->
  <g>
    <!-- Tire -->
    <circle cx="550" cy="450" r="80" fill="#2B2D42" />
    <!-- Rim -->
    <circle cx="550" cy="450" r="68" fill="#E9ECEF" />
    <!-- Spokes -->
    <g stroke="#ADB5BD" stroke-width="4">
      <line x1="550" y1="382" x2="550" y2="518" />
      <line x1="482" y1="450" x2="618" y2="450" />
      <line x1="502" y1="402" x2="598" y2="498" />
      <line x1="502" y1="498" x2="598" y2="402" />
    </g>
    <!-- Hub -->
    <circle cx="550" cy="450" r="12" fill="#6C757D" />
  </g>

  <!-- Front Wing (Overlaps handlebars and frame) -->
  <g transform="translate(360, 210) rotate(10)" filter="url(#soft-shadow)">
    <path d="M 0 0 C 30 -30, 90 -20, 110 10 C 90 30, 30 40, 0 20 Z" fill="#FFFFFF" />
    <path d="M 10 5 C 30 -10, 70 -5, 85 10 C 70 20, 30 25, 10 15 Z" fill="#F8F9FA" />
    <!-- Wing Feathers Detail -->
    <path d="M 85 10 C 95 5, 105 10, 110 10 C 105 15, 95 15, 85 10 Z" fill="#E9ECEF" />
  </g>

  <!-- Extra Motion Lines (Foreground) -->
  <g stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4">
    <line x1="50" y1="300" x2="150" y2="300" />
    <line x1="600" y1="100" x2="720" y2="100" />
  </g>

</svg>