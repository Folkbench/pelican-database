      </g>
      <circle r="10" fill="#5B6470"/>
      <circle r="4" fill="#2E3440"/>
    </g>
    <clipPath id="bodyClip">
      <ellipse cx="325" cy="232" rx="82" ry="58" transform="rotate(-8 325 232)"/>
    </clipPath>
  </defs>

