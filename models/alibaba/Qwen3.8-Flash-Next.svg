<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="A pelican riding a bicycle beside a lake at dawn">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161e33"/>
      <stop offset="0.5" stop-color="#3a4568"/>
      <stop offset="0.8" stop-color="#c8a0a3"/>
      <stop offset="1" stop-color="#e8b08a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a982"/>
      <stop offset="0.15" stop-color="#9a8ca0"/>
      <stop offset="1" stop-color="#283550"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7b3"/>
      <stop offset="0.35" stop-color="#ffce8a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffce8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff4dc"/>
      <stop offset="1" stop-color="#ffdca0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdca6"/>
      <stop offset="0.3" stop-color="#b2a29c"/>
      <stop offset="0.7" stop-color="#3d5075"/>
      <stop offset="1" stop-color="#2a3a55"/>
    </linearGradient>
    <radialGradient id="bodyG" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="0.75" stop-color="#cdd4e8"/>
      <stop offset="1" stop-color="#98a2bd"/>
    </radialGradient>
    <linearGradient id="saddle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4630"/>
      <stop offset="1" stop-color="#43291a"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#ffb268"/>
      <stop offset="1" stop-color="#f4831f"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d63"/>
      <stop offset="1" stop-color="#d15a28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#0a0f1c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- distant birds -->
  <g fill="none" stroke="#c3c9d6" stroke-width="2.4" stroke-linecap="round" opacity="0.7">
    <path d="M110 118 q8 -9 16 0 q8 -9 16 0"/>
    <path d="M170 88 q6 -7 12 0 q6 -7 12 0"/>
    <path d="M630 92 q7 -8 14 0 q7 -8 14 0"/>
    <path d="M680 122 q5 -6 10 0 q5 -6 10 0"/>
    <path d="M560 60 q9 -10 18 0 q9 -10 18 0"/>
  </g>

  <!-- sun -->
  <circle cx="475" cy="168" r="200" fill="url(#sunGlow)"/>
  <circle cx="475" cy="168" r="58" fill="url(#sunBody)"/>

  <!-- water -->
  <rect x="0" y="330" width="800" height="170" fill="url(#water)"/>

  <!-- lake -->
  <path d="M560 395 q100 -50 180 -20 q-35 -40 -95 -42 q-45 -2 -5 22 q120 -20 140 34 q40 -5 55 20 q-260 -10 -260 -10 z" fill="url(#lake)"/>
  <g stroke="#aeb4c2" stroke-width="1.4" fill="none" opacity="0.55">
    <path d="M570 386 q30 -22 58 -30"/>
    <path d="M690 366 q28 20 55 48"/>
  </g>

  <!-- reeds -->
  <g stroke="#26352b" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M40 430 q-8 -40 -2 -78"/>
    <path d="M60 435 q4 -30 0 -60"/>
    <path d="M78 430 q10 -50 6 -95"/>
    <path d="M98 440 q2 -34 -4 -64"/>
    <path d="M118 435 q-6 -42 2 -86"/>
    <path d="M742 435 q-8 -40 -2 -80"/>
    <path d="M762 440 q4 -34 0 -70"/>
    <path d="M782 435 q8 -50 4 -95"/>
  </g>
  <ellipse cx="38" cy="349" rx="5" ry="13" fill="#8a7a4e"/>
  <ellipse cx="83" cy="331" rx="5" ry="14" fill="#7a6c40"/>
  <ellipse cx="119" cy="345" rx="5" ry="13" fill="#8a7a4e"/>

  <!-- sun reflection -->
  <g fill="#ffdca0">
    <ellipse cx="475" cy="338" rx="30" ry="4"/>
    <ellipse cx="475" cy="349" rx="23" ry="3.4"/>
    <ellipse cx="475" cy="361" rx="34" ry="4"/>
    <ellipse cx="475" cy="375" rx="16" ry="3"/>
    <ellipse cx="475" cy="390" rx="27" ry="4.4"/>
    <ellipse cx="475" cy="408" rx="13" ry="2.6"/>
    <ellipse cx="475" cy="428" rx="21" ry="3.4"/>
  </g>

  <!-- ground + shadow -->
  <path d="M0 400 q400 12 800 0 v100 h-800 z" fill="#243429" opacity="0.85"/>
  <ellipse cx="400" cy="436" rx="205" ry="24" fill="#0a0f1c" opacity="0.35"/>

  <!-- ===== PEACOCK-free PELICAN ===== -->
  <g filter="url(#shadow)">
    <path d="M378 286 Q325 300 300 340 Q285 358 300 352 Q330 335 358 322 Q380 330 398 320 Q380 300 378 286 Z" fill="url(#bodyG)" stroke="#63708f" stroke-width="2"/>
    <path d="M296 356 L272 348 L282 338 L266 346 L280 356 L270 352 L290 360 Q310 366 316 356 Z" fill="#9aa4bd" stroke="#5a6580" stroke-width="1"/>

    <path d="M300 250 q40 -30 92 -6 q42 24 30 68 q-40 20 -92 8 q-46 -10 -30 -70 z" fill="url(#bodyG)"/>
    <path d="M296 270 q10 40 46 54 q-30 4 -50 -20 q-10 -22 4 -34 z" fill="#98a2bd"/>

    <path d="M318 330 L326 388 L356 426" fill="none" stroke="#e98a45" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M356 426 l16 5" stroke="#e98a45" stroke-width="8" stroke-linecap="round"/>
    <path d="M262 318 q30 14 62 12" fill="none" stroke="#f0a548" stroke-width="6" stroke-linecap="round"/>
    <path d="M400 312 q50 10 90 -6" fill="none" stroke="#e8a850" stroke-width="9" stroke-linecap="round"/>

    <path d="M466 340 l0 46" stroke="#f0a548" stroke-width="10" stroke-linecap="round"/>

    <path d="M392 205 q18 10 20 26 q1 20 -18 36" fill="none" stroke="#7d8aa6" stroke-width="2" opacity="0.4"/>
    <ellipse cx="370" cy="256" rx="46" ry="30" fill="#aeb5c9" opacity="0.55" transform="rotate(-14 370 256)"/>
    <path d="M330 250 q22 20 44 34 q-30 8 -58 -4 q8 -22 14 -30 z" fill="#c6ccdd" opacity="0.9" stroke="#7d8aa6" stroke-width="1"/>
    <path d="M400 176 L372 196 L404 190 Z" fill="url(#bodyG)" stroke="#7d8aa6" stroke-width="1.5"/>
    <ellipse cx="432" cy="208" rx="14" ry="10" fill="#dfe4f0" opacity="0.9" transform="rotate(15 432 208)"/>
    <ellipse cx="366" cy="182" rx="34" ry="26" fill="url(#bodyG)"/>

    <path d="M398 164 Q418 150 452 158 L580 168 Q642 168 678 180 L606 178 Q650 178 684 202 Q598 206 454 188 Q406 182 398 164 Z" fill="url(#beak)" stroke="#a5470f" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M454 188 Q590 202 684 202 Q594 206 598 190 Z" fill="url(#beak)" stroke="#a5470f" stroke-width="2.5"/>

    <path d="M334 244 Q410 232 472 252" fill="none" stroke="#c2571f" stroke-width="7" stroke-linecap="round"/>

    <path d="M405 160 Q390 140 372 152" fill="none" stroke="#394356" stroke-width="3" stroke-linecap="round"/>
    <path d="M384 176 L358 154 L372 150 L360 160 Z" fill="url(#bodyG)" stroke="#5a6580" stroke-width="1.5"/>

    <circle cx="452" cy="190" r="14" fill="#a3b86b"/>
    <path d="M470 200 Q486 198 494 206 Q482 200 468 206 Z" fill="#a3b86b"/>
    <circle cx="452" cy="190" r="7" fill="#695015"/>
    <circle cx="449" cy="188" r="2.5" fill="#ffe9a8"/>

    <g stroke="#7d8aa6" stroke-width="1.2" fill="none" opacity="0.4">
      <path d="M340 250 q24 16 46 26"/>
      <path d="M350 236 q24 10 44 20"/>
      <path d="M400 176 q30 20 60 22"/>
      <path d="M404 190 q30 12 58 14"/>
    </g>
  </g>

  <!-- ===== BICYCLE ===== -->
  <g stroke-linecap="round">
    <circle cx="310" cy="370" r="56" fill="#12151d" opacity="0.6"/>
    <circle cx="510" cy="370" r="56" fill="#12151d" opacity="0.6"/>

    <circle cx="310" cy="370" r="52" fill="none" stroke="#2b3040" stroke-width="9"/>
    <circle cx="510" cy="370" r="52" fill="none" stroke="#2b3040" stroke-width="9"/>
    <circle cx="310" cy="370" r="40" fill="none" stroke="#565f74" stroke-width="5" opacity="0.35"/>
    <circle cx="510" cy="370" r="40" fill="none" stroke="#565f74" stroke-width="5" opacity="0.35"/>

    <g stroke="#aab4c6" stroke-width="1.6" opacity="0.85">
      <line x1="310" y1="322" x2="310" y2="418"/>
      <line x1="262" y1="370" x2="358" y2="370"/>
      <line x1="275" y1="335" x2="345" y2="405"/>
      <line x1="345" y1="335" x2="275" y2="405"/>
      <line x1="283" y1="343" x2="337" y2="397"/>
      <line x1="337" y1="343" x2="283" y2="397"/>
      <line x1="300" y1="325" x2="300" y2="415"/>
      <line x1="320" y1="325" x2="320" y2="415"/>
      <line x1="462" y1="370" x2="558" y2="370"/>
      <line x1="475" y1="335" x2="545" y2="405"/>
      <line x1="545" y1="335" x2="475" y2="405"/>
      <line x1="483" y1="343" x2="537" y2="397"/>
      <line x1="537" y1="343" x2="483" y2="397"/>
      <line x1="500" y1="325" x2="500" y2="415"/>
      <line x1="520" y1="325" x2="520" y2="415"/>
    </g>

    <circle cx="400" cy="370" r="18" fill="none" stroke="#454b5a" stroke-width="2.5"/>

    <g stroke-linecap="round">
      <line x1="400" y1="370" x2="428" y2="344" stroke="#e06a28" stroke-width="10"/>
      <line x1="400" y1="370" x2="372" y2="396" stroke="#e06a28" stroke-width="10"/>
      <rect x="418" y="335" width="24" height="9" rx="2" fill="#2b2b2b" transform="rotate(45 430 340)"/>
      <rect x="370" y="385" width="24" height="9" rx="2" fill="#2b2b2b" transform="rotate(45 382 390)"/>
    </g>
    <circle cx="400" cy="370" r="8" fill="#3a4048"/>

    <circle cx="310" cy="370" r="6" fill="#2b3040"/>
    <circle cx="510" cy="370" r="6" fill="#2b3040"/>

    <line x1="310" y1="370" x2="400" y2="370" stroke="url(#frame)" stroke-width="7"/>
    <line x1="400" y1="370" x2="430" y2="318" stroke="url(#frame)" stroke-width="7"/>
    <line x1="430" y1="318" x2="400" y2="370" stroke="url(#frame)" stroke-width="7"/>
    <line x1="430" y1="318" x2="510" y2="370" stroke="url(#frame)" stroke-width="6"/>
    <line x1="430" y1="318" x2="500" y2="318" stroke="url(#frame)" stroke-width="6"/>
    <line x1="500" y1="318" x2="510" y2="370" stroke="url(#frame)" stroke-width="6"/>

    <line x1="500" y1="318" x2="506" y2="286" stroke="#42485c" stroke-width="5"/>
    <path d="M498 286 q12 -8 30 -2" fill="none" stroke="#2b3040" stroke-width="6"/>
    <circle cx="498" cy="286" r="4" fill="#2b3040"/>

    <line x1="430" y1="318" x2="424" y2="290" stroke="#42485c" stroke-width="5"/>
    <path d="M396 290 q28 -10 56 0" fill="url(#saddle)" stroke="#20140c" stroke-width="2"/>
  </g>
</svg>