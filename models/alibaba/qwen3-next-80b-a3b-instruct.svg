<svg width="500" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#87CEEB" />

  <!-- Ground -->
  <rect y="250" width="100%" height="50" fill="#8B4513" />

  <!-- Bicycle -->
  <!-- Frame -->
  <path d="M150,250 L180,200 L250,200 L280,250" fill="none" stroke="black" stroke-width="3"/>
  <line x1="180" y1="200" x2="250" y2="200" stroke="black" stroke-width="3"/>

  <!-- Wheels -->
  <circle cx="150" cy="250" r="20" fill="black" stroke="gray" stroke-width="2"/>
  <circle cx="280" cy="250" r="20" fill="black" stroke="gray" stroke-width="2"/>
  <circle cx="150" cy="250" r="5" fill="white"/>
  <circle cx="280" cy="250" r="5" fill="white"/>

  <!-- Handlebars -->
  <path d="M180,200 Q160,170 160,150" fill="none" stroke="black" stroke-width="2"/>
  <line x1="160" y1="150" x2="140" y2="150" stroke="black" stroke-width="2"/>

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="210" cy="180" rx="30" ry="20" fill="white" />

  <!-- Head -->
  <circle cx="255" cy="150" r="18" fill="white" />

  <!-- Beak -->
  <path d="M270,150 L310,130 L275,160 Z" fill="#FFD700" />
  <line x1="310" y1="130" x2="315" y2="135" stroke="#FFA500" stroke-width="1"/>

  <!-- Eye -->
  <circle cx="265" cy="145" r="3" fill="black" />

  <!-- Neck -->
  <path d="M235,180 Q250,160 255,150" fill="none" stroke="white" stroke-width="5"/>

  <!-- Wings -->
  <path d="M190,170 Q160,140 170,120 L190,180 Z" fill="#D3D3D3" />
  <path d="M230,170 Q260,140 250,120 L230,180 Z" fill="#D3D3D3" />

  <!-- Legs -->
  <line x1="200" y1="200" x2="190" y2="230" stroke="black" stroke-width="2"/>
  <line x1="220" y1="200" x2="230" y2="230" stroke="black" stroke-width="2"/>

  <!-- Feet (holding pedals) -->
  <path d="M185,230 L180,235 L190,240 Z" fill="orange"/>
  <path d="M235,230 L230,235 L240,240 Z" fill="orange"/>

  <!-- Optional: Fun text -->
  <text x="50%" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="black">
    🐧🦩 Who needs legs?!
  </text>
</svg>