<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="bikeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#555;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#333;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#87CEEB"/>
  <rect y="300" width="100%" height="100" fill="#90EE90"/>

  <g transform="translate(0, -10)">
    <circle cx="120" cy="300" r="40" fill="none" stroke="url(#bikeGradient)" stroke-width="5"/>
    <circle cx="120" cy="300" r="30" fill="none" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="300" x2="160" y2="300" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="300" x2="80" y2="300" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="300" x2="120" y2="260" stroke="#999" stroke-width="1"/>
    <line x1="120" y1="300" x2="120" y2="340" stroke="#999" stroke-width="1"/>

    <circle cx="380" cy="300" r="40" fill="none" stroke="url(#bikeGradient)" stroke-width="5"/>
    <circle cx="380" cy="300" r="30" fill="none" stroke="#999" stroke-width="2"/>
    <line x1="380" y1="300" x2="420" y2="300" stroke="#999" stroke-width="1"/>
    <line x1="380" y1="300" x2="340" y2="300" stroke="#999" stroke-width="1"/>
    <line x1="380" y1="300" x2="380" y2="260" stroke="#999" stroke-width="1"/>
    <line x1="380" y1="300" x2="380" y2="340" stroke="#999" stroke-width="1"/>

    <path d="M120 300 L250 300 L380 300 L300 180 L250 300 L250 230 L300 180" fill="none" stroke="url(#bikeGradient)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M300 180 L320 140 L300 160" fill="none" stroke="#444" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="250" cy="225" rx="15" ry="5" fill="#222" transform="rotate(-10 250 225)"/>
    <circle cx="250" cy="300" r="8" fill="#333"/>
    <line x1="250" y1="300" x2="250" y2="330" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="330" x2="220" y2="340" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(50, -40)">
    <line x1="230" y1="240" x2="210" y2="290" stroke="#FFA500" stroke-width="8" stroke-linecap="round"/>
    <line x1="260" y1="240" x2="280" y2="290" stroke="#FFA500" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="250" cy="220" rx="60" ry="45" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="2" filter="url(#shadow)"/>
    
    <ellipse cx="250" cy="230" rx="35" ry="30" fill="#F0F8FF"/>

    <path d="M210 190 Q180 150 180 110" fill="none" stroke="#FFF" stroke-width="35" stroke-linecap="round"/>
    <circle cx="180" cy="110" r="25" fill="#FFF" stroke="#E0E0E0" stroke-width="2"/>

    <circle cx="188" cy="105" r="3" fill="#000"/>
    <circle cx="188" cy="105" r="1" fill="#FFF"/>

    <path d="M165 115 L120 100 Q100 100 100 125 L165 135 Z" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    
    <path d="M165 125 Q130 150 110 130" fill="none" stroke="#FFA500" stroke-width="3" stroke-linecap="round"/>
    
    <path d="M280 200 Q300 230 260 240 Q240 220 280 200" fill="#F0F0F0" stroke="#CCC" stroke-width="1"/>
    
    <path d="M300 210 L320 200 L310 230 Z" fill="#E8E8E8"/>

    <line x1="300" y1="210" x2="315" y2="215" stroke="#CCC" stroke-width="1"/>
    
    <path d="M230 200 Q210 230 240 225" fill="#F5F5F5" stroke="#CCC" stroke-width="1"/>

    <line x1="240" y1="210" x2="220" y2="180" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    <line x1="260" y1="210" x2="290" y2="175" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
    
    <circle cx="290" cy="175" r="4" fill="#222"/>
  </g>
  
  <path d="M400 100 L410 90 L450 90 Q460 90 460 100 L460 120 Q460 130 450 130 L410 130 L400 120 Z" fill="#FFF" stroke="#000" stroke-width="1"/>
  <text x="415" y="115" font-family="Arial, sans-serif" font-size="16" fill="#000" text-anchor="start">Wheee!</text>

</svg>