<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="900" height="650" role="img" aria-label="Pelican riding a bicycle">
  <title>Pelican riding a bicycle</title>
  <desc>A cartoon pelican seated on a bicycle, with its wing on the handlebar and feet on the pedals.</desc>

  <rect width="900" height="650" fill="#dff2ff"/>
  <rect y="560" width="900" height="90" fill="#b9e0a5"/>

  <!-- Wheels -->
  <g stroke="#1f2430" fill="none">
    <circle cx="240" cy="480" r="88" stroke-width="14"/>
    <circle cx="660" cy="480" r="88" stroke-width="14"/>
  </g>

  <g stroke="#6b7280" stroke-width="3" fill="none">
    <circle cx="240" cy="480" r="62"/>
    <circle cx="660" cy="480" r="62"/>

    <line x1="240" y1="392" x2="240" y2="568"/>
    <line x1="152" y1="480" x2="328" y2="480"/>
    <line x1="178" y1="418" x2="302" y2="542"/>
    <line x1="302" y1="418" x2="178" y2="542"/>

    <line x1="660" y1="392" x2="660" y2="568"/>
    <line x1="572" y1="480" x2="748" y2="480"/>
    <line x1="598" y1="418" x2="722" y2="542"/>
    <line x1="722" y1="418" x2="598" y2="542"/>
  </g>

  <g fill="#111827">
    <circle cx="240" cy="480" r="9"/>
    <circle cx="660" cy="480" r="9"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#e11d48" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 480 L430 480 L360 300 Z"/>
    <path d="M360 300 L600 300 L430 480"/>
    <path d="M600 300 L660 480"/>
    <path d="M600 300 L625 250"/>
  </g>

  <!-- Handlebar -->
  <path d="M625 250 C 660 230, 690 240, 705 265" stroke="#111827" stroke-width="11" fill="none" stroke-linecap="round"/>

  <!-- Seat post and saddle -->
  <line x1="360" y1="300" x2="348" y2="258" stroke="#111827" stroke-width="11" stroke-linecap="round"/>
  <path d="M300 258 Q348 240 398 258 Q348 272 300 258 Z" fill="#111827"/>

  <!-- Cranks and pedals -->
  <circle cx="430" cy="480" r="18" fill="#374151"/>

  <g stroke="#111827" stroke-width="10" stroke-linecap="round">
    <line x1="430" y1="480" x2="485" y2="515"/>
    <line x1="430" y1="480" x2="375" y2="445"/>
  </g>

  <g fill="#111827">
    <rect x="469" y="506" width="38" height="13" rx="6"/>
    <rect x="337" y="436" width="38" height="13" rx="6"/>
  </g>

  <!-- Pelican -->
  <g stroke="#1f2937" stroke-linejoin="round">
    <!-- Tail -->
    <path d="M235 225 L150 180 L205 240 L135 245 L215 275 Z" fill="#f8fafc" stroke-width="5"/>

    <!-- Legs -->
    <path d="M350 260 L405 380 L480 508" fill="none" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
    <path d="M330 265 L360 370 L372 442" fill="none" stroke="#d97706" stroke-width="11" stroke-linecap="round"/>

    <!-- Feet -->
    <ellipse cx="488" cy="512" rx="20" ry="9" fill="#f59e0b" stroke-width="3" transform="rotate(18 488 512)"/>
    <ellipse cx="372" cy="443" rx="18" ry="8" fill="#d97706" stroke-width="3" transform="rotate(-12 372 443)"/>

    <!-- Body -->
    <ellipse cx="330" cy="210" rx="100" ry="62" fill="#f8fafc" stroke-width="7" transform="rotate(-16 330 210)"/>

    <!-- Wing reaching handlebar -->
    <path d="M355 190 C 440 165, 545 205, 620 250 C 565 270, 480 265, 415 240 C 380 226, 362 210, 355 190 Z" fill="#e2e8f0" stroke-width="5"/>

    <!-- Neck -->
    <path d="M385 180 C 435 135, 480 125, 520 140" fill="none" stroke="#1f2937" stroke-width="36" stroke-linecap="round"/>
    <path d="M385 180 C 435 135, 480 125, 520 140" fill="none" stroke="#f8fafc" stroke-width="26" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="528" cy="142" r="30" fill="#f8fafc" stroke-width="7"/>
    <circle cx="539" cy="131" r="5" fill="#111827" stroke="none"/>

    <!-- Beak and pouch -->
    <path d="M548 130 L720 175 L552 160 Z" fill="#f59e0b" stroke-width="5"/>
    <path d="M552 158 C 620 215, 670 215, 716 179 C 660 235, 590 230, 550 180 Z" fill="#fb923c" stroke-width="5"/>
  </g>
</svg>