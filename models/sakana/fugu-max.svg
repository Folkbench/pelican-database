<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aedcf5"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="85" r="42" fill="#ffe066" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="90" rx="55" ry="20"/>
    <ellipse cx="185" cy="78" rx="40" ry="18"/>
    <ellipse cx="560" cy="120" rx="48" ry="17"/>
    <ellipse cx="590" cy="108" rx="34" ry="15"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="528" width="800" height="34" fill="#6e6e6e"/>
  <rect x="0" y="558" width="800" height="42" fill="#8fbf6f"/>
  <g stroke="#f5f5f5" stroke-width="4" stroke-dasharray="28 22">
    <line x1="0" y1="545" x2="800" y2="545"/>
  </g>

  <!-- ================= BICYCLE ================= -->
  <!-- Wheels -->
  <g fill="none" stroke="#2b2b2b" stroke-width="9">
    <circle cx="240" cy="460" r="70"/>
    <circle cx="560" cy="460" r="70"/>
  </g>
  <!-- Spokes -->
  <g stroke="#9a9a9a" stroke-width="3">
    <line x1="172" y1="460" x2="308" y2="460"/>
    <line x1="240" y1="392" x2="240" y2="528"/>
    <line x1="192" y1="412" x2="288" y2="508"/>
    <line x1="192" y1="508" x2="288" y2="412"/>
    <line x1="492" y1="460" x2="628" y2="460"/>
    <line x1="560" y1="392" x2="560" y2="528"/>
    <line x1="512" y1="412" x2="608" y2="508"/>
    <line x1="512" y1="508" x2="608" y2="412"/>
  </g>
  <circle cx="240" cy="460" r="7" fill="#555"/>
  <circle cx="560" cy="460" r="7" fill="#555"/>

  <!-- Chain -->
  <g stroke="#444" stroke-width="4" fill="none">
    <line x1="243" y1="453" x2="390" y2="434"/>
    <line x1="243" y1="467" x2="390" y2="466"/>
  </g>

  <!-- Frame -->
  <g stroke="#d64545" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="400" y1="450" x2="240" y2="460"/>          <!-- chain stay -->
    <line x1="240" y1="460" x2="348" y2="312"/>          <!-- seat stay -->
    <line x1="400" y1="450" x2="525" y2="335"/>          <!-- down tube -->
    <line x1="345" y1="302" x2="528" y2="330"/>          <!-- top tube -->
    <line x1="400" y1="450" x2="345" y2="300"/>          <!-- seat tube -->
    <line x1="525" y1="335" x2="538" y2="282"/>          <!-- head tube -->
    <line x1="535" y1="320" x2="560" y2="460"/>          <!-- fork -->
  </g>

  <!-- Handlebar -->
  <path d="M 538 282 C 545 268 555 260 572 257" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <circle cx="574" cy="257" r="6" fill="#222"/>

  <!-- Seat -->
  <path d="M 320 298 Q 345 288 372 298 Q 345 308 320 298 Z" fill="#2b2b2b"/>

  <!-- Chainring -->
  <circle cx="400" cy="450" r="18" fill="none" stroke="#555" stroke-width="5"/>

  <!-- Cranks and pedals -->
  <line x1="400" y1="450" x2="432" y2="478" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <line x1="400" y1="450" x2="368" y2="420" stroke="#333" stroke-width="7" stroke-linecap="round"/>
  <rect x="420" y="474" width="26" height="9" rx="3" fill="#222"/>
  <rect x="356" y="416" width="26" height="9" rx="3" fill="#222"/>

  <!-- ================= PELICAN ================= -->
  <!-- Back leg to rear pedal -->
  <path d="M 340 295 L 352 365 L 368 419" fill="none" stroke="#e6952b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 356 420 L 384 412 L 382 424 Z" fill="#e6952b"/>

  <!-- Tail -->
  <g stroke="#c9c9d2" stroke-width="5" stroke-linecap="round">
    <line x1="262" y1="245" x2="228" y2="232"/>
    <line x1="260" y1="255" x2="224" y2="250"/>
    <line x1="262" y1="265" x2="228" y2="268"/>
  </g>

  <!-- Body -->
  <ellipse cx="330" cy="260" rx="76" ry="48" fill="#fdfdfd" stroke="#b9b9c4" stroke-width="3" transform="rotate(-6 330 260)"/>

  <!-- Wing -->
  <path d="M 302 238 Q 258 258 282 288 Q 330 305 372 258 Q 384 236 350 224 Q 314 220 302 238 Z"
        fill="#dcdce6" stroke="#a9a9b5" stroke-width="2.5"/>

  <!-- Neck -->
  <path d="M 358 235 C 372 186 402 160 448 154 L 458 182 C 418 188 396 214 388 252 Z"
        fill="#fdfdfd" stroke="#b9b9c4" stroke-width="3"/>

  <!-- Head -->
  <circle cx="455" cy="158" r="29" fill="#fdfdfd" stroke="#b9b9c4" stroke-width="3"/>
  <path d="M 436 136 Q 424 122 434 114 Q 442 124 450 132 Z" fill="#dcdce6"/>

  <!-- Bill: upper mandible -->
  <path d="M 468 145 L 588 160 L 470 170 Z" fill="#f4a020" stroke="#d98a12" stroke-width="2"/>
  <!-- Bill: pouch -->
  <path d="M 468 170 C 478 208 530 214 578 166 L 588 160 L 470 170 Z"
        fill="#e88f18" stroke="#d98a12" stroke-width="2"/>

  <!-- Eye -->
  <circle cx="462" cy="150" r="5" fill="#1c1c1c"/>
  <circle cx="464" cy="148" r="1.6" fill="#ffffff"/>

  <!-- Front leg to front pedal -->
  <path d="M 358 292 L 398 380 L 432 477" fill="none" stroke="#e6952b" stroke-width="8" stroke-linecap="round"/>
  <path d="M 424 478 L 452 470 L 450 482 Z" fill="#e6952b"/>

  <!-- Motion lines -->
  <g stroke="#9aa7b0" stroke-width="4" stroke-linecap="round" opacity="0.7">
    <line x1="90" y1="470" x2="40" y2="470"/>
    <line x1="100" y1="495" x2="60" y2="495"/>
    <line x1="95" y1="445" x2="55" y2="445"/>
  </g>
</svg>