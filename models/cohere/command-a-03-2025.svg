<svg width="300" height="200" viewBox="0 0 300 200"
     xmlns="http://www.w3.org/2000/svg" version="1.1"
     style="background:#e0f7fa">
  <!-- Bicycle -->
  <!-- Wheels -->
  <circle cx="80"  cy="150" r="30" fill="#333" stroke="#222" stroke-width="2"/>
  <circle cx="220" cy="150" r="30" fill="#333" stroke="#222" stroke-width="2"/>

  <!-- Frame -->
  <rect x="100" y="110" width="80" height="40" fill="#333" stroke="#222" stroke-width="2"/>

  <!-- Seat -->
  <rect x="150" y="90" width="10" height="20" fill="#333" stroke="#222" stroke-width="2"/>

  <!-- Handlebars -->
  <line x1="70" y1="140" x2="90" y2="140" stroke="#333" stroke-width="3"/>

  <!-- Pedal (rear) -->
  <circle cx="150" cy="150" r="5" fill="#333" stroke="#222" stroke-width="1"/>

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="150" cy="100" rx="20" ry="10" fill="#ffcc00" stroke="#333" stroke-width="1"/>

  <!-- Head -->
  <circle cx="170" cy="95" r="8" fill="#ffcc00" stroke="#333" stroke-width="1"/>
  <!-- Eye -->
  <circle cx="172" cy="95" r="1" fill="#000"/>

  <!-- Beak -->
  <polygon points="180,95 190,95 185,85" fill="#ff6600" stroke="#333" stroke-width="1"/>

  <!-- Wings (simple arcs) -->
  <path d="M130,100 Q110,80 130,60" fill="#8b4513" stroke="#333" stroke-width="1"/>
  <path d="M170,100 Q190,80 170,60" fill="#8b4513" stroke="#333" stroke-width="1"/>

  <!-- Legs -->
  <line x1="150" y1="120" x2="150" y2="150" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="120" x2="140" y2="150" stroke="#333" stroke-width="2"/>
</svg>