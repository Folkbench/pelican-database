  <path d="M0 646 C146 590 272 603 400 650 C536 701 676 671 794 628 C938 576 1080 604 1200 655 L1200 800 L0 800 Z" fill="#8fbd9e" opacity="0.62"/>
  <rect x="0" y="690" width="1200" height="110" fill="url(#road)"/>
  <path d="M0 691 C240 681 421 700 612 694 C820 687 1010 681 1200 695" fill="none" stroke="#fff4cf" stroke-width="5" opacity="0.7"/>
