    <circle r="128" fill="none" stroke="#dfe9e3" stroke-width="7"/>
    <circle r="121" fill="none" stroke="#5fa6aa" stroke-width="3" opacity="0.85"/>
    <g fill="none" stroke="#a9c7c4" stroke-width="2.1" opacity="0.9">
