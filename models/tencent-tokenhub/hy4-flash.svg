  <path d="M1094 160 C1087 172 1074 176 1060 170" fill="none" stroke="#9d6225" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="805" cy="143" rx="6" ry="3.4" fill="#9d6225" opacity="0.75"/>

  <!-- Near wing reaching the handlebar -->
  <path d="M628 278 C668 258 716 273 747 302 C779 332 813 342 850 337 C865 335 870 350 858 360 C836 378 787 369 752 356 C714 342 674 337 646 323 C623 312 615 291 628 278 Z" fill="url(#wing)" stroke="#71817f" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M660 299 C704 301 742 323 775 345 M650 313 C690 321 727 342 759 356" fill="none" stroke="#9aa7a4" stroke-width="2.5" stroke-linecap="round"/>
