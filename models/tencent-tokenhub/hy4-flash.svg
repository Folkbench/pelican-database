  <path d="M568 265 C517 267 475 300 470 346 C493 351 536 338 570 313 C587 301 587 273 568 265 Z" fill="#d9dfd9" stroke="#7f8d8a" stroke-width="3"/>
  <path d="M491 330 C516 319 540 303 557 286 M486 340 C515 335 540 320 562 302" class="thin"/>

