  <circle cx="768" cy="139" r="9.5" fill="#ffffff" stroke="#4a5c5a" stroke-width="2.5"/>
  <circle cx="771" cy="140" r="4.5" fill="#26393b"/>
  <circle cx="772.5" cy="138" r="1.6" fill="#ffffff"/>

