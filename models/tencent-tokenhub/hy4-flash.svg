  <path d="M452 366 C468 350 535 349 568 361 C557 377 477 382 452 366 Z" fill="#28464b"/>
  <path d="M466 364 C488 356 528 355 554 362" fill="none" stroke="#6f8a88" stroke-width="3" stroke-linecap="round"/>

  <!-- Rear leg and foot -->
  <path d="M579 400 C567 444 554 491 553 552" fill="none" stroke="#b95d1f" stroke-width="23" stroke-linecap="round"/>
  <path d="M579 400 C567 444 554 491 553 552" fill="none" stroke="url(#leg)" stroke-width="15" stroke-linecap="round"/>
  <path d="M544 546 C558 539 574 543 583 555 C571 557 566 565 566 574 C552 569 538 561 544 546 Z" fill="#f4a13b" stroke="#b95d1f" stroke-width="3" stroke-linejoin="round"/>

