  <path d="M850 341 C856 343 859 347 860 352" fill="none" stroke="#aab5b1" stroke-width="2" stroke-linecap="round"/>

  <!-- Near leg and webbed foot -->
  <path d="M626 418 C650 455 677 491 670 533 C667 559 655 590 645 620" fill="none" stroke="#b95d1f" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M626 418 C650 455 677 491 670 533 C667 559 655 590 645 620" fill="none" stroke="url(#leg)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M632 608 C646 601 660 605 668 616 C674 624 685 625 695 630 C680 638 662 639 647 635 C636 632 627 623 632 608 Z" fill="#f4a13b" stroke="#b95d1f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M656 617 C667 622 679 627 690 630 M649 625 C660 630 672 634 682 635" fill="none" stroke="#c96f24" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Small motion accents -->
  <g fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.62">
    <path d="M123 479 H215"/>
    <path d="M86 514 H167"/>
    <path d="M154 545 H220"/>
