<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful white pelican with a long orange bill and pouch pedals a teal bicycle along a sunny road.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeaf6"/>
      <stop offset="0.62" stop-color="#eaf8f6"/>
      <stop offset="1" stop-color="#fff3d4"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dca8"/>
      <stop offset="1" stop-color="#d8b877"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a8a92"/>
      <stop offset="1" stop-color="#12505d"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#f6f2e8"/>
      <stop offset="1" stop-color="#d9d8cf"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#e8e7dd"/>
      <stop offset="1" stop-color="#bfc8c6"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6ad35"/>
      <stop offset="0.62" stop-color="#f9c84c"/>
      <stop offset="1" stop-color="#e88924"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.55" stop-color="#f6a96b"/>
      <stop offset="1" stop-color="#e98568"/>
    </linearGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb43f"/>
      <stop offset="1" stop-color="#e97c24"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .ink { stroke:#28464b; stroke-linecap:round; stroke-linejoin:round; }
      .thin { fill:none; stroke:#7c8b87; stroke-width:2.2; stroke-linecap:round; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1035" cy="120" r="62" fill="#ffe8a0" opacity="0.72"/>
  <circle cx="1035" cy="120" r="43" fill="#fff3c6" opacity="0.86"/>
  <g fill="#ffffff" opacity="0.78">
    <ellipse cx="178" cy="135" rx="67" ry="25"/>
    <ellipse cx="224" cy="124" rx="45" ry="30"/>
    <ellipse cx="130" cy="124" rx="42" ry="22"/>
    <ellipse cx="470" cy="90" rx="56" ry="18"/>
    <ellipse cx="510" cy="82" rx="34" ry="23"/>
    <ellipse cx="430" cy="83" rx="31" ry="17"/>
  </g>
