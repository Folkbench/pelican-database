<svg height="400" id="pelican-svg" viewbox="0 0 600 400" width="600" xmlns="http://www.w3.org/2000/svg">
<!-- Sky background -->
<rect fill="#87CEEB" height="400" width="600"></rect>
<!-- Ground -->
<rect fill="#8BC34A" height="80" width="600" x="0" y="320"></rect>
<rect fill="#795548" height="10" width="600" x="0" y="320"></rect>
<!-- Bicycle -->
<g id="bicycle">
<!-- Rear wheel -->
<circle cx="180" cy="280" fill="none" r="40" stroke="#333" stroke-width="8"></circle>
<circle cx="180" cy="280" fill="#333" r="10"></circle>
<!-- Front wheel -->
<circle cx="380" cy="280" fill="none" r="40" stroke="#333" stroke-width="8"></circle>
<circle cx="380" cy="280" fill="#333" r="10"></circle>
<!-- Frame -->
<path d="M 180 280 L 250 220 L 320 220 L 380 280" fill="none" stroke="#E74C3C" stroke-width="10"></path>
<path d="M 250 220 L 320 280" fill="none" stroke="#E74C3C" stroke-width="10"></path>
<path d="M 320 220 L 320 280" fill="none" stroke="#E74C3C" stroke-width="10"></path>
<!-- Seat -->
<ellipse cx="250" cy="210" fill="#8B4513" rx="20" ry="10"></ellipse>
<!-- Handlebars -->
<path d="M 320 220 L 340 200" fill="none" stroke="#333" stroke-width="8"></path>
<path d="M 330 195 L 350 195" fill="none" stroke="#333" stroke-width="8"></path>
<!-- Pedals and crank -->
<circle cx="280" cy="260" fill="#333" r="15"></circle>
<line stroke="#333" stroke-width="6" x1="280" x2="260" y1="260" y2="240"></line>
<line stroke="#333" stroke-width="6" x1="280" x2="300" y1="260" y2="240"></line>
<circle cx="260" cy="240" fill="#333" r="8"></circle>
<circle cx="300" cy="240" fill="#333" r="8"></circle>
</g>
<!-- Pelican -->
<g id="pelican">
<!-- Body -->
<ellipse cx="280" cy="200" fill="#F5F5F5" rx="50" ry="30" stroke="#333" stroke-width="3"></ellipse>
<!-- Head -->
<circle cx="280" cy="150" fill="#F5F5F5" r="25" stroke="#333" stroke-width="3"></circle>
<!-- Beak -->
<path d="M 280 150 L 320 140 L 280 160 Z" fill="#FF9800" stroke="#333" stroke-width="2"></path>
<!-- Eye -->
<circle cx="290" cy="145" fill="#333" r="4"></circle>
<!-- Wing -->
<path d="M 260 190 Q 230 170 240 210 Q 250 230 270 210" fill="#E0E0E0" stroke="#333" stroke-width="2"></path>
<!-- Feet -->
<path d="M 260 230 L 250 270 L 240 270" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
<path d="M 300 230 L 310 270 L 320 270" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
<!-- Pelican on bicycle - connecting to pedals -->
<path d="M 260 230 L 260 240" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
<path d="M 300 230 L 300 240" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
<!-- Pelican holding handlebars -->
<path d="M 320 220 L 340 200" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
<path d="M 330 195 L 350 195" fill="none" stroke="#FF9800" stroke-linecap="round" stroke-width="6"></path>
</g>
<!-- Sun -->
<circle cx="80" cy="80" fill="#FFEB3B" r="30"></circle>
<g id="sun-rays">
<line stroke="#FFEB3B" stroke-width="4" x1="80" x2="80" y1="40" y2="20"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="80" x2="80" y1="120" y2="140"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="40" x2="20" y1="80" y2="80"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="120" x2="140" y1="80" y2="80"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="50" x2="35" y1="50" y2="35"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="110" x2="125" y1="50" y2="35"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="50" x2="35" y1="110" y2="125"></line>
<line stroke="#FFEB3B" stroke-width="4" x1="110" x2="125" y1="110" y2="125"></line>
</g>
<!-- Clouds -->
<g id="clouds">
<ellipse cx="450" cy="100" fill="white" rx="40" ry="25"></ellipse>
<ellipse cx="420" cy="90" fill="white" rx="30" ry="20"></ellipse>
<ellipse cx="480" cy="90" fill="white" rx="30" ry="20"></ellipse>
<ellipse cx="150" cy="70" fill="white" rx="35" ry="20"></ellipse>
<ellipse cx="120" cy="60" fill="white" rx="25" ry="15"></ellipse>
<ellipse cx="180" cy="60" fill="white" rx="25" ry="15"></ellipse>
</g>
<!-- Motion lines for bicycle -->
<g id="motion-lines">
<path d="M 140 280 Q 130 270 120 280" fill="none" stroke="#333" stroke-dasharray="5,5" stroke-width="2"></path>
<path d="M 420 280 Q 430 270 440 280" fill="none" stroke="#333" stroke-dasharray="5,5" stroke-width="2"></path>
</g>
</svg>