<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Pelican Riding a Bicycle</title>
  
  <rect width="100%" height="100%" fill="lightblue"/>
  <path d="M0,250 Q150,220 300,250 T400,250" stroke="white" stroke-width="2" fill="none"/>
  
  <g stroke="black" stroke-width="3" fill="none">
    <circle cx="80" cy="200" r="40" fill="lightgray" stroke="gray"/>
    <circle cx="240" cy="200" r="40" fill="lightgray" stroke="gray"/>
    <line x1="80" y1="200" x2="130" y2="150"/> <line x1="130" y1="150" x2="240" y2="200"/> <line x1="240" y1="200" x2="160" y2="200"/> <line x1="160" y1="200" x2="130" y2="150"/> <rect x="150" y="140" width="20" height="10" fill="black"/> <line x1="160" y1="145" x2="200" y2="145"/> </g>
  
  <g fill="white" stroke="black" stroke-width="2">
    <ellipse cx="160" cy="130" rx="40" ry="30"/>
    <path d="M120,130 Q110,120 115,110 Q120,120 125,130"/>
    <circle cx="190" cy="110" r="25"/>
    <path d="M210,110 Q240,100 230,130 Q210,140 190,130" fill="yellow"/>
    <path d="M210,110 Q240,100 230,130" fill="none" stroke="black" stroke-width="1"/>
    <ellipse cx="200" cy="135" rx="15" ry="10" fill="yellow"/>
    <circle cx="185" cy="105" r="3" fill="black"/>
    <ellipse cx="140" cy="120" rx="20" ry="15" transform="rotate(-20,140,120)"/>
    <line x1="160" y1="160" x2="160" y2="170"/>
    <line x1="180" y1="160" x2="180" y2="170"/>
    <circle cx="160" cy="170" r="5" fill="gray"/>
    <circle cx="180" cy="170" r="5" fill="gray"/>
  </g>
  
  <ellipse cx="150" cy="125" rx="15" ry="10" transform="rotate(-30,150,125)" fill="white" stroke="black" stroke-width="2"/>
  
  <rect x="155" y="145" width="10" height="5" fill="black"/>
  
  <circle cx="80" cy="200" r="30" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="80" cy="200" r="25" fill="none" stroke="black" stroke-width="1"/>
  <circle cx="240" cy="200" r="30" fill="none" stroke="black" stroke-width="2"/>
  <circle cx="240" cy="200" r="25" fill="none" stroke="black" stroke-width="1"/>
  
  <line x1="80" y1="200" x2="80" y2="170"/>
  <line x1="80" y1="200" x2="110" y2="200"/>
  <line x1="80" y1="200" x2="80" y2="230"/>
  <line x1="80" y1="200" x2="50" y2="200"/>
  <line x1="240" y1="200" x2="240" y2="170"/>
  <line x1="240" y1="200" x2="270" y2="200"/>
  <line x1="240" y1="200" x2="240" y2="230"/>
  <line x1="240" y1="200" x2="210" y2="200"/>
</svg>