<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Sun -->
  <circle cx="350" cy="50" r="20" fill="#FFD700"/>
  
  <!-- Bicycle -->
  <g id="bicycle">
    <!-- Wheels -->
    <circle cx="120" cy="220" r="30" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="200" cy="220" r="30" fill="none" stroke="#333" stroke-width="3"/>
    
    <!-- Frame -->
    <path d="M120,220 L150,190 L200,220 L180,160 L200,160 Z M150,190 L180,160" stroke="#333" stroke-width="3" fill="none"/>
    
    <!-- Seat -->
    <ellipse cx="170" cy="160" rx="15" ry="8" fill="#666"/>
    
    <!-- Handlebars -->
    <line x1="200" y1="160" x2="230" y2="170" stroke="#333" stroke-width="3"/>
    <ellipse cx="230" cy="170" rx="8" ry="5" fill="#666"/>
    
    <!-- Pedals -->
    <line x1="160" y1="210" x2="180" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="200" x2="190" y2="220" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="170" cy="170" rx="35" ry="45" fill="#FFF" stroke="#000" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="140" cy="140" r="20" fill="#FFF" stroke="#000" stroke-width="2"/>
    
    <!-- Beak -->
    <path d="M130,145 L110,155 L115,135 Z" fill="#F4A460" stroke="#000" stroke-width="2"/>
    <path d="M115,145 L105,155 L110,135 Z" fill="#FFA07A" stroke="#000" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="135" cy="135" r="3" fill="#000"/>
    
    <!-- Wings -->
    <ellipse cx="170" cy="170" rx="40" ry="15" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(-30 170 170)"/>
    <ellipse cx="170" cy="170" rx="40" ry="15" fill="#FFF" stroke="#000" stroke-width="2" transform="rotate(30 170 170)"/>
    
    <!-- Legs -->
    <line x1="155" y1="210" x2="155" y2="230" stroke="#000" stroke-width="3"/>
    <line x1="185" y1="210" x2="185" y2="230" stroke="#000" stroke-width="3"/>
    <ellipse cx="155" cy="230" rx="8" ry="5" fill="#000"/>
    <ellipse cx="185" cy="230" rx="8" ry="5" fill="#000"/>
  </g>
</svg>