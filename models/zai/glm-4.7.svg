<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients for depth -->
    <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="beakGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <!-- Background Ground Shadow -->
  <ellipse cx="250" cy="330" rx="180" ry="10" fill="#000000" opacity="0.1" />

  <!-- Bicycle Group -->
  <g id="bicycle" transform="translate(0, 10)">
    <!-- Back Wheel -->
    <circle cx="120" cy="280" r="50" fill="none" stroke="#444" stroke-width="6" />
    <circle cx="120" cy="280" r="45" fill="none" stroke="#ccc" stroke-width="1" />
    <!-- Spokes -->
    <line x1="120" y1="230" x2="120" y2="330" stroke="#888" stroke-width="1" />
    <line x1="70" y1="280" x2="170" y2="280" stroke="#888" stroke-width="1" />
    <line x1="85" y1="245" x2="155" y2="315" stroke="#888" stroke-width="1" />
    <line x1="155" y1="245" x2="85" y2="315" stroke="#888" stroke-width="1" />
    <circle cx="120" cy="280" r="6" fill="#444" />

    <!-- Front Wheel -->
    <circle cx="380" cy="280" r="50" fill="none" stroke="#444" stroke-width="6" />
    <circle cx="380" cy="280" r="45" fill="none" stroke="#ccc" stroke-width="1" />
    <!-- Spokes -->
    <line x1="380" y1="230" x2="380" y2="330" stroke="#888" stroke-width="1" />
    <line x1="330" y1="280" x2="430" y2="280" stroke="#888" stroke-width="1" />
    <line x1="345" y1="245" x2="415" y2="315" stroke="#888" stroke-width="1" />
    <line x1="415" y1="245" x2="345" y2="315" stroke="#888" stroke-width="1" />
    <circle cx="380" cy="280" r="6" fill="#444" />

    <!-- Frame -->
    <path d="M 120 280 L 220 180 L 360 280 L 220 180 L 200 150 L 340 150" 
          fill="none" stroke="#333" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Seat Tube -->
    <line x1="220" y1="180" x2="210" y2="140" stroke="#333" stroke-width="5" stroke-linecap="round" />
    <!-- Chainstay -->
    <line x1="120" y1="280" x2="220" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round" />
    
    <!-- Seat -->
    <path d="M 190 140 Q 210 130 230 140 L 225 148 Q 210 140 195 148 Z" fill="#5D4037" />
    
    <!-- Handlebars -->
    <path d="M 340 150 Q 340 130 360 125 Q 380 130 380 150" fill="none" stroke="#333" stroke-width="4" stroke-linecap="round" />
    
    <!-- Pedals Area -->
    <circle cx="220" cy="180" r="8" fill="#555" />
    <line x1="220" y1="180" x2="210" y2="200" stroke="#333" stroke-width="3" />
    <rect x="200" y="195" width="20" height="6" fill="#222" rx="2" />
  </g>

  <!-- Pelican Group -->
  <g id="pelican" transform="translate(0, 10)">
    <!-- Tail Feathers -->
    <path d="M 180 180 Q 160 190 150 170 Q 160 180 180 175" fill="#ECEFF1" />

    <!-- Body -->
    <path d="M 190 170 
             Q 210 160 230 170 
             Q 240 200 220 220 
             Q 190 230 180 200 
             Z" 
          fill="#F5F5F5" stroke="#CFD8DC" stroke-width="1" />
          
    <!-- Wing -->
    <path d="M 200 180 Q 230 190 240 210 Q 220 220 200 210 Z" fill="#CFD8DC" />

    <!-- Legs -->
    <!-- Back Leg (on pedal) -->
    <path d="M 210 220 L 210 205" stroke="#FF9800" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="210" cy="205" rx="6" ry="3" fill="#FF9800" transform="rotate(-20 210 205)" />

    <!-- Front Leg (pushing pedal) -->
    <path d="M 225 215 L 215 200" stroke="#FF9800" stroke-width="3" stroke-linecap="round" />
    <ellipse cx="215" cy="200" rx="6" ry="3" fill="#FF9800" transform="rotate(-20 215 200)" />

    <!-- Neck -->
    <path d="M 210 170 
             Q 200 130 220 100 
             Q 250 90 280 110" 
          fill="none" stroke="#F5F5F5" stroke-width="18" stroke-linecap="round" />
    <path d="M 210 170 
             Q 200 130 220 100 
             Q 250 90 280 110" 
          fill="none" stroke="#ECEFF1" stroke-width="16" stroke-linecap="round" />

    <!-- Head -->
    <ellipse cx="290" cy="110" rx="25" ry="20" fill="#F5F5F5" />

    <!-- Beak Top -->
    <path d="M 305 105 L 380 110 L 305 115 Z" fill="url(#beakGradient)" />
    
    <!-- Beak Pouch -->
    <path d="M 305 115 Q 340 145 305 115" fill="#FFCCBC" opacity="0.8" />
    <path d="M 305 115 Q 340 135 305 115" stroke="#FFAB91" stroke-width="1" fill="none" />

    <!-- Eye -->
    <circle cx="295" cy="105" r="3" fill="#333" />
    
    <!-- Wing tip detail -->
    <path d="M 240 210 L 245 215" stroke="#B0BEC5" stroke-width="2" />
  </g>
</svg>