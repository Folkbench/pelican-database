<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle frame -->
  <path d="M120,280 L200,280 L280,200 L120,200 Z" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="120" cy="280" r="30" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="280" cy="280" r="30" fill="none" stroke="#333" stroke-width="6"/>
  <line x1="200" y1="280" x2="200" y2="180" stroke="#333" stroke-width="6"/>
  <line x1="200" y1="180" x2="150" y2="150" stroke="#333" stroke-width="6"/>
  
  <!-- Pelican body -->
  <ellipse cx="200" cy="150" rx="40" ry="30" fill="#7D9EB8"/>
  <ellipse cx="220" cy="160" rx="25" ry="20" fill="#7D9EB8"/>
  
  <!-- Pelican head and beak -->
  <circle cx="250" cy="140" r="20" fill="#7D9EB8"/>
  <path d="M270,140 Q290,130 300,145 Q290,160 270,150 Z" fill="#F9C116"/>
  <path d="M270,140 Q285,135 290,145" fill="none" stroke="#333" stroke-width="1.5"/>
  
  <!-- Pelican eye -->
  <circle cx="245" cy="135" r="3" fill="#333"/>
  
  <!-- Pelican legs -->
  <line x1="190" y1="180" x2="170" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="210" y1="180" x2="230" y2="220" stroke="#333" stroke-width="4"/>
  <path d="M170,220 L180,230" stroke="#333" stroke-width="2"/>
  <path d="M230,220 L220,230" stroke="#333" stroke-width="2"/>
  
  <!-- Pelican wing -->
  <path d="M160,150 Q140,120 150,100 Q170,110 180,130" fill="none" stroke="#7D9EB8" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <path d="M150,150 Q140,140 130,145" fill="none" stroke="#333" stroke-width="4"/>
  
  <!-- Seat -->
  <ellipse cx="200" cy="180" rx="15" ry="8" fill="#333"/>
</svg>