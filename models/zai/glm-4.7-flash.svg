<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bikeFrameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#4ca1af;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="wheelGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="300" cy="200" r="180" fill="#f4f7f6"/>

  <ellipse cx="300" cy="320" rx="140" ry="15" fill="#000000" opacity="0.1"/>

  <g transform="translate(50, 20)">
    <circle cx="180" cy="280" r="60" fill="url(#wheelGradient)" stroke="#95a5a6" stroke-width="4"/>
    <circle cx="180" cy="280" r="10" fill="#7f8c8d"/>
    <g stroke="#bdc3c7" stroke-width="2">
      <line x1="180" y1="220" x2="180" y2="340"/>
      <line x1="120" y1="280" x2="240" y2="280"/>
      <line x1="135" y1="235" x2="225" y2="325"/>
      <line x1="225" y1="235" x2="135" y2="325"/>
    </g>

    <circle cx="380" cy="280" r="60" fill="url(#wheelGradient)" stroke="#95a5a6" stroke-width="4"/>
    <circle cx="380" cy="280" r="10" fill="#7f8c8d"/>
    <g stroke="#bdc3c7" stroke-width="2">
      <line x1="380" y1="220" x2="380" y2="340"/>
      <line x1="320" y1="280" x2="440" y2="280"/>
      <line x1="335" y1="235" x2="425" y2="325"/>
      <line x1="425" y1="235" x2="335" y2="325"/>
    </g>

    <g stroke="url(#bikeFrameGradient)" stroke-width="6" stroke-linecap="round" fill="none">
      <line x1="220" y1="220" x2="180" y2="280"/>
      <line x1="220" y1="220" x2="380" y2="280"/>
      <line x1="220" y1="220" x2="340" y2="180"/>
      <line x1="340" y1="180" x2="380" y2="280"/>
      <line x1="180" y1="280" x2="220" y2="220"/>
    </g>

    <path d="M320 180 Q340 150 360 180" stroke="#2c3e50" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="320" cy="180" r="4" fill="#2c3e50"/>
    <circle cx="360" cy="180" r="4" fill="#2c3e50"/>

    <path d="M210 220 Q220 210 230 220" stroke="#2c3e50" stroke-width="4" fill="#2c3e50"/>

    <circle cx="220" cy="220" r="6" fill="#e67e22"/>
    <line x1="220" y1="220" x2="220" y2="240" stroke="#e67e22" stroke-width="3"/>
    <rect x="210" y="238" width="20" height="4" fill="#e67e22"/>
  </g>

  <g transform="translate(180, 100)" filter="url(#dropShadow)">
    
    <path d="M-40 180 Q-60 160 -50 140" stroke="#ecf0f1" stroke-width="8" stroke-linecap="round" fill="none"/>

    <ellipse cx="50" cy="180" rx="55" ry="45" fill="#ffffff"/>
    
    <path d="M20 160 Q10 180 30 190 Q50 200 60 180" fill="#ecf0f1"/>

    <path d="M70 160 Q90 120 80 80 Q70 50 90 30" stroke="#ffffff" stroke-width="25" fill="none" stroke-linecap="round"/>
    
    <circle cx="90" cy="25" r="22" fill="#ffffff"/>
    
    <circle cx="98" cy="20" r="3" fill="#2c3e50"/>
    <circle cx="99" cy="19" r="1" fill="#ffffff"/>

    <path d="M110 25 L160 25 L155 35 L110 35 Z" fill="#e67e22"/>
    
    <path d="M110 35 Q110 60 140 60 Q170 60 170 35 L160 35 Q160 50 140 50 Q120 50 120 35 Z" fill="#e67e22"/>
    
    <path d="M110 35 Q125 55 140 55 Q155 55 170 35 L160 35 Q160 50 140 50 Q120 50 120 35 Z" fill="#f5cba7" opacity="0.8"/>

    <path d="M40 210 L40 240 L50 240" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M60 210 L70 240 L80 240" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none"/>
    
    <path d="M40 240 L30 250 M40 240 L50 250" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>
    <path d="M70 240 L60 250 M70 240 L80 250" stroke="#e67e22" stroke-width="3" stroke-linecap="round"/>

  </g>
</svg>