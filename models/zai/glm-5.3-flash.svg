<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#e8f4fd"/>

  <!-- Ground line -->
  <line x1="20" y1="260" x2="380" y2="260" stroke="#999" stroke-width="3"/>

  <!-- Bicycle rear wheel -->
  <circle cx="130" cy="220" r="40" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="130" cy="220" r="6" fill="#333"/>
  <g stroke="#888" stroke-width="2">
    <line x1="90" y1="220" x2="170" y2="220"/>
    <line x1="130" y1="180" x2="130" y2="260"/>
    <line x1="102" y1="192" x2="158" y2="248"/>
    <line x1="158" y1="192" x2="102" y2="248"/>
  </g>

  <!-- Bicycle front wheel -->
  <circle cx="280" cy="220" r="40" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="280" cy="220" r="6" fill="#333"/>
  <g stroke="#888" stroke-width="2">
    <line x1="240" y1="220" x2="320" y2="220"/>
    <line x1="280" y1="180" x2="280" y2="260"/>
    <line x1="252" y1="192" x2="308" y2="248"/>
    <line x1="308" y1="192" x2="252" y2="248"/>
  </g>

  <!-- Frame -->
  <path d="M130 220 L190 150 L230 160 M190 150 L175 215 M175 215 L250 210 M230 160 L280 220"
        fill="none" stroke="#d33" stroke-width="5" stroke-linecap="round"/>
  <!-- Handlebars and fork -->
  <path d="M280 220 L265 155 L245 145" fill="none" stroke="#d33" stroke-width="5" stroke-linecap="round"/>
  <circle cx="245" cy="143" r="7" fill="#222"/>

  <!-- Pedals/crank -->
  <circle cx="195" cy="218" r="10" fill="none" stroke="#555" stroke-width="4"/>
  <line x1="185" y1="232" x2="205" y2="204" stroke="#555" stroke-width="4"/>
  <rect x="178" y="228" width="18" height="6" rx="2" fill="#222"/>

  <!-- Pelican legs to pedal and frame -->
  <path d="M225 165 Q235 195 196 226" fill="none" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
  <path d="M255 140 Q270 175 238 208" fill="none" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>

  <!-- Pelican body -->
  <ellipse cx="240" cy="120" rx="65" ry="42" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <!-- Wing -->
  <path d="M230 105 q45 -15 60 15 q-30 25 -70 10 z" fill="#eee" stroke="#bbb" stroke-width="2"/>

  <!-- Tail feathers -->
  <path d="M295 110 l35 -14 m-35 16 l38 0 m-38 14 l34 13" stroke="#ddd" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Neck (S-curve) -->
  <path d="M285 100 Q310 85 305 55 Q302 38 290 32" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
  <path d="M285 100 Q310 85 305 55 Q302 38 290 32" fill="none" stroke="#ccc" stroke-width="1"/>

  <!-- Head -->
  <circle cx="285" cy="30" r="17" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <circle cx="292" cy="26" r="3.5" fill="#222"/>

  <!-- Beak with pouch -->
  <path d="M278 28 L212 44 Q278 62 282 36 Z" fill="#f39c12" stroke="#d68910" stroke-width="2"/>
</svg>