<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="320" width="400" height="80" fill="#90EE90"/>
  
  <!-- Bicycle Frame -->
  <g id="bicycle">
    <!-- Rear wheel -->
    <circle cx="120" cy="280" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="120" cy="280" r="5" fill="#333"/>
    <line x1="120" y1="245" x2="120" y2="315" stroke="#333" stroke-width="2"/>
    
    <!-- Front wheel -->
    <circle cx="280" cy="280" r="35" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="280" cy="280" r="5" fill="#333"/>
    <line x1="280" y1="245" x2="280" y2="315" stroke="#333" stroke-width="2"/>
    
    <!-- Main frame -->
    <line x1="120" y1="280" x2="200" y2="200" stroke="#FF6B6B" stroke-width="6"/>
    <line x1="200" y1="200" x2="280" y2="280" stroke="#FF6B6B" stroke-width="6"/>
    <line x1="120" y1="280" x2="200" y2="280" stroke="#FF6B6B" stroke-width="6"/>
    <line x1="200" y1="200" x2="200" y2="240" stroke="#FF6B6B" stroke-width="6"/>
    
    <!-- Seat -->
    <ellipse cx="200" cy="190" rx="25" ry="8" fill="#333"/>
    
    <!-- Handlebars -->
    <line x1="200" y1="200" x2="240" y2="160" stroke="#FF6B6B" stroke-width="4"/>
    <line x1="220" y1="160" x2="260" y2="160" stroke="#333" stroke-width="4"/>
    
    <!-- Pedals -->
    <circle cx="200" cy="280" r="8" fill="#666"/>
    <line x1="192" y1="280" x2="208" y2="280" stroke="#333" stroke-width="3"/>
  </g>
  
  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="200" cy="160" rx="50" ry="40" fill="#F5DEB3"/>
    
    <!-- Neck -->
    <path d="M 180 140 Q 160 120 155 100" fill="none" stroke="#F5DEB3" stroke-width="20"/>
    
    <!-- Head -->
    <circle cx="155" cy="90" r="25" fill="#F5DEB3"/>
    
    <!-- Beak -->
    <path d="M 130 90 L 80 88 L 85 95 L 130 92 Z" fill="#FFA500"/>
    <path d="M 80 88 L 75 90 L 85 95 Z" fill="#FF8C00"/>
    
    <!-- Throat pouch -->
    <path d="M 130 90 Q 110 100 115 110 Q 120 115 130 110" fill="#FFE4B5" stroke="#DEB887" stroke-width="1"/>
    
    <!-- Eye -->
    <circle cx="145" cy="85" r="5" fill="#000"/>
    <circle cx="147" cy="83" r="2" fill="#FFF"/>
    
    <!-- Wings (holding handlebars) -->
    <path d="M 200 160 Q 240 170 260 160" fill="#F5DEB3" stroke="#DEB887" stroke-width="2"/>
    <path d="M 200 170 Q 240 180 260 170" fill="#F5DEB3" stroke="#DEB887" stroke-width="2"/>
    
    <!-- Legs on pedals -->
    <line x1="190" y1="195" x2="192" y2="272" stroke="#F5DEB3" stroke-width="8" stroke-linecap="round"/>
    <line x1="210" y1="195" x2="208" y2="272" stroke="#F5DEB3" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Feet -->
    <ellipse cx="192" cy="280" rx="12" ry="6" fill="#FFA500"/>
    <ellipse cx="208" cy="280" rx="12" ry="6" fill="#FFA500"/>
    
    <!-- Tail feathers -->
    <path d="M 240 160 L 255 155 L 250 165 Z" fill="#F5DEB3"/>
    <path d="M 245 165 L 260 160 L 255 170 Z" fill="#F5DEB3"/>
  </g>
  
  <!-- Motion lines -->
  <g opacity="0.5">
    <line x1="50" y1="280" x2="70" y2="280" stroke="#666" stroke-width="2"/>
    <line x1="330" y1="280" x2="350" y2="280" stroke="#666" stroke-width="2"/>
    <line x1="40" y1="290" x2="60" y2="290" stroke="#666" stroke-width="2"/>
    <line x1="340" y1="290" x2="360" y2="290" stroke="#666" stroke-width="2"/>
  </g>
</svg>