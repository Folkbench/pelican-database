<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle -->
  <circle cx="100" cy="150" r="20" fill="black" />
  <rect x="80" y="130" width="40" height="20" fill="black" />
  <line x1="80" y1="130" x2="120" y2="130" stroke="black" stroke-width="2" />
  <line x1="80" y1="150" x2="120" y2="150" stroke="black" stroke-width="2" />
  <line x1="100" y1="110" x2="100" y2="130" stroke="black" stroke-width="2" />
  <line x1="100" y1="110" x2="110" y2="110" stroke="black" stroke-width="2" />
  <line x1="100" y1="110" x2="90" y2="110" stroke="black" stroke-width="2" />

  <!-- Pelican -->
  <ellipse cx="100" cy="80" rx="30" ry="20" fill="white" />
  <path d="M 100 80 Q 120 60 140 80 Q 120 100 100 80" stroke="black" stroke-width="2" fill="white" />
  <circle cx="100" cy="75" r="5" fill="black" />
  <ellipse cx="130" cy="80" rx="10" ry="5" fill="white" />
  <ellipse cx="70" cy="80" rx="10" ry="5" fill="white" />
  <path d="M 100 80 Q 90 100 100 120" stroke="black" stroke-width="2" fill="none" />
  <path d="M 100 80 Q 110 100 100 120" stroke="black" stroke-width="2" fill="none" />
</svg>