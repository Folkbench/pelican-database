<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (optional) -->
  <rect width="400" height="300" fill="#87CEEB" />

  <!-- Bicycle -->
  <g id="bicycle">
    <!-- Front wheel -->
    <circle cx="280" cy="220" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="280" cy="220" r="5" fill="#333" />

    <!-- Back wheel -->
    <circle cx="120" cy="220" r="40" fill="none" stroke="#333" stroke-width="4" />
    <circle cx="120" cy="220" r="5" fill="#333" />

    <!-- Frame -->
    <line x1="120" y1="220" x2="200" y2="160" stroke="#333" stroke-width="4" />
    <line x1="200" y1="160" x2="280" y2="220" stroke="#333" stroke-width="4" />
    <line x1="200" y1="160" x2="160" y2="180" stroke="#333" stroke-width="4" />
    <line x1="160" y1="180" x2="120" y2="220" stroke="#333" stroke-width="4" />

    <!-- Handlebars -->
    <line x1="280" y1="220" x2="260" y2="140" stroke="#333" stroke-width="4" />
    <line x1="260" y1="140" x2="240" y2="140" stroke="#333" stroke-width="4" />

    <!-- Pedals (simplified) -->
    <line x1="160" y1="200" x2="180" y2="200" stroke="#333" stroke-width="3" />
    <line x1="170" y1="190" x2="170" y2="210" stroke="#333" stroke-width="3" />
  </g>

  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="200" cy="160" rx="30" ry="40" fill="#F5F5DC" stroke="#333" stroke-width="2" />

    <!-- Head -->
    <circle cx="180" cy="130" r="20" fill="#F5F5DC" stroke="#333" stroke-width="2" />

    <!-- Beak -->
    <path d="M160,130 Q140,120 140,140 Q140,160 160,150 L180,140 Z" fill="#FFD700" stroke="#333" stroke-width="1" />

    <!-- Eye -->
    <circle cx="175" cy="125" r="3" fill="#333" />

    <!-- Wing -->
    <path d="M210,140 Q240,130 250,160 Q240,190 210,180 Z" fill="#F5F5DC" stroke="#333" stroke-width="2" />

    <!-- Legs (riding the bike) -->
    <line x1="190" y1="200" x2="190" y2="220" stroke="#333" stroke-width="3" />
    <line x1="210" y1="200" x2="210" y2="220" stroke="#333" stroke-width="3" />

    <!-- Feet -->
    <ellipse cx="190" cy="225" rx="8" ry="4" fill="#F5F5DC" stroke="#333" stroke-width="1" />
    <ellipse cx="210" cy="225" rx="8" ry="4" fill="#F5F5DC" stroke="#333" stroke-width="1" />
  </g>

  <!-- Optional: Road -->
  <rect x="0" y="260" width="400" height="40" fill="#555" />
</svg>