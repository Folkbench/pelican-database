<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB" />

  <!-- Ground -->
  <rect y="200" width="400" height="100" fill="#8BC34A" />

  <!-- Bicycle -->
  <!-- Frame -->
  <path d="M100,200 L200,180 L250,200" stroke="#333" stroke-width="4" fill="none" />
  <!-- Wheels -->
  <circle cx="120" cy="200" r="20" fill="#333" />
  <circle cx="230" cy="200" r="20" fill="#333" />
  <!-- Handlebar -->
  <path d="M130,180 L100,170" stroke="#333" stroke-width="3" fill="none" />

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="180" cy="170" rx="30" ry="20" fill="#F5F5F5" stroke="#333" stroke-width="2" />
  <!-- Head -->
  <circle cx="220" cy="150" r="15" fill="#F5F5F5" stroke="#333" stroke-width="2" />
  <!-- Beak -->
  <path d="M230,150 L250,145 L230,140 Z" fill="#FF9800" stroke="#333" stroke-width="1" />
  <!-- Eye -->
  <circle cx="225" cy="147" r="2" fill="#333" />
  <!-- Wings -->
  <path d="M160,170 L140,150 L160,130" fill="#D3D3D3" stroke="#333" stroke-width="1" />
  <!-- Legs -->
  <path d="M170,190 L170,200" stroke="#333" stroke-width="3" />
  <path d="M190,190 L190,200" stroke="#333" stroke-width="3" />

  <!-- Sun -->
  <circle cx="50" cy="50" r="30" fill="#FFEB3B" />
</svg>