<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 350" width="400" height="350">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8E8E8"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="350" fill="url(#skyGrad)"/>
  <ellipse cx="200" cy="320" rx="180" ry="15" fill="#90EE90" opacity="0.5"/>
  <line x1="0" y1="320" x2="400" y2="320" stroke="#8B7355" stroke-width="4"/>

  <!-- Motion lines -->
  <line x1="30" y1="180" x2="70" y2="180" stroke="#B0C4DE" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="20" y1="200" x2="60" y2="200" stroke="#B0C4DE" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="40" y1="220" x2="75" y2="220" stroke="#B0C4DE" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Bicycle -->
  <g>
    <!-- Back wheel -->
    <circle cx="120" cy="270" r="45" fill="none" stroke="#333" stroke-width="6"/>
    <circle cx="120" cy="270" r="38" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="120" cy="270" r="5" fill="#333"/>
    <!-- Spokes back wheel -->
    <line x1="120" y1="270" x2="120" y2="232" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="120" y2="308" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="82" y2="270" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="158" y2="270" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="93" y2="243" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="147" y2="297" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="147" y2="243" stroke="#999" stroke-width="2"/>
    <line x1="120" y1="270" x2="93" y2="297" stroke="#999" stroke-width="2"/>

    <!-- Front wheel -->
    <circle cx="290" cy="270" r="45" fill="none" stroke="#333" stroke-width="6"/>
    <circle cx="290" cy="270" r="38" fill="none" stroke="#666" stroke-width="2"/>
    <circle cx="290" cy="270" r="5" fill="#333"/>
    <!-- Spokes front wheel -->
    <line x1="290" y1="270" x2="290" y2="232" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="290" y2="308" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="252" y2="270" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="328" y2="270" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="263" y2="243" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="317" y2="297" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="317" y2="243" stroke="#999" stroke-width="2"/>
    <line x1="290" y1="270" x2="263" y2="297" stroke="#999" stroke-width="2"/>

    <!-- Frame -->
    <path d="M 120 270 L 180 200 L 250 200 L 290 270 L 200 270 L 120 270" fill="none" stroke="#E74C3C" stroke-width="7" stroke-linejoin="round"/>
    <path d="M 180 200 L 200 270" fill="none" stroke="#E74C3C" stroke-width="7"/>
    <path d="M 250 200 L 290 270" fill="none" stroke="#E74C3C" stroke-width="7"/>

    <!-- Seat -->
    <path d="M 170 195 Q 180 185 195 195 L 190 205 L 175 205 Z" fill="#8B4513"/>

    <!-- Handlebars -->
    <path d="M 250 200 L 265 175 L 285 170" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <circle cx="287" cy="169" r="6" fill="#333"/>

    <!-- Pedals and crank -->
    <circle cx="200" cy="270" r="12" fill="none" stroke="#333" stroke-width="4"/>
    <line x1="200" y1="270" x2="215" y2="285" stroke="#333" stroke-width="4"/>
    <line x1="200" y1="270" x2="185" y2="255" stroke="#333" stroke-width="4"/>
    <rect x="210" y="282" width="18" height="8" rx="3" fill="#333"/>
    <rect x="172" y="248" width="18" height="8" rx="3" fill="#333"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Legs -->
    <path d="M 185 230 Q 190 250 200 268" fill="none" stroke="#FFA500" stroke-width="7" stroke-linecap="round"/>
    <path d="M 195 235 Q 200 255 212 280" fill="none" stroke="#FFA500" stroke-width="7" stroke-linecap="round"/>
    <!-- Feet on pedals -->
    <ellipse cx="215" cy="286" rx="10" ry="5" fill="#FFA500"/>
    <ellipse cx="188" cy="252" rx="10" ry="5" fill="#FFA500"/>

    <!-- Body -->
    <ellipse cx="185" cy="185" rx="45" ry="55" fill="url(#bodyGrad)" transform="rotate(-15 185 185)"/>

    <!-- Wing -->
    <path d="M 160 160 Q 130 180 140 215 Q 165 205 180 185 Q 175 165 160 160 Z" fill="#D3D3D3"/>
    <path d="M 145 175 Q 135 190 142 205" fill="none" stroke="#A9A9A9" stroke-width="2"/>
    <path d="M 152 170 Q 142 188 148 200" fill="none" stroke="#A9A9A9" stroke-width="2"/>

    <!-- Tail feathers -->
    <path d="M 145 210 Q 120 220 115 240 Q 135 235 150 225 Z" fill="#E8E8E8"/>
    <path d="M 148 215 Q 128 228 125 245 Q 142 238 155 228 Z" fill="#D3D3D3"/>

    <!-- Neck -->
    <path d="M 210 145 Q 225 120 220 95 Q 215 75 230 65" fill="none" stroke="url(#bodyGrad)" stroke-width="28" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="235" cy="60" r="22" fill="url(#bodyGrad)"/>
    <!-- Head tuft -->
    <path d="M 225 45 Q 220 35 228 32 Q 225 40 232 38 Q 228 45 235 42" fill="none" stroke="#D3D3D3" stroke-width="3" stroke-linecap="round"/>

    <!-- Eye -->
    <circle cx="242" cy="55" r="5" fill="#333"/>
    <circle cx="243.5" cy="53.5" r="1.5" fill="#FFF"/>

    <!-- Beak (upper) -->
    <path d="M 252 52 Q 320 55 340 70 Q 320 75 255 68 Q 250 60 252 52 Z" fill="url(#beakGrad)"/>

    <!-- Pouch -->
    <path d="M 255 68 Q 290 85 320 72 Q 300 95 270 85 Q 258 78 255 68 Z" fill="#FF8C69"/>
    <path d="M 260 72 Q 285 82 310 73" fill="none" stroke="#CD5C5C" stroke-width="1.5"/>

    <!-- Lower beak line -->
    <path d="M 255 68 Q 300 72 335 70" fill="none" stroke="#CC8400" stroke-width="2"/>

    <!-- Wing tip reaching handlebar -->
    <path d="M 175 175 Q 220 170 265 172 Q 280 172 285 170" fill="none" stroke="#D3D3D3" stroke-width="12" stroke-linecap="round"/>
    <circle cx="285" cy="170" r="8" fill="#D3D3D3"/>
  </g>

  <!-- Speed effect -->
  <circle cx="120" cy="270" r="50" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3" stroke-dasharray="10 15"/>
  <circle cx="290" cy="270" r="50" fill="none" stroke="#FFF" stroke-width="2" opacity="0.3" stroke-dasharray="10 15"/>
</svg>