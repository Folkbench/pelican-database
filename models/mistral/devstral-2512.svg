<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#87CEEB" />

  <!-- Ground -->
  <rect x="0" y="150" width="400" height="50" fill="#228B22" />

  <!-- Bicycle -->
  <!-- Frame -->
  <path d="M100,120 L180,100 L250,120" stroke="#333" stroke-width="3" fill="none" />
  <!-- Front wheel -->
  <circle cx="120" cy="150" r="20" fill="#333" />
  <circle cx="120" cy="150" r="10" fill="#555" />
  <!-- Back wheel -->
  <circle cx="230" cy="150" r="20" fill="#333" />
  <circle cx="230" cy="150" r="10" fill="#555" />
  <!-- Pedals -->
  <circle cx="150" cy="160" r="5" fill="#333" />
  <circle cx="170" cy="160" r="5" fill="#333" />
  <!-- Handlebar -->
  <line x1="180" y1="100" x2="160" y2="80" stroke="#333" stroke-width="2" />
  <line x1="180" y1="100" x2="200" y2="80" stroke="#333" stroke-width="2" />
  <line x1="160" y1="80" x2="200" y2="80" stroke="#333" stroke-width="2" />

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="180" cy="120" rx="25" ry="15" fill="#FFF" stroke="#000" stroke-width="2" />
  <!-- Head -->
  <circle cx="210" cy="100" r="15" fill="#FFF" stroke="#000" stroke-width="2" />
  <!-- Beak -->
  <path d="M225,100 L240,95 L225,90 Z" fill="#FFA500" stroke="#000" stroke-width="1" />
  <!-- Eye -->
  <circle cx="205" cy="95" r="2" fill="#000" />
  <!-- Wing -->
  <path d="M180,120 Q160,110 150,120" fill="#DDD" stroke="#000" stroke-width="1" />
  <!-- Legs -->
  <line x1="170" y1="135" x2="165" y2="150" stroke="#000" stroke-width="2" />
  <line x1="190" y1="135" x2="185" y2="150" stroke="#000" stroke-width="2" />
  <!-- Feet -->
  <circle cx="165" cy="150" r="3" fill="#FFD700" />
  <circle cx="185" cy="150" r="3" fill="#FFD700" />

  <!-- Shadow -->
  <ellipse cx="180" cy="155" rx="30" ry="5" fill="rgba(0,0,0,0.2)" />
</svg>