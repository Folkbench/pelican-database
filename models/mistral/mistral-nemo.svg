<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <!-- Pelican body -->
  <path d="M250 100 Q200 150, 150 200 Q100 250, 150 300 Q200 350, 250 400 Q300 350, 350 300 Q400 250, 350 200 Q400 150, 250 100" fill="orange" stroke="black" stroke-width="2"/>

  <!-- Pelican head -->
  <circle cx="250" cy="100" r="50" fill="white" stroke="black" stroke-width="2"/>

  <!-- Pelican beak -->
  <path d="M250 100 Q220 120, 200 140 Q220 160, 250 180 Q280 160, 300 140 Q280 120, 250 100" fill="yellow" stroke="black" stroke-width="2"/>

  <!-- Bicycle frame -->
  <rect x="150" y="250" width="200" height="50" fill="gray" stroke="black" stroke-width="2"/>
  <line x1="150" y1="300" x2="350" y2="300" stroke="black" stroke-width="2"/>

  <!-- Bicycle wheels -->
  <circle cx="150" cy="350" r="50" fill="lightgray" stroke="black" stroke-width="2"/>
  <circle cx="350" cy="350" r="50" fill="lightgray" stroke="black" stroke-width="2"/>

  <!-- Bicycle seat -->
  <rect x="225" y="275" width="50" height="50" fill="brown" stroke="black" stroke-width="2"/>

  <!-- Bicycle handlebars -->
  <line x1="250" y1="250" x2="250" y2="275" stroke="black" stroke-width="2"/>
  <line x1="225" y1="275" x2="275" y2="275" stroke="black" stroke-width="2"/>
</svg>