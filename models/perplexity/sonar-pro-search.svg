<svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle Frame -->
  <line x1="100" y1="150" x2="200" y2="100" stroke="black" stroke-width="5"/>
  <line x1="200" y1="100" x2="300" y2="150" stroke="black" stroke-width="5"/>
  <line x1="200" y1="100" x2="225" y2="75" stroke="black" stroke-width="3"/>
  <line x1="225" y1="75" x2="250" y2="100" stroke="black" stroke-width="3"/>
  <line x1="250" y1="100" x2="225" y2="75" stroke="black" stroke-width="3"/>
  <circle cx="150" cy="150" r="30" fill="none" stroke="black" stroke-width="5"/>
  <circle cx="250" cy="150" r="30" fill="none" stroke="black" stroke-width="5"/>
  <!-- Pelican Body -->
  <ellipse cx="175" cy="120" rx="30" ry="40" fill="white" stroke="black" stroke-width="2"/>
  <!-- Pelican Head & Beak -->
  <circle cx="145" cy="100" r="20" fill="white" stroke="black" stroke-width="2"/>
  <path d="M125,100 Q110,110 100,120 L140,120 Q130,110 125,100 Z" fill="orange" stroke="black" stroke-width="1"/>
  <!-- Pelican Eye -->
  <circle cx="150" cy="95" r="3" fill="black"/>
  <!-- Pelican Feet (on pedals) -->
  <line x1="160" y1="150" x2="170" y2="170" stroke="black" stroke-width="2"/>
  <line x1="180" y1="150" x2="190" y2="170" stroke="black" stroke-width="2"/>
  <!-- Bicycle Seat -->
  <path d="M195,100 Q200,90 205,100" fill="none" stroke="black" stroke-width="3"/>
</svg>