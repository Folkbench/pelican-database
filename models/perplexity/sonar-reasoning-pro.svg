    <path d="M140 95              Q130 105 132 118              Q150 115 162 110              Q152 100 140 95 Z" fill="#dde3ea" stroke="#222" stroke-width="1.5"/>

    <polygon points="120,95 108,90 110,105" fill="#ffffff" stroke="#222" stroke-width="1.5"/>

