  <circle cx="90" cy="160" r="28" fill="#f7f7f7" stroke="#333" stroke-width="3"/>
  <circle cx="210" cy="160" r="28" fill="#f7f7f7" stroke="#333" stroke-width="3"/>

  <circle cx="90" cy="160" r="3" fill="#333"/>
  <circle cx="210" cy="160" r="3" fill="#333"/>

  <line x1="90" y1="160" x2="210" y2="160" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="160" x2="150" y2="120" stroke="#444" stroke-width="4" stroke-linecap="round"/>
  <line x1="150" y1="120" x2="210" y2="140" stroke="#444" stroke-width="4" stroke-linecap="round"/>
