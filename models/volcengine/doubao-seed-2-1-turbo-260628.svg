<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <title>Pelican Riding a Bicycle</title>
  <desc>A cheerful white pelican with an orange gular pouch rides a red cruiser bicycle, with a tiny fish peeking out of its pouch.</desc>
  
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bee3f8"/>
      <stop offset="100%" stop-color="#e6fffa"/>
    </linearGradient>
  </defs>

  <!-- Background and Ground -->
  <rect width="400" height="400" fill="url(#skyGradient)"/>
  <line x1="0" y1="380" x2="400" y2="380" stroke="#a0aec0" stroke-width="2"/>
  <ellipse cx="100" cy="378" rx="45" ry="4" fill="#a0aec0" opacity="0.3"/>
  <ellipse cx="300" cy="378" rx="45" ry="4" fill="#a0aec0" opacity="0.3"/>
  
  <!-- Grass Tufts -->
  <g stroke="#48bb78" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M50 380 l3 -8 l2 6 l3 -7 l2 9"/>
    <path d="M150 380 l2 -7 l3 5 l2 -8 l3 10"/>
    <path d="M250 380 l3 -9 l2 7 l3 -6 l2 8"/>
    <path d="M320 380 l2 -8 l3 6 l2 -7 l3 9"/>
    <path d="M380 380 l3 -7 l2 5 l3 -8 l2 10"/>
  </g>

  <!-- Back Wheel -->
  <g>
    <circle cx="100" cy="330" r="50" stroke="#2d3748" stroke-width="8" fill="none"/>
    <circle cx="100" cy="330" r="46" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <g stroke="#cbd5e0" stroke-width="1">
      <line x1="100" y1="330" x2="100" y2="284"/>
      <line x1="100" y1="330" x2="132.5" y2="297.5"/>
      <line x1="100" y1="330" x2="146" y2="330"/>
      <line x1="100" y1="330" x2="132.5" y2="362.5"/>
      <line x1="100" y1="330" x2="100" y2="376"/>
      <line x1="100" y1="330" x2="67.5" y2="362.5"/>
      <line x1="100" y1="330" x2="54" y2="330"/>
      <line x1="100" y1="330" x2="67.5" y2="297.5"/>
    </g>
    <circle cx="100" cy="330" r="3" fill="#1a202c"/>
  </g>

  <!-- Front Wheel -->
  <g>
    <circle cx="300" cy="330" r="50" stroke="#2d3748" stroke-width="8" fill="none"/>
    <circle cx="300" cy="330" r="46" stroke="#cbd5e0" stroke-width="2" fill="none"/>
    <g stroke="#cbd5e0" stroke-width="1">
      <line x1="300" y1="330" x2="300" y2="284"/>
      <line x1="300" y1="330" x2="332.5" y2="297.5"/>
      <line x1="300" y1="330" x2="346" y2="330"/>
      <line x1="300" y1="330" x2="332.5" y2="362.5"/>
      <line x1="300" y1="330" x2="300" y2="376"/>
      <line x1="300" y1="330" x2="267.5" y2="362.5"/>
      <line x1="300" y1="330" x2="254" y2="330"/>
      <line x1="300" y1="330" x2="267.5" y2="297.5"/>
    </g>
    <circle cx="300" cy="330" r="3" fill="#1a202c"/>
  </g>

  <!-- Red Cruiser Bike Frame -->
  <path d="M 180 310 L 150 200 L 260 180 L 180 310 M 180 310 L 100 330 M 150 200 L 100 330 M 260 180 L 300 330" 
    stroke="#e53e3e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Chain and Gears -->
  <circle cx="180" cy="310" r="14" stroke="#2d3748" stroke-width="2" fill="none"/>
  <circle cx="100" cy="330" r="7" stroke="#2d3748" stroke-width="2" fill="none"/>
  <line x1="180" y1="296" x2="100" y2="323" stroke="#2d3748" stroke-width="2"/>
  <line x1="180" y1="324" x2="100" y2="337" stroke="#2d3748" stroke-width="2"/>

  <!-- Bike Seat -->
  <ellipse cx="150" cy="198" rx="14" ry="7" fill="#1a202c"/>

  <!-- Pelican Far Wing (behind handlebars) -->
  <path d="M 220 145 Q 255 140, 290 155 Q 292 162, 288 165 Q 255 155, 220 158 Z" fill="#e2e8f0" stroke="#cbd5e0" stroke-width="1.5"/>

  <!-- Handlebars -->
  <line x1="260" y1="180" x2="262" y2="160" stroke="#2d3748" stroke-width="6" stroke-linecap="round"/>
  <line x1="262" y1="160" x2="230" y2="155" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
  <line x1="262" y1="160" x2="290" y2="158" stroke="#2d3748" stroke-width="5" stroke-linecap="round"/>
  <circle cx="230" cy="155" r="5" fill="#1a202c"/> <!-- Near Grip -->
  <circle cx="290" cy="158" r="5" fill="#4a5568"/> <!-- Far Grip -->
  <circle cx="262" cy="165" r="4" fill="#f6e05e" stroke="#d69e2e" stroke-width="1"/> <!-- Bell -->

  <!-- Cranks and Pedals -->
  <line x1="180" y1="310" x2="160" y2="335" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/>
  <line x1="180" y1="310" x2="200" y2="285" stroke="#4a5568" stroke-width="5" stroke-linecap="round"/>
  <ellipse cx="200" cy="285" rx="8" ry="5" fill="#4a5568"/> <!-- Far Pedal -->
  <ellipse cx="160" cy="335" rx="8" ry="5" fill="#1a202c"/> <!-- Near Pedal -->

  <!-- Pelican Body -->
  <ellipse cx="170" cy="165" rx="45" ry="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Pelican Tail -->
  <path d="M 125 165 L 105 170 L 120 180 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pelican Far Leg -->
  <line x1="185" y1="195" x2="200" y2="275" stroke="#f6ad55" stroke-width="4" stroke-linecap="round"/>
  <path d="M 195 280 L 205 280 L 210 290 L 190 292 Z" fill="#f6ad55" stroke="#dd6b20" stroke-width="1"/>

  <!-- Pelican Neck -->
  <path d="M 210 138 Q 235 120, 265 112 Q 268 122, 265 125 Q 235 140, 215 158 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Pelican Head -->
  <circle cx="275" cy="115" r="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Upper Beak -->
  <path d="M 290 108 Q 315 105, 335 113 L 332 120 Q 310 117, 290 118 Z" fill="#f6e05e" stroke="#d69e2e" stroke-width="1.5"/>

  <!-- Gular Pouch (Lower Beak) -->
  <path d="M 290 118 L 332 120 Q 310 170, 270 160 Q 262 140, 268 125 Z" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/>

  <!-- Tiny Fish in Pouch -->
  <path d="M 295 140 Q 305 138, 310 145 Q 305 152, 295 150 Q 290 145, 295 140 Z" fill="#4299e1" stroke="#2b6cb0" stroke-width="1"/>
  <circle cx="307" cy="143" r="0.8" fill="#1a202c"/>

  <!-- Pelican Near Wing (holding handlebar) -->
  <path d="M 185 132 Q 210 128, 232 148 Q 235 158, 230 168 Q 205 168, 192 158 Q 180 148, 185 132 Z" fill="#cbd5e0" stroke="#a0aec0" stroke-width="2" stroke-linejoin="round"/>

  <!-- Pelican Near Leg -->
  <line x1="170" y1="200" x2="162" y2="325" stroke="#ed8936" stroke-width="5" stroke-linecap="round"/>
  <path d="M 150 330 L 170 330 L 175 340 L 155 342 L 148 338 Z" fill="#ed8936" stroke="#c05621" stroke-width="1.5"/>

  <!-- Pelican Face Details -->
  <circle cx="278" cy="108" r="3" fill="#1a202c"/> <!-- Eye -->
  <circle cx="279" cy="107" r="1" fill="#ffffff"/> <!-- Eye Highlight -->
  <path d="M 275 97 Q 278 92, 282 97" stroke="#e2e8f0" stroke-width="2" fill="none" stroke-linecap="round"/> <!-- Head Tuft -->
</svg>