<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .bike-frame { fill: #888; stroke: #555; stroke-width: 2; }
    .bike-wheel { fill: #333; stroke: #111; stroke-width: 1; }
    .pelican-body { fill: #fff; }
    .pelican-accent { fill: #ff9933; }
    .pedals { fill: #666; }
  </style>

  <g class="bike-frame">
    <circle class="bike-wheel" cx="160" cy="200" r="35"/>
    <circle cx="160" cy="200" r="25" fill="none"/>
    <line x1="160" y1="165" x2="160" y2="235" stroke="#111" stroke-width="1"/>
    <line x1="130" y1="185" x2="190" y2="185" stroke="#111" stroke-width="1"/>
    <line x1="130" y1="195" x2="190" y2="195" stroke="#111" stroke-width="1"/>
    <line x1="130" y1="205" x2="190" y2="205" stroke="#111" stroke-width="1"/>
    <line x1="130" y1="215" x2="190" y2="215" stroke="#111" stroke-width="1"/>
    <circle cx="160" cy="200" r="5" fill="#111"/>

    <circle class="bike-wheel" cx="280" cy="200" r="35"/>
    <circle cx="280" cy="200" r="25" fill="none"/>
    <line x1="280" y1="165" x2="280" y2="235" stroke="#111" stroke-width="1"/>
    <line x1="250" y1="185" x2="310" y2="185" stroke="#111" stroke-width="1"/>
    <line x1="250" y1="195" x2="310" y2="195" stroke="#111" stroke-width="1"/>
    <line x1="250" y1="205" x2="310" y2="205" stroke="#111" stroke-width="1"/>
    <line x1="250" y1="215" x2="310" y2="215" stroke="#111" stroke-width="1"/>
    <circle cx="280" cy="200" r="5" fill="#111"/>

    <path d="M260 200 L220 120 L180 100 L170 90 L190 70 L200 50 L240 50 L250 70 L250 110 L260 120 L260 200" stroke="#555" stroke-width="8" fill="none" stroke-linejoin="round"/>
    <line x1="220" y1="120" x2="260" y2="200" stroke="#555" stroke-width="6" stroke-linejoin="round"/>

    <circle cx="180" cy="100" r="8" fill="#555"/>
    <line x1="160" y1="90" x2="200" y2="90" stroke="#555" stroke-width="6"/>
    <line x1="160" y1="95" x2="165" y2="85" stroke="#555" stroke-width="6"/>
    <line x1="200" y1="95" x2="195" y2="85" stroke="#555" stroke-width="6"/>

    <rect x="220" y="115" width="12" height="8" rx="2" ry="2" fill="#555"/>

    <g class="pedals">
      <circle cx="240" cy="180" r="6" fill="#666"/>
      <circle cx="240" cy="180" r="4" fill="#444"/>
      <line x1="240" y1="180" x2="250" y2="190" stroke="#666" stroke-width="2"/>
      
      <circle cx="220" cy="200" r="6" fill="#666"/>
      <circle cx="220" cy="200" r="4" fill="#444"/>
      <line x1="220" y1="200" x2="210" y2="210" stroke="#666" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(220, 140)">
    <ellipse class="pelican-body" cx="0" cy="0" rx="30" ry="25" stroke="#555" stroke-width="1"/>
    
    <polygon class="pelican-accent" points="0,0 -15,-5 -10,-10 0,-5"/>
    <line x1="-10" y1="-10" x2="-15" y2="-10" stroke="#555" stroke-width="1"/>
    
    <circle cx="-8" cy="-3" r="2" fill="#333"/>
    
    <polygon points="25,0 15,10 5,20 -5,25 -15,10" class="pelican-body" stroke="#555" stroke-width="1"/>
    
    <g transform="translate(-12, 22)">
      <line x1="0" y1="0" x2="10" y2="15" stroke="#555" stroke-width="2"/>
      <circle cx="10" cy="15" r="6" class="pelican-accent"/>
    </g>
    <g transform="translate(8, 20)">
      <line x1="0" y1="0" x2="-8" y2="12" stroke="#555" stroke-width="2"/>
      <circle cx="-8" cy="12" r="6" class="pelican-accent"/>
    </g>
    
    <circle cx="12" cy="15" r="2" fill="#222"/>
    <circle cx="-6" cy="12" r="2" fill="#222"/>
  </g>

  <line x1="160" y1="90" x2="145" y2="75" stroke="#ff4444" stroke-width="1"/>
  <polygon points="145,75 140,70 150,70 145,75" fill="#ff4444"/>
</svg>