<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A pelican riding a bicycle">
  <title>Pelican riding a bicycle</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b7ddf1"/>
      <stop offset="1" stop-color="#eef9fd"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc26a"/>
      <stop offset="1" stop-color="#6ca24a"/>
    </linearGradient>
    <radialGradient id="plumage" cx="0.38" cy="0.32" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8e2d2"/>
    </radialGradient>
    <path id="frame" d="M195 457 L325 445 M195 457 L309 344 M325 445 L306 334 M308 336 L521 330 M528 348 L325 445 M528 348 C540 386 552 428 564 456 M522 322 L528 348"/>
    <g id="spokes">
      <line x1="0" y1="-73" x2="0" y2="73"/>
      <line x1="0" y1="-73" x2="0" y2="73" transform="rotate(30)"/>
      <line x1="0" y1="-73" x2="0" y2="73" transform="rotate(60)"/>
      <line x1="0" y1="-73" x2="0" y2="73" transform="rotate(90)"/>
      <line x1="0" y1="-73" x2="0" y2="73" transform="rotate(120)"/>
      <line x1="0" y1="-73" x2="0" y2="73" transform="rotate(150)"/>
    </g>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="686" cy="100" r="58" fill="#ffe9a6" opacity="0.55"/>
  <circle cx="686" cy="100" r="42" fill="#ffd75e"/>
  <g fill="#ffffff">
    <g opacity="0.92">
      <ellipse cx="140" cy="118" rx="44" ry="17"/>
      <ellipse cx="112" cy="128" rx="30" ry="13"/>
      <ellipse cx="170" cy="128" rx="26" ry="11"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="480" cy="66" rx="36" ry="12"/>
      <ellipse cx="455" cy="74" rx="24" ry="10"/>
      <ellipse cx="505" cy="74" rx="22" ry="9"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="718" cy="204" rx="40" ry="14"/>
      <ellipse cx="693" cy="212" rx="26" ry="10"/>
      <ellipse cx="743" cy="212" rx="22" ry="9"/>
    </g>
  </g>

  <!-- hills, ground, shadow -->
  <path d="M-20 549 Q160 442 340 549 Z" fill="#cfe6ba"/>
  <path d="M300 549 Q570 436 830 549 Z" fill="#c2dcaa"/>
  <rect x="0" y="549" width="800" height="51" fill="url(#grass)"/>
  <rect x="0" y="549" width="800" height="5" fill="#649843"/>
  <ellipse cx="380" cy="553" rx="298" ry="13" fill="#3f6b2c" opacity="0.25"/>

  <!-- grass tufts and flowers -->
  <g stroke="#4c8a3c" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M92 552 q-4 -9 -9 -12 M98 552 q0 -11 0 -15 M104 552 q4 -8 8 -11"/>
    <path d="M256 562 q-4 -8 -8 -11 M262 562 q0 -10 0 -14 M268 562 q4 -7 7 -10"/>
    <path d="M616 560 q-4 -8 -8 -11 M622 560 q0 -10 0 -14 M628 560 q4 -7 7 -10"/>
    <path d="M736 554 q-4 -8 -8 -11 M742 554 q0 -10 0 -14 M748 554 q4 -7 7 -10"/>
  </g>
  <g>
    <circle cx="142" cy="570" r="5" fill="#fdfcf7"/><circle cx="142" cy="570" r="2.1" fill="#f2b23c"/>
    <circle cx="452" cy="576" r="4.6" fill="#f7a8b2"/><circle cx="452" cy="576" r="2" fill="#f6e27a"/>
    <circle cx="668" cy="572" r="5" fill="#fdfcf7"/><circle cx="668" cy="572" r="2.1" fill="#f2b23c"/>
    <circle cx="748" cy="578" r="4.4" fill="#f7a8b2"/><circle cx="748" cy="578" r="1.9" fill="#f6e27a"/>
  </g>

  <!-- speed lines -->
  <g stroke="#b5d7ec" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M26 236 H86 M12 272 H60 M30 314 H82 M52 468 H118"/>
  </g>

  <!-- far leg, far crank and pedal (behind the bike) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 300 Q336 318 357 358 Q332 396 288 404" fill="none" stroke="#3a362f" stroke-width="15"/>
    <path d="M298 300 Q336 318 357 358 Q332 396 288 404" fill="none" stroke="#cf7f1e" stroke-width="9"/>
    <path d="M278 396 C290 391 302 394 310 401 C313 404 312 408 307 410 C295 413 282 412 273 406 C270 402 273 398 278 396 Z" fill="#cf7f1e" stroke="#3a362f" stroke-width="3.5"/>
    <line x1="325" y1="445" x2="281" y2="412" stroke="#3a362f" stroke-width="7"/>
    <rect x="266" y="407" width="30" height="9" rx="3" fill="#4a4640"/>
  </g>

  <!-- wheels -->
  <g>
    <circle cx="195" cy="457" r="86" fill="none" stroke="#33302b" stroke-width="13"/>
    <circle cx="195" cy="457" r="73" fill="none" stroke="#b9bdb2" stroke-width="6"/>
    <circle cx="565" cy="457" r="86" fill="none" stroke="#33302b" stroke-width="13"/>
    <circle cx="565" cy="457" r="73" fill="none" stroke="#b9bdb2" stroke-width="6"/>
    <g stroke="#b9bdb2" stroke-width="2.4">
      <use href="#spokes" x="195" y="457"/>
      <use href="#spokes" x="565" y="457"/>
    </g>
  </g>

  <!-- frame -->
  <g fill="none" stroke-linecap="round">
    <use href="#frame" stroke="#1c544c" stroke-width="13"/>
    <use href="#frame" stroke="#2f9184" stroke-width="8"/>
  </g>

  <!-- stem, handlebar, grip, bell, saddle, seat post -->
  <path d="M522 322 L516 301" fill="none" stroke="#3a362f" stroke-width="7" stroke-linecap="round"/>
  <path d="M516 301 C512 293 502 292 495 299 C488 306 486 313 489 319" fill="none" stroke="#3a362f" stroke-width="7" stroke-linecap="round"/>
  <path d="M497 301 C491 306 488 313 489 319" fill="none" stroke="#d97c22" stroke-width="10" stroke-linecap="round"/>
  <circle cx="512" cy="294" r="5.5" fill="#f4c545" stroke="#8a6b1f" stroke-width="2"/>
  <line x1="312" y1="326" x2="306" y2="336" stroke="#3a362f" stroke-width="6" stroke-linecap="round"/>
  <path d="M274 316 C280 306 330 302 354 310 C358 313 357 318 352 320 C322 327 288 326 276 321 C272 319 272 318 274 316 Z" fill="#3a362f" stroke="#26231f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M282 311 C306 305 336 306 350 311" fill="none" stroke="#5b564d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- chain, sprockets, hubs, near crank and pedal -->
  <path d="M325 419 L195 444 M325 471 L195 470" fill="none" stroke="#4a4640" stroke-width="4.5" stroke-dasharray="6 4"/>
  <circle cx="195" cy="457" r="13" fill="none" stroke="#9aa39a" stroke-width="4"/>
  <circle cx="195" cy="457" r="8" fill="#c4c8bd" stroke="#3a362f" stroke-width="2.5"/>
  <circle cx="325" cy="445" r="26" fill="none" stroke="#9aa39a" stroke-width="5"/>
  <circle cx="325" cy="445" r="16" fill="none" stroke="#9aa39a" stroke-width="2" opacity="0.65"/>
  <circle cx="325" cy="445" r="6.5" fill="#9aa39a" stroke="#3a362f" stroke-width="2.5"/>
  <circle cx="565" cy="457" r="8" fill="#c4c8bd" stroke="#3a362f" stroke-width="2.5"/>
  <line x1="325" y1="445" x2="368" y2="480" stroke="#3a362f" stroke-width="8" stroke-linecap="round"/>
  <rect x="345" y="474" width="46" height="10" rx="4" fill="#3a362f"/>

  <!-- pelican: tail, body, neck, head, beak -->
  <g>
    <g fill="#d9d4c6" stroke="#3a362f" stroke-width="3" stroke-linejoin="round">
      <path d="M262 238 L156 220 L260 268 Z"/>
      <path d="M264 252 L168 248 L262 284 Z"/>
      <path d="M264 266 L190 278 L260 296 Z"/>
    </g>
    <g transform="rotate(6 305 245)">
      <ellipse cx="305" cy="245" rx="100" ry="62" fill="url(#plumage)" stroke="#3a362f" stroke-width="4"/>
      <ellipse cx="330" cy="278" rx="50" ry="22" fill="#e9e3d4" opacity="0.6"/>
      <ellipse cx="282" cy="212" rx="58" ry="22" fill="#ffffff" opacity="0.4"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path d="M378 242 C420 226 442 194 450 150" stroke="#3a362f" stroke-width="40"/>
      <path d="M378 242 C420 226 442 194 450 150" stroke="#f9f7f0" stroke-width="32"/>
    </g>
    <path d="M439 115 L427 101 L441 107 L448 94 L452 110 Z" fill="#f9f7f0" stroke="#3a362f" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="455" cy="132" rx="26" ry="23" fill="#f9f7f0" stroke="#3a362f" stroke-width="4"/>
    <circle cx="462" cy="124" r="5" fill="#2b2926"/>
    <circle cx="463.5" cy="122.5" r="1.6" fill="#ffffff"/>
    <path d="M468 116 C516 108 562 132 596 160 C601 164 601 171 594 173 C546 152 496 141 468 138 Z" fill="#f5a83b" stroke="#5f4623" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M468 138 C496 141 546 152 594 173 C588 198 546 214 505 208 C482 203 468 172 468 138 Z" fill="#f0912f" stroke="#5f4623" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M484 122 C494 119 504 120 512 124" fill="none" stroke="#5f4623" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M480 160 C500 172 530 184 560 190" fill="none" stroke="#f7b054" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- near wing reaching the handlebar -->
  <g>
    <path d="M342 245 C398 236 452 262 498 318 C480 331 438 330 402 314 C372 300 350 280 344 262 Z" fill="#f2efe4" stroke="#3a362f" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M382 258 C428 255 462 278 486 305" fill="none" stroke="#d8d2c2" stroke-width="3" stroke-linecap="round"/>
    <path d="M372 276 C412 276 442 294 464 312" fill="none" stroke="#d8d2c2" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="493" cy="317" rx="12" ry="8.5" fill="#f2efe4" stroke="#3a362f" stroke-width="3" transform="rotate(-24 493 317)"/>
  </g>

  <!-- near leg and webbed foot on the pedal -->
  <g>
    <path d="M306 308 Q322 336 335 368 Q348 420 361 466" fill="none" stroke="#3a362f" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M306 308 Q322 336 335 368 Q348 420 361 466" fill="none" stroke="#eb9a2e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M353 462 C366 457 380 459 392 467 C396 470 395 474 391 477 C376 480 362 479 350 473 C347 469 349 464 353 462 Z" fill="#eb9a2e" stroke="#3a362f" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M366 462 L386 471 M369 468 L388 477" fill="none" stroke="#5f4623" stroke-width="1.6" opacity="0.55"/>
  </g>
</svg>