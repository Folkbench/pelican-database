<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect y="220" width="400" height="80" fill="#90EE90"/>
  
  <!-- Bicycle wheels -->
  <circle cx="120" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="280" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Wheel spokes -->
  <g stroke="#666" stroke-width="1">
    <line x1="120" y1="185" x2="120" y2="255"/>
    <line x1="85" y1="220" x2="155" y2="220"/>
    <line x1="92" y1="192" x2="148" y2="248"/>
    <line x1="92" y1="248" x2="148" y2="192"/>
    
    <line x1="280" y1="185" x2="280" y2="255"/>
    <line x1="245" y1="220" x2="315" y2="220"/>
    <line x1="252" y1="192" x2="308" y2="248"/>
    <line x1="252" y1="248" x2="308" y2="192"/>
  </g>
  
  <!-- Frame -->
  <line x1="120" y1="220" x2="200" y2="140" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="140" x2="280" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="140" x2="120" y2="220" stroke="#333" stroke-width="4"/>
  <line x1="200" y1="140" x2="280" y2="220" stroke="#333" stroke-width="4"/>
  
  <!-- Handlebars -->
  <line x1="200" y1="140" x2="200" y2="110" stroke="#333" stroke-width="3"/>
  <line x1="175" y1="110" x2="225" y2="110" stroke="#333" stroke-width="3"/>
  
  <!-- Seat -->
  <ellipse cx="200" cy="135" rx="20" ry="8" fill="#8B4513"/>
  
  <!-- Pedals and cranks -->
  <circle cx="200" cy="160" r="3" fill="#333"/>
  <line x1="200" y1="160" x2="190" y2="175" stroke="#333" stroke-width="2"/>
  <circle cx="190" cy="175" r="4" fill="#666"/>
  <line x1="200" y1="160" x2="210" y2="145" stroke="#333" stroke-width="2"/>
  <circle cx="210" cy="145" r="4" fill="#666"/>
  
  <!-- Pelican body -->
  <ellipse cx="200" cy="120" rx="35" ry="40" fill="#F5DEB3"/>
  
  <!-- Pelican head -->
  <circle cx="220" cy="85" r="18" fill="#F5DEB3"/>
  
  <!-- Pelican eye -->
  <circle cx="226" cy="82" r="3" fill="#000"/>
  <circle cx="227" cy="81" r="1" fill="#fff"/>
  
  <!-- Pelican beak/pouch -->
  <path d="M 235 85 Q 270 90 275 95 Q 270 92 235 88 Z" fill="#FFB6C1"/>
  <path d="M 235 85 Q 270 90 275 95 Q 270 100 235 98 Z" fill="#FFC0CB"/>
  
  <!-- Pelican neck -->
  <path d="M 225 100 Q 215 110 200 120" stroke="#F5DEB3" stroke-width="12" fill="none"/>
  
  <!-- Pelican wings -->
  <ellipse cx="175" cy="115" rx="20" ry="35" fill="#DEB887" transform="rotate(-30 175 115)"/>
  <ellipse cx="225" cy="115" rx="20" ry="35" fill="#D2B48C" transform="rotate(30 225 115)"/>
  
  <!-- Pelican legs -->
  <line x1="195" y1="155" x2="195" y2="210" stroke="#FF8C00" stroke-width="3"/>
  <line x1="205" y1="155" x2="205" y2="210" stroke="#FF8C00" stroke-width="3"/>
  
  <!-- Pelican feet -->
  <circle cx="195" cy="212" r="4" fill="#FF8C00"/>
  <circle cx="205" cy="212" r="4" fill="#FF8C00"/>
  
  <!-- Motion lines -->
  <line x1="40" y1="140" x2="70" y2="140" stroke="#333" stroke-width="2" opacity="0.5"/>
  <line x1="30" y1="160" x2="60" y2="160" stroke="#333" stroke-width="2" opacity="0.5"/>
  <line x1="50" y1="120" x2="80" y2="120" stroke="#333" stroke-width="2" opacity="0.5"/>
</svg>