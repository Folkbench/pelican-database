<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- background -->
  <rect width="400" height="300" fill="#dff3ff"/>
  <rect y="245" width="400" height="55" fill="#8bc773"/>

  <!-- sun -->
  <circle cx="340" cy="50" r="25" fill="#ffe066"/>

  <!-- bicycle wheels -->
  <g fill="none" stroke="#333" stroke-width="5">
    <circle cx="110" cy="205" r="40"/>
    <circle cx="290" cy="205" r="40"/>
  </g>
  <g stroke="#999" stroke-width="1.5">
    <line x1="110" y1="165" x2="110" y2="245"/>
    <line x1="70" y1="205" x2="150" y2="205"/>
    <line x1="290" y1="165" x2="290" y2="245"/>
    <line x1="250" y1="205" x2="330" y2="205"/>
  </g>

  <!-- bicycle frame -->
  <g stroke="#d62828" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 205 L170 140 L250 140 L290 205"/>
    <path d="M110 205 L195 205 L170 140"/>
    <path d="M195 205 L250 140"/>
    <path d="M250 140 L245 120 M235 120 L265 120"/>
  </g>
  <!-- seat -->
  <path d="M155 133 h35" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <!-- pedal crank -->
  <circle cx="195" cy="205" r="8" fill="#555"/>
  <line x1="195" y1="205" x2="210" y2="228" stroke="#222" stroke-width="5"/>
  <rect x="204" y="226" width="18" height="5" fill="#222"/>

  <!-- pelican body -->
  <ellipse cx="180" cy="105" rx="42" ry="32" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <!-- tail -->
  <path d="M143 105 L115 120 L145 125 Z" fill="#eee" stroke="#bbb" stroke-width="2"/>
  <!-- wing -->
  <path d="M155 95 Q185 90 205 112 Q180 130 155 115 Z" fill="#cfd8dc" stroke="#90a4ae" stroke-width="2"/>

  <!-- neck -->
  <path d="M208 95 Q235 80 228 55" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="228" cy="48" r="16" fill="#fff" stroke="#bbb" stroke-width="2"/>
  <!-- eye -->
  <circle cx="233" cy="43" r="3" fill="#000"/>
  <!-- beak -->
  <path d="M240 45 L300 55 L240 62 Z" fill="#ffb703" stroke="#e08e00" stroke-width="2"/>
  <path d="M240 62 Q272 90 300 55 Z" fill="#f4a261" stroke="#e08e00" stroke-width="2"/>

  <!-- legs -->
  <g stroke="#f4a261" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M175 133 L190 175 L212 226"/>
    <path d="M195 130 L230 160 L185 190"/>
  </g>
  <!-- arm/wing to handlebar -->
  <path d="M205 105 Q240 110 250 122" stroke="#cfd8dc" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>