<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="340" cy="50" r="30" fill="#FFD700"/>
  <!-- Ground -->
  <rect x="0" y="250" width="400" height="50" fill="#7CFC00"/>
  <!-- Road -->
  <rect x="0" y="262" width="400" height="8" fill="#555"/>

  <!-- Back wheel -->
  <circle cx="110" cy="220" r="40" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="110" cy="220" r="5" fill="#222"/>
  <!-- Front wheel -->
  <circle cx="260" cy="220" r="40" fill="none" stroke="#222" stroke-width="6"/>
  <circle cx="260" cy="220" r="5" fill="#222"/>

  <!-- Spokes back -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="110" y1="180" x2="110" y2="260"/>
    <line x1="70" y1="220" x2="150" y2="220"/>
    <line x1="82" y1="192" x2="138" y2="248"/>
    <line x1="138" y1="192" x2="82" y2="248"/>
  </g>
  <!-- Spokes front -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="260" y1="180" x2="260" y2="260"/>
    <line x1="220" y1="220" x2="300" y2="220"/>
    <line x1="232" y1="192" x2="288" y2="248"/>
    <line x1="288" y1="192" x2="232" y2="248"/>
  </g>

  <!-- Frame -->
  <polyline points="110,220 185,220 260,220" fill="none" stroke="#D62828" stroke-width="6"/>
  <polyline points="110,220 150,150 230,150 260,220" fill="none" stroke="#D62828" stroke-width="6" stroke-linejoin="round"/>
  <line x1="185" y1="220" x2="230" y2="150" stroke="#D62828" stroke-width="6"/>
  <!-- Seat -->
  <line x1="138" y1="140" x2="165" y2="140" stroke="#222" stroke-width="7" stroke-linecap="round"/>
  <line x1="150" y1="150" x2="142" y2="140" stroke="#D62828" stroke-width="5"/>
  <!-- Handlebar stem and bars -->
  <line x1="230" y1="150" x2="240" y2="115" stroke="#444" stroke-width="5"/>
  <path d="M240,115 L255,112" stroke="#444" stroke-width="5" stroke-linecap="round"/>

  <!-- Pelican body -->
  <ellipse cx="185" cy="115" rx="45" ry="28" fill="#F5F5F5" stroke="#888" stroke-width="2"/>
  <!-- Wing -->
  <path d="M150,105 Q175,80 215,105 Q185,118 150,105 Z" fill="#DDDDDD" stroke="#888" stroke-width="2"/>
  <!-- Neck -->
  <path d="M215,105 Q232,80 230,60" fill="none" stroke="#F5F5F5" stroke-width="14" stroke-linecap="round"/>
  <path d="M215,105 Q232,80 230,60" fill="none" stroke="#888" stroke-width="1" transform="translate(7,0)"/>
  <!-- Head -->
  <circle cx="232" cy="52" r="16" fill="#F5F5F5" stroke="#888" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="237" cy="48" r="3" fill="#111"/>
  <circle cx="238" cy="47" r="1" fill="#FFF"/>
  <!-- Beak with pouch -->
  <path d="M246,50 L290,58 Q280,72 262,70 Q252,64 246,58 Z" fill="#FF9F1C" stroke="#C97000" stroke-width="2"/>
  <path d="M248,58 Q262,72 268,70 Q258,64 248,58 Z" fill="#FFB84D"/>
  <!-- Legs -->
  <line x1="175" y1="140" x2="185" y2="175" stroke="#FF9F1C" stroke-width="4"/>
  <line x1="185" y1="175" x2="172" y2="180" stroke="#FF9F1C" stroke-width="4"/>
  <line x1="185" y1="175" x2="200" y2="180" stroke="#FF9F1C" stroke-width="4"/>
  <!-- Pedal crank -->
  <circle cx="185" cy="220" r="8" fill="#444"/>
  <line x1="185" y1="220" x2="185" y2="195" stroke="#444" stroke-width="4"/>
  <!-- Tail -->
  <path d="M140,108 L118,98 L125,115 Z" fill="#CCCCCC" stroke="#888" stroke-width="1.5"/>
</svg>