<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle Frame -->
  <line x1="100" y1="200" x2="200" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="200" x2="280" y2="200" stroke="#333" stroke-width="3"/>
  <line x1="200" y1="200" x2="150" y2="120" stroke="#333" stroke-width="3"/>
  <line x1="150" y1="120" x2="100" y2="200" stroke="#333" stroke-width="3"/>
  
  <!-- Wheels -->
  <circle cx="100" cy="200" r="40" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="200" r="35" fill="none" stroke="#666" stroke-width="1"/>
  <circle cx="280" cy="200" r="40" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="280" cy="200" r="35" fill="none" stroke="#666" stroke-width="1"/>
  
  <!-- Spokes -->
  <line x1="100" y1="160" x2="100" y2="240" stroke="#999" stroke-width="1"/>
  <line x1="60" y1="200" x2="140" y2="200" stroke="#999" stroke-width="1"/>
  <line x1="280" y1="160" x2="280" y2="240" stroke="#999" stroke-width="1"/>
  <line x1="240" y1="200" x2="320" y2="200" stroke="#999" stroke-width="1"/>
  
  <!-- Handlebars -->
  <line x1="150" y1="120" x2="140" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="100" x2="130" y2="100" stroke="#333" stroke-width="2"/>
  <line x1="140" y1="100" x2="150" y2="100" stroke="#333" stroke-width="2"/>
  
  <!-- Seat -->
  <ellipse cx="165" cy="110" rx="12" ry="8" fill="#8B4513"/>
  
  <!-- Pedals and Crank -->
  <circle cx="200" cy="200" r="5" fill="#333"/>
  <line x1="200" y1="200" x2="210" y2="185" stroke="#333" stroke-width="2"/>
  <circle cx="210" cy="185" r="4" fill="#666"/>
  
  <!-- Pelican Body -->
  <ellipse cx="170" cy="130" rx="35" ry="45" fill="#E8D5B7"/>
  
  <!-- Pelican Neck -->
  <path d="M 180 100 Q 185 70 190 50" stroke="#E8D5B7" stroke-width="18" fill="none" stroke-linecap="round"/>
  
  <!-- Pelican Head -->
  <circle cx="195" cy="35" r="18" fill="#E8D5B7"/>
  
  <!-- Pelican Eye -->
  <circle cx="205" cy="30" r="3" fill="#000"/>
  <circle cx="206" cy="29" r="1" fill="#fff"/>
  
  <!-- Pelican Beak (Pouch) -->
  <path d="M 210 35 Q 240 40 245 50 Q 240 45 210 40 Z" fill="#D4A574"/>
  <path d="M 210 35 L 245 50 Q 250 60 240 65 Q 210 50 210 40 Z" fill="#C9935E" opacity="0.6"/>
  
  <!-- Pelican Wing -->
  <path d="M 150 140 Q 120 120 110 160 Q 120 150 150 160 Z" fill="#D4A574"/>
  
  <!-- Pelican Tail -->
  <path d="M 140 170 L 110 190 L 115 175 Z" fill="#D4A574"/>
  
  <!-- Pelican Legs on Pedals -->
  <line x1="175" y1="175" x2="200" y2="185" stroke="#E8D5B7" stroke-width="6" stroke-linecap="round"/>
  <line x1="175" y1="175" x2="195" y2="210" stroke="#E8D5B7" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Pelican Feet -->
  <circle cx="200" cy="185" r="4" fill="#FF8C00"/>
  <circle cx="195" cy="210" r="4" fill="#FF8C00"/>
</svg>