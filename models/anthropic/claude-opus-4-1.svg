<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="450" fill="#87CEEB"/>
  
  <!-- Ground -->
  <rect x="0" y="450" width="800" height="150" fill="#90EE90"/>
  
  <!-- Bicycle -->
  <!-- Back wheel -->
  <circle cx="250" cy="450" r="60" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="250" cy="450" r="50" fill="none" stroke="#666" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="250" y1="390" x2="250" y2="510" stroke="#666" stroke-width="2"/>
  <line x1="190" y1="450" x2="310" y2="450" stroke="#666" stroke-width="2"/>
  <line x1="210" y1="410" x2="290" y2="490" stroke="#666" stroke-width="2"/>
  <line x1="210" y1="490" x2="290" y2="410" stroke="#666" stroke-width="2"/>
  
  <!-- Front wheel -->
  <circle cx="500" cy="450" r="60" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="500" cy="450" r="50" fill="none" stroke="#666" stroke-width="2"/>
  <!-- Spokes -->
  <line x1="500" y1="390" x2="500" y2="510" stroke="#666" stroke-width="2"/>
  <line x1="440" y1="450" x2="560" y2="450" stroke="#666" stroke-width="2"/>
  <line x1="460" y1="410" x2="540" y2="490" stroke="#666" stroke-width="2"/>
  <line x1="460" y1="490" x2="540" y2="410" stroke="#666" stroke-width="2"/>
  
  <!-- Frame -->
  <line x1="250" y1="450" x2="375" y2="350" stroke="#FF4500" stroke-width="6"/>
  <line x1="500" y1="450" x2="375" y2="350" stroke="#FF4500" stroke-width="6"/>
  <line x1="375" y1="350" x2="375" y2="280" stroke="#FF4500" stroke-width="6"/>
  <line x1="250" y1="450" x2="350" y2="280" stroke="#FF4500" stroke-width="6"/>
  <line x1="350" y1="280" x2="500" y2="280" stroke="#FF4500" stroke-width="6"/>
  
  <!-- Pedals -->
  <ellipse cx="375" cy="380" rx="30" ry="15" fill="#333" transform="rotate(20 375 380)"/>
  <line x1="360" y1="370" x2="390" y2="390" stroke="#666" stroke-width="4"/>
  
  <!-- Handlebars -->
  <line x1="500" y1="280" x2="480" y2="250" stroke="#333" stroke-width="5"/>
  <line x1="500" y1="280" x2="520" y2="250" stroke="#333" stroke-width="5"/>
  <circle cx="480" cy="250" r="8" fill="#8B4513"/>
  <circle cx="520" cy="250" r="8" fill="#8B4513"/>
  
  <!-- Seat -->
  <ellipse cx="350" cy="270" rx="35" ry="15" fill="#8B4513"/>
  
  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="350" cy="220" rx="80" ry="60" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  
  <!-- Wing (visible) -->
  <path d="M 330 200 Q 280 180, 260 200 Q 270 220, 300 230 L 330 220 Z" fill="#F0F0F0" stroke="#CCC" stroke-width="2"/>
  
  <!-- Neck -->
  <rect x="410" y="180" width="35" height="70" rx="15" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  
  <!-- Head -->
  <ellipse cx="445" cy="160" rx="35" ry="30" fill="#FFF" stroke="#DDD" stroke-width="2"/>
  
  <!-- Beak with pouch -->
  <path d="M 475 160 L 550 165 L 545 175 L 470 170 Z" fill="#FFA500" stroke="#FF8C00" stroke-width="2"/>
  <!-- Pouch -->
  <path d="M 470 170 Q 510 200, 545 175" fill="#FFD700" stroke="#FFA500" stroke-width="2" opacity="0.8"/>
  
  <!-- Eye -->
  <circle cx="455" cy="155" r="8" fill="#000"/>
  <circle cx="457" cy="153" r="3" fill="#FFF"/>
  
  <!-- Pelican's legs on pedals -->
  <line x1="340" y1="270" x2="360" y2="370" stroke="#FFA500" stroke-width="6"/>
  <line x1="360" y1="270" x2="390" y2="370" stroke="#FFA500" stroke-width="6"/>
  
  <!-- Feet -->
  <ellipse cx="360" cy="375" rx="15" ry="8" fill="#FFA500"/>
  <ellipse cx="390" cy="375" rx="15" ry="8" fill="#FFA500"/>
  
  <!-- Wings holding handlebars -->
  <line x1="390" y1="200" x2="480" y2="250" stroke="#F0F0F0" stroke-width="12" stroke-linecap="round"/>
  <line x1="390" y1="200" x2="520" y2="250" stroke="#F0F0F0" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#FFD700"/>
  <g transform="translate(700, 100)">
    <line x1="0" y1="-70" x2="0" y2="-90" stroke="#FFD700" stroke-width="4"/>
    <line x1="50" y1="-50" x2="64" y2="-64" stroke="#FFD700" stroke-width="4"/>
    <line x1="70" y1="0" x2="90" y2="0" stroke="#FFD700" stroke-width="4"/>
    <line x1="50" y1="50" x2="64" y2="64" stroke="#FFD700" stroke-width="4"/>
    <line x1="0" y1="70" x2="0" y2="90" stroke="#FFD700" stroke-width="4"/>
    <line x1="-50" y1="50" x2="-64" y2="64" stroke="#FFD700" stroke-width="4"/>
    <line x1="-70" y1="0" x2="-90" y2="0" stroke="#FFD700" stroke-width="4"/>
    <line x1="-50" y1="-50" x2="-64" y2="-64" stroke="#FFD700" stroke-width="4"/>
  </g>
  
  <!-- Clouds -->
  <ellipse cx="150" cy="80" rx="40" ry="25" fill="#FFF" opacity="0.8"/>
  <ellipse cx="180" cy="75" rx="35" ry="20" fill="#FFF" opacity="0.8"/>
  <ellipse cx="120" cy="75" rx="35" ry="20" fill="#FFF" opacity="0.8"/>
  
  <ellipse cx="550" cy="120" rx="40" ry="25" fill="#FFF" opacity="0.8"/>
  <ellipse cx="580" cy="115" rx="35" ry="20" fill="#FFF" opacity="0.8"/>
  <ellipse cx="520" cy="115" rx="35" ry="20" fill="#FFF" opacity="0.8"/>
  
  <!-- Motion lines -->
  <line x1="150" y1="220" x2="100" y2="220" stroke="#87CEEB" stroke-width="3" opacity="0.6"/>
  <line x1="150" y1="240" x2="90" y2="240" stroke="#87CEEB" stroke-width="3" opacity="0.6"/>
  <line x1="150" y1="260" x2="100" y2="260" stroke="#87CEEB" stroke-width="3" opacity="0.6"/>
</svg>