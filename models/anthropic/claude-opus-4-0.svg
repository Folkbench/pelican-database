<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle Frame -->
  <g id="bicycle">
    <!-- Back wheel -->
    <circle cx="120" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="120" cy="220" r="30" fill="none" stroke="#666" stroke-width="1"/>
    <!-- Spokes -->
    <line x1="120" y1="185" x2="120" y2="255" stroke="#666" stroke-width="1"/>
    <line x1="85" y1="220" x2="155" y2="220" stroke="#666" stroke-width="1"/>
    
    <!-- Front wheel -->
    <circle cx="260" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="260" cy="220" r="30" fill="none" stroke="#666" stroke-width="1"/>
    <!-- Spokes -->
    <line x1="260" y1="185" x2="260" y2="255" stroke="#666" stroke-width="1"/>
    <line x1="225" y1="220" x2="295" y2="220" stroke="#666" stroke-width="1"/>
    
    <!-- Frame -->
    <line x1="120" y1="220" x2="180" y2="160" stroke="#d42" stroke-width="4"/>
    <line x1="180" y1="160" x2="260" y2="220" stroke="#d42" stroke-width="4"/>
    <line x1="180" y1="160" x2="180" y2="120" stroke="#d42" stroke-width="4"/>
    <line x1="260" y1="220" x2="240" y2="140" stroke="#d42" stroke-width="4"/>
    
    <!-- Seat -->
    <ellipse cx="180" cy="115" rx="25" ry="8" fill="#8B4513"/>
    
    <!-- Handlebars -->
    <line x1="240" y1="140" x2="235" y2="125" stroke="#333" stroke-width="3"/>
    <line x1="225" y1="125" x2="245" y2="125" stroke="#333" stroke-width="3"/>
    
    <!-- Pedals -->
    <circle cx="180" cy="190" r="15" fill="none" stroke="#333" stroke-width="2"/>
    <line x1="170" y1="185" x2="190" y2="195" stroke="#333" stroke-width="3"/>
  </g>
  
  <!-- Pelican -->
  <g id="pelican">
    <!-- Body -->
    <ellipse cx="180" cy="100" rx="40" ry="35" fill="#f5f5f5"/>
    
    <!-- Wing -->
    <path d="M 150 100 Q 120 90, 110 110 Q 120 120, 150 115" fill="#e0e0e0"/>
    <path d="M 210 100 Q 240 90, 250 110 Q 240 120, 210 115" fill="#e0e0e0"/>
    
    <!-- Neck -->
    <rect x="170" y="70" width="20" height="35" rx="10" fill="#f5f5f5"/>
    
    <!-- Head -->
    <ellipse cx="180" cy="60" rx="20" ry="18" fill="#f5f5f5"/>
    
    <!-- Beak -->
    <path d="M 160 60 L 130 65 L 135 75 L 165 70 Z" fill="#ff9500"/>
    <!-- Pouch -->
    <path d="M 165 70 Q 150 85, 160 85 L 165 70" fill="#ffb84d" opacity="0.7"/>
    
    <!-- Eye -->
    <circle cx="175" cy="58" r="3" fill="#000"/>
    <circle cx="176" cy="57" r="1" fill="#fff"/>
    
    <!-- Feet on pedals -->
    <g id="feet">
      <!-- Left foot -->
      <path d="M 170 130 L 165 180 L 170 185 L 175 180 Z" fill="#ff9500"/>
      <path d="M 165 180 L 160 185 M 170 185 L 168 190 M 175 180 L 180 185" 
            stroke="#ff9500" stroke-width="2" fill="none"/>
      
      <!-- Right foot -->
      <path d="M 190 130 L 195 190 L 190 195 L 185 190 Z" fill="#ff9500"/>
      <path d="M 195 190 L 200 195 M 190 195 L 192 200 M 185 190 L 180 195" 
            stroke="#ff9500" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Wing holding handlebar -->
    <ellipse cx="235" cy="125" rx="8" ry="5" fill="#e0e0e0" transform="rotate(-20 235 125)"/>
  </g>
</svg>