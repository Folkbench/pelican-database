<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#B0E0E6"/>
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#8FBC8F"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="3" fill="none">
    <!-- Wheels -->
    <circle cx="130" cy="230" r="35"/>
    <circle cx="270" cy="230" r="35"/>
    <!-- Spokes -->
    <line x1="130" y1="230" x2="130" y2="195"/>
    <line x1="130" y1="230" x2="130" y2="265"/>
    <line x1="130" y1="230" x2="100" y2="230"/>
    <line x1="130" y1="230" x2="160" y2="230"/>
    <line x1="270" y1="230" x2="270" y2="195"/>
    <line x1="270" y1="230" x2="270" y2="265"/>
    <line x1="270" y1="230" x2="240" y2="230"/>
    <line x1="270" y1="230" x2="300" y2="230"/>
    <!-- Frame -->
    <line x1="130" y1="230" x2="190" y2="180"/>
    <line x1="190" y1="180" x2="270" y2="230"/>
    <line x1="190" y1="180" x2="200" y2="150"/>
    <line x1="130" y1="230" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="230" y2="150"/>
    <!-- Seat post -->
    <line x1="190" y1="180" x2="185" y2="150"/>
    <!-- Seat -->
    <ellipse cx="182" cy="148" rx="12" ry="5" fill="#333"/>
    <!-- Handlebar post -->
    <line x1="230" y1="150" x2="235" y2="120"/>
    <!-- Handlebar -->
    <line x1="215" y1="118" x2="255" y2="118"/>
    <!-- Pedal crank -->
    <circle cx="190" cy="180" r="6" fill="#333"/>
    <line x1="190" y1="180" x2="205" y2="195"/>
    <line x1="190" y1="180" x2="175" y2="165"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Body -->
    <ellipse cx="195" cy="110" rx="35" ry="28" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    <!-- Tail feathers -->
    <path d="M 160 105 L 140 95 L 145 115 Z" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    
    <!-- Wing -->
    <path d="M 190 95 Q 165 100 170 130 Q 195 125 200 100 Z" fill="#E0E0E0" stroke="#333" stroke-width="2"/>
    
    <!-- Leg to pedal -->
    <line x1="200" y1="135" x2="205" y2="195" stroke="#FFA500" stroke-width="4"/>
    <line x1="185" y1="135" x2="175" y2="165" stroke="#FFA500" stroke-width="4"/>
    
    <!-- Neck -->
    <path d="M 220 95 Q 240 80 250 100 Q 255 110 245 115" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 222 90 Q 245 75 253 98 Q 258 112 247 118 Q 235 120 225 105 Z" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    
    <!-- Head -->
    <circle cx="250" cy="90" r="16" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    
    <!-- Beak (upper) -->
    <path d="M 264 85 Q 300 82 310 90 Q 300 95 264 95 Z" fill="#FFA500" stroke="#333" stroke-width="2"/>
    <!-- Beak pouch (lower) -->
    <path d="M 264 95 Q 295 100 305 108 Q 290 112 264 100 Z" fill="#FF8C00" stroke="#333" stroke-width="2"/>
    
    <!-- Eye -->
    <circle cx="253" cy="86" r="2.5" fill="#000"/>
    
    <!-- Hands/wings gripping handlebar -->
    <ellipse cx="225" cy="118" rx="8" ry="12" fill="#F5F5F5" stroke="#333" stroke-width="2"/>
    <line x1="222" y1="122" x2="220" y2="118" stroke="#333" stroke-width="2"/>
  </g>

  <!-- Ground line detail -->
  <line x1="0" y1="265" x2="400" y2="265" stroke="#556B2F" stroke-width="2"/>
</svg>