<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#eafaf7"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe6ee"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffcf5c"/>
      <stop offset="100%" stop-color="#ffab2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="700" cy="90" r="42" fill="#fff3b0" opacity="0.9"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="110" rx="52" ry="26"/>
    <ellipse cx="180" cy="98" rx="38" ry="24"/>
    <ellipse cx="100" cy="100" rx="32" ry="20"/>
    <ellipse cx="430" cy="70" rx="44" ry="22"/>
    <ellipse cx="465" cy="62" rx="30" ry="18"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#9fd98a"/>
  <line x1="0" y1="522" x2="800" y2="522" stroke="#6fb85c" stroke-width="4"/>

  <!-- Motion lines -->
  <g stroke="#7fc7e8" stroke-width="5" stroke-linecap="round" opacity="0.7">
    <line x1="40" y1="300" x2="110" y2="300"/>
    <line x1="20" y1="350" x2="100" y2="350"/>
    <line x1="55" y1="400" x2="115" y2="400"/>
  </g>

  <!-- ================= BICYCLE ================= -->
  <g>
    <!-- Rear wheel -->
    <g>
      <circle cx="220" cy="430" r="86" fill="none" stroke="#222" stroke-width="9"/>
      <circle cx="220" cy="430" r="78" fill="none" stroke="#b9c2cc" stroke-width="4"/>
      <g stroke="#cfd6de" stroke-width="3">
        <line x1="220" y1="430" x2="220" y2="352"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(45 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(90 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(135 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(180 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(225 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(270 220 430)"/>
        <line x1="220" y1="430" x2="220" y2="352" transform="rotate(315 220 430)"/>
      </g>
      <circle cx="220" cy="430" r="8" fill="#555"/>
    </g>

    <!-- Front wheel -->
    <g>
      <circle cx="580" cy="430" r="86" fill="none" stroke="#222" stroke-width="9"/>
      <circle cx="580" cy="430" r="78" fill="none" stroke="#b9c2cc" stroke-width="4"/>
      <g stroke="#cfd6de" stroke-width="3">
        <line x1="580" y1="430" x2="580" y2="352"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(45 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(90 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(135 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(180 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(225 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(270 580 430)"/>
        <line x1="580" y1="430" x2="580" y2="352" transform="rotate(315 580 430)"/>
      </g>
      <circle cx="580" cy="430" r="8" fill="#555"/>
    </g>

    <!-- Chain -->
    <g stroke="#7a7f87" stroke-width="4" fill="none">
      <line x1="220" y1="422" x2="390" y2="422"/>
      <line x1="220" y1="438" x2="390" y2="438"/>
    </g>
    <circle cx="220" cy="430" r="16" fill="none" stroke="#7a7f87" stroke-width="4"/>

    <!-- Frame -->
    <g stroke="#e2492f" stroke-width="12" stroke-linecap="round" fill="none">
      <line x1="220" y1="430" x2="390" y2="430"/>   <!-- chainstay -->
      <line x1="220" y1="430" x2="332" y2="300"/>   <!-- seatstay -->
      <line x1="390" y1="430" x2="332" y2="300"/>   <!-- seat tube -->
      <line x1="332" y1="300" x2="508" y2="296"/>   <!-- top tube -->
      <line x1="390" y1="430" x2="516" y2="318"/>   <!-- down tube -->
      <line x1="508" y1="296" x2="524" y2="330"/>   <!-- head tube -->
      <line x1="520" y1="322" x2="580" y2="430"/>   <!-- fork -->
    </g>

    <!-- Seat post & saddle -->
    <line x1="332" y1="300" x2="326" y2="280" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <path d="M 286 280 Q 326 264 366 276 Q 340 292 300 290 Z" fill="#3b2b22"/>

    <!-- Handlebar -->
    <path d="M 508 296 L 506 258 Q 506 244 522 244 L 548 244" fill="none" stroke="#444" stroke-width="9" stroke-linecap="round"/>
    <line x1="534" y1="244" x2="556" y2="244" stroke="#222" stroke-width="13" stroke-linecap="round"/>

    <!-- Crank & pedals -->
    <circle cx="390" cy="430" r="20" fill="none" stroke="#7a7f87" stroke-width="5"/>
    <circle cx="390" cy="430" r="7" fill="#555"/>
    <line x1="390" y1="430" x2="364" y2="468" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <line x1="390" y1="430" x2="416" y2="392" stroke="#444" stroke-width="8" stroke-linecap="round"/>
    <rect x="348" y="464" width="34" height="10" rx="3" fill="#222"/>
    <rect x="400" y="388" width="34" height="10" rx="3" fill="#222"/>
  </g>

  <!-- ================= PELICAN ================= -->
  <g>
    <!-- Legs -->
    <g stroke="#f0912c" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M 348 300 L 356 372 L 366 456"/>
      <path d="M 366 296 L 392 352 L 414 382"/>
    </g>
    <!-- Feet -->
    <path d="M 366 456 l -18 12 l 20 4 l 16 -6 z" fill="#f7a63d" stroke="#d9821f" stroke-width="2"/>
    <path d="M 414 382 l -16 12 l 20 4 l 16 -8 z" fill="#f7a63d" stroke="#d9821f" stroke-width="2"/>

    <!-- Tail feathers -->
    <path d="M 262 246 L 190 236 L 236 262 L 186 272 L 252 282 Z" fill="#e6ecf2" stroke="#c2cad3" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="330" cy="248" rx="84" ry="62" fill="url(#bodyGrad)" stroke="#c2cad3" stroke-width="3"/>

    <!-- Neck -->
    <path d="M 372 206 Q 392 150 440 138 L 462 176 Q 414 190 400 236 Z" fill="#ffffff" stroke="#c2cad3" stroke-width="3"/>

    <!-- Head -->
    <circle cx="461" cy="152" r="38" fill="#ffffff" stroke="#c2cad3" stroke-width="3"/>
    <!-- Crest -->
    <path d="M 442 118 q 6 -22 24 -26 q -10 12 -6 24 z" fill="#f3f6f9" stroke="#c2cad3" stroke-width="2"/>

    <!-- Pouch -->
    <path d="M 478 168 Q 500 246 566 224 Q 606 208 630 188 L 632 176 Z" fill="#f79a2b" stroke="#d9821f" stroke-width="3"/>
    <!-- Upper beak -->
    <path d="M 476 136 Q 560 142 634 172 Q 638 180 630 186 Q 556 166 478 166 Z" fill="url(#beakGrad)" stroke="#d9821f" stroke-width="3"/>
    <line x1="500" y1="145" x2="620" y2="176" stroke="#e08f22" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="470" cy="140" r="9" fill="#ffffff" stroke="#b9c2cc" stroke-width="1.5"/>
    <circle cx="472" cy="141" r="5.5" fill="#20242b"/>
    <circle cx="474" cy="139" r="1.8" fill="#ffffff"/>

    <!-- Wing (reaching to handlebar) -->
    <path d="M 316 206 Q 380 186 436 226 Q 486 258 534 250 Q 532 266 506 270 Q 452 278 402 262 Q 344 244 316 206 Z"
          fill="#eef3f8" stroke="#c2cad3" stroke-width="3"/>
    <path d="M 352 216 Q 404 226 444 246" fill="none" stroke="#cfd8e2" stroke-width="3"/>
    <path d="M 366 232 Q 412 244 448 258" fill="none" stroke="#cfd8e2" stroke-width="3"/>
  </g>

  <!-- Small grass tufts -->
  <g stroke="#6fb85c" stroke-width="4" stroke-linecap="round">
    <path d="M 90 522 l 0 -16 M 98 522 l 6 -14 M 82 522 l -6 -12" fill="none"/>
    <path d="M 700 522 l 0 -16 M 710 522 l 7 -13 M 692 522 l -7 -12" fill="none"/>
  </g>
</svg>