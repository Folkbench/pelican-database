<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle wheels -->
  <circle cx="80" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
  <circle cx="280" cy="220" r="35" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Wheel spokes -->
  <g stroke="#666" stroke-width="1">
    <line x1="80" y1="185" x2="80" y2="255"/>
    <line x1="45" y1="220" x2="115" y2="220"/>
    <line x1="55" y1="195" x2="105" y2="245"/>
    <line x1="105" y1="195" x2="55" y2="245"/>
    
    <line x1="280" y1="185" x2="280" y2="255"/>
    <line x1="245" y1="220" x2="315" y2="220"/>
    <line x1="255" y1="195" x2="305" y2="245"/>
    <line x1="305" y1="195" x2="255" y2="245"/>
  </g>
  
  <!-- Bicycle frame -->
  <g stroke="#444" stroke-width="4" fill="none">
    <line x1="80" y1="220" x2="180" y2="160"/>
    <line x1="180" y1="160" x2="280" y2="220"/>
    <line x1="180" y1="160" x2="180" y2="200"/>
    <line x1="140" y1="180" x2="220" y2="180"/>
  </g>
  
  <!-- Handlebars -->
  <line x1="140" y1="180" x2="130" y2="170" stroke="#444" stroke-width="4"/>
  <line x1="120" y1="170" x2="140" y2="170" stroke="#444" stroke-width="4"/>
  
  <!-- Seat -->
  <ellipse cx="220" cy="175" rx="15" ry="5" fill="#654321"/>
  
  <!-- Pedals -->
  <circle cx="180" cy="200" r="3" fill="#333"/>
  <line x1="170" y1="205" x2="190" y2="195" stroke="#333" stroke-width="2"/>
  
  <!-- Pelican body -->
  <ellipse cx="200" cy="130" rx="40" ry="25" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pelican wings -->
  <ellipse cx="170" cy="135" rx="25" ry="15" fill="#e8e8e8" stroke="#ddd" stroke-width="1"/>
  <ellipse cx="230" cy="135" rx="25" ry="15" fill="#e8e8e8" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pelican neck -->
  <ellipse cx="160" cy="110" rx="8" ry="20" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pelican head -->
  <ellipse cx="150" cy="85" rx="15" ry="12" fill="#f0f0f0" stroke="#ddd" stroke-width="1"/>
  
  <!-- Pelican beak -->
  <polygon points="135,85 100,90 105,95 140,92" fill="#ffa500" stroke="#ff8c00" stroke-width="1"/>
  
  <!-- Pelican pouch -->
  <path d="M 105 90 Q 95 100 105 105 Q 115 100 105 90" fill="#ffb84d" stroke="#ff8c00" stroke-width="1"/>
  
  <!-- Pelican eye -->
  <circle cx="145" cy="80" r="3" fill="#333"/>
  <circle cx="146" cy="79" r="1" fill="white"/>
  
  <!-- Pelican legs/feet on pedals -->
  <line x1="190" y1="155" x2="175" y2="195" stroke="#ffa500" stroke-width="3"/>
  <line x1="210" y1="155" x2="185" y2="205" stroke="#ffa500" stroke-width="3"/>
  
  <!-- Pelican feet -->
  <g stroke="#ffa500" stroke-width="2" fill="none">
    <path d="M 170 195 L 165 200 M 170 195 L 175 200 M 170 195 L 170 200"/>
    <path d="M 180 205 L 175 210 M 180 205 L 185 210 M 180 205 L 180 210"/>
  </g>
  
  <!-- Pelican wings holding handlebars -->
  <line x1="180" y1="120" x2="130" y2="170" stroke="#e8e8e8" stroke-width="6"/>
</svg>