<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <!-- Gradient for sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB"/>
      <stop offset="100%" style="stop-color:#E0F4FF"/>
    </linearGradient>
    <!-- Gradient for water -->
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#2E5F8A"/>
    </linearGradient>
    <!-- Wheel spoke pattern -->
    <pattern id="spokes" patternUnits="userSpaceOnUse" width="40" height="40">
      <line x1="20" y1="0" x2="20" y2="40" stroke="#555" stroke-width="1"/>
      <line x1="0" y1="20" x2="40" y2="20" stroke="#555" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background sky -->
  <rect width="500" height="400" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="420" cy="60" r="35" fill="#FFD93D" opacity="0.9"/>
  <circle cx="420" cy="60" r="30" fill="#FFE66D"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.85">
    <ellipse cx="100" cy="50" rx="40" ry="18"/>
    <ellipse cx="130" cy="42" rx="30" ry="16"/>
    <ellipse cx="75" cy="48" rx="25" ry="14"/>
    
    <ellipse cx="300" cy="80" rx="35" ry="15"/>
    <ellipse cx="325" cy="72" rx="25" ry="13"/>
  </g>

  <!-- Water/lake at bottom -->
  <ellipse cx="250" cy="400" rx="300" ry="60" fill="url(#water)" opacity="0.6"/>

  <!-- Ground/path -->
  <ellipse cx="250" cy="340" rx="220" ry="25" fill="#8B7355"/>
  <ellipse cx="250" cy="338" rx="210" ry="20" fill="#A0896C"/>

  <!-- === BICYCLE === -->
  
  <!-- Back wheel -->
  <circle cx="160" cy="310" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="160" cy="310" r="40" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="160" cy="310" r="5" fill="#333"/>
  <!-- Spokes back -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="160" y1="265" x2="160" y2="355"/>
    <line x1="115" y1="310" x2="205" y2="310"/>
    <line x1="128" y1="278" x2="192" y2="342"/>
    <line x1="192" y1="278" x2="128" y2="342"/>
  </g>

  <!-- Front wheel -->
  <circle cx="340" cy="310" r="45" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="340" cy="310" r="40" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="340" cy="310" r="5" fill="#333"/>
  <!-- Spokes front -->
  <g stroke="#666" stroke-width="1.5">
    <line x1="340" y1="265" x2="340" y2="355"/>
    <line x1="295" y1="310" x2="385" y2="310"/>
    <line x1="308" y1="278" x2="372" y2="342"/>
    <line x1="372" y1="278" x2="308" y2="342"/>
  </g>

  <!-- Bicycle frame -->
  <g stroke="#E85D04" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main triangle -->
    <line x1="160" y1="310" x2="220" y2="270"/> <!-- back wheel to seat area -->
    <line x1="220" y1="270" x2="280" y2="310"/> <!-- seat area to crank -->
    <line x1="280" y1="310" x2="160" y2="310"/> <!-- crank to back wheel -->
    <!-- Top tube -->
    <line x1="220" y1="270" x2="320" y2="265"/> <!-- seat to head tube -->
    <!-- Down tube -->
    <line x1="320" y1="265" x2="280" y2="310"/> <!-- head tube to crank -->
    <!-- Head tube -->
    <line x1="320" y1="265" x2="340" y2="275"/> <!-- to front fork -->
    <!-- Fork -->
    <line x1="340" y1="275" x2="340" y2="310"/> <!-- front wheel -->
    <!-- Handlebars -->
    <line x1="320" y1="265" x2="355" y2="255"/>
    <line x1="355" y1="255" x2="365" y2="250"/>
    <!-- Seat post -->
    <line x1="220" y1="270" x2="218" y2="260"/>
  </g>

  <!-- Seat -->
  <ellipse cx="218" cy="257" rx="18" ry="5" fill="#333"/>

  <!-- Pedals/crank -->
  <circle cx="280" cy="310" r="8" fill="#555" stroke="#333" stroke-width="2"/>
  <!-- Pedal arms -->
  <line x1="280" y1="310" x2="295" y2="325" stroke="#444" stroke-width="3"/>
  <line x1="280" y1="310" x2="265" y2="295" stroke="#444" stroke-width="3"/>
  <!-- Pedals -->
  <rect x="290" y="322" width="12" height="5" rx="1" fill="#666"/>
  <rect x="258" y="292" width="12" height="5" rx="1" fill="#666"/>

  <!-- === PELICAN === -->

  <!-- Back leg on pedal -->
  <g>
    <line x1="230" y1="260" x2="293" y2="324" stroke="#E8985E" stroke-width="6" stroke-linecap="round"/>
    <!-- Webbed foot on pedal -->
    <path d="M290 327 L285 333 M293 327 L293 334 M296 327 L301 333" stroke="#E8985E" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Body -->
  <ellipse cx="240" cy="235" rx="45" ry="35" fill="white" stroke="#ddd" stroke-width="1"/>
  <!-- Body feather texture -->
  <ellipse cx="230" cy="245" rx="25" ry="18" fill="#f5f5f5"/>
  <ellipse cx="250" cy="230" rx="20" ry="15" fill="#fafafa"/>

  <!-- Wing (folded) -->
  <path d="M200 225 Q185 240 195 265 Q210 270 230 260 Q220 245 215 230 Z" fill="#E8E8E8" stroke="#ccc" stroke-width="1"/>
  <!-- Wing feather lines -->
  <path d="M198 235 Q205 245 210 255" stroke="#ccc" stroke-width="1" fill="none"/>
  <path d="M203 230 Q210 242 215 252" stroke="#ccc" stroke-width="1" fill="none"/>

  <!-- Front wing reaching to handlebars -->
  <path d="M265 220 Q290 215 330 240 Q335 245 330 248 Q290 230 265 235 Z" fill="white" stroke="#ddd" stroke-width="1"/>

  <!-- Neck -->
  <path d="M265 215 Q275 190 285 165" stroke="white" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M265 215 Q275 190 285 165" stroke="#f0f0f0" stroke-width="18" fill="none" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="290" cy="155" rx="22" ry="18" fill="white"/>

  <!-- Eye -->
  <circle cx="298" cy="150" r="5" fill="#333"/>
  <circle cx="299" cy="149" r="1.5" fill="white"/>
  <!-- Eyebrow/expression -->
  <path d="M293 144 Q298 141 304 143" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Beak - upper part -->
  <path d="M308 155 L380 148 Q385 155 380 158 L308 160 Z" fill="#F4A460" stroke="#D2691E" stroke-width="1"/>
  <!-- Beak line -->
  <line x1="308" y1="157" x2="380" y2="153" stroke="#D2691E" stroke-width="1"/>
  <!-- Beak tip hook -->
  <path d="M378 153 Q385 160 380 168" stroke="#D2691E" stroke-width="2" fill="none"/>

  <!-- Pouch (throat bag) -->
  <path d="M308 160 Q340 195 360 185 Q370 180 365 165 Q340 175 308 165 Z" fill="#FFB347" stroke="#E8985E" stroke-width="1"/>
  <!-- Pouch texture lines -->
  <path d="M320 162 Q330 180 340 175" stroke="#E8985E" stroke-width="0.5" fill="none" opacity="0.6"/>
  <path d="M335 163 Q345 182 355 175" stroke="#E8985E" stroke-width="0.5" fill="none" opacity="0.6"/>

  <!-- Back leg -->
  <g>
    <line x1="230" y1="260" x2="265" y2="293" stroke="#E8985E" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Front wing tip on handlebar -->
  <path d="M330 242 L355 252" stroke="#E8985E" stroke-width="3" stroke-linecap="round"/>

  <!-- Small tail feathers -->
  <path d="M195 240 L175 250 L180 235 L170 242" stroke="#ddd" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Motion lines behind -->
  <g stroke="#999" stroke-width="1.5" opacity="0.5">
    <line x1="100" y1="280" x2="120" y2="280"/>
    <line x1="90" y1="300" x2="115" y2="300"/>
    <line x1="95" y1="320" x2="125" y2="320"/>
  </g>

  <!-- Small flowers on the path -->
  <g>
    <circle cx="120" cy="335" r="3" fill="#FF6B6B"/>
    <circle cx="120" cy="335" r="1" fill="#FFE66D"/>
    <line x1="120" y1="338" x2="120" y2="345" stroke="#4CAF50" stroke-width="1"/>
    
    <circle cx="400" cy="332" r="3" fill="#FF6B6B"/>
    <circle cx="400" cy="332" r="1" fill="#FFE66D"/>
    <line x1="400" y1="335" x2="400" y2="343" stroke="#4CAF50" stroke-width="1"/>
    
    <circle cx="370" cy="338" r="2.5" fill="#9B59B6"/>
    <circle cx="370" cy="338" r="0.8" fill="#FFE66D"/>
    <line x1="370" y1="340" x2="370" y2="347" stroke="#4CAF50" stroke-width="1"/>
  </g>

</svg>