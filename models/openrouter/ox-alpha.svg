<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky background -->
  <rect width="400" height="300" fill="#e8f4f8"/>
  
  <!-- Ground -->
  <rect y="250" width="400" height="50" fill="#d2b48c"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#8b7355" stroke-width="3"/>
  
  <!-- Bicycle rear wheel -->
  <circle cx="120" cy="230" r="38" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="120" cy="230" r="30" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="120" cy="230" r="4" fill="#333"/>
  
  <!-- Bicycle front wheel -->
  <circle cx="280" cy="230" r="38" fill="none" stroke="#333" stroke-width="5"/>
  <circle cx="280" cy="230" r="30" fill="none" stroke="#888" stroke-width="1.5"/>
  <circle cx="280" cy="230" r="4" fill="#333"/>
  
  <!-- Spokes -->
  <g stroke="#aaa" stroke-width="1">
    <line x1="90" y1="230" x2="150" y2="230"/>
    <line x1="120" y1="200" x2="120" y2="260"/>
    <line x1="99" y1="209" x2="141" y2="251"/>
    <line x1="141" y1="209" x2="99" y2="251"/>
    <line x1="250" y1="230" x2="310" y2="230"/>
    <line x1="280" y1="200" x2="280" y2="260"/>
    <line x1="259" y1="209" x2="301" y2="251"/>
    <line x1="301" y1="209" x2="259" y2="251"/>
  </g>
  
  <!-- Frame -->
  <path d="M120,230 L170,160 L240,160 L280,230 M170,160 L155,225 L245,225 L240,160"
        fill="none" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <!-- Fork -->
  <line x1="280" y1="230" x2="265" y2="165" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <!-- Handlebars -->
  <path d="M265,165 Q255,150 240,152" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat post and seat -->
  <line x1="170" y1="160" x2="165" y2="140" stroke="#333" stroke-width="5"/>
  <ellipse cx="163" cy="138" rx="16" ry="6" fill="#222"/>
  <!-- Pedals/crank -->
  <circle cx="205" cy="228" r="7" fill="#555"/>
  <line x1="205" y1="228" x2="220" y2="242" stroke="#333" stroke-width="4"/>
  <rect x="214" y="239" width="14" height="6" rx="2" fill="#222"/>
  <line x1="205" y1="228" x2="190" y2="214" stroke="#333" stroke-width="4"/>
  <rect x="182" y="211" width="14" height="6" rx="2" fill="#222"/>
  
  <!-- Pelican body -->
  <ellipse cx="185" cy="115" rx="45" ry="32" fill="#f5f5f0" stroke="#ccc" stroke-width="2"/>
  <!-- Tail feathers -->
  <path d="M145,105 L118,92 L128,110 L112,112 L132,122 Z" fill="#eee" stroke="#bbb" stroke-width="1.5"/>
  
  <!-- Wing (reaching to handlebars) -->
  <path d="M195,100 Q235,95 252,140 Q240,148 215,135 Q198,125 190,112 Z"
        fill="#e8e8e0" stroke="#bbb" stroke-width="2"/>
  
  <!-- Neck -->
  <path d="M210,95 Q225,70 218,50 Q212,35 222,28" fill="none" stroke="#f5f5f0" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Head -->
  <circle cx="224" cy="27" r="13" fill="#f5f5f0" stroke="#ddd" stroke-width="1.5"/>
  
  <!-- Beak with pouch -->
  <path d="M232,22 L272,34 L234,40 Z" fill="#f39c12" stroke="#d68910" stroke-width="1.5"/>
  <path d="M233,36 Q250,52 270,36 Z" fill="#f8c471" stroke="#d68910" stroke-width="1.5"/>
  <!-- Eye -->
  <circle cx="226" cy="23" r="2.5" fill="#222"/>
  
  <!-- Legs -->
  <path d="M175,142 Q180,180 190,213" fill="none" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
  <path d="M195,140 Q192,180 190,214" fill="none" stroke="#f39c12" stroke-width="6" stroke-linecap="round"/>
  <!-- Webbed feet on pedals -->
  <path d="M188,208 L204,216 L186,220 Z" fill="#f39c12"/>
  <path d="M184,206 L196,212 L178,216 Z" fill="#f39c12"/>
</svg>