<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>

  <!-- Sun -->
  <circle cx="350" cy="30" r="30" fill="#FFD700"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="3">
    <line x1="350" y1="0" x2="350" y2="10"/>
    <line x1="350" y1="50" x2="358" y2="38"/>
    <line x1="350" y1="50" x2="350" y2="70"/>
    <line x1="350" y1="250" x2="358" y2="262"/>
    <line x1="350" y1="250" x2="350" y2="290"/>
    <line x1="350" y1="250" x2="342" y2="262"/>
    <line x1="350" y1="0" x2="342" y2="38"/>
    <line x1="350" y1="0" x2="342" y2="10"/>
    <line x1="350" y1="0" x2="358" y2="10"/>
  </g>

  <!-- Bicycle -->
  <g>
    <!-- Frame -->
    <path d="M 100 220 L 130 180 L 170 180 L 190 200 L 170 220 Z" fill="#FF6B6B"/>
    <!-- Handlebars -->
    <path d="M 120 180 Q 100 160 80 170" stroke="#333" stroke-width="6" fill="none"/>
    <line x1="80" y1="170" x2="70" y2="165" stroke="#333" stroke-width="4"/>
    <line x1="80" y1="170" x2="70" y2="175" stroke="#333" stroke-width="4"/>
    <!-- Front wheel -->
    <circle cx="190" cy="220" r="25" fill="#ddd"/>
    <circle cx="190" cy="220" r="20" fill="#fff"/>
    <g stroke="#333" stroke-width="3">
      <line x1="190" y1="200" x2="190" y2="240"/>
      <line x1="165" y1="215" x2="215" y2="225"/>
    </g>
    <!-- Back wheel -->
    <circle cx="130" cy="200" r="28" fill="#ddd"/>
    <circle cx="130" cy="200" r="23" fill="#fff"/>
    <g stroke="#333" stroke-width="3">
      <line x1="130" y1="172" x2="130" y2="228"/>
      <line x1="102" y1="190" x2="158" y2="210"/>
    </g>
    <!-- Seat -->
    <ellipse cx="150" cy="190" rx="15" ry="5" fill="#FF6B6B"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Body -->
    <ellipse cx="110" cy="170" rx="35" ry="25" fill="#FFFACD"/>
    <!-- Head -->
    <circle cx="145" cy="145" r="25" fill="#FFFACD"/>
    <!-- Beak -->
    <path d="M 145 140 Q 160 130 170 150 Q 160 145 145 145" fill="#FFA07A"/>
    <!-- Eye -->
    <circle cx="155" cy="138" r="5" fill="black"/>
    <!-- Wing -->
    <path d="M 90 160 Q 70 150 60 170 Q 75 180 90 170" fill="#FFA07A"/>
    <!-- Legs -->
    <line x1="125" y1="195" x2="150" y2="220" stroke="#333" stroke-width="3"/>
    <line x1="125" y1="195" x2="110" y2="220" stroke="#333" stroke-width="3"/>
    <!-- Feet -->
    <line x1="150" y1="220" x2="160" y2="240" stroke="#333" stroke-width="3"/>
    <line x1="150" y1="220" x2="140" y2="240" stroke="#333" stroke-width="3"/>
    <line x1="110" y1="220" x2="100" y2="240" stroke="#333" stroke-width="3"/>
    <line x1="110" y1="220" x2="120" y2="240" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Clouds -->
  <g fill="#FFF" opacity="0.9">
    <ellipse cx="50" cy="40" rx="25" ry="15"/>
    <ellipse cx="70" cy="35" rx="20" ry="12"/>
    <ellipse cx="30" cy="40" rx="18" ry="10"/>
    <ellipse cx="350" cy="60" rx="20" ry="12"/>
    <ellipse cx="320" cy="55" rx="18" ry="10"/>
  </g>
</svg>