<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle frame -->
  <rect x="220" y="320" width="80" height="60" fill="#0080ff"/>
  
  <!-- Front wheel -->
  <circle cx="170" cy="300" r="30" fill="#0080ff"/>
  <!-- Spokes -->
  <line x1="170" y1="270" x2="170" y2="330" stroke="#0080ff" stroke-width="2"/>
  <line x1="165" y1="270" x2="185" y2="330" stroke="#0080ff" stroke-width="2"/>
  <line x1="185" y1="270" x2="175" y2="330" stroke="#0080ff" stroke-width="2"/>
  
  <!-- Rear wheel -->
  <circle cx="400" cy="300" r="30" fill="#0080ff"/>
  <!-- Spokes -->
  <line x1="400" y1="270" x2="400" y2="330" stroke="#0080ff" stroke-width="2"/>
  <line x1="395" y1="270" x2="405" y2="330" stroke="#0080ff" stroke-width="2"/>
  <line x1="390" y1="270" x2="410" y2="330" stroke="#0080ff" stroke-width="2"/>
  
  <!-- Chain -->
  <line x1="240" y1="320" x2="360" y2="320" stroke="#808080" stroke-width="1"/>
  
  <!-- Seat -->
  <rect x="250" y="250" width="50" height="20" fill="#002244"/>
  
  <!-- Handlebar -->
  <path d="M250 200 Q275 180 300 200" stroke="#0080ff" stroke-width="6" fill="none"/>
  <circle cx="300" cy="180" r="15" fill="#0080ff"/>
  
  <!-- Pedals -->
  <circle cx="275" cy="350" r="10" fill="#0080ff"/>
  <circle cx="325" cy="350" r="10" fill="#0080ff"/>
  
  <!-- Pelican body -->
  <ellipse cx="225" cy="250" rx="50" ry="70" fill="#800080"/>
  
  <!-- Pelican head -->
  <ellipse cx="255" cy="200" rx="30" ry="40" fill="#800080"/>
  
  <!-- Beak -->
  <polygon points="220,230 230,250 220,270" fill="gold"/>
  
  <!-- Wing -->
  <line x1="225" y1="275" x2="170" y2="275" stroke="gold" stroke-width="6"/>
  
  <!-- Eyes -->
  <circle cx="235" cy="220" r="4" fill="white"/>
  <circle cx="235" cy="220" r="6" stroke="#000000" stroke-width="1"/>
  <circle cx="275" cy="220" r="4" fill="white"/>
  <circle cx="275" cy="220" r="6" stroke="#000000" stroke-width="1"/>
</svg>