<svg width="640" height="480" viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9e6ff"/>
      <stop offset="100%" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7a01a"/>
      <stop offset="100%" stop-color="#f5c04f"/>
    </linearGradient>
    <linearGradient id="legGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6a64d"/>
      <stop offset="100%" stop-color="#e0851f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="off"/>
      <feMerge>
        <feMergeNode in="off"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#sky)"/>

  <!-- ground -->
  <rect x="0" y="360" width="640" height="120" fill="#cfe7cf"/>
  <path d="M0,370 C80,360 140,380 220,370 C310,360 360,385 450,372 C520,362 580,378 640,370 L640,480 L0,480 Z" fill="#b9ddb9"/>

  <!-- bicycle -->
  <!-- wheels -->
  <g id="bike" filter="url(#shadow)">
    <g transform="translate(170,340)">
      <circle r="54" fill="#2b2b2b"/>
      <circle r="48" fill="#ffffff"/>
      <circle r="6" fill="#2b2b2b"/>
      <g stroke="#2b2b2b" stroke-width="2">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="0" x2="-48" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="-48"/>
        <line x1="0" y1="0" x2="0" y2="48"/>
        <line x1="0" y1="0" x2="34" y2="34"/>
        <line x1="0" y1="0" x2="-34" y2="34"/>
        <line x1="0" y1="0" x2="34" y2="-34"/>
        <line x1="0" y1="0" x2="-34" y2="-34"/>
      </g>
    </g>
    <g transform="translate(440,340)">
      <circle r="54" fill="#2b2b2b"/>
      <circle r="48" fill="#ffffff"/>
      <circle r="6" fill="#2b2b2b"/>
      <g stroke="#2b2b2b" stroke-width="2">
        <line x1="0" y1="0" x2="48" y2="0"/>
        <line x1="0" y1="0" x2="-48" y2="0"/>
        <line x1="0" y1="0" x2="0" y2="-48"/>
        <line x1="0" y1="0" x2="0" y2="48"/>
        <line x1="0" y1="0" x2="34" y2="34"/>
        <line x1="0" y1="0" x2="-34" y2="34"/>
        <line x1="0" y1="0" x2="34" y2="-34"/>
        <line x1="0" y1="0" x2="-34" y2="-34"/>
      </g>
    </g>

    <!-- frame -->
    <g stroke="#3f5a7a" stroke-width="7" fill="none">
      <line x1="170" y1="340" x2="260" y2="260"/>
      <line x1="260" y1="260" x2="360" y2="285"/>
      <line x1="170" y1="340" x2="360" y2="285"/>
      <line x1="260" y1="260" x2="320" y2="210"/>
      <line x1="440" y1="340" x2="360" y2="285"/>
      <line x1="440" y1="340" x2="410" y2="245"/>
    </g>

    <!-- seat post and saddle -->
    <g>
      <line x1="320" y1="210" x2="305" y2="175" stroke="#3f5a7a" stroke-width="6"/>
      <path d="M260,170 Q286,156 312,170 Q296,183 270,182 Z" fill="#2b2b2b"/>
    </g>

    <!-- handlebar and stem -->
    <g stroke="#3f5a7a" stroke-width="6" stroke-linecap="round">
      <line x1="410" y1="245" x2="430" y2="205"/>
      <path d="M430,205 C450,195 468,200 482,212" fill="none"/>
      <line x1="482" y1="212" x2="495" y2="205"/>
      <line x1="482" y1="212" x2="495" y2="220"/>
    </g>

    <!-- crank and pedal -->
    <g>
      <circle cx="300" cy="305" r="13" fill="#2b2b2b"/>
      <line x1="300" y1="305" x2="322" y2="325" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
      <rect x="322" y="320" width="24" height="9" rx="4" ry="4" fill="#2b2b2b"/>
      <line x1="300" y1="305" x2="278" y2="285" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
      <rect x="252" y="280" width="24" height="9" rx="4" ry="4" fill="#5a5a5a"/>
    </g>

    <!-- chain -->
    <ellipse cx="332" cy="310" rx="40" ry="12" fill="none" stroke="#2b2b2b" stroke-width="3"/>
  </g>

  <!-- pelican -->
  <g id="pelican" filter="url(#shadow)">
    <!-- body -->
    <ellipse cx="290" cy="260" rx="85" ry="55" fill="#f0f3f7" stroke="#d4dbe4" stroke-width="2"/>
    <!-- wing -->
    <path d="M250,245 C215,270 210,305 250,315 C300,330 340,295 330,270 C320,245 285,235 250,245 Z"
          fill="#e3e8ef" stroke="#cbd3dd" stroke-width="2"/>
    <!-- tail -->
    <path d="M205,255 C180,260 168,270 170,282 C190,285 205,280 216,272 Z" fill="#e3e8ef" stroke="#cbd3dd" stroke-width="2"/>

    <!-- neck -->
    <path d="M332,250 C360,240 380,210 375,190 C370,170 338,168 318,185 C300,200 300,230 305,245 Z"
          fill="#f0f3f7" stroke="#d4dbe4" stroke-width="2"/>

    <!-- head -->
    <ellipse cx="372" cy="182" rx="34" ry="28" fill="#f0f3f7" stroke="#d4dbe4" stroke-width="2"/>

    <!-- eye -->
    <circle cx="382" cy="178" r="5.5" fill="#2b2b2b"/>
    <circle cx="380.5" cy="176.5" r="1.8" fill="#ffffff" opacity="0.9"/>

    <!-- beak -->
    <path d="M390,182 C420,176 460,178 502,182 C474,196 442,205 406,204 C398,197 394,189 390,182 Z"
          fill="url(#beakGrad)" stroke="#e59319" stroke-width="2"/>
    <path d="M391,186 C418,188 450,190 490,188 C470,198 444,202 410,202 C401,196 396,191 391,186 Z"
          fill="#f7b23e" opacity="0.75"/>

    <!-- gular pouch hint -->
    <path d="M372,198 C392,210 410,214 430,214" stroke="#e9a73a" stroke-width="2" opacity="0.7"/>

    <!-- legs -->
    <g>
      <path d="M305,305 C300,330 300,350 302,365" stroke="url(#legGrad)" stroke-width="8" stroke-linecap="round"/>
      <path d="M335,300 C332,322 335,344 340,360" stroke="url(#legGrad)" stroke-width="8" stroke-linecap="round"/>
      <!-- feet -->
      <path d="M288,368 C304,372 316,372 330,368" stroke="#e0851f" stroke-width="8" stroke-linecap="round"/>
      <path d="M327,362 C344,366 360,366 374,362" stroke="#e0851f" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- pelican on seat -->
    <ellipse cx="305" cy="178" rx="12" ry="6" fill="#cbd3dd" opacity="0.6"/>

    <!-- subtle shading -->
    <ellipse cx="290" cy="274" rx="70" ry="35" fill="#cfd9e4" opacity="0.35"/>
  </g>

  <!-- motion accents -->
  <g stroke="#9dc8ff" stroke-width="3" opacity="0.8">
    <path d="M130,340 C110,330 95,330 80,335"/>
    <path d="M480,340 C505,330 525,330 540,338"/>
    <path d="M155,300 C135,295 118,295 100,300"/>
  </g>

  <!-- title -->
  <text x="320" y="60" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" fill="#3f5a7a" opacity="0.85">
    Pelican on Wheels
  </text>
</svg>