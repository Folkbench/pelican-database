<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BDE7FF"/>
      <stop offset="100%" stop-color="#E8F9FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8D5A2"/>
      <stop offset="100%" stop-color="#7FB77E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="120" cy="90" rx="90" ry="30" fill="white" opacity="0.9"/>
  <ellipse cx="660" cy="70" rx="100" ry="32" fill="white" opacity="0.9"/>
  <circle cx="700" cy="100" r="35" fill="#FFEB3B"/>
  <rect x="0" y="470" width="800" height="130" fill="url(#ground)"/>
  <ellipse cx="400" cy="480" rx="600" ry="40" fill="#8BC48A" opacity="0.6"/>

  <!-- Shadow -->
  <ellipse cx="400" cy="530" rx="280" ry="18" fill="#000" opacity="0.12"/>

  <!-- Bicycle Wheels -->
  <!-- Back wheel -->
  <g id="back-wheel">
    <circle cx="240" cy="460" r="70" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="240" cy="460" r="62" fill="none" stroke="#E0E0E0" stroke-width="3"/>
    <g stroke="#9E9E9E" stroke-width="2.5">
      <line x1="240" y1="390" x2="240" y2="530"/>
      <line x1="170" y1="460" x2="310" y2="460"/>
      <line x1="190" y1="410" x2="290" y2="510"/>
      <line x1="290" y1="410" x2="190" y2="510"/>
    </g>
    <circle cx="240" cy="460" r="12" fill="#444"/>
    <circle cx="240" cy="460" r="5" fill="#CCC"/>
  </g>
  <!-- Front wheel -->
  <g id="front-wheel">
    <circle cx="560" cy="460" r="70" fill="none" stroke="#222" stroke-width="10"/>
    <circle cx="560" cy="460" r="62" fill="none" stroke="#E0E0E0" stroke-width="3"/>
    <g stroke="#9E9E9E" stroke-width="2.5">
      <line x1="560" y1="390" x2="560" y2="530"/>
      <line x1="490" y1="460" x2="630" y2="460"/>
      <line x1="510" y1="410" x2="610" y2="510"/>
      <line x1="610" y1="410" x2="510" y2="510"/>
    </g>
    <circle cx="560" cy="460" r="12" fill="#444"/>
    <circle cx="560" cy="460" r="5" fill="#CCC"/>
  </g>

  <!-- Bicycle Frame -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- chain stays, seat stays -->
    <line x1="240" y1="460" x2="400" y2="460" stroke="#D32F2F" stroke-width="8"/>
    <line x1="240" y1="460" x2="370" y2="280" stroke="#D32F2F" stroke-width="8"/>
    <!-- seat tube -->
    <line x1="400" y1="460" x2="370" y2="280" stroke="#D32F2F" stroke-width="9"/>
    <!-- top tube -->
    <line x1="370" y1="280" x2="530" y2="300" stroke="#D32F2F" stroke-width="9"/>
    <!-- down tube -->
    <line x1="400" y1="460" x2="530" y2="300" stroke="#D32F2F" stroke-width="9"/>
    <!-- fork -->
    <line x1="530" y1="300" x2="560" y2="460" stroke="#B71C1C" stroke-width="8"/>
    <!-- seat post & seat -->
    <line x1="370" y1="280" x2="355" y2="245" stroke="#333" stroke-width="7"/>
    <path d="M 310 240 Q 365 230 390 245 Q 365 255 315 252 Z" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
    <!-- handlebar stem -->
    <line x1="530" y1="300" x2="520" y2="260" stroke="#333" stroke-width="7"/>
    <path d="M 520 260 Q 540 245 555 250 Q 565 255 560 265" fill="none" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <!-- crank and pedals -->
    <circle cx="400" cy="460" r="18" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="400" cy="460" r="6" fill="#333"/>
    <line x1="400" y1="460" x2="425" y2="485" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="460" x2="375" y2="435" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <rect x="410" y="480" width="32" height="8" rx="3" fill="#222"/>
    <rect x="358" y="430" width="32" height="8" rx="3" fill="#222"/>
    <!-- basket -->
    <path d="M 545 285 L 625 285 L 615 335 L 555 335 Z" fill="#FFCC80" stroke="#8D6E63" stroke-width="2"/>
    <line x1="550" y1="300" x2="620" y2="300" stroke="#8D6E63" stroke-width="1.5"/>
    <line x1="552" y1="315" x2="618" y2="315" stroke="#8D6E63" stroke-width="1.5"/>
    <!-- little fish in basket -->
    <g transform="translate(585,275) scale(0.6)">
      <path d="M0 0 Q20 -10 40 0 Q20 10 0 0 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="2"/>
      <path d="M40 0 L55 -8 L55 8 Z" fill="#29B6F6" stroke="#0277BD" stroke-width="2"/>
      <circle cx="8" cy="-1" r="2" fill="#01579B"/>
    </g>
  </g>

  <!-- PELICAN -->
  <g id="pelican">
    <!-- Tail -->
    <path d="M 200 340 L 145 305 L 165 345 L 135 340 L 175 370 L 150 385 L 215 375 Z" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Body -->
    <ellipse cx="300" cy="330" rx="115" ry="70" transform="rotate(-15 300 330)" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="3"/>
    <!-- Belly shading -->
    <ellipse cx="315" cy="355" rx="85" ry="40" transform="rotate(-15 315 355)" fill="#F5F5F5" opacity="0.9"/>
    
    <!-- Back leg (far side) -->
    <g stroke="#FF8F00" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline points="350,380 375,435 375,435"/>
    </g>
    <g transform="translate(375,435)">
      <path d="M-10 0 L20 3 L15 10 L-2 8 Z" fill="#FF8F00" stroke="#E65100" stroke-width="1.5"/>
    </g>

    <!-- Near leg on pedal -->
    <g stroke="#FFA000" stroke-width="8" stroke-linecap="round" fill="none">
      <polyline points="370,390 425,485"/>
    </g>
    <g transform="translate(425,485) rotate(15)">
      <path d="M-12 0 L22 2 L18 12 L-4 10 Z" fill="#FFA000" stroke="#E65100" stroke-width="1.5"/>
    </g>

    <!-- Wing (far, on handlebar) -->
    <path d="M 320 285 Q 420 260 525 260" fill="none" stroke="#E0E0E0" stroke-width="18" stroke-linecap="round"/>
    <circle cx="525" cy="260" r="10" fill="#E0E0E0"/>

    <!-- Head -->
    <circle cx="410" cy="200" r="52" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="3"/>
    <!-- Crest -->
    <path d="M 385 155 Q 395 130 420 145 Q 410 135 395 155 Z" fill="#FFECB3"/>
    
    <!-- Beak - lower pouch -->
    <path d="M 455 195 Q 540 210 615 235 Q 580 275 500 260 Q 460 245 450 215 Z" fill="#FFAB91" stroke="#E64A19" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Beak - upper -->
    <path d="M 445 175 L 640 220 L 635 235 L 460 205 Z" fill="#FF8A65" stroke="#D84315" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="628" cy="227" rx="9" ry="7" fill="#E64A19"/>
    <!-- Little fish tail peeking from pouch -->
    <path d="M 560 240 L 580 232 L 580 248 Z" fill="#4FC3F7" stroke="#0288D1" stroke-width="1.5"/>

    <!-- Eye -->
    <circle cx="430" cy="185" r="12" fill="#212121"/>
    <circle cx="434" cy="181" r="4" fill="white"/>
    <circle cx="428" cy="188" r="2" fill="white" opacity="0.8"/>
    <!-- Cheek blush -->
    <ellipse cx="415" cy="210" rx="14" ry="8" fill="#FFCCBC" opacity="0.8"/>

    <!-- Wing (main, on body) -->
    <path d="M 260 300 Q 340 285 385 335 Q 390 370 320 375 Q 250 360 255 325 Z" fill="#ECEFF1" stroke="#B0BEC5" stroke-width="3"/>
    <path d="M 285 325 Q 340 315 365 340" fill="none" stroke="#B0BEC5" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 295 345 Q 335 338 355 352" fill="none" stroke="#CFD8DC" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Accessory: tiny helmet / cap -->
    <path d="M 368 168 Q 410 145 455 168 L 455 178 Q 410 160 368 178 Z" fill="#29B6F6" stroke="#0288D1" stroke-width="2"/>
    <rect x="360" y="170" width="100" height="6" rx="3" fill="#0288D1"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#78909C" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="110" y1="300" x2="175" y2="300"/>
    <line x1="90" y1="330" x2="160" y2="330"/>
    <line x1="115" y1="360" x2="170" y2="360"/>
  </g>

  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" fill="#37474F" text-anchor="middle" font-style="italic">The Pelican Commute</text>
</svg>