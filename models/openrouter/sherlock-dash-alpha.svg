<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Background -->
  <rect width="400" height="300" fill="#87CEEB"/>
  <path d="M0 250 Q100 200 200 260 Q300 220 400 250 L400 300 Z" fill="#90EE90"/>

  <!-- Bicycle frame -->
  <g fill="none" stroke="#8B4513" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main frame -->
    <line x1="100" y1="180" x2="200" y2="180"/>
    <line x1="100" y1="180" x2="150" y2="120"/>
    <line x1="200" y1="180" x2="150" y2="120"/>
    <line x1="150" y1="120" x2="250" y2="120"/>
    <line x1="250" y1="120" x2="300" y2="180"/>
    <!-- Seat tube -->
    <line x1="200" y1="180" x2="200" y2="140"/>
  </g>

  <!-- Wheels -->
  <g fill="none" stroke="#333" stroke-width="12" stroke-linecap="round">
    <!-- Front wheel -->
    <circle cx="100" cy="180" r="50"/>
    <line x1="100" y1="130" x2="100" y2="230"/>
    <line x1="50" y1="180" x2="150" y2="180"/>
    <!-- Rear wheel -->
    <circle cx="300" cy="180" r="50"/>
    <line x1="300" y1="130" x2="300" y2="230"/>
    <line x1="250" y1="180" x2="350" y2="180"/>
  </g>

  <!-- Spokes (simplified) -->
  <g stroke="#555" stroke-width="4" stroke-linecap="round">
    <line x1="100" y1="180" x2="70" y2="150"/>
    <line x1="100" y1="180" x2="70" y2="210"/>
    <line x1="100" y1="180" x2="130" y2="150"/>
    <line x1="100" y1="180" x2="130" y2="210"/>
    <line x1="300" y1="180" x2="270" y2="150"/>
    <line x1="300" y1="180" x2="270" y2="210"/>
    <line x1="300" y1="180" x2="330" y2="150"/>
    <line x1="300" y1="180" x2="330" y2="210"/>
  </g>

  <!-- Handlebars -->
  <g fill="none" stroke="#8B4513" stroke-width="8" stroke-linecap="round">
    <line x1="150" y1="120" x2="130" y2="100"/>
    <line x1="130" y1="100" x2="120" y2="110"/>
  </g>

  <!-- Seat -->
  <ellipse cx="200" cy="135" rx="25" ry="8" fill="#8B4513"/>

  <!-- Pelican body -->
  <ellipse cx="180" cy="100" rx="35" ry="25" fill="#F4D03F" stroke="#D68910" stroke-width="3"/>
  
  <!-- Pelican head -->
  <circle cx="150" cy="80" r="18" fill="#F4D03F" stroke="#D68910" stroke-width="3"/>
  
  <!-- Beak -->
  <path d="M140 80 Q130 70 125 85 Q130 90 140 85 L145 80 Z" fill="#FF8C00" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="132" cy="82" rx="8" ry="4" fill="#FF6B35"/>
  
  <!-- Eye -->
  <circle cx="142" cy="75" r="4" fill="#FFF"/>
  <circle cx="144" cy="74" r="1.5" fill="#000"/>
  
  <!-- Wings -->
  <path d="M180 95 Q140 80 120 110 Q100 130 130 120" fill="none" stroke="#D68910" stroke-width="12" stroke-linecap="round"/>
  <path d="M180 105 Q160 95 140 125 Q130 140 160 130" fill="none" stroke="#D68910" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Tail -->
  <ellipse cx="210" cy="110" rx="12" ry="8" fill="#D68910" transform="rotate(-20 210 110)"/>
  
  <!-- Legs (pedaling) -->
  <g fill="#FF6B35" stroke="#E67E22" stroke-width="2">
    <!-- Left leg -->
    <ellipse cx="170" cy="140" rx="6" ry="18" transform="rotate(-30 170 140)"/>
    <ellipse cx="155" cy="160" rx="5" ry="12" transform="rotate(-45 155 160)"/>
    <!-- Right leg -->
    <ellipse cx="195" cy="145" rx="6" ry="20" transform="rotate(20 195 145)"/>
    <ellipse cx="210" cy="165" rx="5" ry="12" transform="rotate(30 210 165)"/>
  </g>

  <!-- Feet on pedals -->
  <ellipse cx="175" cy="175" rx="8" ry="4" fill="#FF6B35" stroke="#E67E22" stroke-width="2"/>
  <ellipse cx="195" cy="175" rx="8" ry="4" fill="#FF6B35" stroke="#E67E22" stroke-width="2"/>

  <!-- Pedals (simplified) -->
  <circle cx="185" cy="175" r="6" fill="#666"/>
</svg>