<svg width="500" height="400" viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
        <!-- Bicycle Frame -->
        <path d="M150,250 L200,200 L250,250 L200,300 Z" stroke="black" stroke-width="5" fill="none"/>
        <path d="M200,200 L200,150" stroke="black" stroke-width="5" fill="none"/>
        <path d="M200,150 L250,120" stroke="black" stroke-width="5" fill="none"/>
        <path d="M250,120 L300,150" stroke="black" stroke-width="5" fill="none"/>
        
        <!-- Wheels -->
        <circle cx="150" cy="250" r="40" stroke="black" stroke-width="5" fill="none"/>
        <circle cx="150" cy="250" r="10" stroke="black" stroke-width="3" fill="black"/>
        <circle cx="350" cy="250" r="40" stroke="black" stroke-width="5" fill="none"/>
        <circle cx="350" cy="250" r="10" stroke="black" stroke-width="3" fill="black"/>
        
        <!-- Handlebars -->
        <path d="M300,150 L320,130" stroke="black" stroke-width="5" fill="none"/>
        <path d="M300,150 L280,130" stroke="black" stroke-width="5" fill="none"/>
        
        <!-- Pedals and Chain -->
        <circle cx="200" cy="250" r="15" stroke="black" stroke-width="3" fill="none"/>
        <path d="M200,250 L200,280" stroke="black" stroke-width="5" fill="none"/>
        <path d="M200,280 L220,280" stroke="black" stroke-width="5" fill="none"/>
        
        <!-- Pelican Body -->
        <ellipse cx="200" cy="200" rx="50" ry="40" stroke="black" stroke-width="3" fill="white"/>
        
        <!-- Pelican Head -->
        <circle cx="250" cy="180" r="30" stroke="black" stroke-width="3" fill="white"/>
        
        <!-- Pelican Beak -->
        <path d="M280,180 L350,160 L350,200 Z" stroke="black" stroke-width="3" fill="orange"/>
        <path d="M350,160 L350,200" stroke="black" stroke-width="3" fill="none"/>
        
        <!-- Pelican Eyes -->
        <circle cx="265" cy="170" r="5" fill="black"/>
        <circle cx="265" cy="190" r="5" fill="black"/>
        
        <!-- Pelican Wings -->
        <path d="M150,200 Q100,150 150,100" stroke="black" stroke-width="3" fill="white"/>
        <path d="M250,200 Q300,150 250,100" stroke="black" stroke-width="3" fill="white"/>
        
        <!-- Pelican Legs -->
        <path d="M190,230 L190,270 L200,280" stroke="black" stroke-width="5" fill="none"/>
        <path d="M210,230 L210,270 L200,280" stroke="black" stroke-width="5" fill="none"/>
        
        <!-- Pelican Pouch -->
        <path d="M200,220 Q220,240 200,260" stroke="black" stroke-width="3" fill="white"/>
    </svg>