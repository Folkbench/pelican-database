<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#f0f8ff"/>
  
  <!-- Bicycle Wheels -->
  <circle cx="80" cy="220" r="30" fill="none" stroke="#333" stroke-width="4"/>
  <circle cx="220" cy="220" r="30" fill="none" stroke="#333" stroke-width="4"/>
  
  <!-- Bicycle Frame -->
  <line x1="80" y1="220" x2="140" y2="180" stroke="#d32f2f" stroke-width="4"/>
  <line x1="140" y1="180" x2="220" y2="220" stroke="#d32f2f" stroke-width="4"/>
  <line x1="140" y1="180" x2="140" y2="140" stroke="#d32f2f" stroke-width="4"/>
  <line x1="140" y1="140" x2="200" y2="120" stroke="#333" stroke-width="3"/>
  <line x1="80" y1="220" x2="140" y2="140" stroke="#555" stroke-width="3"/>
  
  <!-- Seat -->
  <ellipse cx="140" cy="140" rx="15" ry="5" fill="#333"/>
  
  <!-- Pelican Body -->
  <ellipse cx="150" cy="160" rx="35" ry="25" fill="#fff" stroke="#ccc" stroke-width="2"/>
  
  <!-- Pelican Head -->
  <circle cx="180" cy="145" r="12" fill="#fff" stroke="#ccc" stroke-width="2"/>
  
  <!-- Pelican Beak -->
  <path d="M192 145 L230 155 L192 165 Z" fill="#ffcc00" stroke="#e6b800" stroke-width="1"/>
  <path d="M192 145 L230 155 L192 165 Z" fill="none" stroke="#e6b800" stroke-width="1"/>
  
  <!-- Pelican Eye -->
  <circle cx="185" cy="142" r="2" fill="#000"/>
  
  <!-- Pelican Wing -->
  <path d="M130 160 Q150 180 170 160" fill="none" stroke="#ccc" stroke-width="3"/>
  
  <!-- Pelican Legs -->
  <line x1="150" y1="180" x2="130" y2="200" stroke="#ff9900" stroke-width="3"/>
  <line x1="150" y1="180" x2="170" y2="200" stroke="#ff9900" stroke-width="3"/>
  
  <!-- Pedals -->
  <circle cx="130" cy="200" r="4" fill="#555"/>
  <circle cx="170" cy="200" r="4" fill="#555"/>
</svg>