<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" style="background:#f0f8ff">

  <g id="bike" stroke="#333" stroke-width="2" fill="none">
    <circle cx="80" cy="150" r="30" fill="#fff"/>
    <circle cx="220" cy="150" r="30" fill="#fff"/>
    <line x1="80" y1="150" x2="130" y2="110"/>
    <line x1="130" y1="110" x2="190" y2="110"/>
    <line x1="190" y1="110" x2="220" y2="150"/>
    <line x1="130" y1="110" x2="150" y2="150"/>
    <line x1="150" y1="150" x2="220" y2="150"/>
    <line x1="130" y1="110" x2="130" y2="95" stroke="#555"/>
    <line x1="125" y1="95" x2="135" y2="95" stroke="#555"/>
    <line x1="190" y1="110" x2="200" y2="90" stroke="#555"/>
    <line x1="200" y1="90" x2="210" y2="90" stroke="#555"/>
    <line x1="150" y1="150" x2="140" y2="160" stroke="#555"/>
    <line x1="150" y1="150" x2="160" y2="140" stroke="#555"/>
  </g>

  <g id="pelican" transform="translate(130,80) scale(0.8)">
    <ellipse cx="0" cy="0" rx="30" ry="45" fill="#ffcc80" stroke="#d48b2b" stroke-width="2"/>
    <path d="M -10,0 C -40,-20 -40,20 -10,0 Z" fill="#ffb74d" stroke="#d48b2b" stroke-width="1.5"/>
    <circle cx="0" cy="-55" r="20" fill="#ffcc80" stroke="#d48b2b" stroke-width="2"/>
    <polygon points="-5,-55 -5,-45 15,-50" fill="#ffeb3b" stroke="#d48b2b" stroke-width="1"/>
    <circle cx="5" cy="-60" r="3" fill="#000"/>
    <line x1="-15" y1="45" x2="-25" y2="70" stroke="#d48b2b" stroke-width="2"/>
    <line x1="15" y1="45" x2="25" y2="70" stroke="#d48b2b" stroke-width="2"/>
    <line x1="-25" y1="70" x2="-35" y2="70" stroke="#d48b2b" stroke-width="2"/>
    <line x1="25" y1="70" x2="35" y2="70" stroke="#d48b2b" stroke-width="2"/>
  </g>

  <g transform="translate(0,0)">
    <use href="#pelican" transform="translate(0,0)"/>
  </g>
</svg>