<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cce6ff"/>
      <stop offset="100%" stop-color="#f2f8ff"/>
    </linearGradient>
  </defs>

  <!-- Background and ground -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <line x1="0" y1="498" x2="800" y2="498" stroke="#8fc99e" stroke-width="8"/>
  <ellipse cx="240" cy="498" rx="70" ry="10" fill="#000" fill-opacity="0.12"/>
  <ellipse cx="560" cy="498" rx="70" ry="10" fill="#000" fill-opacity="0.12"/>

  <!-- Far-side leg and pedal (behind bicycle) -->
  <line x1="390" y1="410" x2="355" y2="445" stroke="#777" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(355,443) rotate(-18)">
    <rect x="-13" y="-5" width="26" height="10" rx="3" fill="#777" stroke="#444" stroke-width="1"/>
  </g>
  <path d="M335 315 Q345 380 350 445" fill="none" stroke="#d97706" stroke-width="16" stroke-linecap="round"/>
  <path d="M338 440 L368 440 L363 452 L348 458 L338 452 Z" fill="#d97706" stroke="#a05a00" stroke-width="2"/>

  <!-- Rear wheel -->
  <g transform="translate(240,430)">
    <circle r="61" fill="none" stroke="#1c1c1c" stroke-width="14"/>
    <circle r="48" fill="none" stroke="#d7dde2" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="33.94" y2="-33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="33.94" y2="33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="48" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-33.94" y2="33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-48" y2="0" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-33.94" y2="-33.94" stroke="#9aa5b1" stroke-width="2"/>
    <circle r="7" fill="#4a5568"/>
  </g>

  <!-- Front wheel -->
  <g transform="translate(560,430)">
    <circle r="61" fill="none" stroke="#1c1c1c" stroke-width="14"/>
    <circle r="48" fill="none" stroke="#d7dde2" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-48" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="33.94" y2="-33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="48" y2="0" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="33.94" y2="33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="48" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-33.94" y2="33.94" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-48" y2="0" stroke="#9aa5b1" stroke-width="2"/>
    <line x1="0" y1="0" x2="-33.94" y2="-33.94" stroke="#9aa5b1" stroke-width="2"/>
    <circle r="7" fill="#4a5568"/>
  </g>

  <!-- Bicycle frame -->
  <path d="M240 430 L390 410 L370 315 L540 285 L390 410" fill="none" stroke="#1f7a8c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="560" y1="430" x2="540" y2="285" stroke="#1f7a8c" stroke-width="8" stroke-linecap="round"/>
  <line x1="548" y1="300" x2="535" y2="270" stroke="#1f7a8c" stroke-width="10" stroke-linecap="round"/>
  <line x1="540" y1="285" x2="575" y2="275" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <path d="M545 280 Q565 278 585 272" fill="none" stroke="#6b7280" stroke-width="7" stroke-linecap="round"/>
  <line x1="370" y1="315" x2="358" y2="296" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
  <path d="M335 295 Q360 287 388 296 L386 304 Q360 297 333 303 Z" fill="#4a3732" stroke="#2d201c" stroke-width="3"/>

  <!-- Chainring and chain -->
