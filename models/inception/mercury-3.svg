  </g>
  <path d="M370 310 Q395 335 425 375" fill="none" stroke="#f59e0b" stroke-width="16" stroke-linecap="round"/>
  <path d="M408 368 L438 368 L433 380 L418 386 L408 380 Z" fill="#f59e0b" stroke="#c77700" stroke-width="2"/>

  <!-- Pelican body, tail, neck, head, beak -->
  <path d="M270 255 L205 270 L210 290 L275 305 Z" fill="#f4f2ee" stroke="#a8a29a" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="330" cy="270" rx="88" ry="62" fill="#f4f2ee" stroke="#a8a29a" stroke-width="3"/>

  <path d="M415 240 Q450 215 470 215" fill="none" stroke="#a8a29a" stroke-width="54" stroke-linecap="round"/>
  <path d="M415 240 Q450 215 470 215" fill="none" stroke="#f4f2ee" stroke-width="48" stroke-linecap="round"/>

  <circle cx="475" cy="205" r="32" fill="#f4f2ee" stroke="#a8a29a" stroke-width="3"/>

  <path d="M475 190 Q550 202 640 218 L656 240 L642 248 Q560 238 500 220 L475 190 Z" fill="#f9a825" stroke="#b26a00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M495 222 Q555 234 625 261 Q590 282 530 268 Q505 258 495 222 Z" fill="#f57c00" stroke="#b26a00" stroke-width="3" stroke-linejoin="round"/>
  <path d="M490 218 Q565 226 640 234" fill="none" stroke="#8a4b00" stroke-width="3"/>
  <path d="M510 202 q10 2 20 7" fill="none" stroke="#b26a00" stroke-width="3"/>

  <circle cx="482" cy="196" r="6" fill="#1f1f1f"/>
  <circle cx="484" cy="194" r="2" fill="#fff"/>
  <path d="M470 185 Q482 180 494 186" fill="none" stroke="#a8a29a" stroke-width="3"/>

  <!-- Wing reaching to handlebars -->
  <path d="M395 255 Q450 222 540 258 Q560 264 572 270 Q575 276 570 281 Q540 286 500 283 Q430 290 395 278 Z" fill="#f4f2ee" stroke="#a8a29a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M552 263 L588 260 Q593 268 586 275 L576 282 Q562 282 548 280 Z" fill="#1f1f1f" stroke="#111" stroke-width="1"/>
</svg>