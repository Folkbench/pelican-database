<svg width="200" height="100" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bicycle -->
  <rect x="50" y="60" width="20" height="10" fill="black" />
  <circle cx="65" cy="65" r="5" fill="black" />
  <circle cx="85" cy="65" r="5" fill="black" />

  <!-- Pelican Body -->
  <ellipse cx="75" cy="40" rx="15" ry="10" fill="white" />
  <ellipse cx="75" cy="35" rx="12" ry="8" fill="gray" />
  <ellipse cx="75" cy="30" rx="8" ry="6" fill="gray" />

  <!-- Pelican Beak -->
  <polygon points="70,30 75,25 80,30" fill="orange" />

  <!-- Pelican Head -->
  <circle cx="75" cy="25" r="4" fill="white" />

  <!-- Pelican Wings (simplified) -->
  <line x1="60" y1="35" x2="90" y2="35" stroke="gray" stroke-width="2" />
  <line x1="55" y1="30" x2="95" y2="30" stroke="gray" stroke-width="2" />

  <!-- Pelican Tail -->
  <line x1="75" y1="45" x2="75" y2="50" stroke="gray" stroke-width="2" />
</svg>