<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7a5939"/>
      <stop offset="50%" stop-color="#8d6b4e"/>
      <stop offset="100%" stop-color="#6a4d30"/>
    </linearGradient>
    
    <radialGradient id="pouchGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc66"/>
      <stop offset="100%" stop-color="#e6b84d"/>
    </radialGradient>
  </defs>

  <g id="bicycle" transform="translate(200,200)">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="400" cy="100" r="80" fill="none" stroke="#333" stroke-width="3"/>
    
    <g stroke="#666" stroke-width="1.5">
      <line x1="100" y1="20" x2="100" y2="180"/>
      <line x1="100" y1="20" x2="179.3" y2="50"/>
      <line x1="100" y1="20" x2="230.7" y2="100"/>
      <line x1="100" y1="180" x2="179.3" y2="150"/>
      <line x1="100" y1="180" x2="230.7" y2="130"/>
      <line x1="180" y1="20" x2="20" y2="100"/>
      <line x1="220" y1="20" x2="40" y2="100"/>
      <line x1="260" y1="20" x2="100" y2="100"/>
      
      <line x1="400" y1="20" x2="400" y2="180"/>
      <line x1="400" y1="20" x2="479.3" y2="50"/>
      <line x1="400" y1="20" x2="530.7" y2="100"/>
      <line x1="400" y1="180" x2="479.3" y2="150"/>
      <line x1="400" y1="180" x2="530.7" y2="130"/>
      <line x1="480" y1="20" x2="320" y2="100"/>
      <line x1="520" y1="20" x2="360" y2="100"/>
      <line x1="560" y1="20" x2="400" y2="100"/>
    </g>

    <path d="M100,100 L140,80 L400,100 L400,180 L140,160 Z" fill="none" stroke="#333" stroke-width="4"/>
    
    <path d="M300,90 L330,80 L350,95 L370,80 L400,90" fill="none" stroke="#333" stroke-width="4"/>
    
    <rect x="290" y="160" width="120" height="15" rx="5" fill="#666"/>
    
    <circle cx="240" cy="145" r="10" fill="#333"/>
    <circle cx="360" cy="145" r="10" fill="#333"/>
    <line x1="240" y1="145" x2="255" y2="160" stroke="#333" stroke-width="3"/>
    <line x1="360" y1="145" x2="345" y2="160" stroke="#333" stroke-width="3"/>
  </g>

  <g id="pelican" transform="translate(180,230)">
    <ellipse cx="400" cy="100" rx="60" ry="40" fill="url(#featherGrad)"/>
    
    <path d="M340,70 C320,60 300,70 300,90 C300,110 320,120 340,110 Z" fill="url(#featherGrad)"/>
    
    <path d="M340,110 L350,130 L360,150" fill="none" stroke="#8d6b4e" stroke-width="8"/>
    
    <path d="M350,150 Q380,180 360,190 Q340,200 330,185 Q320,170 350,150 Z" fill="url(#pouchGrad)" stroke="#e6b84d" stroke-width="2"/>
    
    <path d="M360,150 L380,165 L370,155 Z" fill="#ffcc66"/>
    
    <path d="M380,100 L390,90 L410,100 L400,110 Z" fill="url(#featherGrad)"/>
    <path d="M350,100 L340,90 L320,100 L330,110 Z" fill="url(#featherGrad)"/>
    
    <path d="M380,140 L380,160 L390,160" fill="none" stroke="#8d6b4e" stroke-width="8"/>
    <path d="M320,140 L320,160 L310,160" fill="none" stroke="#8d6b4e" stroke-width="8"/>
    
    <circle cx="395" cy="165" r="5" fill="#333"/>
    <circle cx="305" cy="165" r="5" fill="#333"/>
  </g>

  <g stroke="#333" stroke-width="2">
    <line x1="255" y1="160" x2="270" y2="175"/>
    <line x1="345" y1="160" x2="330" y2="175"/>
  </g>
</svg>