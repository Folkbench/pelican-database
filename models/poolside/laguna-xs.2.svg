<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="100%" height="100%" fill="#87CEEB"/>
  
  <g id="bicycle">
    <circle cx="100" cy="200" r="30" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="250" cy="200" r="30" fill="none" stroke="#333" stroke-width="4"/>
    <circle cx="100" cy="200" r="15" fill="#666"/>
    <circle cx="250" cy="200" r="15" fill="#666"/>
    
    <path d="M100,200 L130,150 L220,150 L250,200" fill="none" stroke="#c00" stroke-width="4"/>
    <path d="M130,150 L180,100 L220,150" fill="none" stroke="#c00" stroke-width="4"/>
    
    <rect x="175" y="130" width="10" height="20" fill="#8B4513"/>
    <path d="M180,130 L180,110" stroke="#8B4513" stroke-width="3"/>
    
    <circle cx="180" cy="180" r="4" fill="#333"/>
  </g>
  
  <g id="pelican" transform="translate(150, 100)">
    <ellipse cx="50" cy="80" rx="40" ry="30" fill="#4682B4"/>
    
    <circle cx="90" cy="60" r="20" fill="#4682B4"/>
    
    <path d="M110,60 Q125,60 130,70" stroke="#D2691E" stroke-width="3" fill="none"/>
    
    <path d="M115,70 Q125,85 115,100" fill="#FFF8DC" stroke="#4682B4" stroke-width="1"/>
    
    <path d="M30,80 Q20,100 30,120" fill="#2F4F4F" stroke="#4682B4" stroke-width="1"/>
    
    <line x1="40" y1="110" x2="45" y2="130" stroke="#8B4513" stroke-width="2"/>
    <line x1="60" y1="110" x2="55" y2="130" stroke="#8B4513" stroke-width="2"/>
    
    <circle cx="95" cy="55" r="2" fill="#000"/>
  </g>
</svg>