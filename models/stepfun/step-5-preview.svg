<svg viewBox="0 0 500 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="500" height="400" fill="#E1F5FE"/>
  <circle cx="420" cy="70" r="35" fill="#FFF59D"/>
  <ellipse cx="100" cy="80" rx="40" ry="18" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="130" cy="70" rx="30" ry="15" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Ground -->
  <rect x="0" y="365" width="500" height="35" fill="#8BC34A"/>
  <ellipse cx="250" cy="368" rx="190" ry="8" fill="rgba(0,0,0,0.15)"/>
  
  <!-- Bicycle Wheels -->
  <g stroke-linecap="round">
    <!-- Rear wheel -->
    <circle cx="140" cy="320" r="45" fill="none" stroke="#263238" stroke-width="5"/>
    <circle cx="140" cy="320" r="38" fill="none" stroke="#90A4AE" stroke-width="2"/>
    <g stroke="#78909C" stroke-width="1.5">
      <line x1="140" y1="320" x2="185" y2="320"/>
      <line x1="140" y1="320" x2="172" y2="352"/>
      <line x1="140" y1="320" x2="140" y2="365"/>
      <line x1="140" y1="320" x2="108" y2="352"/>
      <line x1="140" y1="320" x2="95" y2="320"/>
      <line x1="140" y1="320" x2="108" y2="288"/>
      <line x1="140" y1="320" x2="140" y2="275"/>
      <line x1="140" y1="320" x2="172" y2="288"/>
    </g>
    <circle cx="140" cy="320" r="4" fill="#263238"/>
    
    <!-- Front wheel -->
    <circle cx="360" cy="320" r="45" fill="none" stroke="#263238" stroke-width="5"/>
    <circle cx="360" cy="320" r="38" fill="none" stroke="#90A4AE" stroke-width="2"/>
    <g stroke="#78909C" stroke-width="1.5">
      <line x1="360" y1="320" x2="405" y2="320"/>
      <line x1="360" y1="320" x2="392" y2="352"/>
      <line x1="360" y1="320" x2="360" y2="365"/>
      <line x1="360" y1="320" x2="328" y2="352"/>
      <line x1="360" y1="320" x2="315" y2="320"/>
      <line x1="360" y1="320" x2="328" y2="288"/>
      <line x1="360" y1="320" x2="360" y2="275"/>
      <line x1="360" y1="320" x2="392" y2="288"/>
    </g>
    <circle cx="360" cy="320" r="4" fill="#263238"/>
  </g>
  
  <!-- Bicycle Frame -->
  <g fill="none" stroke="#E53935" stroke-width="6" stroke-linecap="round">
    <line x1="250" y1="320" x2="140" y2="320"/>
    <line x1="180" y1="260" x2="140" y2="320"/>
    <line x1="250" y1="320" x2="180" y2="260"/>
    <line x1="180" y1="260" x2="340" y2="265"/>
    <line x1="250" y1="320" x2="335" y2="275"/>
    <line x1="335" y1="275" x2="345" y2="255"/>
    <line x1="345" y1="255" x2="360" y2="320"/>
  </g>
  
  <!-- Handlebar -->
  <path d="M 345 255 L 350 225 M 335 225 H 365" fill="none" stroke="#37474F" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Seat -->
  <path d="M 165 250 H 190 Q 185 244 175 244 Q 165 244 165 250 Z" fill="#263238"/>
  
  <!-- Chain -->
  <path d="M 145 318 H 245 M 145 324 H 245" stroke="#546E7A" stroke-width="2" fill="none"/>
  
  <!-- Pedals & Cranks -->
  <line x1="250" y1="320" x2="270" y2="338" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="320" x2="230" y2="302" stroke="#263238" stroke-width="4" stroke-linecap="round"/>
  <rect x="262" y="338" width="16" height="5" rx="1" fill="#37474F"/>
  <rect x="222" y="302" width="16" height="5" rx="1" fill="#37474F"/>
  
  <!-- Pelican Legs -->
  <g fill="none" stroke="#FF9800" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 225 260 L 255 295 L 270 338"/>
    <path d="M 215 258 L 205 278 L 225 302"/>
  </g>
  
  <!-- Pelican Body -->
  <path d="M 175 255 C 190 215 220 210 250 225 C 270 235 275 260 265 275 C 240 295 200 290 175 255 Z" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="2"/>
  <!-- Tail -->
  <path d="M 175 255 L 155 245 L 170 265 Z" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="2"/>
  
  <!-- Pelican Neck -->
  <path d="M 240 215 C 260 170 280 150 305 160" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Wing -->
  <path d="M 225 225 C 250 230 300 240 345 228 C 350 226 352 232 348 234 C 300 246 250 238 225 233 Z" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="2"/>
  <!-- Wing tip -->
  <path d="M 330 231 Q 348 228 346 222 Q 342 230 330 232 Z" fill="#37474F"/>
  
  <!-- Head -->
  <circle cx="308" cy="158" r="12" fill="#FFFFFF" stroke="#ECEFF1" stroke-width="1"/>
  
  <!-- Beak -->
  <path d="M 315 152 L 402 172 L 316 168 Z" fill="#FB8C00"/>
  <!-- Pouch -->
  <path d="M 316 168 C 340 188 375 190 400 174 C 375 205 335 198 316 172 Z" fill="#FFCC80"/>
  
  <!-- Eye -->
  <circle cx="312" cy="153" r="2.5" fill="#37474F"/>
  <circle cx="313" cy="152" r="0.8" fill="#FFFFFF"/>
</svg>