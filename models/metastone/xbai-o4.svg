<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="400" height="300">
  <!-- Bicycle -->
  <circle cx="50" cy="120" r="15" fill="#333"/> <!-- Front wheel -->
  <circle cx="130" cy="120" r="15" fill="#333"/> <!-- Back wheel -->
  <rect x="60" y="95" width="70" height="10" fill="#000"/> <!-- Frame -->
  <line x1="50" y1="120" x2="60" y2="95" stroke="#000" stroke-width="4"/> <!-- Handlebar -->
  <line x1="130" y1="120" x2="100" y2="95" stroke="#000" stroke-width="4"/> <!-- Seat post -->
  <rect x="65" y="105" width="20" height="4" fill="#999"/> <!-- Pedal -->

  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="100" cy="95" rx="20" ry="15" fill="#4A90E2"/>
  <!-- Head -->
  <circle cx="85" cy="85" r="10" fill="#4A90E2"/>
  <!-- Beak -->
  <path d="M85,85 Q70,95 85,105" fill="#FF6F61"/>
  <!-- Eye -->
  <circle cx="82" cy="83" r="2" fill="#000"/>
  <!-- Wings -->
  <path d="M100,95 Q80,70 60,90" fill="none" stroke="#4A90E2" stroke-width="3"/>
  <!-- Legs -->
  <line x1="95" y1="110" x2="88" y2="130" stroke="#FFA500" stroke-width="4"/>
  <line x1="105" y1="110" x2="112" y2="130" stroke="#FFA500" stroke-width="4"/>
  
  <!-- Decorative feathers -->
  <path d="M120,95 Q130,80 140,95" fill="none" stroke="#4A90E2" stroke-width="2"/>
  <path d="M125,90 Q135,75 145,90" fill="none" stroke="#4A90E2" stroke-width="2"/>
</svg>