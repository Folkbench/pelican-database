    <path d="M590 430 L668 430 M590 430 L658 391 M590 430 L629 362 M590 430 L590 352 M590 430 L551 362 M590 430 L522 391 M590 430 L512 430 M590 430 L522 469 M590 430 L551 498 M590 430 L590 508 M590 430 L629 498 M590 430 L658 469"
