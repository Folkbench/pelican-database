    <path d="M455 202 C459 209 464 214 470 216"/>
    <path d="M327 214 C339 210 349 211 358 215"/>
    <path d="M312 229 C321 225 331 225 339 229"/>
    <path d="M351 249 C361 246 371 247 379 251"/>
