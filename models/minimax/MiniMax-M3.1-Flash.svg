<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful cream-colored pelican with a golden bill and pouch pedals a coral bicycle while holding the handlebar with one wing.</desc>

  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bce8ef"/>
      <stop offset="100%" stop-color="#f8f5dc"/>
    </linearGradient>
    <radialGradient id="sun" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fff3a6"/>
      <stop offset="65%" stop-color="#ffd66c"/>
      <stop offset="100%" stop-color="#f4b64e"/>
    </radialGradient>
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ead6a3"/>
      <stop offset="100%" stop-color="#d8bd83"/>
    </linearGradient>
    <linearGradient id="body" x1="15%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%" stop-color="#fffdf2"/>
      <stop offset="65%" stop-color="#f5ecd8"/>
      <stop offset="100%" stop-color="#dfceb0"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9aafb5"/>
      <stop offset="55%" stop-color="#78919c"/>
      <stop offset="100%" stop-color="#536e7c"/>
    </linearGradient>
    <linearGradient id="bill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd05c"/>
      <stop offset="55%" stop-color="#f6a43d"/>
      <stop offset="100%" stop-color="#df7130"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8b6c"/>
      <stop offset="100%" stop-color="#d94d4d"/>
    </linearGradient>
  </defs>

  <!-- Coastal background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="93" r="48" fill="url(#sun)"/>

  <g fill="#ffffff" opacity="0.76">
    <circle cx="92" cy="131" r="23"/>
    <circle cx="120" cy="114" r="32"/>
    <circle cx="151" cy="132" r="24"/>
    <rect x="69" y="130" width="104" height="28" rx="14"/>
