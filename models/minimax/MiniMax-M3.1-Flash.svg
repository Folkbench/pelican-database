    <circle cx="200" cy="430" r="91" stroke="#273b46" stroke-width="11"/>
    <circle cx="200" cy="430" r="82" stroke="#fff9e9" stroke-width="5"/>
    <path d="M200 430 L278 430 M200 430 L268 391 M200 430 L239 362 M200 430 L200 352 M200 430 L161 362 M200 430 L132 391 M200 430 L122 430 M200 430 L132 469 M200 430 L161 498 M200 430 L200 508 M200 430 L239 498 M200 430 L268 469"
