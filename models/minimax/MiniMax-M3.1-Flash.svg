    <circle cx="330" cy="67" r="23"/>
    <circle cx="356" cy="81" r="17"/>
    <rect x="289" y="80" width="80" height="20" rx="10"/>
  </g>

  <path d="M0 405 C83 374 148 377 218 400 C292 424 358 417 432 394 C513 369 581 375 650 398 C707 417 757 414 800 399 L800 521 L0 521 Z" fill="#b5d39c"/>
  <path d="M0 448 C95 418 170 430 249 451 C330 473 411 453 489 434 C578 411 683 428 800 456 L800 522 L0 522 Z" fill="#98c68e" opacity="0.78"/>
  <path d="M0 505 C167 497 279 510 415 504 C554 497 664 499 800 507 L800 600 L0 600 Z" fill="url(#ground)"/>
  <path d="M0 505 C167 497 279 510 415 504 C554 497 664 499 800 507" fill="none" stroke="#c4a873" stroke-width="4"/>

