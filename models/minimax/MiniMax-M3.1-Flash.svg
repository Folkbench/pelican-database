  <path d="M284 248
           C290 216 321 190 359 185
           C391 181 421 189 445 207
           C458 217 468 214 475 199
           C485 178 483 154 476 136
           C469 118 474 99 489 90
           C505 80 527 89 536 105
           C543 118 542 134 535 148
           C529 162 528 178 518 191
           C503 214 487 237 460 251
           C424 270 373 276 332 264
           C312 258 294 256 284 248 Z"
