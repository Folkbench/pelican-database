  <!-- Near wing reaching for the handlebar -->
  <path d="M411 207
           C434 198 458 207 477 225
           C494 240 516 248 542 247
           L568 248
           C576 248 580 255 574 261
           C567 269 551 269 535 265
           C501 259 470 248 445 235
           C426 226 412 220 411 207 Z"
        fill="url(#wing)" stroke="#344a56" stroke-width="4" stroke-linejoin="round"/>
  <path d="M418 207 C438 204 457 214 474 228 C493 243 516 251 541 251"
        fill="none" stroke="#c0cdd0" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  <g fill="none" stroke="#b4c5c8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M439 220 C456 232 476 241 498 247"/>
    <path d="M454 214 C470 223 486 235 505 241"/>
    <path d="M480 242 C499 253 520 259 541 260"/>
  </g>
  <path d="M549 252 C558 247 568 247 575 251 C579 254 578 260 574 263"
