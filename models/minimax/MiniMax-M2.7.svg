<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f7fa;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1"/>
    </linearGradient>
    <radialGradient id="wheelGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="70%" style="stop-color:#333;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#000;stop-opacity:1"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#skyGradient)"/>

  <path d="M0 330 L600 330" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>

  <g id="bicycle" transform="translate(50, 0)">
    <g stroke="#333" stroke-width="4" fill="url(#wheelGradient)">
      <circle cx="100" cy="280" r="50" fill="#333"/>
      <circle cx="100" cy="280" r="45" fill="none" stroke="#555" stroke-width="2"/>
      <path d="M100 235 L100 325 M55 280 L145 280 M68 253 L132 307 M68 307 L132 253" stroke="#888" stroke-width="1"/>

      <circle cx="400" cy="280" r="50" fill="#333"/>
      <circle cx="400" cy="280" r="45" fill="none" stroke="#555" stroke-width="2"/>
      <path d="M400 235 L400 325 M355 280 L445 280 M368 253 L432 307 M368 307 L432 253" stroke="#888" stroke-width="1"/>
    </g>

    <g stroke="#3498db" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="100" y1="280" x2="220" y2="280"/>
      <line x1="220" y1="280" x2="190" y2="160"/>
      <line x1="190" y1="160" x2="360" y2="160"/>
      <line x1="220" y1="280" x2="360" y2="160"/>
      <line x1="360" y1="160" x2="400" y2="280"/>
      <line x1="360" y1="160" x2="360" y2="130"/>
    </g>

    <path d="M170 160 L210 160 L215 155 L165 155 Z" fill="#8e44ad" stroke="#333" stroke-width="2"/>

    <path d="M360 130 Q360 110 380 115 L420 115" fill="none" stroke="#333" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(220, 280)">
      <circle r="10" fill="#333"/>
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#333" stroke-width="4"/>
      <line x1="0" y1="0" x2="0" y2="15" stroke="#333" stroke-width="4"/>
      <rect x="-15" y="-5" width="30" height="10" fill="#7f8c8d" rx="2"/>
    </g>
  </g>

  <g id="pelican" transform="translate(50, 0)">
    
    <path d="M230 160 Q240 220 220 280" stroke="#f1c40f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M220 280 L210 285 L220 290 L230 285" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>

    <ellipse cx="240" cy="130" rx="60" ry="40" fill="#ffffff" stroke="#333" stroke-width="2"/>
    
    <path d="M200 130 Q220 100 260 110 Q290 120 280 140" fill="#ecf0f1" stroke="#333" stroke-width="2"/>

    <path d="M250 160 Q280 220 235 265" stroke="#f1c40f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M235 265 L225 270 L235 275 L245 270" fill="#f1c40f" stroke="#d35400" stroke-width="2"/>

    <path d="M270 130 Q300 100 290 70" fill="none" stroke="#ffffff" stroke-width="25" stroke-linecap="round"/>
    <path d="M270 130 Q300 100 290 70" fill="none" stroke="#333" stroke-width="2" opacity="0.5"/> <circle cx="290" cy="70" r="20" fill="#ffffff" stroke="#333" stroke-width="2"/>

    <path d="M300 60 L400 55 L400 75 Q350 95 300 80 Z" fill="#f39c12" stroke="#333" stroke-width="2"/>
    <line x1="300" y1="70" x2="390" y2="70" stroke="#d35400" stroke-width="1"/>

    <circle cx="290" cy="65" r="3" fill="#000"/>
    <circle cx="291" cy="64" r="1" fill="#fff"/>

    <path d="M260 130 Q320 120 350 115" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="360" cy="115" r="5" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
  </g>

  <g stroke="#3498db" stroke-width="2" opacity="0.6">
    <line x1="50" y1="350" x2="20" y2="350"/>
    <line x1="80" y1="360" x2="40" y2="360"/>
  </g>

</svg>