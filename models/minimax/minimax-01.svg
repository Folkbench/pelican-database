  <rect x="245" y="165" width="10" height="5" fill="black"></rect>
  <rect x="275" y="165" width="10" height="5" fill="black"></rect>

  
  <g transform="translate(220, 100)">
    
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="white" stroke="black"></ellipse>
    
    <polygon points="20,0 30,-10 30,10" fill="orange" stroke="black"></polygon>
    
    <ellipse cx="10" cy="-5" rx="2" ry="3" fill="black" stroke="black"></ellipse>
    
