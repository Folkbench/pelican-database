    <linearGradient id="beak" x1="560" y1="175" x2="755" y2="215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd36a"/>
      <stop offset="0.55" stop-color="#f6a33a"/>
      <stop offset="1" stop-color="#e8792f"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#16202b" flood-opacity="0.18"/>
    </filter>
  </defs>

