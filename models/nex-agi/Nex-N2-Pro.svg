<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A cheerful pelican with a large orange beak rides a bicycle along a grassy path.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfeaff"/>
      <stop offset="1" stop-color="#f7fcff"/>
    </linearGradient>

    <linearGradient id="ground" x1="0" y1="520" x2="0" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9ef9b"/>
      <stop offset="1" stop-color="#93c86b"/>
