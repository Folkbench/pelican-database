    <path d="M448 226 C455 219 466 218 475 225" fill="none" stroke="#cbd5e1" stroke-width="2" opacity="0.7"/>

    <path d="M493 224 C532 210 584 211 640 227 C586 240 531 240 486 237 C492 233 495 229 493 224 Z" fill="url(#beakGrad)" stroke="#ea580c" stroke-width="2"/>
    <path d="M493 241 C535 238 584 263 574 304 C559 320 505 300 487 264 C490 255 491 248 493 241 Z" fill="url(#pouchGrad)" stroke="#ea580c" stroke-width="2"/>
    <path d="M492 236 C535 231 585 232 633 227" fill="none" stroke="#fff7ad" stroke-width="3" opacity="0.55"/>

    <circle cx="474" cy="230" r="5" fill="#11182a"/>
    <circle cx="476" cy="228" r="1.5" fill="#ffffff"/>

    <circle cx="466" cy="244" r="5" fill="#fed7aa" opacity="0.35"/>
