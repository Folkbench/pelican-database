    <path d="M337 348 C355 358 371 370 382 386" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.7"/>

    <path d="M402 316 C438 292 480 288 545 306 L570 313 C548 325 520 329 489 326 C456 323 425 329 403 330 C399 324 399 319 402 316 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>
