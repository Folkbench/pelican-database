    <path d="M431 331 C462 324 493 324 531 330" fill="none" stroke="#94a3b8" stroke-width="3" opacity="0.7"/>

    <path d="M410 316 C424 286 414 258 441 237 C462 221 486 233 478 258 C471 281 457 292 438 316 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3"/>

