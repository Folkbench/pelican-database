  <path d="M0 575 C170 555 300 575 450 560 C620 545 720 560 900 545" fill="none" stroke="#fde68a" stroke-width="8" opacity="0.75"/>

  <ellipse cx="420" cy="540" rx="330" ry="34" fill="#0f172a" opacity="0.16"/>

