    <circle cx="145" cy="105" r="34"/>
    <circle cx="190" cy="126" r="30"/>

    <ellipse cx="650" cy="125" rx="50" ry="24"/>
    <circle cx="612" cy="124" r="24"/>
    <circle cx="650" cy="106" r="31"/>
    <circle cx="690" cy="126" r="26"/>
  </g>

