<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <g id="pelican-riding-bicycle">
    <circle cx="150" cy="250" r="50" fill="#987654"></circle>
    <ellipse cx="120" cy="200" rx="30" ry="20" fill="#C3F500"></ellipse>
    <ellipse cx="180" cy="200" rx="30" ry="20" fill="#C3F500"></ellipse>
    <polyline points="100,250 150,270 200,250" stroke="#987654" stroke-width="5" fill="none"></polyline>
    <rect x="80" y="180" width="40" height="20" fill="#987654" rx="5"></rect>
    <rect x="220" y="180" width="40" height="20" fill="#987654" rx="5"></rect>
    <path d="M 100,280 Q 120,290 150,280 Q 180,270 200,280 Z" stroke="#987654" stroke-width="5" fill="none"></path>
  </g>
  <g id="wheel">
    <circle cx="80" cy="340" r="20" fill="#C3F500"></circle>
    <path d="M 60,340 Q 70,350 80,340 Z" stroke="#C3F500" stroke-width="2" fill="none"></path>
  </g>
  <g id="cylinder-rod">
    <rect x="100" y="280" width="20" height="20" fill="#987654" rx="2"></rect>
    <path d="M 110,280 L 130,280" stroke="#987654" stroke-width="2" fill="none"></path>
  </g>
  <g id="handlebar">
    <rect x="150" y="250" width="20" height="20" fill="#987654" rx="2"></rect>
  </g>
  <g id="pedals">
    <rect x="70" y="350" width="20" height="20" fill="#987654" rx="2"></rect>
    <rect x="230" y="350" width="20" height="20" fill="#987654" rx="2"></rect>
  </g>
  <line x1="150" y1="260" x2="150" y2="320" stroke="#987654" stroke-width="2"></line>
  <line x1="150" y1="260" x2="140" y2="250" stroke="#987654" stroke-width="2"></line>
  <line x1="150" y1="260" x2="160" y2="270" stroke="#987654" stroke-width="2"></line>
</svg>