<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img">
<title>Pelican riding a bicycle</title>
<!-- Background -->
<rect width="800" height="500" fill="#B3E5FC"/>
<!-- Sun -->
<circle cx="710" cy="80" r="52" fill="#FFEB3B" stroke="#FBC02D" stroke-width="5"/>
<circle cx="710" cy="80" r="8" fill="#FFF9C4"/>
<!-- Clouds -->
<g fill="white" opacity="0.95">
  <ellipse cx="120" cy="90" rx="45" ry="28"/><ellipse cx="155" cy="78" rx="38" ry="30"/><ellipse cx="190" cy="92" rx="42" ry="26"/><ellipse cx="152" cy="102" rx="50" ry="18"/>
  <ellipse cx="420" cy="70" rx="32" ry="20"/><ellipse cx="445" cy="60" rx="28" ry="22"/><ellipse cx="470" cy="72" rx="30" ry="18"/><ellipse cx="445" cy="82" rx="40" ry="14"/>
  <ellipse cx="320" cy="105" rx="22" ry="14"/><ellipse cx="338" cy="98" rx="20" ry="16"/><ellipse cx="355" cy="106" rx="18" ry="12"/>
</g>
<!-- Distant hills -->
<path d="M0 300 C 120 200, 240 260, 360 230 C 480 200, 560 280, 800 240 L 800 420 L 0 420 Z" fill="#81C784" stroke="#66BB6A" stroke-width="4" stroke-linejoin="round"/>
<path d="M0 340 C 180 280, 320 320, 480 290 C 600 270, 680 330, 800 310 L 800 420 L 0 420 Z" fill="#AED581" stroke="#9CCC65" stroke-width="3"/>

<!-- Ground & Road -->
<rect x="0" y="420" width="800" height="80" fill="#C8E6C9"/>
<rect x="0" y="420" width="800" height="34" fill="#616161"/>
<rect x="0" y="420" width="800" height="9" fill="#424242"/>
<!-- road dashes -->
<g stroke="#FAFAFA" stroke-width="5" stroke-linecap="round" stroke-dasharray="28 36" opacity="0.9">
  <line x1="20" y1="437" x2="780" y2="437"/>
</g>
<!-- wheel shadows -->
<ellipse cx="260" cy="428" rx="58" ry="8" fill="black" opacity="0.18"/>
<ellipse cx="520" cy="428" rx="58" ry="8" fill="black" opacity="0.18"/>

<!-- ================= BICYCLE ================= -->
<g id="bicycle">
  <!-- wheels tires -->
  <g id="wheels">
    <!-- Rear wheel -->
    <g transform="translate(260 350)">
      <circle r="70" fill="none" stroke="#212121" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#757575" stroke-width="2"/>
      <!-- spokes -->
      <g stroke="#9E9E9E" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="-44" y1="44" x2="44" y2="-44"/>
        <line x1="-23" y1="-58" x2="23" y2="58"/>
        <line x1="-58" y1="-23" x2="58" y2="23"/>
        <line x1="-58" y1="23" x2="58" y2="-23"/>
        <line x1="-23" y1="58" x2="23" y2="-58"/>
      </g>
      <circle r="11" fill="#424242" stroke="#212121" stroke-width="3"/>
      <circle r="4" fill="#BDBDBD"/>
    </g>
    <!-- Front wheel -->
    <g transform="translate(520 350)">
      <circle r="70" fill="none" stroke="#212121" stroke-width="10"/>
      <circle r="62" fill="none" stroke="#757575" stroke-width="2"/>
      <g stroke="#9E9E9E" stroke-width="2.5" stroke-linecap="round">
        <line x1="0" y1="-62" x2="0" y2="62"/>
        <line x1="-62" y1="0" x2="62" y2="0"/>
        <line x1="-44" y1="-44" x2="44" y2="44"/>
        <line x1="-44" y1="44" x2="44" y2="-44"/>
        <line x1="-23" y1="-58" x2="23" y2="58"/>
        <line x1="-58" y1="-23" x2="58" y2="23"/>
        <line x1="-58" y1="23" x2="58" y2="-23"/>
        <line x1="-23" y1="58" x2="23" y2="-58"/>
      </g>
      <circle r="11" fill="#424242" stroke="#212121" stroke-width="3"/>
      <circle r="4" fill="#BDBDBD"/>
    </g>
  </g>

  <!-- Frame -->
  <g fill="none" stroke="#E53935" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <!-- chain stay -->
    <line x1="260" y1="350" x2="375" y2="350"/>
    <!-- seat tube -->
    <line x1="375" y1="350" x2="330" y2="260"/>
    <!-- seat stay -->
    <line x1="260" y1="350" x2="330" y2="260"/>
    <!-- down tube -->
    <line x1="375" y1="350" x2="498" y2="280"/>
    <!-- top tube -->
    <line x1="330" y1="260" x2="498" y2="280"/>
    <!-- fork -->
    <line x1="520" y1="350" x2="498" y2="280"/>
  </g>
  <!-- head tube detail -->
  <line x1="498" y1="280" x2="512" y2="258" stroke="#B71C1C" stroke-width="10" stroke-linecap="round"/>
  <!-- seat -->
  <g transform="translate(330 252)">
    <ellipse cx="0" cy="0" rx="32" ry="10" fill="#212121" stroke="black" stroke-width="2"/>
    <ellipse cx="0" cy="-3" rx="30" ry="6" fill="#424242"/>
  </g>
  <!-- seat clamp -->
  <circle cx="330" cy="260" r="6" fill="#9E9E9E" stroke="#212121" stroke-width="2"/>
  <!-- handlebars -->
  <g stroke="#212121" stroke-linecap="round">
    <line x1="485" y1="255" x2="525" y2="250" stroke-width="9"/>
    <line x1="485" y1="242" x2="492" y2="262" stroke-width="7"/>
    <!-- brake hood / grip -->
    <rect x="523" y="240" width="16" height="18" rx="6" fill="#212121"/>
    <circle cx="488" cy="266" r="7" fill="#FF6F00" stroke="#212121" stroke-width="2"/>
  </g>
  <!-- bottom bracket -->
  <circle cx="375" cy="350" r="13" fill="#424242" stroke="#212121" stroke-width="3"/>
  <!-- crank and pedals -->
  <g stroke="#212121" stroke-linecap="round">
    <line x1="375" y1="350" x2="400" y2="385" stroke="#424242" stroke-width="8"/>
    <line x1="375" y1="350" x2="350" y2="315" stroke="#616161" stroke-width="7"/>
  </g>
  <g fill="#212121" stroke="black" stroke-width="1.5">
    <rect x="392" y="380" width="26" height="12" rx="3" transform="rotate(-12 405 386)"/>
    <rect x="336" y="310" width="26" height="12" rx="3" transform="rotate(-12 349 316)"/>
    <!-- reflectors -->
    <rect x="396" y="383" width="18" height="4" rx="1.5" fill="#FF6F00" stroke="none" transform="rotate(-12 405 386)"/>
  </g>
  <!-- chain -->
  <path d="M 263 340 L 375 338 L 387 355 L 268 360 Z" fill="none" stroke="#9E9E9E" stroke-width="2.2" stroke-dasharray="6 4" opacity="0.9"/>
  <!-- bell -->
  <g transform="translate(514 253)">
    <circle r="8" fill="#FFD54F" stroke="#212121" stroke-width="1.8"/>
    <circle r="3" fill="#FFF9C4"/>
  </g>
</g>

<!-- ================= PELICAN ================= -->
<g id="pelican">
  <!-- tail -->
  <path d="M 268 240 C 225 235, 205 255, 248 278 C 260 285, 282 276, 288 256 Z" fill="#FFF8E7" stroke="#D7CCC8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 235 252 C 222 248, 215 257, 232 264 Z" fill="#EFEBE9" stroke="#BCAAA4" stroke-width="1.2"/>
  <!-- body main -->
  <ellipse cx="340" cy="242" rx="78" ry="56" fill="#FFFBF0" stroke="#D7CCC8" stroke-width="5"/>
  <ellipse cx="340" cy="242" rx="78" ry="56" fill="none" stroke="white" stroke-width="2" opacity="0.6"/>
  <!-- belly shading -->
  <ellipse cx="345" cy="265" rx="46" ry="22" fill="#FFF3E0" opacity="0.9"/>
  <!-- wing -->
  <g>
    <ellipse cx="332" cy="258" rx="58" ry="38" fill="white" stroke="#D7CCC8" stroke-width="4"/>
    <!-- feather lines -->
    <path d="M 292 250 C 310 245, 330 250, 348 242" fill="none" stroke="#D7CCC8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 286 262 C 305 258, 328 264, 352 254" fill="none" stroke="#D7CCC8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 290 274 C 312 270, 335 274, 355 266" fill="none" stroke="#D7CCC8" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 302 282 C 318 280, 334 283, 345 277" fill="none" stroke="#BCAAA4" stroke-width="1.5" stroke-linecap="round"/>
    <!-- wing tip dark -->
    <path d="M 362 232 C 378 238, 386 252, 380 270 C 372 262, 360 250, 352 244 Z" fill="#EFEBE9" stroke="#BCAAA4" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <!-- neck -->
  <path d="M 368 198 C 382 178, 398 160, 416 143 L 432 158 C 418 174, 397 194, 386 228 C 376 250, 358 262, 334 248 C 342 228, 355 212, 368 198 Z" fill="#FFFBF0" stroke="#D7CCC8" stroke-width="4.5" stroke-linejoin="round"/>
  <!-- neck shading line -->
  <path d="M 388 185 C 398 172, 410 160, 420 152" fill="none" stroke="#EFEBE9" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  
  <!-- legs -->
  <!-- far leg (to upper pedal) -->
  <path d="M 330 282 L 342 304 L 350 313" fill="none" stroke="#FF8F00" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- near leg (to lower pedal) -->
  <path d="M 355 284 C 368 306, 380 332, 395 381" fill="none" stroke="#EF6C00" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 348 282 C 360 298, 372 318, 382 340" fill="none" stroke="#FFB74D" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- feet / webbed -->
  <g fill="#FF8F00" stroke="#E65100" stroke-width="2.2" stroke-linejoin="round">
    <!-- upper foot on pedal -->
    <path d="M 343 312 L 362 318 L 358 324 L 342 322 L 334 320 Z" fill="#FF8F00"/>
    <path d="M 347 315 L 353 321" stroke="#BF360C" stroke-width="1.4"/>
    <!-- lower foot -->
    <path d="M 388 379 L 412 386 L 408 394 L 390 392 L 380 388 Z" />
    <path d="M 393 382 L 399 389 M 398 383 L 403 391" stroke="#BF360C" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- head -->
  <ellipse cx="418" cy="146" rx="31" ry="27" fill="#FFFBF0" stroke="#D7CCC8" stroke-width="4.5"/>
  <!-- cheek blush -->
  <ellipse cx="408" cy="158" rx="10" ry="6" fill="#FFCCBC" opacity="0.45"/>
  <!-- eye -->
  <g>
    <ellipse cx="416" cy="136" rx="11.5" ry="12.5" fill="white" stroke="#3E2723" stroke-width="2.2"/>
    <circle cx="418.5" cy="137.5" r="7" fill="#212121"/>
    <circle cx="421" cy="134.5" r="2.7" fill="white" opacity="0.95"/>
    <circle cx="417" cy="141" r="1.2" fill="white" opacity="0.7"/>
    <!-- eyelid -->
    <path d="M 405 128 C 412 122, 424 123, 428 129" fill="none" stroke="#3E2723" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- nostril -->
  <ellipse cx="452" cy="148" rx="3" ry="1.8" fill="#6D4C41"/>

  <!-- BEAK upper -->
  <path d="M 430 126 C 486 118, 548 135, 582 159 L 432 166 Z" fill="#FF9800" stroke="#EF6C00" stroke-width="4.2" stroke-linejoin="round"/>
  <path d="M 433 132 C 470 128, 520 138, 562 152" fill="none" stroke="#FFB74D" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <!-- beak tip nail -->
  <path d="M 566 153 L 582 159 L 565 167 Z" fill="#FFF3E0" stroke="#EF6C00" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 568 157 C 572 158, 573 161, 570 163" fill="none" stroke="#BCAAA4" stroke-width="1.2" stroke-linecap="round"/>
  <!-- lower mandible & huge pouch -->
  <path d="M 429 169 L 580 160 C 560 182, 520 222, 478 242 C 442 258, 404 252, 384 216 C 392 204, 400 192, 411 181 Z" fill="#FFCC80" stroke="#EF6C00" stroke-width="4" stroke-linejoin="round"/>
  <!-- pouch membrane lines -->
  <path d="M 432 169 C 452 188, 470 214, 448 236 C 422 246, 398 232, 388 215" fill="#FFAB91" stroke="#E64A19" stroke-width="2.2" stroke-linejoin="round" opacity="0.95"/>
  <path d="M 450 176 C 468 192, 482 210, 478 226" fill="none" stroke="#BF360C" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
  <path d="M 470 179 C 484 195, 495 212, 492 227" fill="none" stroke="#BF360C" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
  <!-- lower beak edge highlight -->
  <path d="M 430 169 L 576 161" fill="none" stroke="#5D4037" stroke-width="1.8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 432 169 L 558 164" fill="none" stroke="#FFE0B2" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- helmet -->
  <g>
    <path d="M 388 128 C 392 108, 420 100, 438 112 C 446 120, 444 132, 435 135 L 388 136 Z" fill="#29B6F6" stroke="#01579B" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M 393 115 C 402 108, 422 106, 434 118" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- helmet vents -->
    <ellipse cx="406" cy="120" rx="7" ry="3.5" fill="#01579B" opacity="0.9"/>
    <ellipse cx="424" cy="122" rx="5.5" ry="2.8" fill="#01579B" opacity="0.9"/>
    <!-- strap -->
    <path d="M 392 135 C 398 150, 410 162, 418 165" fill="none" stroke="#01579B" stroke-width="3" stroke-linecap="round"/>
    <path d="M 430 135 C 430 150, 424 160, 418 165" fill="none" stroke="#01579B" stroke-width="3" stroke-linecap="round"/>
    <circle cx="418" cy="165" r="3.5" fill="#01579B"/>
  </g>
  <!-- helmet reflection shine -->
  <path d="M 398 118 C 402 112, 412 109, 418 113" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>

  <!-- Motion lines -->
  <g stroke="#0288D1" stroke-width="3.5" stroke-linecap="round" opacity="0.45">
    <line x1="140" y1="330" x2="190" y2="330"/>
    <line x1="125" y1="350" x2="175" y2="350"/>
    <line x1="145" y1="370" x2="195" y2="370"/>
  </g>
</g>

<!-- front basket (optional cute) -->
<g transform="translate(530 282)">
  <path d="M -22 -16 L 22 -16 L 14 18 L -14 18 Z" fill="none" stroke="#795548" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M -22 -16 L 14 18 M -10 -16 L 6 18 M 2 -16 L -2 18" stroke="#8D6E63" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M -18 0 L 18 0" stroke="#8D6E63" stroke-width="2"/>
  <!-- little fish peeking out of basket -->
  <g transform="translate(0 -4) rotate(-8)">
    <ellipse cx="0" cy="0" rx="18" ry="10" fill="#4FC3F7" stroke="#0277BD" stroke-width="2"/>
    <path d="M -12 -6 C -18 -10, -22 -2, -14 2" fill="#4FC3F7" stroke="#0277BD" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 10 0 L 18 -5 L 18 5 Z" fill="#FF8A65" stroke="#BF360C" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="-4" cy="-2" r="2.2" fill="#212121"/><circle cx="-3.2" cy="-2.8" r="0.7" fill="white"/>
    <path d="M -6 2 C -2 5, 2 5, 6 2" fill="none" stroke="#01579B" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</g>

<!-- Signature handlebar streamer -->
<g opacity="0.95">
  <path d="M 525 248 C 535 244, 542 252, 538 262 C 534 272, 542 280, 552 276" fill="none" stroke="#AB47BC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 525 251 C 533 247, 538 254, 535 262" fill="none" stroke="#CE93D8" stroke-width="2" stroke-linecap="round"/>
</g>

</svg>