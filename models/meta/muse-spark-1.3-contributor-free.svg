<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".65" stop-color="#bae6fd"/><stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <pattern id="basket" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#d97706"/>
      <path d="M0 6H12M6 0V12" stroke="#92400e" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="960" height="600" fill="url(#sky)"/>
  <!-- sun -->
  <g transform="translate(830,90)">
    <g class="wheel-spin">
      <circle r="38" fill="#fde047" stroke="#f59e0b" stroke-width="4"/>
      <g stroke="#f59e0b" stroke-width="6" stroke-linecap="round">
        <line y1="-58" y2="-46"/><line y1="58" y2="46"/>
        <line x1="-58" x2="-46"/><line x1="58" x2="46"/>
        <line x1="-40" y1="-40" x2="-31" y2="-31"/><line x1="40" y1="40" x2="31" y2="31"/>
        <line x1="-40" y1="40" x2="-31" y2="31"/><line x1="40" y1="-40" x2="31" y2="-31"/>
      </g>
    </g>
    <circle r="30" fill="#fef08a" opacity=".9"/>
  </g>

  <!-- clouds -->
  <g class="cloud-a" fill="#fff" opacity=".95">
    <ellipse cx="0" cy="90" rx="46" ry="22"/><ellipse cx="38" cy="80" rx="32" ry="20"/><ellipse cx="-38" cy="82" rx="28" ry="16"/>
  </g>
  <g class="cloud-b" fill="#fff" opacity=".85">
    <ellipse cx="0" cy="150" rx="38" ry="17"/><ellipse cx="30" cy="142" rx="26" ry="15"/><ellipse cx="-30" cy="143" rx="22" ry="13"/>
  </g>
  <g class="cloud-c" fill="#fff" opacity=".9">
    <ellipse cx="0" cy="60" rx="30" ry="14"/><ellipse cx="24" cy="54" rx="20" ry="12"/>
  </g>
  <!-- birds -->
  <g stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M200 130 q10 -10 20 0 q10 -10 20 0"><animate attributeName="d" values="M200 130 q10 -10 20 0 q10 -10 20 0;M200 135 q10 -4 20 0 q10 -4 20 0;M200 130 q10 -10 20 0 q10 -10 20 0" dur="1.2s" repeatCount="indefinite"/></path>
    <path d="M260 110 q8 -8 16 0 q8 -8 16 0"><animate attributeName="d" values="M260 110 q8 -8 16 0 q8 -8 16 0;M260 114 q8 -3 16 0 q8 -3 16 0;M260 110 q8 -8 16 0 q8 -8 16 0" dur="1s" repeatCount="indefinite"/></path>
  </g>

  <!-- distant hills (loop: two copies) -->
  <g class="hill-back" opacity=".9">
    <g fill="#7dd3a8">
      <ellipse cx="120" cy="480" rx="220" ry="90"/><ellipse cx="360" cy="480" rx="200" ry="70"/>
      <ellipse cx="600" cy="480" rx="220" ry="90"/><ellipse cx="840" cy="480" rx="200" ry="70"/>
      <ellipse cx="1080" cy="480" rx="220" ry="90"/>
    </g>
  </g>

  <!-- grass + road -->
  <rect x="0" y="440" width="960" height="160" fill="url(#grass)"/>
  <rect x="0" y="480" width="960" height="80" fill="url(#road)"/>
  <line x1="0" y1="480" x2="960" y2="480" stroke="#fff" stroke-width="4"/>
  <line class="road-dash" x1="0" y1="522" x2="960" y2="522" stroke="#fde047" stroke-width="7" stroke-dasharray="36 36" stroke-linecap="round"/>

  <!-- passing trees (foreground loop) -->
  <g class="trees">
    <g id="treeRow">
      <g transform="translate(40,0)">
        <rect x="-8" y="380" width="16" height="70" rx="5" fill="#78350f"/>
        <circle cx="0" cy="355" r="34" fill="#16a34a"/><circle cx="-24" cy="370" r="22" fill="#22c55e"/><circle cx="24" cy="370" r="22" fill="#15803d"/>
      </g>
      <g transform="translate(360,0)">
        <rect x="-8" y="380" width="16" height="70" rx="5" fill="#78350f"/>
        <circle cx="0" cy="355" r="34" fill="#16a34a"/><circle cx="-24" cy="370" r="22" fill="#22c55e"/><circle cx="24" cy="370" r="22" fill="#15803d"/>
      </g>
      <g transform="translate(680,0)">
        <rect x="-8" y="380" width="16" height="70" rx="5" fill="#78350f"/>
        <circle cx="0" cy="355" r="34" fill="#16a34a"/><circle cx="-24" cy="370" r="22" fill="#22c55e"/><circle cx="24" cy="370" r="22" fill="#15803d"/>
      </g>
      <g transform="translate(1000,0)">
        <rect x="-8" y="380" width="16" height="70" rx="5" fill="#78350f"/>
        <circle cx="0" cy="355" r="34" fill="#16a34a"/><circle cx="-24" cy="370" r="22" fill="#22c55e"/><circle cx="24" cy="370" r="22" fill="#15803d"/>
      </g>
    </g>
  </g>

  <!-- dust behind rear wheel -->
  <g fill="#e2e8f0">
    <circle class="dust" cx="320" cy="470" r="10"/>
    <circle class="dust d2" cx="320" cy="475" r="13"/>
    <circle class="dust d3" cx="320" cy="468" r="8"/>
  </g>

  <!-- ===== rider + bike ===== -->
  <g class="bike-bob">
    <!-- shadow -->
    <ellipse cx="490" cy="498" rx="155" ry="12" fill="#000" opacity=".22"/>

    <!-- wheels -->
    <g>
      <g class="wheel-spin" style="transform-origin: 380px 430px;">
        <circle cx="380" cy="430" r="55" fill="#f8fafc" stroke="#1e293b" stroke-width="9"/>
        <circle cx="380" cy="430" r="8" fill="#1e293b"/>
        <g stroke="#94a3b8" stroke-width="4">
          <line x1="380" y1="378" x2="380" y2="482"/><line x1="328" y1="430" x2="432" y2="430"/>
          <line x1="343" y1="393" x2="417" y2="467"/><line x1="417" y1="393" x2="343" y2="467"/>
        </g>
        <circle cx="380" cy="378" r="7" fill="#f59e0b"/>
      </g>
      <g class="wheel-spin" style="transform-origin: 600px 430px;">
        <circle cx="600" cy="430" r="55" fill="#f8fafc" stroke="#1e293b" stroke-width="9"/>
        <circle cx="600" cy="430" r="8" fill="#1e293b"/>
        <g stroke="#94a3b8" stroke-width="4">
          <line x1="600" y1="378" x2="600" y2="482"/><line x1="548" y1="430" x2="652" y2="430"/>
          <line x1="563" y1="393" x2="637" y2="467"/><line x1="637" y1="393" x2="563" y2="467"/>
        </g>
        <circle cx="600" cy="378" r="7" fill="#f59e0b"/>
      </g>
    </g>

    <!-- frame -->
    <g fill="none" stroke="#0ea5e9" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <line x1="380" y1="430" x2="460" y2="320"/>
      <line x1="460" y1="320" x2="575" y2="325"/>
      <line x1="460" y1="320" x2="600" y2="430"/>
      <line x1="380" y1="430" x2="490" y2="430"/>
      <line x1="490" y1="430" x2="600" y2="430"/>
      <line x1="575" y1="325" x2="600" y2="430"/>
    </g>
    <!-- chain -->
    <g stroke="#334155" stroke-width="4" fill="none" opacity=".9">
      <line x1="380" y1="418" x2="490" y2="418"/><line x1="380" y1="442" x2="490" y2="442"/>
      <circle cx="380" cy="430" r="14" fill="none"/>
    </g>
    <!-- seat + handlebar -->
    <line x1="460" y1="320" x2="455" y2="300" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="448" cy="295" rx="22" ry="8" fill="#1e293b"/>
    <line x1="575" y1="325" x2="582" y2="282" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <line x1="562" y1="282" x2="600" y2="282" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
    <circle id="bell" cx="592" cy="272" r="9" fill="#fbbf24" stroke="#92400e" stroke-width="2" style="cursor:pointer"/>
    <text class="bell-text" x="610" y="260" font-size="22" font-weight="800" fill="#1e293b">叮铃铃! 🔔</text>

    <!-- front basket with fish -->
    <g transform="translate(600,300)">
      <rect x="0" y="30" width="64" height="44" rx="6" fill="url(#basket)" stroke="#92400e" stroke-width="3"/>
      <g>
        <path d="M12 30 Q8 12 22 6 Q26 16 20 30 Z" fill="#94a3b8"/>
        <path d="M34 30 Q34 10 48 4 Q50 16 44 30 Z" fill="#cbd5e1"/>
        <circle cx="22" cy="14" r="2" fill="#1e293b"/><circle cx="46" cy="13" r="2" fill="#1e293b"/>
      </g>
    </g>

    <!-- crank + pedals -->
    <g class="crank-spin" style="transform-origin: 490px 430px;">
      <circle cx="490" cy="430" r="12" fill="#1e293b"/>
      <line x1="490" y1="430" x2="518" y2="430" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
      <line x1="490" y1="430" x2="462" y2="430" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
      <rect x="506" y="424" width="26" height="11" rx="4" fill="#0f172a"/>
      <rect x="448" y="424" width="26" height="11" rx="4" fill="#0f172a"/>
    </g>

    <!-- ===== pelican ===== -->
    <g class="pelican-bob">
      <!-- far leg (darker) -->
      <line x1="470" y1="295" x2="462" y2="430" stroke="#ea580c" stroke-width="12" stroke-linecap="round">
        <animate attributeName="x2" values="462;490;518;490;462" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="430;402;430;458;430" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <!-- near leg -->
      <line x1="478" y1="295" x2="518" y2="430" stroke="#fb923c" stroke-width="12" stroke-linecap="round">
        <animate attributeName="x2" values="518;490;462;490;518" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="430;458;430;402;430" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <!-- feet -->
      <g fill="#ea580c">
        <ellipse cx="518" cy="430" rx="14" ry="6">
          <animate attributeName="cx" values="518;490;462;490;518" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="cy" values="430;458;430;402;430" keyTimes="0;.25;.5;.75;1" dur="0.9s" repeatCount="indefinite"/>
        </ellipse>
      </g>

      <!-- tail -->
      <path d="M410 240 L368 222 L376 244 L364 252 L410 262 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" stroke-linejoin="round"/>

      <!-- body -->
      <ellipse cx="475" cy="250" rx="72" ry="52" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <ellipse cx="460" cy="270" rx="40" ry="22" fill="#f1f5f9"/>

      <!-- wing -->
      <g class="wing">
        <path d="M470 235 Q420 200 372 218 Q396 236 410 248 Q430 262 472 258 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round"/>
        <path d="M430 232 Q410 220 392 224" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M438 242 Q418 232 400 236" stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- scarf -->
      <path d="M530 205 Q500 195 485 205 Q505 220 535 218 Z" fill="#ef4444"/>
      <path class="scarf-tail" d="M490 208 Q450 200 420 214 Q448 222 438 236 Q470 232 492 220 Z" fill="#f87171"/>

      <!-- neck -->
      <path d="M528 235 Q548 200 560 175 Q570 160 582 158" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
      <path d="M528 235 Q548 200 560 175 Q570 160 582 158" fill="none" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round" stroke-dasharray="0" opacity=".25"/>

      <!-- head -->
      <circle cx="586" cy="152" r="24" fill="#fff" stroke="#cbd5e1" stroke-width="3"/>
      <!-- crest -->
      <path d="M570 132 Q562 112 574 104 Q578 118 580 130 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
      <!-- eye -->
      <circle cx="592" cy="148" r="6" fill="#fff" stroke="#1e293b" stroke-width="2"/>
      <circle cx="593.5" cy="148.5" r="3" fill="#0f172a"/>
      <circle cx="594.5" cy="147.5" r="1" fill="#fff"/>
      <rect class="eye-lid" x="584" y="140" width="18" height="16" rx="8" fill="#fff"/>
      <!-- cheek -->
      <circle cx="582" cy="160" r="5" fill="#fecdd3" opacity=".8"/>

      <!-- beak + pouch -->
      <g>
        <path d="M606 142 L700 160 L606 168 Z" fill="#fb923c" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/>
        <path class="pouch" d="M606 168 Q655 212 700 160 Q670 176 606 168 Z" fill="#fdba74" stroke="#ea580c" stroke-width="3"/>
        <line x1="606" y1="142" x2="700" y2="160" stroke="#fed7aa" stroke-width="2"/>
      </g>

      <!-- wing-holding handlebar: little wing arm -->
      <path d="M505 250 Q540 270 572 282" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
      <circle cx="573" cy="282" r="8" fill="#fb923c" stroke="#ea580c" stroke-width="2"/>
    </g>
  </g>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7">
    <line x1="120" y1="300" x2="220" y2="300"><animate attributeName="x1" values="260;60" dur="0.7s" repeatCount="indefinite"/><animate attributeName="x2" values="360;160" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="90" y1="350" x2="170" y2="350"><animate attributeName="x1" values="220;20" dur="0.9s" repeatCount="indefinite"/><animate attributeName="x2" values="300;100" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="140" y1="250" x2="210" y2="250"><animate attributeName="x1" values="280;80" dur="0.8s" repeatCount="indefinite"/><animate attributeName="x2" values="350;150" dur="0.8s" repeatCount="indefinite"/></line>
  </g>
</svg>