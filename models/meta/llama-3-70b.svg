<svg width="400" height="200" viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Pelican -->
  <g transform="translate(150, 50)">
    <circle cx="0" cy="0" r="20" fill="#F7DC6F" /> <!-- Head -->
    <rect x="-15" y="-20" width="30" height="40" fill="#F7DC6F" rx="5" /> <!-- Body -->
    <circle cx="-25" cy="-30" r="10" fill="#F7DC6F" /> <!-- Wing 1 -->
    <circle cx="25" cy="-30" r="10" fill="#F7DC6F" /> <!-- Wing 2 -->
    <path d="M -10 -50 L 10 -50 L 10 -60 L -10 -60 Z" fill="#F7DC6F" /> <!-- Beak -->
  </g>

  <!-- Bicycle -->
  <g transform="translate(150, 100)">
    <rect x="-50" y="-20" width="100" height="20" fill="#666" rx="5" /> <!-- Frame -->
    <circle cx="-30" cy="-15" r="10" fill="#666" /> <!-- Wheel 1 -->
    <circle cx="30" cy="-15" r="10" fill="#666" /> <!-- Wheel 2 -->
    <path d="M -40 -10 L -40 10 L 40 10 L 40 -10 Z" fill="#666" /> <!-- Pedals -->
    <path d="M -20 0 L 20 0" stroke="#666" stroke-width="5" /> <!-- Handlebars -->
  </g>

  <!-- Action lines -->
  <path d="M 150 100 L 150 50" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
  <path d="M 150 50 L 170 30" stroke="#999" stroke-width="2" stroke-dasharray="5,5" />
</svg>