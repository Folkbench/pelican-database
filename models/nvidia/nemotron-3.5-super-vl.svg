<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#e3f2fd"/>
  <rect x="0" y="250" width="400" height="50" fill="#8bc34a"/>

  <!-- Bicycle -->
  <g>
    <!-- Wheels -->
    <circle cx="100" cy="215" r="35" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="100" cy="215" r="30" fill="none" stroke="#aaa" stroke-width="1"/>
    <line x1="100" y1="215" x2="100" y2="180" stroke="#aaa" stroke-width="1"/>
    <line x1="100" y1="215" x2="130" y2="195" stroke="#aaa" stroke-width="1"/>
    <line x1="100" y1="215" x2="70" y2="195" stroke="#aaa" stroke-width="1"/>

    <circle cx="280" cy="215" r="35" fill="none" stroke="#222" stroke-width="5"/>
    <circle cx="280" cy="215" r="30" fill="none" stroke="#aaa" stroke-width="1"/>
    <line x1="280" y1="215" x2="280" y2="180" stroke="#aaa" stroke-width="1"/>
    <line x1="280" y1="215" x2="310" y2="195" stroke="#aaa" stroke-width="1"/>
    <line x1="280" y1="215" x2="250" y2="195" stroke="#aaa" stroke-width="1"/>

    <!-- Frame -->
    <line x1="100" y1="215" x2="130" y2="165" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="165" x2="250" y2="155" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
    <line x1="250" y1="155" x2="280" y2="215" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
    <line x1="130" y1="165" x2="180" y2="215" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
    <line x1="180" y1="215" x2="250" y2="155" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>
    <line x1="100" y1="215" x2="180" y2="215" stroke="#d32f2f" stroke-width="5" stroke-linecap="round"/>

    <!-- Seat -->
    <ellipse cx="130" cy="160" rx="16" ry="7" fill="#222" transform="rotate(-15 130 160)"/>

    <!-- Handlebars -->
    <line x1="250" y1="155" x2="265" y2="130" stroke="#222" stroke-width="5" stroke-linecap="round"/>
    <line x1="265" y1="130" x2="285" y2="135" stroke="#222" stroke-width="5" stroke-linecap="round"/>

    <!-- Crank and pedals -->
    <circle cx="180" cy="215" r="7" fill="#666"/>
    <line x1="180" y1="215" x2="160" y2="240" stroke="#333" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="215" x2="200" y2="190" stroke="#333" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Tail -->
    <path d="M 150 200 Q 135 210 145 230" fill="none" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="180" cy="195" rx="30" ry="22" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
    <line x1="170" y1="190" x2="180" y2="195" stroke="#e0e0e0" stroke-width="1" stroke-linecap="round"/>
    <line x1="190" y1="185" x2="200" y2="190" stroke="#e0e0e0" stroke-width="1" stroke-linecap="round"/>

    <!-- Wing -->
    <path d="M 168 188 Q 192 178 212 198 Q 198 212 178 202" fill="none" stroke="#e0e0e0" stroke-width="3" stroke-linecap="round"/>

    <!-- Neck -->
    <path d="M 200 180 Q 225 165 240 150" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Head -->
    <circle cx="250" cy="145" r="13" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

    <!-- Eye -->
    <circle cx="254" cy="142" r="2.5" fill="#333"/>
    <circle cx="255" cy="141" r="0.8" fill="white"/>

    <!-- Upper beak -->
    <path d="M 260 145 L 325 150 L 305 160 Z" fill="#ffb300" stroke="#e6a000" stroke-width="1"/>

    <!-- Lower beak / pouch -->
    <path d="M 260 150 Q 310 165 305 170 L 270 160 Z" fill="#ffd180" stroke="#e6a000" stroke-width="1"/>

    <!-- Legs -->
    <line x1="175" y1="210" x2="160" y2="240" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>
    <line x1="190" y1="210" x2="200" y2="195" stroke="#ffb300" stroke-width="4" stroke-linecap="round"/>

    <!-- Feet -->
    <ellipse cx="160" cy="240" rx="6" ry="3" fill="#e6a000"/>
    <ellipse cx="200" cy="195" rx="6" ry="3" fill="#e6a000"/>
  </g>

  <!-- Motion lines -->
  <g stroke="#bbb" stroke-width="2" opacity="0.6">
    <line x1="50" y1="215" x2="70" y2="215"/>
    <line x1="55" y1="205" x2="75" y2="205"/>
    <line x1="330" y1="215" x2="350" y2="215"/>
    <line x1="335" y1="205" x2="355" y2="205"/>
  </g>
</svg>