<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#444"/>
      <stop offset="100%" style="stop-color:#111"/>
    </radialGradient>
    
    <linearGradient id="pelicanBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#f0f0f0"/>
      <stop offset="100%" style="stop-color:#dfe6e9"/>
    </linearGradient>
    
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22"/>
      <stop offset="50%" style="stop-color:#f39c12"/>
      <stop offset="100%" style="stop-color:#e67e22"/>
    </linearGradient>
    
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fab1a0"/>
      <stop offset="100%" style="stop-color:#e17055"/>
    </linearGradient>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <line x1="0" y1="255" x2="400" y2="255" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="5,5"/>

  <g id="bicycle" filter="url(#dropShadow)">
    
    <g transform="translate(80, 210)">
      <circle r="45" fill="url(#tireGrad)" stroke="#2c3e50" stroke-width="3"/>
      <circle r="35" fill="none" stroke="#34495e" stroke-width="1.5"/>
      <circle r="8" fill="#2c3e50"/>
      <g stroke="#7f8c8d" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="-35"/>
        <line x1="0" y1="0" x2="25" y2="-25"/>
        <line x1="0" y1="0" x2="35" y2="0"/>
        <line x1="0" y1="0" x2="25" y2="25"/>
        <line x1="0" y1="0" x2="0" y2="35"/>
        <line x1="0" y1="0" x2="-25" y2="25"/>
        <line x1="0" y1="0" x2="-35" y2="0"/>
        <line x1="0" y1="0" x2="-25" y2="-25"/>
      </g>
    </g>

    <g transform="translate(290, 210)">
      <circle r="45" fill="url(#tireGrad)" stroke="#2c3e50" stroke-width="3"/>
      <circle r="35" fill="none" stroke="#34495e" stroke-width="1.5"/>
      <circle r="8" fill="#2c3e50"/>
      <g stroke="#7f8c8d" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="-35"/>
        <line x1="0" y1="0" x2="25" y2="-25"/>
        <line x1="0" y1="0" x2="35" y2="0"/>
        <line x1="0" y1="0" x2="25" y2="25"/>
        <line x1="0" y1="0" x2="0" y2="35"/>
        <line x1="0" y1="0" x2="-25" y2="25"/>
        <line x1="0" y1="0" x2="-35" y2="0"/>
        <line x1="0" y1="0" x2="-25" y2="-25"/>
      </g>
    </g>

    <g fill="none" stroke="url(#frameGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 125 155 L 245 155 L 255 210 L 125 155 Z"/>
      <path d="M 80 210 L 125 155"/>
      <path d="M 125 155 L 80 210" stroke-width="3"/>
      <path d="M 245 155 L 260 130 L 290 210" stroke-width="5"/>
      <path d="M 260 130 L 275 100" stroke-width="4"/>
      <path d="M 255 100 L 295 100" stroke-width="4" stroke-linecap="round"/>
      <circle cx="255" cy="100" r="5" fill="#2c3e50"/>
      <circle cx="295" cy="100" r="5" fill="#2c3e50"/>
    </g>

    <path d="M 115 155 Q 125 140 145 155" fill="none" stroke="#1a1a2e" stroke-width="14" stroke-linecap="round" filter="url(#dropShadow)"/>
    <ellipse cx="130" cy="148" rx="18" ry="6" fill="#1a1a2e" filter="url(#dropShadow)"/>

    <g transform="translate(80, 210)">
      <line x1="0" y1="0" x2="30" y2="-10" stroke="url(#frameGrad)" stroke-width="4" stroke-linecap="round"/>
      <rect x="30" y="-18" width="22" height="8" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="1.5" transform="rotate(-15 41 -14)"/>
    </g>
    
    <g transform="translate(80, 210)">
       <circle r="18" fill="none" stroke="#34495e" stroke-width="3"/>
       <circle r="6" fill="#2c3e50"/>
    </g>

    <g stroke="#34495e" stroke-width="1.5" fill="none" opacity="0.8">
        <path d="M 98 210 L 272 210"/>
        <path d="M 98 195 L 272 195"/>
    </g>

  </g>

  <g id="pelican" transform="translate(0, -10)" filter="url(#dropShadow)">
    
    <path d="M 75 145 Q 55 130 50 155 Q 60 150 75 145" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1"/>
    <path d="M 70 150 Q 50 140 45 160 Q 55 155 70 150" fill="#dfe6e9" stroke="#b2bec3" stroke-width="1"/>

    <ellipse cx="145" cy="150" rx="55" ry="40" fill="url(#pelicanBody)" stroke="#b2bec3" stroke-width="1.5"/>
    
    <path d="M 110 140 Q 90 130 85 165 Q 100 160 120 150 Q 115 145 110 140" fill="#ffffff" stroke="#dfe6e9" stroke-width="1"/>
    <path d="M 105 150 Q 95 155 90 170 Q 105 165 115 155" fill="none" stroke="#b2bec3" stroke-width="0.5" opacity="0.5"/>

    <path d="M 190 130 Q 210 105 220 85 Q 230 70 235 60" fill="none" stroke="url(#pelicanBody)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 195 125 Q 215 100 225 80 Q 232 68 236 58" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

    <ellipse cx="245" cy="45" rx="22" ry="20" fill="url(#pelicanBody)" stroke="#b2bec3" stroke-width="1"/>
    
    <circle cx="255" cy="40" r="5" fill="#2c3e50"/>
    <circle cx="257" cy="38" r="1.5" fill="white"/>
    <path d="M 240 30 Q 255 20 270 30" fill="none" stroke="#f39c12" stroke-width="3" stroke-linecap="round"/>

    <path d="M 245 50 Q 280 35 330 45 Q 325 55 280 60 Q 250 55 245 50" fill="url(#beakGrad)" stroke="#d35400" stroke-width="1.5"/>
    <ellipse cx="270" cy="45" rx="3" ry="1.5" fill="#d35400" opacity="0.6"/>

    <path d="M 245 50 Q 280 65 320 75 Q 310 95 270 90 Q 250 65 245 50" fill="url(#pouchGrad)" stroke="#d35400" stroke-width="1"/>
    <g stroke="#d35400" stroke-width="0.5" opacity="0.5" fill="none">
        <path d="M 260 60 Q 290 75 310 85"/>
        <path d="M 265 65 Q 295 80 310 90"/>
        <path d="M 270 70 Q 300 85 305 95"/>
    </g>

    <g transform="translate(80, 210)">
        <path d="M 30 -10 Q 30 10 28 35" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round"/>
        <path d="M 28 35 L 20 45 M 28 35 L 28 48 M 28 35 L 36 45" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <g transform="translate(290, 210)">
        <line x1="0" y1="0" x2="-30" y2="-10" stroke="url(#frameGrad)" stroke-width="4" stroke-linecap="round"/>
        <rect x="-50" y="-18" width="22" height="8" rx="2" fill="#34495e" stroke="#2c3e50" stroke-width="1.5" transform="rotate(15 -39 -14)"/>
        
        <path d="M -20 -10 Q -10 10 0 35" fill="none" stroke="#e67e22" stroke-width="5" stroke-linecap="round" transform="translate(-10, 0)"/>
        <path d="M 0 35 L -10 48 L 0 48 L 10 48" stroke="#e67e22" stroke-width="4" stroke-linecap="round" fill="none" transform="translate(-10, 0)"/>
    </g>
    
    <path d="M 120 135 Q 160 110 240 100 Q 250 110 210 125 Q 180 120 120 135" fill="#ffffff" stroke="#b2bec3" stroke-width="1.5" opacity="0.9"/>
    <path d="M 140 125 Q 180 115 220 108" fill="none" stroke="#b2bec3" stroke-width="0.5" opacity="0.5"/>
    <path d="M 140 130 Q 185 118 225 112" fill="none" stroke="#b2bec3" stroke-width="0.5" opacity="0.5"/>

    <path d="M 150 135 Q 190 110 275 100 Q 285 110 240 125 Q 210 120 150 135" fill="#ffffff" stroke="#b2bec3" stroke-width="1.5" opacity="0.9"/>
    <path d="M 170 125 Q 220 115 260 108" fill="none" stroke="#b2bec3" stroke-width="0.5" opacity="0.5"/>
    <path d="M 170 130 Q 225 118 265 112" fill="none" stroke="#b2bec3" stroke-width="0.5" opacity="0.5"/>

  </g>

  <g opacity="0.3" stroke="#7f8c8d" stroke-width="1.5" stroke-linecap="round">
    <line x1="20" y1="180" x2="50" y2="180"/>
    <line x1="15" y1="200" x2="45" y2="200"/>
    <line x1="20" y1="220" x2="50" y2="220"/>
    <line x1="20" y1="120" x2="50" y2="120"/>
    <line x1="15" y1="100" x2="45" y2="100"/>
  </g>

</svg>