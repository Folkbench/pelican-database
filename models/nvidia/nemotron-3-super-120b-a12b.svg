<svg width="400" height="250" viewBox="0 0 400 250"
     xmlns="http://www.w3.org/2000/svg"
     style="background:#e0f7fa">
  <!-- Bicycle -->
  <!-- Rear wheel -->
  <circle cx="120" cy="200" r="30" fill="#fff" stroke="#555" stroke-width="3"/>
  <!-- Front wheel -->
  <circle cx="260" cy="200" r="30" fill="#fff" stroke="#555" stroke-width="3"/>
  <!-- Wheel spokes (simple) -->
  <line x1="120" y1="170" x2="120" y2="230" stroke="#555" stroke-width="1"/>
  <line x1="90"  y1="200" x2="150" y2="200" stroke="#555" stroke-width="1"/>
  <line x1="260" y1="170" x2="260" y2="230" stroke="#555" stroke-width="1"/>
  <line x1="230" y1="200" x2="290" y2="200" stroke="#555" stroke-width="1"/>
  <!-- Frame -->
  <path d="M150 170
           L180 130   % down tube
           L210 130   % top tube
           L240 170   % seat tube
           L210 130   % back to top tube (forming a triangle)
           L210 100   % seat post
           L230  90   % saddle
           L190 100   % handlebar stem
           L170  80   % handlebar left
           L190  60   % handlebar right
           Z"
        fill="none" stroke="#555" stroke-width="4"/>
  <!-- Pedals -->
  <circle cx="180" cy="170" r="5" fill="#777"/>
  <circle cx="240" cy="170" r="5" fill="#777"/>
  <!-- Pelican -->
  <!-- Body -->
  <ellipse cx="210" cy="115" rx="40" ry="25" fill="#f5deb3" stroke="#8b4513" stroke-width="2"/>
  <!-- Head -->
  <circle cx="250" cy="100" r="15" fill="#f5deb3" stroke="#8b4513" stroke-width="2"/>
  <!-- Beak -->
  <polygon points="265,95 285,100 265,105" fill="#ff8c00" stroke="#8b4513" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="255" cy="98" r="2" fill="#000"/>
  <!-- Wing -->
  <path d="M190,115
           q-20,-30  -10,-50           q 10,-20  30,-10
           q 20,10   10,30
           q-10,20  -30,10
           Z"
        fill="#ffe4b5" stroke="#8b4513" stroke-width="2"/>
  <!-- Legs (holding the bike) -->
  <line x1="190" y1="140" x2="180" y2="165" stroke="#8b4513" stroke-width="3"/>
  <line x1="230" y1="140" x2="240" y2="165" stroke="#8b4513" stroke-width="3"/>
  <!-- Feet on pedals -->
  <circle cx="180" cy="165" r="4" fill="#555"/>
  <circle cx="240" cy="165" r="4" fill="#555"/>
</svg>