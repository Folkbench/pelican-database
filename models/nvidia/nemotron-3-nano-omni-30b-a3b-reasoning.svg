<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 200 150"
     width="400" height="300"
     style="background:#f0f8ff">

  <!-- Pelican -->
  <g stroke="black" stroke-width="2" fill="yellow">
    <!-- Head -->
    <circle cx="100" cy="40" r="12"/>
    <!-- Beak -->
    <polygon points="100,40 115,55 85,55" fill="orange"/>
    <!-- Body -->
    <ellipse cx="100" cy="80" rx="30" ry="20"/>
    <!-- Wings -->
    <path d="M70 80 C50 70, 50 90, 80 85" />
    <path d="M130 80 C150 70, 150 90, 120 85" />
    <!-- Legs -->
    <line x1="85" y1="100" x2="85" y2="130"/>
    <line x1="115" y1="100" x2="115" y2="130"/>
  </g>

  <!-- Bicycle -->
  <g stroke="black" stroke-width="2" fill="none">
    <!-- Wheels -->
    <circle cx="70" cy="120" r="12"/>
    <circle cx="130" cy="120" r="12"/>
    <!-- Frame -->
    <line x1="70" y1="110" x2="130" y2="110"/>
    <line x1="70" y1="115" x2="70" y2="120"/>
    <line x1="130" y1="115" x2="130" y2="120"/>
    <!-- Handlebars -->
    <line x1="70" y1="105" x2="60" y2="100"/>
    <line x1="130" y1="105" x2="140" y2="100"/>
    <!-- Pedals -->
    <line x1="80" y1="115" x2="85" y2="110"/>
    <line x1="120" y1="115" x2="115" y2="110"/>
  </g>
</svg>